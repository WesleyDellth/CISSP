<script>window.QUIZ_DATA={"meta":{"title":"CISSP Domain 5 — Identity and Access Management","subtitle":"Bilingual Practice & Exam Quiz / แบบฝึกหัดสองภาษา","source_file":"1.1 CISSP certification CBK Domain 5 - Identity and Access Management..html","question_count":125,"pass_mark_percent":70,"deduplication":"Compared with prior Domain 1 by ID, normalized English text, and manually reviewed high-similarity candidates; no duplicates removed","content_note":"Questions and English explanations are derived from the supplied HTML. Thai text is a study translation/summary."},"questions":[{"number":1,"id":102018127,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is a valid access control policy for a sensitive database?","question_th":"ข้อใดเป็นนโยบายควบคุมการเข้าถึงที่เหมาะสมสำหรับฐานข้อมูลที่มีข้อมูลอ่อนไหว","options":[{"en":"Allow access to all users with a valid login and password","th":"อนุญาตให้ผู้ใช้ทุกคนที่มีชื่อผู้ใช้และรหัสผ่านที่ถูกต้องเข้าถึงได้"},{"en":"Deny access to all users with a valid login and password","th":"ปฏิเสธผู้ใช้ทุกคนที่มีชื่อผู้ใช้และรหัสผ่านที่ถูกต้อง"},{"en":"Allow access only to users with administrator privileges","th":"อนุญาตเฉพาะผู้ใช้ที่มีสิทธิ์ผู้ดูแลระบบ"},{"en":"Deny access to all users without explicit approval from the database owner","th":"ปฏิเสธผู้ใช้ทุกคน เว้นแต่ได้รับอนุมัติอย่างชัดเจนจากเจ้าของฐานข้อมูล"}],"correct":[3],"explanation_en":"The correct answer:\nDenying access to all users without explicit approval from the database owner is a valid access control policy for a sensitive database. It operates on the principle of least privilege, meaning that access is only given to those who need it to perform their job functions. This principle minimizes the potential damage that can occur from accidents, errors, and exploits by limiting access to the minimum amount of data and privileges necessary to complete a task.\n\nThe incorrect answers:\nAllowing access to all users with a valid login and password is not secure for a sensitive database. Just because a user has a valid login and password does not mean they should have access to all data, especially sensitive data. Access should be based on need and role, not simply on the ability to log in.\nDenying access to all users with a valid login and password would render the database unusable, as no one could access it. While it would indeed protect the data from unauthorized access, it would also prevent authorized access, making the data useless to the organization.\nAllowing access only to users with administrator privileges might work for some databases, but it is not usually appropriate for a sensitive database. Administrators typically need broad access to perform their roles, but they do not need access to all data. Giving them access to all data would violate the principle of least privilege and could increase the risk of data compromise. Furthermore, other users might also need access to the database to perform their roles, and this policy would unnecessarily restrict their access.","explanation_th":"คำตอบที่ถูกคือ D เพราะเป็นแนวทางแบบปฏิเสธโดยปริยาย (default deny) และสอดคล้องกับหลักสิทธิ์น้อยที่สุด โดยให้สิทธิ์เฉพาะผู้ที่เจ้าของข้อมูลอนุมัติเท่านั้น A กว้างเกินไปเพราะการล็อกอินได้ไม่ได้แปลว่าควรเห็นข้อมูลอ่อนไหว B ทำให้ผู้ใช้ที่ได้รับอนุญาตใช้งานไม่ได้ทั้งหมด C ให้สิทธิ์ตามสถานะผู้ดูแลระบบแทนความจำเป็นทางธุรกิจ และอาจให้สิทธิ์มากเกินจำเป็น"},{"number":2,"id":102018129,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST important consideration when updating firmware on a device?","question_th":"ข้อพิจารณาที่สำคัญที่สุดเมื่อต้องอัปเดตเฟิร์มแวร์ของอุปกรณ์คือข้อใด","options":[{"en":"Compatibility with the device's hardware","th":"ความเข้ากันได้กับฮาร์ดแวร์ของอุปกรณ์"},{"en":"Ease of installation","th":"ความง่ายในการติดตั้ง"},{"en":"Compatibility with existing software","th":"ความเข้ากันได้กับซอฟต์แวร์ที่มีอยู่"},{"en":"Ensuring the firmware is the latest version","th":"การตรวจสอบว่าเป็นเฟิร์มแวร์รุ่นล่าสุด"}],"correct":[0],"explanation_en":"The correct answer:\nBefore updating the firmware on a device, it is essential to ensure that the new firmware is compatible with the device's hardware. If the firmware is not compatible, it can cause the device to malfunction or even become damaged.\n\nThe incorrect answers:\nEase of installation may be a convenient factor, it is not the most important consideration when updating firmware. It is essential to ensure that the firmware is compatible with the device's hardware before installing it.\nCompatibility with existing software is important, but it is not the MOST important consideration when updating firmware. Ensuring that the firmware is compatible with the device's hardware is more critical to avoid damaging the device.\nIt is essential to keep devices up to date with the latest firmware, it is not the MOST important consideration when updating. Ensuring that the firmware is compatible with the device's hardware is crucial to avoid damaging the device.","explanation_th":"คำตอบที่ถูกคือ A เพราะเฟิร์มแวร์ที่ไม่ตรงกับฮาร์ดแวร์อาจทำให้อุปกรณ์ทำงานผิดปกติหรือเสียหายได้ B เป็นเพียงความสะดวก C มีความสำคัญแต่รองจากความเข้ากันได้กับตัวอุปกรณ์ และ D ไม่ควรติดตั้งเพียงเพราะเป็นรุ่นล่าสุดหากไม่รองรับฮาร์ดแวร์"},{"number":3,"id":102018131,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Your organization is in the process of implementing digital certificates for secure communication between internal systems and external clients. The IT security team is responsible for managing the digital certificate infrastructure and ensuring that all systems are properly configured to use the certificates. What is the MOST important factor to consider when implementing digital certificates for secure communication?","question_th":"องค์กรกำลังใช้ใบรับรองดิจิทัลเพื่อสื่อสารอย่างปลอดภัยระหว่างระบบภายในกับลูกค้าภายนอก ปัจจัยใดสำคัญที่สุดในการนำใบรับรองดิจิทัลมาใช้","options":[{"en":"The type of certificate used (e.g. SSL, TLS)","th":"ประเภทของใบรับรองที่ใช้ เช่น SSL หรือ TLS"},{"en":"The size of the organization's IT security team","th":"ขนาดของทีมรักษาความปลอดภัยไอที"},{"en":"The frequency of certificate renewal","th":"ความถี่ในการต่ออายุใบรับรอง"},{"en":"The integrity of the certificate authority","th":"ความน่าเชื่อถือและความถูกต้องของหน่วยงานออกใบรับรอง"}],"correct":[3],"explanation_en":"The correct answer:\nThe integrity of the certificate authority is crucial for the implementation of digital certificates. If the certificate authority is not trustworthy, the certificate may be compromised, which would leave the organization vulnerable to cyber attacks.\n\nThe incorrect answers:\nThe type of certificate used is important, it is not the most crucial factor in ensuring secure communication. Different types of certificates may have different levels of security, but the integrity of the certificate authority is the most important factor in ensuring that the certificate is valid.\nThe size of the IT security team is not directly related to the implementation of digital certificates. A larger team may have more resources to manage the certificate infrastructure, but the integrity of the certificate authority is still the most important factor in ensuring secure communication.\nThe frequency of certificate renewal is important for maintaining the security of the certificate, but it is not the most crucial factor in ensuring secure communication. A certificate that is renewed frequently may still be compromised if the certificate authority is not trustworthy.","explanation_th":"คำตอบที่ถูกคือ D เพราะความไว้วางใจในใบรับรองขึ้นอยู่กับ Certificate Authority (CA) หาก CA ไม่น่าเชื่อถือหรือถูกเจาะ ใบรับรองก็ไม่สามารถยืนยันตัวตนได้อย่างปลอดภัย A ใช้คำว่า SSL/TLS ซึ่งเป็นบริบทหรือโพรโทคอลมากกว่าจะรับรองความน่าเชื่อถือ B ไม่กำหนดความถูกต้องของใบรับรอง และ C ช่วยด้านอายุการใช้งานแต่ไม่แก้ปัญหา CA ที่ไม่น่าเชื่อถือ"},{"number":4,"id":102018133,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST important function of an RA (Registration Authority)?","question_th":"หน้าที่ที่สำคัญที่สุดของ RA (Registration Authority) คือข้อใด","options":[{"en":"Issuing digital certificates","th":"ออกใบรับรองดิจิทัล"},{"en":"Verifying the identity of certificate holders","th":"ตรวจสอบยืนยันตัวตนของผู้ขอใบรับรอง"},{"en":"Providing support for certificate revocation","th":"สนับสนุนการเพิกถอนใบรับรอง"},{"en":"Coordinating with other RAs","th":"ประสานงานกับ RA อื่น"}],"correct":[1],"explanation_en":"The correct answer:\nVerifying the identity of certificate holders: In a Public Key Infrastructure (PKI) system, RAs are responsible for verifying the identities of entities (e.g., individuals, organizations, or devices) before they are issued digital certificates by a Certificate Authority (CA). This process ensures that the digital certificates, which are used to establish secure communications and authenticate entities in a network, are issued to the correct and legitimate entities.\n\nThe incorrect answers:\nIssuing digital certificates: This is primarily the role of a Certificate Authority (CA), not an RA. Although an RA assists in the process, the final issuance of a digital certificate is done by the CA.\nProviding support for certificate revocation: While an RA might assist in the certificate revocation process, it's the CA that holds the ultimate responsibility to revoke certificates when necessary. The RA can help identify instances where revocation may be needed, but the action of revocation itself is typically handled by the CA.\nCoordinating with other RAs: While it's true that RAs may need to coordinate with each other in large or complex systems, this is not their primary function. Their main role is to authenticate the identities of entities before a CA issues a certificate, ensuring the overall trustworthiness of the system.","explanation_th":"คำตอบที่ถูกคือ B เพราะ RA ทำหน้าที่ตรวจสอบตัวตนของบุคคล องค์กร หรืออุปกรณ์ก่อนที่ CA จะออกใบรับรอง A เป็นหน้าที่หลักของ CA C อาจมีส่วนช่วยรับคำขอเพิกถอนแต่ CA เป็นผู้เพิกถอนจริง และ D อาจเกิดขึ้นในระบบขนาดใหญ่แต่ไม่ใช่ภารกิจหลัก"},{"number":5,"id":102018135,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the best practice for managing access to sensitive information in an organization?","question_th":"แนวปฏิบัติที่ดีที่สุดในการจัดการการเข้าถึงข้อมูลอ่อนไหวภายในองค์กรคือข้อใด","options":[{"en":"Requiring complex passwords for all employees.","th":"กำหนดให้พนักงานทุกคนใช้รหัสผ่านที่ซับซ้อน"},{"en":"Implementing role-based access control.","th":"ใช้การควบคุมการเข้าถึงตามบทบาท (RBAC)"},{"en":"Sharing all sensitive information with all employees.","th":"เปิดเผยข้อมูลอ่อนไหวทั้งหมดให้พนักงานทุกคน"},{"en":"Providing physical access control measures.","th":"ใช้มาตรการควบคุมการเข้าถึงทางกายภาพ"}],"correct":[1],"explanation_en":"The correct answer:\nRole-based access control (RBAC) is a best practice for managing access to sensitive information because it allows access to be granted based on the specific role of an employee within the organization. This ensures that only authorized employees have access to sensitive information and reduces the risk of unauthorized access.\n\nThe incorrect answers:\nRequiring complex passwords can help to prevent unauthorized access, it is not the most effective method for managing access to sensitive information. Passwords can be easily forgotten or shared, and they do not take into account the specific roles and responsibilities of individual employees.\nSharing all sensitive information with all employees is not a best practice because it increases the risk of unauthorized access and puts the organization's sensitive information at risk. Access to sensitive information should be carefully controlled and granted only to authorized employees who have a legitimate need for it.\nPhysical access control measures such as locks and security cameras can help to prevent unauthorized access to physical assets, they are not the most effective method for managing access to sensitive information. Access to sensitive information should be managed through logical controls such as RBAC, rather than relying solely on physical security measures.","explanation_th":"คำตอบที่ถูกคือ B เพราะ RBAC ให้สิทธิ์ตามหน้าที่และความรับผิดชอบ ทำให้เฉพาะผู้ที่จำเป็นต้องใช้ข้อมูลเท่านั้นเข้าถึงได้ A ช่วยยืนยันตัวตนแต่ไม่กำหนดว่าผู้ใช้ควรเข้าถึงข้อมูลใด C ขัดกับหลักสิทธิ์น้อยที่สุด และ D ช่วยป้องกันพื้นที่หรืออุปกรณ์แต่ไม่เพียงพอสำหรับการควบคุมข้อมูลเชิงตรรกะ"},{"number":6,"id":102018137,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Agnes is working on strengthening our preventative controls. What could she look at to do that?","question_th":"Agnes ต้องการเสริมความแข็งแกร่งให้การควบคุมเชิงป้องกัน เธอควรพิจารณาเรื่องใด","options":[{"en":"Enhancing incident response protocols.","th":"ปรับปรุงขั้นตอนการตอบสนองเหตุการณ์"},{"en":"Implementing strong access control measures.","th":"ใช้มาตรการควบคุมการเข้าถึงที่เข้มแข็ง"},{"en":"Conducting a post-mortem analysis after a data breach.","th":"วิเคราะห์เหตุการณ์ย้อนหลังหลังเกิดข้อมูลรั่วไหล"},{"en":"Regularly testing backups for integrity.","th":"ทดสอบความสมบูรณ์ของข้อมูลสำรองเป็นประจำ"}],"correct":[1],"explanation_en":"The correct answer:\nPreventative controls are designed to stop unwanted or unauthorized activity from occurring in the first place. Implementing strong access control measures is an excellent way to strengthen preventative controls. These measures could include strong password policies, two-factor authentication, and limiting access privileges based on roles (known as the principle of least privilege).\n\nThe incorrect answers:\nEnhancing incident response protocols is a good security practice, it isn't a preventative control. Incident response comes into play after a security incident has occurred, making it a reactive control, not a preventative one.\nConducting a post-mortem analysis after a data breach is again a reactive measure, not a preventative one. While this practice can help identify vulnerabilities and improve future security, it is not a measure that prevents breaches from happening in the first place.\nRegularly testing backups for integrity is crucial for ensuring data availability and recovery, it isn't a preventative control for avoiding breaches or unauthorized access. Backup integrity checks are more about ensuring data recovery in case of a system failure or data loss, rather than preventing unauthorized actions.","explanation_th":"คำตอบที่ถูกคือ B เพราะการควบคุมการเข้าถึงช่วยหยุดการกระทำที่ไม่ได้รับอนุญาตก่อนจะเกิดขึ้น A และ C เป็นมาตรการตอบสนองหรือเรียนรู้หลังเหตุการณ์ ส่วน D เน้นความพร้อมในการกู้คืนและความพร้อมใช้งาน ไม่ได้ป้องกันการเข้าถึงโดยตรง"},{"number":7,"id":102018139,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is NOT a benefit of using centralized IAM (Identity and Access Management) administration?","question_th":"ข้อใดไม่ใช่ประโยชน์ของการบริหาร IAM แบบรวมศูนย์","options":[{"en":"Increased security through consistent access controls","th":"เพิ่มความปลอดภัยด้วยการใช้กฎควบคุมการเข้าถึงที่สม่ำเสมอ"},{"en":"Improved efficiency through standardized processes","th":"เพิ่มประสิทธิภาพด้วยกระบวนการมาตรฐาน"},{"en":"Increased user frustration","th":"ทำให้ผู้ใช้หงุดหงิดมากขึ้น"},{"en":"Enhanced ability to monitor and audit user activity","th":"เพิ่มความสามารถในการเฝ้าติดตามและตรวจสอบกิจกรรมผู้ใช้"}],"correct":[2],"explanation_en":"The correct answer:\nCentralized IAM (Identity and Access Management) administration aims to streamline processes and enhance security within an organization. It does not inherently lead to increased user frustration. In fact, when done correctly, it can improve the user experience by providing simpler, more consistent ways of managing access. It can make the process of gaining, changing, or losing access privileges more transparent and efficient, which is generally beneficial to users.\n\nThe incorrect answers:\nCentralized IAM administration can provide better security because it allows consistent implementation of access controls. When access management is centralized, there's less chance of discrepancies or overlooked vulnerabilities that can occur when access control is managed separately across different departments or systems.\nOne of the main benefits of centralized IAM is that it standardizes the processes of managing user identities and access across the organization. This standardization can make these processes more efficient, as they can be implemented and maintained consistently.\nCentralized IAM systems usually come with tools and features that make it easier to monitor user activity and conduct audits. This can provide a clear overview of who has access to what resources, making it easier to identify any misuse and ensure compliance with internal policies and external regulations.","explanation_th":"คำตอบที่ถูกคือ C เพราะความหงุดหงิดของผู้ใช้ไม่ใช่ประโยชน์ และระบบ IAM ที่ออกแบบดีมักทำให้ขั้นตอนขอ เปลี่ยน หรือยกเลิกสิทธิ์ชัดเจนขึ้น A เป็นประโยชน์จากนโยบายที่สม่ำเสมอ B ลดงานซ้ำซ้อน และ D ช่วยการตรวจสอบและการปฏิบัติตามข้อกำหนด"},{"number":8,"id":102018141,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Looking at the different types of Authorization access we use. Which is not given based on subject and objects?","question_th":"เมื่อพิจารณารูปแบบการอนุญาตเข้าถึง ข้อใดไม่ได้ให้สิทธิ์โดยอาศัยคุณลักษณะของ subject และ object เป็นหลัก","options":[{"en":"Role-based access control","th":"การควบคุมการเข้าถึงตามบทบาท"},{"en":"Attribute-based access control","th":"การควบคุมการเข้าถึงตามคุณลักษณะ"},{"en":"Rule-based access control","th":"การควบคุมการเข้าถึงตามกฎ"},{"en":"Discretionary access control","th":"การควบคุมการเข้าถึงตามดุลยพินิจ"}],"correct":[2],"explanation_en":"The correct answer: \nRule-based access control. Rule-based access control (RuBAC) does not primarily use the characteristics of the subject (the user or process requesting access) or the object (the resource being accessed) to grant or deny access. Instead, rule-based access control uses a set of pre-established security rules that govern access rights. The rules can include various conditions such as time of day, location, type of connection, etc. For example, a rule might specify that no one can access a particular system outside of business hours. \n\nThe incorrect answers:\nRole-based access control: Role-based access control (RBAC) is based on the roles that individual users take on in a system. Under this model, users are granted access rights based on their role, which in turn is linked to the tasks they are expected to perform. This model is therefore inherently linked to the characteristics of the 'subject' (the user) in the authorization process. \nAttribute-based access control: Attribute-based access control (ABAC) is a model that grants access rights based on attributes associated with the user, the resource being accessed, and current environmental conditions. Both subject (user) and object (resource) attributes are central to this model of access control. \nDiscretionary access control: In Discretionary Access Control (DAC), the data owner decides who can access specific resources. This access can be granted based on user identity or on the basis of rules that have been established by the user, so it can be argued that both subjects and objects play a role in this type of access control.","explanation_th":"คำตอบที่ถูกคือ C ตามคำอธิบายต้นฉบับ Rule-based Access Control ใช้กฎที่กำหนดล่วงหน้า เช่น เวลา สถานที่ หรือชนิดการเชื่อมต่อ มากกว่าการพิจารณาคุณลักษณะ subject/object โดยตรง A อาศัยบทบาทของผู้ใช้ B ใช้คุณลักษณะของผู้ใช้ ทรัพยากร และสภาพแวดล้อม และ D ให้เจ้าของทรัพยากรกำหนดสิทธิ์แก่ subject บน object"},{"number":9,"id":102018143,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"How you type on a keyboard can be used for which type of authentication?","question_th":"รูปแบบการพิมพ์บนแป้นพิมพ์สามารถใช้เป็นการยืนยันตัวตนประเภทใด","options":[{"en":"Password.","th":"รหัสผ่าน"},{"en":"Token.","th":"โทเคน"},{"en":"Biometric.","th":"ชีวมิติ"},{"en":"Typing speed.","th":"ความเร็วในการพิมพ์"}],"correct":[2],"explanation_en":"The correct answer:\nBiometric: Typing on a keyboard can be considered a type of biometric authentication, specifically behavioral biometrics. Behavioral biometrics refers to the unique ways in which individuals act, including recognition of typing patterns. This includes the speed of typing, rhythm, and other unique characteristics that can be used to verify a person's identity. It is based on the principle that everyone has their own unique typing style, and this can be used as an additional layer of security or authentication.\n\nThe incorrect answers:\nPasswords are a type of knowledge-based authentication where the user inputs a set of characters to verify their identity. This method of authentication does not take into account the way you type, but rather what you type. Typing style is not related to the content of a password. \nToken-based authentication involves using a piece of data (the token) that certifies a user's identity. This token is usually generated and provided by the service the user is trying to access. Examples include hardware tokens that generate time-based one-time passwords (TOTP), or software tokens sent via email or text message. The way you type on a keyboard does not generate or validate such a token, hence this is a wrong answer.\nWhile typing speed can be a part of biometric authentication, by itself, it does not suffice for a robust authentication mechanism. Authentication requires the ability to confirm a unique identity. As typing speed can vary based on many factors such as time of day, health, stress, and others, it can't be used as a reliable standalone authentication method.","explanation_th":"คำตอบที่ถูกคือ C เพราะจังหวะ ความเร็ว และรูปแบบการกดแป้นเป็นพฤติกรรมเฉพาะบุคคล จัดเป็น behavioral biometrics A ตรวจสิ่งที่พิมพ์ไม่ใช่วิธีพิมพ์ B ใช้วัตถุหรือรหัสจากโทเคน และ D เป็นเพียงคุณลักษณะหนึ่งของรูปแบบการพิมพ์ ไม่ใช่ประเภทการยืนยันตัวตนที่สมบูรณ์"},{"number":10,"id":102018145,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) of a multinational corporation. The corporation has a very complex IT infrastructure, with multiple data centers across the world and remote access for a large number of employees. Recently, your organization has been targeted by a number of brute force and dictionary attacks. Your team has successfully managed to repel these attempts, but you understand that the current security measures are not robust enough. To address this issue, you decide to upgrade the company's password policy. Which of the following updates to your organization's password policy would be the MOST effective in mitigating the risks associated with brute force, dictionary attacks, and rainbow tables while balancing user experience?","question_th":"องค์กรถูกโจมตีแบบ brute force, dictionary และ rainbow table การปรับปรุงนโยบายรหัสผ่านข้อใดมีประสิทธิผลที่สุดพร้อมรักษาประสบการณ์ผู้ใช้","options":[{"en":"Implementing a password expiration policy where users are required to change their passwords every 30 days.","th":"บังคับเปลี่ยนรหัสผ่านทุก 30 วัน"},{"en":"Implementing a policy requiring a minimum password length of 20 characters.","th":"กำหนดความยาวรหัสผ่านอย่างน้อย 20 ตัวอักษร"},{"en":"Implementing a policy where each password must include at least one uppercase letter, one lowercase letter, one number, and one special character.","th":"กำหนดให้มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และอักขระพิเศษ"},{"en":"Implementing a password salting mechanism, adding a unique, random set of characters to each password before it's hashed.","th":"เติมค่า salt แบบสุ่มและไม่ซ้ำให้รหัสผ่านแต่ละชุดก่อนทำ hash"}],"correct":[3],"explanation_en":"The correct answer:\nImplementing a password salting mechanism, adding a unique, random set of characters to each password before it's hashed is the most effective among the listed ones because it directly addresses the vulnerabilities exploited by brute force attacks, dictionary attacks, and rainbow tables. Salting is a technique that adds random data to each user's password before hashing. The addition of this random data significantly complicates the process of cracking the password since it increases the computational requirements of brute force and dictionary attacks. It also negates the effectiveness of rainbow table attacks since precompiled tables of hashed values become irrelevant; even if two users have the same password, their salted hashes will be different.\n\nThe incorrect answers:\nImplementing a password expiration policy where users are required to change their passwords every 30 days will eventually invalidate any successfully guessed or stolen passwords, but it isn't the most effective measure. Frequently requiring password changes may lead to user frustration and could encourage poor security practices, such as incrementing a number at the end of a password or writing down passwords.\nIncreasing password length can effectively increase the complexity and security of passwords by increasing the number of potential combinations, making brute force attacks more difficult. But, excessively long password requirements can lead to user frustration and may result in insecure behaviors such as writing down passwords. It doesn't directly address dictionary attacks or rainbow table attacks.\nImplementing a policy where each password must include at least one uppercase letter, one lowercase letter, one number, and one special character can make passwords more complex and harder to guess, but it does not fundamentally protect against the methods used in brute force or dictionary attacks and does nothing to counter rainbow table attacks. It could also lead to user frustration if not managed effectively.","explanation_th":"คำตอบที่ถูกคือ D เพราะ salt ทำให้รหัสผ่านเดียวกันได้ค่า hash ต่างกันและทำให้ rainbow table ใช้ไม่ได้ อีกทั้งเพิ่มต้นทุนของการเดา A อาจทำให้ผู้ใช้ตั้งรหัสผ่านที่คาดเดาได้ B ช่วยต้าน brute force แต่ไม่แก้ rainbow table โดยตรงและอาจสร้างภาระผู้ใช้ C เพิ่มชุดอักขระแต่ยังไม่ป้องกันฐาน hash ที่คำนวณไว้ล่วงหน้า"},{"number":11,"id":102018147,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"John is not allowed to access the organization's network from anywhere but his home and at his desk at work. He just went on vacation and tried to log in. His access request was denied. This is a type of what?","question_th":"John ถูกอนุญาตให้เข้าเครือข่ายได้เฉพาะจากบ้านและโต๊ะทำงาน เมื่อพยายามเข้าสู่ระบบระหว่างไปพักร้อนจึงถูกปฏิเสธ เหตุการณ์นี้เป็นตัวอย่างของข้อใด","options":[{"en":"Access control policy","th":"นโยบายควบคุมการเข้าถึง"},{"en":"Non-repudiation","th":"การปฏิเสธความรับผิดไม่ได้"},{"en":"Confidentiality","th":"การรักษาความลับ"},{"en":"Integrity","th":"ความถูกต้องครบถ้วน"}],"correct":[0],"explanation_en":"The correct answer:\nAn access control policy is a set of rules that dictate who is allowed to access certain resources and when. It's a way for organizations to manage and limit the availability of their systems to authorized users. In this case, John's organization has a location-based access control policy in place. This policy permits him to access the network only from his home and his work desk. Since he's currently on vacation (presumably somewhere other than his home or his desk at work), his access request was denied, demonstrating that the organization's access control policy is functioning as intended.\n\nThe incorrect answers:\nNon-repudiation is a security principle that prevents someone from denying an action they took. In the context of cybersecurity, non-repudiation often refers to ensuring that a party involved in communication cannot deny the authenticity of their electronic signature or sent/received message. However, it has no direct relation to the location from where John can access the network, which is the focus of the question.\nConfidentiality is a principle of information security that involves keeping sensitive information private. It's about ensuring that only authorized individuals can access certain information. While it's true that an access control policy can contribute to maintaining confidentiality by limiting who can access certain resources, the main focus of the question is on where John is allowed to access the network, not who is allowed to access it. Confidentiality is not the most accurate answer.\nIntegrity in the context of information security refers to maintaining the accuracy and completeness of data. It ensures that information is not altered or destroyed in an unauthorized or undetected manner. In this scenario, integrity would be about ensuring that the data John would be accessing hasn't been tampered with. It has nothing to do with the locations from where John can access the network, it's not the correct answer for this question.","explanation_th":"คำตอบที่ถูกคือ A เพราะองค์กรใช้กฎตามสถานที่เพื่อกำหนดว่าผู้ใช้เข้าถึงได้จากที่ใด B เกี่ยวกับการพิสูจน์ว่าใครทำรายการ C เป็นเป้าหมายในการป้องกันการเปิดเผยข้อมูล และ D เกี่ยวกับการป้องกันข้อมูลถูกแก้ไข ทั้งสามข้อไม่อธิบายการปฏิเสธจากตำแหน่งที่ตั้ง"},{"number":12,"id":102018149,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the BEST practice for implementing IAM/IDAM (Identity and Access Management) in an organization?","question_th":"แนวปฏิบัติที่ดีที่สุดในการนำ IAM/IDAM มาใช้ในองค์กรคือข้อใด","options":[{"en":"Implementing single sign-on (SSO)","th":"ใช้ Single Sign-On (SSO)"},{"en":"Allowing employees to choose their own passwords","th":"ให้พนักงานเลือกรหัสผ่านเองโดยอิสระ"},{"en":"Using biometric authentication for all users","th":"ใช้ชีวมิติกับผู้ใช้ทุกคน"},{"en":"Implementing role-based access controls","th":"ใช้การควบคุมการเข้าถึงตามบทบาท (RBAC)"}],"correct":[3],"explanation_en":"The correct answer:\nImplementing role-based access controls (RBAC) is considered the BEST practice for IAM because it allows for fine-grained access control, where users are granted access based on their role within the organization. This allows for more secure and efficient access management, as opposed to the other options which may not provide the same level of security and control.\n\nThe incorrect answers:\nImplementing single sign-on (SSO) may be a useful component of IAM, but it is not considered the BEST practice on its own. SSO allows for convenient access to multiple applications with a single set of credentials, but it does not provide the same level of granular control as RBAC.\nAllowing employees to choose their own passwords may be convenient, but it is not the BEST practice for IAM. This can lead to weak and easily guessable passwords, and does not provide the same level of security as other authentication methods.\nUsing biometric authentication for all users may provide a high level of security, but it is not considered the BEST practice for IAM. Biometric authentication can be expensive and may not be suitable for all users, such as those with disabilities.","explanation_th":"คำตอบที่ถูกคือ D เพราะ RBAC ให้สิทธิ์อย่างละเอียดตามหน้าที่ ทำให้จัดการสิทธิ์ได้ปลอดภัยและมีประสิทธิภาพ A เพิ่มความสะดวกแต่ไม่ได้กำหนดสิทธิ์อย่างละเอียด B อาจนำไปสู่รหัสผ่านอ่อนแอ และ C อาจมีต้นทุนสูงและไม่เหมาะกับผู้ใช้ทุกกลุ่ม"},{"number":13,"id":102018151,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is an example of a logical access control?","question_th":"ข้อใดเป็นตัวอย่างของการควบคุมการเข้าถึงเชิงตรรกะ","options":[{"en":"Requiring a password to access a computer","th":"กำหนดให้ใส่รหัสผ่านก่อนเข้าใช้คอมพิวเตอร์"},{"en":"Physical barriers around a data center","th":"สร้างสิ่งกีดขวางรอบศูนย์ข้อมูล"},{"en":"Background checks for new employees","th":"ตรวจสอบประวัติพนักงานใหม่"},{"en":"Employee training on security policies","th":"อบรมพนักงานเรื่องนโยบายความปลอดภัย"}],"correct":[0],"explanation_en":"The correct answer:\nA logical access control is a security measure that controls access to a computer or network based on user authentication and authorization. Requiring a password ensures that only authenticated and authorized users can access certain resources. Requiring a password is a logical control because it doesn't physically prevent someone from accessing a computer, but it does control who is allowed to log in and interact with the system logically.\n\nThe incorrect answers:\nPhysical barriers around a data center are an example of a physical access control, not a logical access control. Physical access controls, such as locks, security cameras, or fences, are designed to prevent unauthorized personnel from physically accessing a specific location, like a server room or a data center.\nBackground checks are a part of administrative controls. They involve assessing an individual's history and trustworthiness to determine if they should be given access to certain data or systems. This does not involve the direct regulation of access to digital data, thus it is not a logical access control.\nTraining on security policies is also an administrative control. It focuses on human factors to reduce risk by increasing awareness of threats and promoting good security practices. Like background checks, it does not regulate direct access to digital data.","explanation_th":"คำตอบที่ถูกคือ A เพราะรหัสผ่านควบคุมการเข้าสู่ระบบดิจิทัลผ่านการยืนยันตัวตน B เป็นการควบคุมทางกายภาพ ส่วน C และ D เป็นการควบคุมเชิงบริหาร ไม่ได้บังคับการเข้าถึงระบบโดยตรง"},{"number":14,"id":102018153,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is a type of access control that grants permission based on the position and responsibilities of users within an organization?","question_th":"การควบคุมการเข้าถึงประเภทใดให้สิทธิ์ตามตำแหน่งและความรับผิดชอบของผู้ใช้ในองค์กร","options":[{"en":"Discretionary access control","th":"Discretionary Access Control"},{"en":"Role-based access control","th":"Role-Based Access Control"},{"en":"Rule-based access control","th":"Rule-Based Access Control"},{"en":"Hierarchical access control","th":"Hierarchical Access Control"}],"correct":[1],"explanation_en":"The correct answer:\nRole-based access control is a type of access control that grants permission based on the roles (position) and responsibilities of users within an organization. This means that users are granted access to certain resources based on their job title, position, or responsibilities within the organization.\n\nThe incorrect answers:\nDiscretionary access control is a type of access control that grants permission based on the discretion of the owner of a resource. The owner of a resource can grant or deny access to that resource to other users.\nRule-based access control is a type of access control that grants permission based on pre-defined rules. Access to resources is granted or denied based on predetermined rules, such as the time of day or the location of the user.\nHierarchical access control is a type of access control that grants permission based on the hierarchical structure of an organization. Access to resources is granted or denied based on the user's position within the organizational hierarchy.","explanation_th":"คำตอบที่ถูกคือ B เพราะ RBAC ผูกสิทธิ์กับบทบาท ตำแหน่ง และงานที่รับผิดชอบ A ให้เจ้าของทรัพยากรเป็นผู้ตัดสินใจ C ใช้กฎที่กำหนดไว้ เช่น เวลา หรือสถานที่ และ D ให้สิทธิ์ตามลำดับชั้นขององค์กร ซึ่งไม่ใช่คำตอบที่ต้นฉบับต้องการ"},{"number":15,"id":102018155,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Suobo is the IT director of a rapidly growing tech startup. Given the scale and speed of your company's growth, his CEO has tasked him with ensuring the robustness of your organization's IT security posture. Specifically, the CEO is worried about potential vulnerabilities in your software infrastructure and wants his recommendations on the best types of security controls to mitigate risks. In this context, which of the following types of security controls is likely to be the most effective first line of defense for mitigating vulnerabilities in your software infrastructure?","question_th":"บริษัทต้องการแนวป้องกันแรกที่มีประสิทธิผลในการลดช่องโหว่ของโครงสร้างพื้นฐานซอฟต์แวร์ ควรใช้การควบคุมใด","options":[{"en":"Implementing a disaster recovery site for post-attack recovery","th":"สร้างไซต์กู้คืนภัยพิบัติสำหรับใช้หลังการโจมตี"},{"en":"Regularly applying software patches as corrective controls","th":"ติดตั้งแพตช์ซอฟต์แวร์อย่างสม่ำเสมอในฐานะ corrective control"},{"en":"Installing an Intrusion Detection System (IDS) as a detective control","th":"ติดตั้ง IDS ในฐานะ detective control"},{"en":"Implementing the principle of least privilege as a preventive control","th":"ใช้หลักสิทธิ์น้อยที่สุดในฐานะ preventive control"}],"correct":[1],"explanation_en":"The correct answer:\nRegularly applying software patches as corrective controls is likely to be the most effective first line of defense in this scenario. Software patches are updates released by software vendors to fix known vulnerabilities in their products. Applying these patches regularly can help to mitigate the risk of these known vulnerabilities being exploited.\n\nThe incorrect answers:\nImplementing a disaster recovery site for post-attack recovery: While this is an important part of a comprehensive approach to security, it's more about response and recovery than preventing vulnerabilities being exploited in the first place.\nInstalling an Intrusion Detection System (IDS) as a detective control: An IDS can help detect potential intrusions, but it doesn't directly mitigate vulnerabilities in the software infrastructure. It's more about identifying threats rather than preventing them.\nImplementing the principle of least privilege as a preventive control: This principle, where a user is given the minimum levels of access necessary to perform their job functions, is important for minimizing risk. However, it doesn't directly address vulnerabilities in the software infrastructure.","explanation_th":"คำตอบที่ถูกคือ B ตามต้นฉบับ เพราะแพตช์แก้ช่องโหว่ที่ผู้ผลิตทราบและลดโอกาสถูกใช้โจมตีโดยตรง A ช่วยกู้คืนหลังเหตุการณ์ C ตรวจจับแต่ไม่ปิดช่องโหว่ และ D ลดผลกระทบจากสิทธิ์ผู้ใช้แต่ไม่แก้ข้อบกพร่องของซอฟต์แวร์"},{"number":16,"id":102018157,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"In an IAM (Identity and Access Management) system, which process grants access to specific resources based on a user's assigned roles and permissions?","question_th":"ในระบบ IAM กระบวนการใดให้สิทธิ์เข้าถึงทรัพยากรเฉพาะตามบทบาทและสิทธิ์ที่ผู้ใช้ได้รับ","options":[{"en":"Authentication","th":"การยืนยันตัวตน (Authentication)"},{"en":"Authorization","th":"การอนุญาตสิทธิ์ (Authorization)"},{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Decryption","th":"การถอดรหัส"}],"correct":[1],"explanation_en":"The correct answer:\nAuthorization in IAM (Identity and Access Management) systems is the process of granting access to specific resources based on a user's assigned roles and permissions. After a user has been authenticated (their identity has been verified), the system determines what resources the user should be allowed to access based on their role or assigned permissions.\n\nThe incorrect answers:\nAuthentication is the process of verifying a user's identity. It typically involves validating that the entity is who it claims to be through the use of passwords, biometrics, or other types of credentials. It's a prerequisite to authorization but doesn't directly control access to resources.\nEncryption is the process of encoding data to protect it from unauthorized access by transforming plain text data into cipher text that is unreadable without the correct decryption key. It is not responsible for granting access to resources based on roles and permissions.\nDecryption is the process of decoding encrypted data to access its original form by using a decryption key. Like encryption, decryption is a key aspect of data security but isn't the process that controls access to resources based on user roles and permissions.","explanation_th":"คำตอบที่ถูกคือ B เพราะ Authorization ตัดสินว่าผู้ใช้ที่ยืนยันตัวตนแล้วทำอะไรหรือเข้าถึงทรัพยากรใดได้ A ตรวจว่าเป็นใคร ส่วน C และ D ปกป้องหรือแปลงข้อมูล ไม่ได้กำหนดสิทธิ์ตามบทบาท"},{"number":17,"id":102018159,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which is the MOST important factor when determining the strength of a password?","question_th":"ปัจจัยที่สำคัญที่สุดในการกำหนดความแข็งแรงของรหัสผ่านคือข้อใด","options":[{"en":"The length of the password","th":"ความยาวของรหัสผ่าน"},{"en":"The use of special characters","th":"การใช้อักขระพิเศษ"},{"en":"The use of personal information","th":"การใช้ข้อมูลส่วนบุคคล"},{"en":"The use of upper and lower case letters","th":"การใช้ตัวพิมพ์ใหญ่และตัวพิมพ์เล็ก"}],"correct":[0],"explanation_en":"The correct answer:\nThe length of the password: The strength of a password primarily depends on its length. With each additional character, the complexity of a password increases exponentially, making it harder to crack. A longer password has more possible combinations and permutations for an attacker to guess, making brute force or dictionary attacks less effective. This is due to the sheer number of possibilities that must be considered.\n\nThe incorrect answers:\nThe use of special characters: While the use of special characters does indeed increase the complexity of a password, it is not the most important factor in determining its strength. Special characters increase the potential pool of characters that can be used in a password, which can make brute force attacks more difficult. However, even a password full of special characters can be cracked quickly if it's too short, emphasizing that length is a more important factor.\nThe use of personal information: Using personal information in a password significantly weakens it, as this information can often be discovered or guessed by attackers. People frequently use personal information such as names, birthdays, or addresses, which can often be found through social engineering, data breaches, or simple online searches. Although this factor is important, it is actually a detriment to password strength, not a boost.\nThe use of upper and lower case letters: Incorporating both upper and lower case letters does increase a password's complexity by increasing the number of possible characters that can be used. This makes the password harder to guess and provides some protection against brute force attacks. Like the use of special characters, using both upper and lower case letters is not as significant as password length in determining password strength. A long password comprised solely of lower-case letters would still be more secure than a short password with a mix of upper-case, lower-case, and special characters, due to the exponential increase in combinations that comes with increased length.","explanation_th":"คำตอบที่ถูกคือ A เพราะทุกตัวอักษรที่เพิ่มทำให้จำนวนชุดที่ต้องเดาเพิ่มขึ้นอย่างมาก B และ D เพิ่มความหลากหลายของอักขระแต่รหัสผ่านสั้นยังแตกได้เร็ว C ทำให้รหัสผ่านอ่อนแอลงเพราะข้อมูลส่วนบุคคลอาจค้นพบหรือคาดเดาได้"},{"number":18,"id":102018161,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective indicator of a successful cloud security implementation?","question_th":"ข้อใดเป็นตัวบ่งชี้ที่มีประสิทธิผลที่สุดว่าการรักษาความปลอดภัยคลาวด์ประสบความสำเร็จ","options":[{"en":"The presence of multiple security protocols","th":"มีโพรโทคอลความปลอดภัยหลายชนิด"},{"en":"The use of the latest encryption algorithms","th":"ใช้อัลกอริทึมเข้ารหัสรุ่นล่าสุด"},{"en":"The implementation of robust access controls","th":"มีการควบคุมการเข้าถึงที่แข็งแกร่ง"},{"en":"The adoption of the LOWEST possible security standards","th":"ใช้มาตรฐานความปลอดภัยที่ต่ำที่สุดเท่าที่เป็นไปได้"}],"correct":[2],"explanation_en":"The correct answer:\nRobust access controls, including role-based access controls (RBAC), are a cornerstone of good security. It ensures that only authorized individuals have access to data and resources they require for their roles. This principle is known as the least privilege principle, and it's a fundamental part of cybersecurity. Robust access controls limit the potential damage in case of an account compromise because an attacker can access only the information or resources that the compromised account can access.\n\nThe incorrect answers:\nHaving multiple security protocols is not necessarily an indicator of effective security. While diversity in security measures can be good, it is far more important that the protocols are appropriately implemented and maintained. The quality and suitability of the protocols for the organization's specific needs are more important than the quantity.\nUsing the latest encryption algorithms is generally good practice, but it isn't the sole indicator of a successful cloud security implementation. It's also crucial to consider factors like proper key management, ensuring only authorized individuals have access to keys, and replacing keys at regular intervals or in case of a breach.\nThe adoption of the LOWEST possible security standards is the least effective indicator of a successful cloud security implementation. Adopting the lowest possible security standards will likely result in vulnerabilities and increased risk of security incidents. It's important to adopt security standards that adequately protect the organization's data and assets while still allowing for necessary business operations.","explanation_th":"คำตอบที่ถูกคือ C เพราะการควบคุมการเข้าถึงที่แข็งแกร่งทำให้เฉพาะผู้มีสิทธิ์เข้าถึงทรัพยากรตามหลัก least privilege A จำนวนโพรโทคอลไม่รับประกันว่าติดตั้งถูกต้อง B เป็นเพียงองค์ประกอบหนึ่งและยังต้องมีการจัดการกุญแจที่ดี ส่วน D เพิ่มช่องโหว่และความเสี่ยง"},{"number":19,"id":102018163,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"A new employee begins work at your company and is having trouble logging into the system. After some investigation, you discover that the access control system is evaluating the employee's department and their previous login history before granting access. What is a method of access control that evaluates user details and environmental conditions before granting access to a resource?","question_th":"ระบบประเมินแผนกของพนักงานและประวัติการเข้าสู่ระบบก่อนอนุญาตให้เข้าถึง วิธีควบคุมการเข้าถึงที่ประเมินรายละเอียดผู้ใช้และเงื่อนไขแวดล้อมคือข้อใด","options":[{"en":"Role-based access control","th":"Role-Based Access Control"},{"en":"Rule-based access control","th":"Rule-Based Access Control"},{"en":"Discretionary access control","th":"Discretionary Access Control"},{"en":"Attribute-based access control","th":"Attribute-Based Access Control"}],"correct":[3],"explanation_en":"The correct answer:\nAttribute-based access control (ABAC) is a method of access control that evaluates user attributes and environmental conditions, such as their role, department, or previous login history, as well as environmental conditions (time of day, location, etc.) before granting access to a resource. This method provides a high level of flexibility and granularity in defining access control policies, allowing for complex rule sets that can take a variety of factors into consideration.\n\nThe incorrect answers:\nRole-based access control (RBAC) systems grant permissions to users based on their role within an organization. While the role may include some attributes of the user (such as their job position), RBAC does not consider the full range of user attributes or environmental conditions that ABAC does.\nRule-based access control (RBAC) is a method of access control that grants or denies access to resources based on a set of rules or policies. The rules can be defined based on various conditions, but they are usually fixed and don't take into consideration a wide range of user attributes or environmental conditions like ABAC.\nDiscretionary access control (DAC) is a method of access control grant permissions based on the discretion of the owner. In a DAC model, the owner of the resource can decide who is allowed to access it. This method is user-centric and does not consider a broad range of user attributes or environmental conditions.","explanation_th":"คำตอบที่ถูกคือ D เพราะ ABAC ประเมินคุณลักษณะของผู้ใช้ ทรัพยากร และสภาพแวดล้อม เช่น แผนก ประวัติ เวลา และตำแหน่ง A เน้นบทบาท B ใช้กฎคงที่เป็นหลัก และ C ให้เจ้าของทรัพยากรเป็นผู้กำหนดสิทธิ์"},{"number":20,"id":102018165,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are a senior IT security officer at a large defense organization that primarily operates under a Mandatory Access Control (MAC) model. The system administrators have been granted access rights to the systems they are directly responsible for. However, with the increasing diversity of tasks and the expanding IT infrastructure, system administrators occasionally need access to systems that are not under their immediate control. To maintain the principle of least privilege and security, you're considering implementing a substructure to the MAC model. Which primary measure could best accommodate the changing access needs of the system administrators while still adhering to the principle of least privilege?","question_th":"องค์กรที่ใช้ MAC ต้องการให้ผู้ดูแลระบบเข้าถึงระบบอื่นตามความจำเป็น โดยยังคงหลักสิทธิ์น้อยที่สุด มาตรการใดเหมาะสมที่สุด","options":[{"en":"Introduce role-based access controls within the MAC framework, allowing system administrators access based on their defined roles.","th":"เพิ่ม RBAC ภายในกรอบ MAC เพื่อให้สิทธิ์ผู้ดูแลระบบตามบทบาทที่กำหนด"},{"en":"Employ a comprehensive data loss prevention (DLP) system.","th":"ใช้ระบบ Data Loss Prevention แบบครอบคลุม"},{"en":"Upgrade to more sophisticated encryption methods for data in transit and at rest.","th":"เพิ่มความซับซ้อนของการเข้ารหัสข้อมูลระหว่างส่งและขณะจัดเก็บ"},{"en":"Implement a dynamic security clearance system, adjusting clearance levels based on real-time assessments.","th":"ใช้ระดับ clearance แบบไดนามิกตามการประเมินแบบเรียลไทม์"}],"correct":[0],"explanation_en":"The correct answer:\nIntroducing Role-Based Access Control (RBAC) within the Mandatory Access Control (MAC) framework can provide a more flexible access control model without compromising the principle of least privilege. RBAC can define roles (such as 'system administrator') that are associated with specific access rights. As such, system administrators would have access to systems pertinent to their role, alleviating the need for case-by-case access granting while still maintaining control and security.\n\nThe incorrect answers:\nEmploying a comprehensive data loss prevention system would help secure data across transmission points but does not directly address the issue of granting system administrators appropriate access levels based on their roles and responsibilities.\nUpgrading to more sophisticated encryption methods would increase the security of data, especially when in transit or at rest. However, it does not address the need for a more flexible, role-based access control within the MAC framework.\nImplementing a dynamic security clearance system could provide adaptive access rights based on real-time assessments, but this approach could introduce significant complexity, potential security vulnerabilities, and may not align with the principle of least privilege if not very carefully managed.","explanation_th":"คำตอบที่ถูกคือ A เพราะ RBAC เพิ่มความยืดหยุ่นด้วยการผูกสิทธิ์กับบทบาท ขณะที่ MAC ยังคงบังคับข้อจำกัดส่วนกลาง B และ C ปกป้องข้อมูลแต่ไม่แก้การจัดสิทธิ์ตามหน้าที่ D ซับซ้อนและอาจเพิ่มช่องโหว่หรือให้สิทธิ์เกินจำเป็น"},{"number":21,"id":102018167,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the HIGHEST level of security in an access control model?","question_th":"รูปแบบควบคุมการเข้าถึงใดให้ระดับความปลอดภัยสูงที่สุด","options":[{"en":"Role-based access control.","th":"Role-Based Access Control"},{"en":"Rule-based access control.","th":"Rule-Based Access Control"},{"en":"Discretionary access control.","th":"Discretionary Access Control"},{"en":"Mandatory access control.","th":"Mandatory Access Control"}],"correct":[3],"explanation_en":"The correct answer:\nMandatory access control (MAC) is the highest level of security in an access control model because it is the most restrictive. In a mandatory access control system, access to resources is determined by a central authority, and users have no control over their own access privileges. This ensures that only authorized users are allowed to access sensitive resources, and that access is granted based on the user's role and clearance level. \n\nThe incorrect answers:\nRole-based access control (RBAC) while useful for assigning privileges based on roles within an organization, does not offer the highest level of security. It's flexible and simplifies access management, but doesn't include the strict controls provided by MAC.\nIn rule-based access control (RuBAC) access is granted or denied based on a set of rules defined by a system administrator. While this provides a level of granularity, it does not reach the level of control that MAC does, which involves system-wide policies that govern access based on classification and clearance.\nDiscretionary Access Control (DAC) allows the owner of the information or resource to control access. This is more flexible than MAC, but it's also less secure because it relies on individual users to make access decisions, which could lead to potential security risks if the user lacks proper security knowledge.","explanation_th":"คำตอบที่ถูกคือ D เพราะ MAC มีข้อจำกัดสูงและให้หน่วยงานส่วนกลางกำหนดสิทธิ์ตามชั้นความลับและ clearance ผู้ใช้ไม่สามารถเปลี่ยนสิทธิ์เอง A และ B ยืดหยุ่นกว่า ส่วน C ให้เจ้าของทรัพยากรตัดสินใจจึงมีความเสี่ยงจากการให้สิทธิ์ผิด"},{"number":22,"id":102018169,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are a Chief Information Security Officer (CISO) for an organization that is currently using Active Directory with Role-Based Access Control (RBAC). The organization is spread across different geographical locations, and each location has its separate domain and resources. As the CISO, you are considering different trust domain strategies to ensure access to resources across these separate domains while maintaining high-security standards. Which trust domain strategy would provide the optimal balance between resource accessibility and security?","question_th":"องค์กรมีหลายโดเมน Active Directory ในหลายพื้นที่ กลยุทธ์ความเชื่อถือใดให้สมดุลที่เหมาะสมระหว่างการเข้าถึงทรัพยากรกับความปลอดภัย","options":[{"en":"One-Way Trust","th":"One-Way Trust"},{"en":"Two-Way Trust","th":"Two-Way Trust"},{"en":"Domain Forest","th":"Domain Forest"},{"en":"Transitive Trust","th":"Transitive Trust"}],"correct":[3],"explanation_en":"The correct answer:\nTransitive Trust is an optimal balance between resource accessibility and security in this particular scenario. In a transitive trust relationship, if domain A trusts domain B and domain B trusts domain C, then domain A trusts domain C as well. This model allows for efficient and flexible access to resources across multiple domains while maintaining a certain level of control over trust relationships.\n\nThe incorrect answers:\nOne-Way Trust is less appropriate in this case as it provides limited resource accessibility. In a one-way trust relationship, users in domain A can access resources in domain B, but not vice versa. This could be a hindrance to collaboration and resource sharing across different geographical locations.\nTwo-Way Trust allows users in domain A to access resources in domain B and vice versa, but it may not scale well in an organization with many domains. It also increases potential security risks because a compromise in one domain could impact the other domain in the two-way trust relationship.\nDomain Forest could potentially be too permissive for the scenario. In a domain forest, all domains trust each other, which means users can access resources across all domains. This might offer high resource accessibility but can compromise security as it extends trust too broadly.","explanation_th":"คำตอบที่ถูกคือ D ตามต้นฉบับ เพราะ transitive trust ขยายความเชื่อถือผ่านโดเมนที่เชื่อมต่อกัน ช่วยให้เข้าถึงทรัพยากรหลายโดเมนได้ยืดหยุ่น A จำกัดการเข้าถึงเพียงทิศทางเดียว B ต้องสร้างความไว้วางใจสองทางและอาจขยายความเสี่ยง และ C เปิดความเชื่อถือกว้างเกินไปในสถานการณ์นี้"},{"number":23,"id":102018171,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) of a multinational corporation, and you've been tasked with developing a more robust password policy to improve your organization's security posture. You're faced with deciding which practices to adopt as part of your policy, considering the ubiquitousness and weaknesses associated with Type 1 authentication methods, primarily passwords. Which of the following practices would provide the most substantial improvement to the security of your password policy?","question_th":"แนวปฏิบัติใดช่วยเพิ่มความแข็งแรงของนโยบายรหัสผ่านได้มากที่สุดตามคำอธิบายต้นฉบับ","options":[{"en":"Implement a password complexity requirement including uppercase, lowercase, number, and symbols.","th":"กำหนดความซับซ้อนให้มีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์"},{"en":"Enforce regular password changes with restrictions on reuse.","th":"บังคับเปลี่ยนรหัสผ่านเป็นประจำและห้ามใช้ซ้ำ"},{"en":"Employ multi-factor authentication methods alongside passwords.","th":"ใช้ MFA ร่วมกับรหัสผ่าน"},{"en":"Train employees not to write down their passwords or share them with others.","th":"อบรมไม่ให้จดหรือแบ่งปันรหัสผ่าน"}],"correct":[0],"explanation_en":"The correct answer:\nImplement a password complexity requirement including uppercase, lowercase, number, and symbols. Complex passwords are harder to crack and guess, enhancing the security of accounts. This directly pertains to password policy and is a widely accepted best practice.\n\nThe incorrect answers:\nEnforce regular password changes with restrictions on reuse: While traditionally considered a best practice, recent guidance from security organizations like NIST has started to move away from this recommendation. Regular password changes can often lead to weaker passwords over time, as users may resort to slight modifications of their previous passwords or choose simpler passwords due to the frequent need to change them.\nEmploy multi-factor authentication methods alongside passwords: While MFA significantly enhances account security, it doesn't directly strengthen a password policy, like the questions asked about, it's a different type of authentication (Type 3).\nTrain employees not to write down their passwords or share them with others: While a crucial element of user security awareness, it doesn't directly make the password policy itself stronger.","explanation_th":"คำตอบที่ถูกตามแหล่งต้นฉบับคือ A เพราะเป็นการปรับนโยบายรหัสผ่านโดยตรงและเพิ่มชุดอักขระที่ต้องเดา B อาจทำให้ผู้ใช้เปลี่ยนเพียงเล็กน้อยหรือใช้รหัสที่อ่อนแอ C เพิ่มความปลอดภัยของการยืนยันตัวตนอย่างมากแต่เป็นปัจจัยเพิ่มเติม ไม่ใช่การทำให้ตัวนโยบายรหัสผ่านแข็งแรงขึ้นตามถ้อยคำของโจทย์ และ D เป็นการสร้างความตระหนัก ไม่ใช่ข้อกำหนดเชิงเทคนิคของรหัสผ่าน"},{"number":24,"id":102018173,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"The CEO (Chief Executive Officer) of ThorTeaches.com has expressed concern about the potential for insider threats and has asked for recommendations on how to secure employee accounts. Which of the following is NOT a best practice for managing user accounts within an organization?","question_th":"ข้อใดไม่ใช่แนวปฏิบัติที่ดีในการจัดการบัญชีผู้ใช้ภายในองค์กร","options":[{"en":"Enforcing complex passwords","th":"บังคับใช้รหัสผ่านที่ซับซ้อน"},{"en":"Regularly auditing user access rights","th":"ตรวจสอบสิทธิ์การเข้าถึงของผู้ใช้เป็นประจำ"},{"en":"Sharing passwords among employees","th":"แบ่งปันรหัสผ่านระหว่างพนักงาน"},{"en":"Providing training on account security measures","th":"อบรมมาตรการรักษาความปลอดภัยบัญชี"}],"correct":[2],"explanation_en":"The correct answer:\nSharing passwords among employees is not a best practice for managing user accounts within an organization. Password sharing compromises the principle of individual accountability, makes it difficult to accurately track user activities, and significantly increases the risk of unauthorized access and misuse. \n\nThe incorrect answers:\nEnforcing complex passwords is indeed a best practice. Complex passwords, which are made up of a mix of letters, numbers, and special characters, are harder for attackers to guess or crack using brute force attacks. It strengthens the security of user accounts and reduces the risk of unauthorized access.\nRegularly auditing user access rights is a crucial part of account management. This process helps ensure that users have the appropriate level of access needed to perform their job functions and nothing more, following the principle of least privilege.\nTraining users on account security measures is an essential aspect of managing user accounts securely. By educating employees about the importance of password hygiene, the dangers of phishing attacks, and other security risks, organizations can reduce the likelihood of account compromise.","explanation_th":"คำตอบที่ถูกคือ C เพราะการแบ่งปันรหัสผ่านทำลายความรับผิดชอบรายบุคคล ทำให้ติดตามกิจกรรมไม่ได้ และเพิ่มความเสี่ยงจากการเข้าถึงโดยไม่ได้รับอนุญาต A ช่วยต้านการเดารหัส B ยืนยันว่าผู้ใช้ยังมีสิทธิ์เท่าที่จำเป็น และ D ลดความผิดพลาดจากผู้ใช้"},{"number":25,"id":102018175,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following best describes the FAR (False Acceptance Rate)?","question_th":"ข้อใดอธิบาย FAR (False Acceptance Rate) ได้ถูกต้องที่สุด","options":[{"en":"The probability that an unauthorized user is able to gain access to a system","th":"ความน่าจะเป็นที่ผู้ไม่ได้รับอนุญาตสามารถเข้าสู่ระบบได้"},{"en":"The probability that a system incorrectly rejects a valid user","th":"ความน่าจะเป็นที่ระบบปฏิเสธผู้ใช้ที่ถูกต้องอย่างผิดพลาด"},{"en":"The probability that a system incorrectly grants access to an unauthorized user","th":"ความน่าจะเป็นที่ระบบอนุญาตผู้ไม่ได้รับอนุญาตอย่างผิดพลาด"},{"en":"The probability that a system correctly grants access to a valid user","th":"ความน่าจะเป็นที่ระบบอนุญาตผู้ใช้ที่ถูกต้องอย่างถูกต้อง"}],"correct":[2],"explanation_en":"The correct answer:\nThe false acceptance rate (FAR) is a measure of the effectiveness of a security system, specifically in terms of the likelihood of an unauthorized user being granted access. It represents the probability that an unauthorized user will be incorrectly granted access to a system, despite not having the proper credentials or clearance.\n\nThe incorrect answers:\nThe probability that an unauthorized user is able to gain access to a system is true in general, it is not specific to the false acceptance rate. The false acceptance rate only measures the probability of an unauthorized user being granted access, not the overall likelihood of an unauthorized user gaining access to a system.\nThe probability that a system incorrectly rejects a valid user describes the false rejection rate (FRR), which is the opposite of the false acceptance rate. The false rejection rate measures the probability of a valid user being incorrectly denied access to a system, despite having the proper credentials or clearance.\nThe probability that a system correctly grants access to a valid user is true, but it does not specifically describe the false acceptance rate. The false acceptance rate only measures the probability of an unauthorized user being granted access, not the probability of a valid user being granted access.","explanation_th":"คำตอบที่ถูกคือ C เพราะ FAR วัดสัดส่วนที่ระบบชีวมิติหรือระบบยืนยันตัวตนยอมรับบุคคลที่ไม่ควรผ่าน A กว้างเกินไปและอาจรวมการโจมตีรูปแบบอื่น B คือ False Rejection Rate (FRR) และ D คือการยอมรับที่ถูกต้อง ไม่ใช่ความผิดพลาด"},{"number":26,"id":102018177,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"When we use access rules, what are they mainly a part of?","question_th":"กฎการเข้าถึง (access rules) เป็นส่วนหลักของกระบวนการใด","options":[{"en":"Identification.","th":"การระบุตัวตน (Identification)"},{"en":"Authentication.","th":"การยืนยันตัวตน (Authentication)"},{"en":"Authorization.","th":"การอนุญาตสิทธิ์ (Authorization)"},{"en":"Accountability.","th":"ความรับผิดชอบและการตรวจสอบย้อนกลับ (Accountability)"}],"correct":[2],"explanation_en":"The correct answer:\nAccess rules are mainly a part of authorization. This refers to the process of determining whether or not a particular user or system has the right to access a particular resource or perform a particular action. This could include reading, writing, executing, and so on. In general, after a user has been identified (Identification) and verified to be who they say they are (Authentication), the system will then use access rules to determine what that user is allowed to do (Authorization).\n\nThe incorrect answers:\nIdentification refers to the process of stating or otherwise indicating who or what you are. This typically involves presenting an identifier like a username. Access rules do not fit in this process.\nAuthentication is the process of verifying that an identity is who or what it claims to be. This often involves verifying the authenticity of a claim made by a subject, typically by checking a password or some other form of credentials. Access rules are not directly involved in this step.\nAccountability refers to ensuring that actions can be traced back to the entities that performed them, often for the purposes of auditing. While accountability may rely on the results of the authorization process to some extent (e.g., in tracing who did what), the access rules themselves are part of the authorization process, not the accountability process.","explanation_th":"คำตอบที่ถูกคือ C เพราะ access rules ใช้ตัดสินว่าผู้ใช้ที่ยืนยันตัวตนแล้วสามารถอ่าน เขียน หรือใช้ทรัพยากรใดได้ A เป็นการบอกว่าเป็นใคร B เป็นการพิสูจน์ว่าเป็นบุคคลนั้นจริง และ D เป็นการผูกกิจกรรมกับผู้กระทำเพื่อการตรวจสอบ ไม่ใช่การกำหนดสิทธิ์"},{"number":27,"id":102018179,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following authentication methods is considered to be the MOST secure?","question_th":"วิธีการยืนยันตัวตนข้อใดถือว่าปลอดภัยที่สุดตามตัวเลือกที่ให้มา","options":[{"en":"Single-factor authentication","th":"การยืนยันตัวตนปัจจัยเดียว"},{"en":"Two-factor authentication","th":"การยืนยันตัวตนสองปัจจัย"},{"en":"Biometric authentication","th":"การยืนยันตัวตนด้วยชีวมิติ"},{"en":"Password-only authentication","th":"การยืนยันตัวตนด้วยรหัสผ่านอย่างเดียว"}],"correct":[1],"explanation_en":"The correct answer:\nTwo-factor authentication is considered to be the most secure authentication method because it requires a user to provide two different types of evidence to confirm their identity. This could include something the user knows, such as a password or PIN, and something the user has, such as a security token or biometric identifier. By requiring two different factors, it becomes much more difficult for an attacker to gain access to a system.\n\nThe incorrect answers:\nSingle-factor authentication is a security process in which the user provides only one form of identification, like a password or a passcode. While this method is widely used, it's not as secure as 2FA. If the single factor (like a password) is compromised, the entire system or account can be accessed by an unauthorized user.\nWhile biometric authentication can be a useful additional layer of security, it is not necessarily the most secure authentication method on its own. This is because biometric data can be stolen or replicated, meaning that an attacker could potentially gain access to a system by providing a fake fingerprint or other biometric identifier.\nPassword-only authentication is a type of single-factor authentication, and it's often the least secure option. Passwords can be easy to crack, guess, or phish, especially if users choose simple passwords or reuse them across multiple sites. Also, if the password is compromised, there's no other layer of security to prevent unauthorized access.","explanation_th":"คำตอบที่ถูกคือ B เพราะ 2FA ต้องใช้หลักฐานจากสองปัจจัยที่แตกต่างกัน ทำให้การขโมยปัจจัยเดียวไม่เพียงพอ A และ D มีจุดล้มเหลวเพียงจุดเดียว ส่วน C แม้แข็งแรงแต่หากใช้ชีวมิติเพียงอย่างเดียวยังคงเป็นปัจจัยเดียวและข้อมูลชีวมิติอาจถูกคัดลอกหรือรั่วไหลได้"},{"number":28,"id":102018181,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the head of IT security, you have implemented a new security measure for ThorTeaches.com's network. Employees are now required to provide multiple forms of authentication to access it. What is a security control that would achieve that?","question_th":"องค์กรกำหนดให้พนักงานใช้หลักฐานยืนยันตัวตนหลายรูปแบบในการเข้าเครือข่าย การควบคุมใดตอบโจทย์นี้","options":[{"en":"Single sign-on","th":"Single Sign-On"},{"en":"Two-factor authentication","th":"Two-Factor Authentication"},{"en":"Biometric authentication","th":"Biometric Authentication"},{"en":"Passwordless authentication","th":"Passwordless Authentication"}],"correct":[1],"explanation_en":"The correct answer:\nTwo-factor authentication (2FA) is a type of MFA where users are required to provide two forms of identification to access a system or network. This usually includes something the user knows (like a password), something the user has (like a token or mobile device), or something the user is (like a fingerprint or other biometric data). This provides an additional layer of security as even if one factor (like the password) is compromised, the attacker would still need the second factor to gain access.\n\nThe incorrect answers:\nSingle sign-on (SSO) is a technology that allows users to log in to multiple systems with a single set of credentials. It simplifies the authentication process but does not inherently require multiple forms of authentication.\nBiometric authentication involves using physical or behavioral characteristics (e.g. fingerprints, facial recognition, or voice recognition) to verify a user's identity. While it can be used as a part of a multi-factor authentication setup, by itself, it doesn't imply the usage of multiple forms of authentication.\nPasswordless authentication involves not using a password at all to access a system or network. This could be done through methods such as SSO or biometric authentication, but it does not necessarily involve multiple forms of identification.","explanation_th":"คำตอบที่ถูกคือ B เพราะ 2FA กำหนดให้ใช้สองปัจจัย เช่น รหัสผ่านร่วมกับโทเคนหรือชีวมิติ A ลดจำนวนครั้งที่ล็อกอินแต่ไม่จำเป็นต้องมีหลายปัจจัย C โดยลำพังเป็นเพียงหนึ่งปัจจัย และ D หมายถึงไม่ใช้รหัสผ่านแต่ไม่ได้รับประกันว่าจะใช้หลายปัจจัย"},{"number":29,"id":102018183,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"How do Identity and Access Management (IAM) and Encryption of Data at Rest (EDR) differ in terms of cloud security?","question_th":"IAM และการเข้ารหัสข้อมูลขณะจัดเก็บ (Encryption of Data at Rest: EDR) แตกต่างกันอย่างไรในบริบทคลาวด์","options":[{"en":"IAM ensures that only authorized users have access to data, while EDR ensures that data is encrypted when stored on cloud servers.","th":"IAM จำกัดการเข้าถึงเฉพาะผู้ได้รับอนุญาต ส่วน EDR เข้ารหัสข้อมูลที่จัดเก็บบนเซิร์ฟเวอร์คลาวด์"},{"en":"IAM focuses on protecting data from external threats, while EDR focuses on protecting data from internal threats.","th":"IAM ป้องกันภัยภายนอก ส่วน EDR ป้องกันภัยภายใน"},{"en":"IAM is a proactive security measure, while EDR is a reactive security measure.","th":"IAM เป็นมาตรการเชิงรุก ส่วน EDR เป็นมาตรการเชิงรับ"},{"en":"IAM applies to data in transit, while EDR applies to data at rest.","th":"IAM ใช้เฉพาะข้อมูลระหว่างส่ง ส่วน EDR ใช้กับข้อมูลขณะจัดเก็บ"}],"correct":[0],"explanation_en":"The correct answer:\nIAM ensures that only authorized users have access to data, while EDR ensures that data is encrypted when stored on cloud servers: IAM (Identity and Access Management) is a security practice that ensures only authorized users have access to specific resources or data. It involves managing identities (users, devices, etc.), and regulating access to resources within a network. This involves various processes like authentication (verifying the identity), authorization (providing specific permissions), and audit (recording activities for future review or investigations).\nOn the other hand, EDR (Encryption of Data at Rest) refers to the security practice of encrypting data that is stored on physical or virtual disk storage. This is done to prevent unauthorized access to the data even if the storage medium is compromised. Encryption involves transforming data into an unreadable format using an encryption algorithm and a secret key. Only those possessing the key can decrypt and access the original data.\n\nThe incorrect answers:\nIAM focuses on protecting data from external threats, while EDR focuses on protecting data from internal threats: This statement is not entirely accurate. Both IAM and EDR aim to protect data from both internal and external threats. IAM focuses on ensuring only authorized individuals (internal or external) have access to resources, which can help prevent unauthorized access from both inside and outside the organization. EDR, on the other hand, encrypts data at rest, making it unreadable to anyone without the correct decryption key, again protecting against both internal and external threats.\nIAM is a proactive security measure, while EDR is a reactive security measure: This is incorrect as both IAM and EDR are proactive security measures. IAM proactively regulates who can access what resources to prevent unauthorized access or data breaches. EDR proactively encrypts data stored in physical or virtual disks to ensure it cannot be accessed without the correct decryption key, even if the storage is compromised. Neither are reactive, as they don't respond to security incidents after they've happened, but rather work to prevent them in the first place.\nIAM applies to data in transit, while EDR applies to data at rest: This statement is partially true but misleading. While it's true that EDR specifically refers to the encryption of data at rest, IAM is not limited to data in transit. IAM applies to all data, whether at rest or in transit, by managing and controlling who has access to it. Therefore, IAM's application is broader than just data in transit.","explanation_th":"คำตอบที่ถูกคือ A เพราะ IAM จัดการตัวตน การยืนยันตัวตน และสิทธิ์ ส่วน EDR ทำให้ข้อมูลที่อยู่บนดิสก์อ่านไม่ได้หากไม่มีกุญแจ B ไม่ถูกเพราะทั้งสองช่วยป้องกันได้ทั้งภัยภายในและภายนอก C ไม่ถูกเพราะทั้งคู่เป็นมาตรการเชิงป้องกัน และ D จำกัดขอบเขต IAM แคบเกินไป เพราะ IAM ควบคุมการเข้าถึงข้อมูลได้ทุกสถานะ"},{"number":30,"id":102018185,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the newly appointed Chief Information Security Officer (CISO) for a global corporation with operations in several countries. You have a mandate to overhaul the company's existing IT security framework due to recent security breaches. You are planning to apply different types of security controls based on the operational requirements of different divisions within the organization. Which type of security control would be most effective in compensating for an inability to apply standard security controls due to the unique needs of a specific division within the organization?","question_th":"เมื่อหน่วยงานหนึ่งไม่สามารถใช้การควบคุมมาตรฐานได้เนื่องจากข้อจำกัดเฉพาะ ควรใช้การควบคุมประเภทใดเพื่อรักษาระดับการป้องกันเทียบเท่า","options":[{"en":"Installing a state-of-the-art Intrusion Detection System (IDS) for the specific division.","th":"ติดตั้ง IDS รุ่นล้ำสมัยเฉพาะหน่วยงาน"},{"en":"Implementing a stringent password policy company-wide.","th":"ใช้นโยบายรหัสผ่านที่เข้มงวดทั้งบริษัท"},{"en":"Hiring additional security personnel for physical control at the specific division's location.","th":"เพิ่มเจ้าหน้าที่รักษาความปลอดภัยทางกายภาพ"},{"en":"Applying compensating controls that provide an equivalent level of protection.","th":"ใช้ compensating controls ที่ให้ระดับการป้องกันเทียบเท่า"}],"correct":[3],"explanation_en":"The correct answer:\nCompensating controls are designed to provide an alternative solution when primary security controls cannot be applied due to operational, financial, or other constraints. In this situation, given the unique needs of a specific division, the most appropriate solution would be to apply compensating controls that could fulfill the same security function or goal as the primary controls, maintaining an equivalent level of protection.\n\nThe incorrect answers:\nInstalling an Intrusion Detection System (IDS) is an important measure for detecting potential intrusions, but it is primarily a detective control rather than a compensating one. Although useful, an IDS is not specifically tailored to address unique security requirements that might prevent the use of standard controls in certain situations.\nImplementing a stringent password policy is a form of preventive control that can enhance security across the entire company. This is a good practice, but it does not directly address the issue of compensating for an inability to apply standard security controls in a specific division.\nHiring additional security personnel for physical control can enhance security, but it is a physical control type. Similar to installing a state-of-the-art Intrusion Detection System (IDS) and implementing a stringent password policy, it does not serve as a compensating control for specific circumstances that prohibit the use of standard controls. Additionally, physical control might not be the most effective solution for a division with unique IT-related security needs.","explanation_th":"คำตอบที่ถูกคือ D เพราะ compensating control เป็นทางเลือกทดแทนเมื่อไม่สามารถใช้ control หลักได้ แต่ยังต้องบรรลุวัตถุประสงค์และระดับการป้องกันใกล้เคียงกัน A เป็น detective control เฉพาะชนิด B เป็น preventive control ทั่วไป และ C เป็น physical control ซึ่งอาจไม่แก้ข้อจำกัดด้านไอทีของหน่วยงานนั้น"},{"number":31,"id":102018187,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the security officer for a small startup, you are in charge of implementing a new system for authenticating employees and their devices before granting access to the company network. Which of the following is a commonly used protocol for verifying the identity of a user or device?","question_th":"โพรโทคอลใดนิยมใช้เพื่อตรวจสอบตัวตนของผู้ใช้หรืออุปกรณ์ก่อนให้เข้าเครือข่าย","options":[{"en":"HTTPS","th":"HTTPS"},{"en":"SSH","th":"SSH"},{"en":"LDAP","th":"LDAP"},{"en":"SSL","th":"SSL"}],"correct":[
