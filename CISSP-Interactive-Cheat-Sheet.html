<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CISSP Interactive Cheat Sheet</title>
<style>
:root{
  --bg:#0b1620; --bg2:#0e1e2b; --panel:#122636; --panel2:#16304399;
  --line:#1f3d52; --gold:#d4af6a; --gold-dim:#8a7444; --text:#dfe9f0; --text-dim:#93a8b8;
  --accent:#4fb8c9; --accent2:#e0954f;
  --c1:#4fb8c9; --c2:#e0954f; --c3:#9c7fd4; --c4:#5fbf8f; --c5:#d4af6a; --c6:#e06b6b; --c7:#6a9bd4; --c8:#c9a24f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
body{background:
  radial-gradient(1200px 600px at 10% -10%, #12283a 0%, transparent 60%),
  radial-gradient(1000px 500px at 100% 0%, #10202c 0%, transparent 55%),
  var(--bg);
  min-height:100vh;
}
::selection{background:var(--gold); color:#0b1620;}

/* Header */
header{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, rgba(11,22,32,0.98), rgba(11,22,32,0.9));
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:14px 20px 10px;
}
.header-top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:baseline; gap:10px;}
.brand .mark{font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:22px; color:var(--gold); letter-spacing:1px;}
.brand .sub{font-size:11px; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase;}
.tools{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.search-wrap{position:relative;}
#search{
  background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:9px 14px 9px 34px; border-radius:20px; width:260px; font-size:13.5px;
  outline:none; transition:border-color .2s, width .2s;
}
#search:focus{border-color:var(--gold); width:320px;}
.search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none;}
.mini-btn{
  background:transparent; border:1px solid var(--line); color:var(--text-dim);
  padding:8px 12px; border-radius:20px; font-size:12.5px; cursor:pointer; transition:.15s;
}
.mini-btn:hover{border-color:var(--gold); color:var(--gold);}
.mini-btn.active{background:var(--gold); color:#0b1620; border-color:var(--gold); font-weight:600;}

nav.tabs{display:flex; gap:6px; overflow-x:auto; margin-top:12px; padding-bottom:4px; scrollbar-width:thin;}
nav.tabs::-webkit-scrollbar{height:5px;}
nav.tabs::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
.tab-btn{
  flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
  padding:9px 14px; border-radius:8px 8px 0 0; font-size:12.5px; cursor:pointer; white-space:nowrap;
  border-bottom:3px solid transparent; transition:.15s; display:flex; align-items:center; gap:7px;
}
.tab-btn .num{font-family:Georgia,serif; font-weight:700; font-size:13px;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--text); border-bottom-color:var(--dcolor,var(--gold)); background:var(--bg2);}
.count-pill{font-size:10px; background:rgba(255,255,255,.06); padding:1px 6px; border-radius:8px; color:var(--text-dim);}

main{max-width:1500px; margin:0 auto; padding:22px 20px 80px;}

.domain-title{display:flex; align-items:center; gap:12px; margin:6px 0 18px;}
.domain-title .badge{
  width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-family:Georgia,serif; font-weight:700; font-size:17px; color:#0b1620; background:var(--dcolor,var(--gold));
  flex-shrink:0;
}
.domain-title h1{font-size:19px; margin:0; font-weight:600; letter-spacing:.3px;}
.domain-title span.tag{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px;}

.grid{
  columns:340px auto; column-gap:16px;
}
.card{
  break-inside:avoid; background:var(--panel); border:1px solid var(--line); border-radius:10px;
  margin-bottom:16px; overflow:hidden; transition:border-color .15s;
}
.card:hover{border-color:var(--gold-dim);}
.card h3{
  margin:0; padding:10px 14px; font-size:12.5px; letter-spacing:.4px; text-transform:uppercase;
  color:#0b1620; background:var(--dcolor,var(--gold)); font-weight:700; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center;
}
.card h3 .chev{transition:transform .2s; font-size:11px;}
.card.collapsed h3 .chev{transform:rotate(-90deg);}
.card .body{padding:2px 0;}
.card.collapsed .body{display:none;}

table{width:100%; border-collapse:collapse; font-size:12.6px;}
tr{border-bottom:1px solid rgba(255,255,255,.05);}
tr:last-child{border-bottom:none;}
td{padding:8px 14px; vertical-align:top; line-height:1.42;}
td.k{color:var(--gold); font-weight:600; width:34%; white-space:normal;}
td.v{color:var(--text);}
table.wide td.k{width:auto; white-space:nowrap;}
tr:hover{background:rgba(212,175,106,.05);}

ul.plain{margin:0; padding:10px 14px; list-style:none;}
ul.plain li{padding:5px 0; font-size:12.6px; line-height:1.4; border-bottom:1px dashed rgba(255,255,255,.06);}
ul.plain li:last-child{border-bottom:none;}
ul.plain li::before{content:"›"; color:var(--gold); margin-right:7px; font-weight:700;}

.note{font-size:11px; color:var(--text-dim); padding:8px 14px; font-style:italic; border-top:1px solid rgba(255,255,255,.05);}

mark{background:var(--gold); color:#0b1620; padding:0 2px; border-radius:2px;}

.empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
.empty-state .big{font-size:40px; margin-bottom:10px;}

.hidden{display:none !important;}

footer{text-align:center; padding:26px; color:var(--text-dim); font-size:11px; border-top:1px solid var(--line);}

@media (max-width:640px){
  #search{width:170px;} #search:focus{width:200px;}
  .grid{columns:1;}
  .domain-title h1{font-size:16px;}
}
@media print{
  header{position:static;} .search-wrap,.tools{display:none;}
  .card.collapsed .body{display:block !important;}
}
</style>
</head>

      <button class="mini-btn" id="printBtn">Print</button>

<main id="main"></main>

/* ============ RENDER ============ */
const main = document.getElementById('main');
const tabsEl = document.getElementById('tabs');
let activeDomain = 1;
let searchMode = false;

function cardHTML(sec, secIdx){
  let body = '';
  if(sec.type === 'kv'){
    body = '<table>' + sec.rows.map(r => `<tr><td class="k">${r[0]}</td><td class="v">${r[1]}</td></tr>`).join('') + '</table>';
  } else if(sec.type === 'table'){
    body = '<table class="wide"><tr>' + sec.headers.map(h=>`<td class="k">${h}</td>`).join('') + '</tr>' +
      sec.rows.map(r => '<tr>' + r.map(c=>`<td class="v">${c}</td>`).join('') + '</tr>').join('') + '</table>';
  } else if(sec.type === 'list'){
    body = '<ul class="plain">' + sec.rows.map(r=>`<li>${r}</li>`).join('') + '</ul>';
  }
  return `<div class="card" data-sec="${secIdx}"><h3><span>${sec.title}</span><span class="chev">▾</span></h3><div class="body">${body}</div></div>`;
}

function renderDomain(d){
  document.documentElement.style.setProperty('--dcolor', d.color);
  main.innerHTML = `
    <div class="domain-title">
      <div class="badge" style="background:${d.color}">D${d.id}</div>
      <div>
        <span class="tag">Domain ${d.id}</span><br>
        <h1>${d.title}</h1>
      </div>
    </div>
    <div class="grid">${d.sections.map((s,i)=>cardHTML(s,i)).join('')}</div>
  `;
  attachCardEvents();
}

function attachCardEvents(){
  document.querySelectorAll('.card h3').forEach(h=>{
    h.addEventListener('click', ()=> h.parentElement.classList.toggle('collapsed'));
  });
}

function renderTabs(){
  tabsEl.innerHTML = DOMAINS.map(d => `
    <button class="tab-btn" data-id="${d.id}" style="--dcolor:${d.color}">
      <span class="num">D${d.id}</span> ${d.title}
    </button>`).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      searchMode = false;
      document.getElementById('search').value = '';
      activeDomain = parseInt(btn.dataset.id);
      updateActiveTab();
      renderDomain(DOMAINS.find(d=>d.id===activeDomain));
    });
  });
  updateActiveTab();
}
function updateActiveTab(){
  tabsEl.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', !searchMode && parseInt(b.dataset.id)===activeDomain);
  });
}

/* ---- Search across all domains ---- */
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function highlight(text, re){ return text.replace(re, m => `<mark>${m}</mark>`); }

function runSearch(q){
  q = q.trim();
  if(!q){ searchMode=false; updateActiveTab(); renderDomain(DOMAINS.find(d=>d.id===activeDomain)); return; }
  searchMode = true;
  updateActiveTab();
  const re = new RegExp(escapeRe(q), 'ig');
  let html = '';
  let matchCount = 0;

  DOMAINS.forEach(d=>{
    let domainCards = '';
    d.sections.forEach((sec, i)=>{
      const hay = JSON.stringify(sec).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return;
      // build filtered/highlighted card
      let body = '';
      if(sec.type==='kv'){
        const rows = sec.rows.filter(r => (r[0]+r[1]).toLowerCase().includes(q.toLowerCase()) || sec.title.toLowerCase().includes(q.toLowerCase()));
        const useRows = rows.length ? rows : sec.rows;
        body = '<table>' + useRows.map(r=>`<tr><td class="k">${highlight(r[0],re)}</td><td class="v">${highlight(r[1],re)}</td></tr>`).join('') + '</table>';
      } else if(sec.type==='table'){
        body = '<table class="wide"><tr>' + sec.headers.map(h=>`<td class="k">${highlight(h,re)}</td>`).join('') + '</tr>' +
          sec.rows.map(r=>'<tr>'+r.map(c=>`<td class="v">${highlight(c,re)}</td>`).join('')+'</tr>').join('') + '</table>';
      } else if(sec.type==='list'){
        body = '<ul class="plain">' + sec.rows.map(r=>`<li>${highlight(r,re)}</li>`).join('') + '</ul>';
      }
      matchCount++;
      domainCards += `<div class="card"><h3 style="background:${d.color}"><span>${highlight(sec.title,re)}</span><span class="dtag">D${d.id}</span></h3><div class="body">${body}</div></div>`;
    });
    if(domainCards){
      html += `<div class="domain-title" style="margin-top:26px;"><div class="badge" style="background:${d.color}">D${d.id}</div><div><span class="tag">Domain ${d.id}</span><br><h1>${d.title}</h1></div></div><div class="grid">${domainCards}</div>`;
    }
  });

  if(!matchCount){
    main.innerHTML = `<div class="empty-state"><div class="big">🔍</div>No matches for "<strong>${q}</strong>". Try a different term.</div>`;
  } else {
    main.innerHTML = html;
    attachCardEvents();
  }
}

document.getElementById('search').addEventListener('input', e => runSearch(e.target.value));
document.getElementById('expandAll').addEventListener('click', ()=> document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed')));
document.getElementById('collapseAll').addEventListener('click', ()=> document.querySelectorAll('.card').forEach(c=>c.classList.add('collapsed')));
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

renderTabs();
renderDomain(DOMAINS.find(d=>d.id===activeDomain));
</script>
</body>
</html>
