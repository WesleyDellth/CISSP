s control lists","th":"Access Control Lists"},{"en":"Keycards","th":"Keycards"},{"en":"Regular security audits","th":"การตรวจสอบความปลอดภัยเป็นประจำ"}],"correct":[1],"explanation_en":"The correct answer:\nAccess control lists are a key part of content-based access control, as they specify which users or system processes are granted access to objects (like directories, files, etc.), as well as what operations are allowed on given objects. An ACL contains a list of permissions associated with an object, and each entry in the list specifies a subject (a user or a group of users) and an operation (like read, write, execute, etc.). When Nestor is adding content-based access control, he could create or modify the ACLs to define who has access to specific content or resources. This is directly in line with the task he's been given.\n\nThe incorrect answers:\nRetina scanners are a type of biometric security control that validates identities based on unique patterns in an individual's retina. While they can help to enhance the overall security of a system by ensuring that access is only granted to verified individuals, they don't directly address content-based access control. Content-based access control is more about controlling access to certain information or resources once a user is already authenticated, rather than the authentication process itself.\nKeycards are another type of physical security control, often used to control access to certain physical locations or systems. Like retina scanners, keycards contribute to the authentication process by validating that a user has a valid card. However, they don't handle content-based access control. Once a user is authenticated with a keycard, it doesn't regulate what data or resources they have access to: this would be the role of mechanisms like ACLs.\nRegular security audits are a critical component of a healthy security posture, as they involve assessing and reviewing a system's security controls to identify and address vulnerabilities. While these audits could uncover issues related to content-based access control, they are not a method of implementing such control themselves. Instead, they are part of a broader security strategy aimed at ensuring the overall integrity, confidentiality, and availability of a system or data.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะ ACL สามารถกำหนดสิทธิ์ต่อไฟล์ ข้อมูล หรือทรัพยากรเฉพาะตามเนื้อหาและผู้ใช้ A กับ C เป็นกลไกยืนยันตัวตนหรือ physical access และ D เป็นกิจกรรม assurance ไม่ใช่กฎที่บังคับการเข้าถึงเนื้อหา"},{"number":122,"id":102018369,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which type of access control could we use to limit access outside of regular work hours?","question_th":"access control ประเภทใดใช้จำกัดการเข้าถึงนอกเวลาทำงานปกติได้","options":[{"en":"Rule-based access control","th":"Rule-Based Access Control"},{"en":"Discretionary access control","th":"Discretionary Access Control"},{"en":"Role-based access control","th":"Role-Based Access Control"},{"en":"Mandatory access control","th":"Mandatory Access Control"}],"correct":[0],"explanation_en":"The correct answer:\nRule-based access control (RBAC) uses a set of approved assertions (i.e., rules) to determine whether access should be granted. These assertions might involve factors like the time of day, location of the user, strength of the user's authentication, type of connection (e.g., secure vs non-secure), among others. If there is a rule that limits access outside of regular work hours, then the RBAC system would deny access to users trying to access resources during those off-hours. Hence, it's the best fit among these options for limiting access outside of regular work hours.\n\nThe incorrect answers:\nDiscretionary Access Control (DAC): This type of access control allows the owner of the information or resource to determine who can access it. While it's a powerful and flexible approach, it's not best suited to time-based restrictions. The owner would need to manually change permissions every day to restrict access outside of work hours, which would be impractical and inefficient.\nRole-Based Access Control (RBAC): This type of access control restricts access to resources based on the user's role within the organization. It's ideal for situations where you need to limit access based on job function (e.g., only managers can access certain files), but it doesn't inherently support time-based restrictions. You could theoretically set up different roles for \"daytime employees\" and \"nighttime employees,\" but this would be an awkward and inefficient solution compared to using rule-based access control.\nMandatory Access Control (MAC) is a policy-driven access control model, where access is granted or denied based on policies set by a central authority, typically involving classifications (or labels) for information and users. While this can be very secure, it's not specifically designed for time-based access control. It is usually used when access needs to be restricted based on the sensitivity or confidentiality of the information (e.g., classified government documents).","explanation_th":"คำตอบที่ถูกคือ A เพราะ RuBAC ใช้เงื่อนไขและกฎ เช่น วัน เวลา ตำแหน่ง หรือประเภทการเชื่อมต่อ B ให้เจ้าของทรัพยากรตัดสิน C ให้สิทธิ์ตามบทบาท และ D ใช้ classification กับ clearance ไม่ได้เน้นเงื่อนไขเวลา"},{"number":123,"id":102018371,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective way to prevent unauthorized access to a system?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการป้องกันการเข้าถึงระบบโดยไม่ได้รับอนุญาต","options":[{"en":"Implementing a password policy","th":"ใช้นโยบายรหัสผ่าน"},{"en":"Implementing a two-factor authentication system","th":"ใช้ระบบยืนยันตัวตนสองปัจจัย"},{"en":"Encrypting all data on the system","th":"เข้ารหัสข้อมูลทั้งหมดในระบบ"},{"en":"Disabling all unused user accounts","th":"ปิดบัญชีผู้ใช้ที่ไม่ได้ใช้งานทั้งหมด"}],"correct":[1],"explanation_en":"The correct answer:\nTwo-factor authentication (2FA) is a security method in which a user is granted access only after successfully presenting two or more pieces of evidence (or factors) to an authentication mechanism. This typically involves something the user knows (e.g., a password), something the user has (e.g., a security token or a smartphone), or something the user is (e.g., a fingerprint). By requiring two forms of identification, 2FA significantly decreases the probability of unauthorized access, as even if an attacker obtains one factor (such as the password), they still need the second factor. This makes 2FA the most effective method listed here for preventing unauthorized access.\n\nThe incorrect answers:\nWhile a strong password policy (which might include requirements for password length, complexity, and expiration) is an important part of any security strategy, it is not the most effective way to prevent unauthorized access. Passwords, even strong ones, can still be cracked, guessed, or phished by attackers. Compared to two-factor authentication, a password-only approach is less secure because it relies on a single factor of authentication.\nEncrypting all data on the system is important for protecting the confidentiality of data, especially if a device is lost or stolen, or if an unauthorized person gains physical access to a system. Encryption does not prevent unauthorized access to a system in the first place. An attacker can still gain access to the system and, if they can crack the encryption key or gain access while the system is unlocked, they can access the encrypted data.\nDisabling unused user accounts is a good security practice because it reduces the number of potential targets for attackers. However, this alone is not the most effective way to prevent unauthorized access. Active user accounts can still be compromised, and if strong authentication practices (like two-factor authentication) are not in place, disabling unused accounts will have a limited impact on overall system security.","explanation_th":"คำตอบที่ถูกคือ B เพราะ 2FA ลดโอกาสที่ credential ปัจจัยเดียวจะเพียงพอต่อการยึดบัญชี A สำคัญแต่ยังพึ่งรหัสผ่าน C ปกป้องข้อมูลแต่ไม่ได้ห้ามการล็อกอินของผู้โจมตีที่มีบัญชี และ D ลดพื้นผิวการโจมตีแต่ยังไม่ป้องกันบัญชีที่ใช้งานอยู่ถูกขโมย"},{"number":124,"id":102018373,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the Chief Information Security Officer (CISO) of a large multinational corporation, you are considering adopting a more robust and secure authentication protocol to enhance the network security of your organization. Currently, your organization is using the Remote Authentication Dial-In User Service (RADIUS) protocol for managing the IP networks, access points, virtual private network (VPN) servers, and everything that is 802.1x. Diameter has been presented as an alternative due to its advanced security features, but you understand it's not widely adopted as a standard. What is your primary concern while contemplating this shift from RADIUS to Diameter?","question_th":"ความกังวลหลักเมื่อต้องเปลี่ยนจาก RADIUS ไปใช้ Diameter คือข้อใด","options":[{"en":"The lack of backward compatibility of Diameter with devices configured for RADIUS","th":"Diameter ไม่ backward compatible กับอุปกรณ์ที่ตั้งค่าสำหรับ RADIUS"},{"en":"The need to shift from UDP to TCP for transport","th":"ต้องเปลี่ยนจาก UDP ไป TCP"},{"en":"Diameter's ability to offer Authentication, Authorization, and Accounting","th":"Diameter ให้บริการ Authentication, Authorization และ Accounting ได้"},{"en":"The adoption of Diameter in 3G-4G-5G spaces","th":"Diameter ถูกใช้ในเครือข่าย 3G-4G-5G"}],"correct":[0],"explanation_en":"The correct answer:\nThe lack of backward compatibility of Diameter with devices configured for RADIUS is the most significant concern while considering this shift. This lack of backward compatibility implies that you would need to reconfigure all devices in your organization to communicate using the Diameter protocol instead of RADIUS. This could involve significant effort, time, and financial resources, possibly disrupting regular operations during the transition period.\n\nThe incorrect answers:\nThe need to shift from UDP to TCP for transport isn't a primary concern as both RADIUS and Diameter protocols can use either TCP or UDP for transport. Both protocols are flexible with the transport protocol, and transitioning to Diameter wouldn't mandate a shift from UDP to TCP necessarily.\nDiameter's ability to offer Authentication, Authorization, and Accounting is not a primary concern as both RADIUS and Diameter offer these functionalities. The shift to Diameter isn't driven by a need for these functionalities but by the more advanced security features offered by Diameter.\nAlthough it is true that Diameter is widely adopted in the 3G-4G-5G spaces, this doesn't directly influence the decision to shift from RADIUS to Diameter in a different context, like managing the IP networks, access points, and VPN servers in an enterprise setting. It does, however, speak to the potential of Diameter for managing large scale, high-speed networks.","explanation_th":"คำตอบที่ถูกคือ A เพราะอุปกรณ์และระบบที่รองรับ RADIUS เดิมอาจไม่สามารถสื่อสารกับ Diameter ได้โดยตรง ทำให้ต้องมี gateway การอัปเกรด หรือการเปลี่ยนอุปกรณ์ B เป็นความเปลี่ยนแปลงด้าน transport แต่ไม่ใช่ความเสี่ยงหลักที่สุด C เป็นความสามารถที่ต้องการ และ D เป็นบริบทการใช้งาน ไม่ใช่ข้อเสีย"},{"number":125,"id":102018375,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"ThorTeaches.com recently experienced a data breach that resulted in the theft of sensitive customer information. A user's credentials were stolen. Prabh is responsible for implementing new security measures to prevent this from happening again. Which of the following would be the MOST effective solution?","question_th":"หลังเกิดข้อมูลรั่วไหลจากการขโมย credentials มาตรการใดมีประสิทธิผลที่สุดเพื่อป้องกันเหตุซ้ำ","options":[{"en":"Implementing a two-factor authentication system for all employees","th":"ใช้การยืนยันตัวตนสองปัจจัยกับพนักงานทั้งหมด"},{"en":"Updating all employee passwords every 90 days","th":"เปลี่ยนรหัสผ่านพนักงานทุก 90 วัน"},{"en":"Conducting regular security awareness training for all employees","th":"อบรมความตระหนักด้านความปลอดภัยเป็นประจำ"},{"en":"Implementing a network firewall to block all incoming traffic","th":"ใช้ไฟร์วอลล์บล็อก traffic ขาเข้าทั้งหมด"}],"correct":[0],"explanation_en":"The correct answer: \nImplementing a two-factor authentication system for all employees is likely the most effective solution following to prevent user credentials being used if stolen. Two-factor authentication (2FA) adds an extra layer of security to the process of authentication by requiring users to present two separate forms of identification before they can access sensitive data. This typically involves something the user knows (such as a password) and something the user possesses (such as a token or an SMS code sent to their mobile device). This approach makes unauthorized access considerably more difficult, even if an attacker is able to obtain a user's password, thereby reducing the risk of future data breaches. \n\nThe incorrect answers:\nUpdating all employee passwords every 90 days. While updating passwords regularly is a common security practice, it is not necessarily the most effective solution following a data breach. Regular password changes can often lead to employees creating weaker passwords or reusing passwords across multiple accounts, which can actually increase the risk of a breach. Also, if an attacker can gain access to a user's password once, there is a risk they could do so again, even if the password is changed every 90 days. \nConducting regular security awareness training for all employees. Regular security awareness training is an important part of a company's overall security strategy, but it may not be the most effective standalone solution following a data breach. Training relies on individual behavior, which can vary greatly and may not always adhere to best practices despite training efforts. While training can reduce the risk of incidents like phishing attacks, it does not provide the same level of security assurance as technical measures such as two-factor authentication. \nImplementing a network firewall to block all incoming traffic. Implementing a network firewall can help protect against external threats, but blocking all incoming traffic is not feasible for most businesses as it would prevent necessary communications and services. Also, a firewall does not protect against all types of attacks. For example, if an attacker obtains a user's login credentials, they could potentially bypass the firewall and gain access to sensitive data. This is why multi-factor authentication, which provides an additional layer of security beyond just a password, is a more effective solution following a data breach.","explanation_th":"คำตอบที่ถูกคือ A เพราะแม้รหัสผ่านถูกขโมย ผู้โจมตียังต้องมีปัจจัยที่สอง B ไม่ช่วยในช่วงก่อนถึงรอบเปลี่ยนและรหัสใหม่อาจถูกขโมยอีก C ลดโอกาสถูกหลอกแต่ไม่ใช่กลไกบังคับ และ D ทำให้บริการใช้งานไม่ได้และยังไม่ป้องกันการใช้ credentials ผ่านช่องทางที่จำเป็นต้องเปิด"}]};</script>
<script>
(() => {
  'use strict';
  const data = window.QUIZ_DATA;
  if (!data || !Array.isArray(data.questions)) {
    document.body.innerHTML = '<p style="padding:24px">ไม่พบ questions data file / Missing quiz data.</p>';
    return;
  }
  const $ = id => document.getElementById(id);
  const els = {
    start: $('startScreen'), quiz: $('quizScreen'), result: $('resultScreen'), top: $('topbar'),
    card: $('questionCard'), nav: $('navGrid'), finish: $('finishBtn'), quit: $('quitBtn'),
    modeText: $('modeText'), current: $('currentStat'), total: $('totalStat'), answered: $('answeredStat'),
    score: $('scoreStat'), scorePill: $('scorePill'), progress: $('progressBar'), toast: $('toast'), note: $('sourceNote')
  };
  let state = null;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function cloneQuestions() {
    return data.questions.map(q => ({...q, options:q.options.map((o, i) => ({...o, originalIndex:i}))}));
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function sameSet(a, b) {
    const x = [...a].sort((m,n)=>m-n), y = [...b].sort((m,n)=>m-n);
    return x.length === y.length && x.every((v,i)=>v===y[i]);
  }
  function correctFor(q) {
    return q.options.map((o,i)=>q.correct.includes(o.originalIndex)?i:null).filter(v=>v!==null);
  }
  function selectedOriginal(q, displayedSelections) {
    return displayedSelections.map(i => q.options[i].originalIndex);
  }
  function isCorrect(q, displayedSelections) {
    return sameSet(selectedOriginal(q, displayedSelections), q.correct);
  }
  function answerText(q, indices) {
    if (!indices || !indices.length) return 'ไม่ได้ตอบ / Unanswered';
    return indices.map(i => `${letters[i]}. ${q.options[i].en} — ${q.options[i].th}`).join(' | ');
  }
  function toast(msg) {
    els.toast.textContent = msg; els.toast.classList.remove('hidden');
    clearTimeout(toast.timer); toast.timer = setTimeout(()=>els.toast.classList.add('hidden'), 2200);
  }
  function start(mode) {
    const qs = cloneQuestions();
    if ($('shuffleOptions').checked) qs.forEach(q=>shuffle(q.options));
    if ($('shuffleQuestions').checked) shuffle(qs);
    state = {mode, questions:qs, index:0, answers:{}, checked:{}, completed:false};
    els.start.classList.add('hidden'); els.result.classList.add('hidden'); els.quiz.classList.remove('hidden'); els.top.classList.remove('hidden');
    els.modeText.textContent = mode === 'practice' ? 'Practice Mode / เฉลยทันที' : 'Exam Mode / เฉลยตอนจบ';
    els.total.textContent = qs.length; els.scorePill.classList.toggle('hidden', mode === 'exam');
    renderNav(); renderQuestion(); updateStats(); window.scrollTo({top:0});
  }
  function renderQuestion() {
    const q = state.questions[state.index];
    const chosen = state.answers[q.id] || [];
    const checked = !!state.checked[q.id];
    const exact = checked ? isCorrect(q, chosen) : false;
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    const optionHTML = q.options.map((o, i) => {
      const selected = chosen.includes(i);
      let cls = selected ? ' selected' : '';
      if (checked) {
        if (correctFor(q).includes(i)) cls += ' correct';
        else if (selected) cls += ' incorrect';
      }
      return `<label class="option${cls}">
        <input type="${type}" name="answer" value="${i}" ${selected?'checked':''} ${checked?'disabled':''}>
        <div><div class="opt-en"><span class="letter">${letters[i]}</span>${escapeHtml(o.en)}</div><div class="opt-th">${escapeHtml(o.th)}</div></div>
      </label>`;
    }).join('');
    const feedback = checked ? `<section class="feedback ${exact?'good':'bad'}">
      <h3>${exact?'✅ Correct — ถูกต้อง':'❌ Incorrect — ยังไม่ถูกต้อง'}</h3>
      <div><b>Correct answer:</b> ${escapeHtml(answerText(q, correctFor(q)))}</div>
      <div class="explain-grid">
        <div class="explain"><strong>คำอธิบายภาษาไทย</strong><div class="preline">${escapeHtml(q.explanation_th)}</div></div>
        <div class="explain"><strong>English explanation (source)</strong><div class="preline">${escapeHtml(q.explanation_en)}</div></div>
      </div>
    </section>` : '';
    els.card.innerHTML = `<div class="qmeta"><div><div class="qcount">Question ${state.index+1} of ${state.questions.length}</div><div class="tag">${q.type==='multi'?'Select all that apply / เลือกทุกข้อที่ถูก':'Single answer / เลือกหนึ่งข้อ'}</div></div><div class="tag">Source Q${q.number}</div></div>
      <div class="lang-label">ENGLISH</div><div class="question-en">${escapeHtml(q.question_en)}</div>
      <div class="lang-label">ภาษาไทย</div><div class="question-th">${escapeHtml(q.question_th)}</div>
      ${q.type==='multi'?'<div class="instruction">ข้อนี้ต้องเลือกคำตอบที่ถูกให้ครบทั้งหมดจึงจะได้คะแนน</div>':''}
      <div class="options">${optionHTML}</div>${feedback}
      <div class="actions"><div class="action-group"><button id="prevBtn" class="btn" ${state.index===0?'disabled':''}>← ก่อนหน้า</button><button id="nextBtn" class="btn" ${state.index===state.questions.length-1?'disabled':''}>ถัดไป →</button></div>
      <div class="action-group">${state.mode==='practice'&&!checked?'<button id="checkBtn" class="btn primary">ตรวจคำตอบ</button>':''}${state.mode==='exam'&&state.index===state.questions.length-1?'<button id="submitHereBtn" class="btn primary">ส่งข้อสอบ</button>':''}</div></div>`;
    els.card.querySelectorAll('input[name="answer"]').forEach(input => input.addEventListener('change', onSelect));
    $('prevBtn').addEventListener('click',()=>go(state.index-1));
    $('nextBtn').addEventListener('click',()=>go(state.index+1));
    if ($('checkBtn')) $('checkBtn').addEventListener('click', checkPractice);
    if ($('submitHereBtn')) $('submitHereBtn').addEventListener('click', finishExam);
    updateStats(); renderNav();
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function onSelect(e) {
    const q = state.questions[state.index];
    if (state.checked[q.id]) return;
    const inputs = [...els.card.querySelectorAll('input[name="answer"]:checked')];
    state.answers[q.id] = inputs.map(x=>Number(x.value));
    renderQuestion();
  }
  function checkPractice() {
    const q = state.questions[state.index];
    const selected = state.answers[q.id] || [];
    if (!selected.length) return toast('กรุณาเลือกคำตอบก่อนตรวจ');
    state.checked[q.id] = true;
    renderQuestion();
  }
  function go(index) {
    if (index < 0 || index >= state.questions.length) return;
    state.index = index; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function answeredCount() { return Object.values(state.answers).filter(a=>a&&a.length).length; }
  function practiceCorrect() {
    return state.questions.filter(q=>state.checked[q.id] && isCorrect(q,state.answers[q.id]||[])).length;
  }
  function updateStats() {
    if (!state) return;
    const answered = answeredCount();
    els.current.textContent = state.index+1; els.answered.textContent = answered;
    els.progress.style.width = `${answered/state.questions.length*100}%`;
    if (state.mode==='practice') {
      const checkedCount = Object.keys(state.checked).length;
      els.score.textContent = checkedCount ? `${practiceCorrect()}/${checkedCount}` : '0/0';
    }
  }
  function renderNav() {
    if (!state) return;
    els.nav.innerHTML = state.questions.map((q,i)=>{
      const ans = state.answers[q.id] || [];
      let cls = i===state.index?' current':'';
      if (state.checked[q.id]) cls += isCorrect(q,ans)?' correct':' incorrect';
      else if (ans.length) cls += ' answered';
      return `<button class="nav-btn${cls}" data-i="${i}" title="Question ${i+1} / Source Q${q.number}">${i+1}</button>`;
    }).join('');
    els.nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i))));
  }
  function finishExam() {
    const unanswered = state.questions.length - answeredCount();
    const message = unanswered ? `ยังไม่ได้ตอบ ${unanswered} ข้อ ต้องการส่งข้อสอบหรือไม่?` : 'ต้องการส่งข้อสอบและดูผลหรือไม่?';
    if (!window.confirm(message)) return;
    finish();
  }
  function finish() {
    state.completed = true;
    const total = state.questions.length;
    const correct = state.questions.filter(q=>isCorrect(q,state.answers[q.id]||[])).length;
    const answered = answeredCount();
    const wrong = answered - correct;
    const unanswered = total - answered;
    const pct = Math.round((correct/total)*10000)/100;
    const passed = pct >= data.meta.pass_mark_percent;
    els.quiz.classList.add('hidden'); els.top.classList.add('hidden'); els.result.classList.remove('hidden');
    const incorrectQs = state.questions.filter(q=>!isCorrect(q,state.answers[q.id]||[]));
    const review = incorrectQs.map((q,idx)=>{
      const displayed = state.answers[q.id]||[];
      return `<article class="review-card"><h3>${idx+1}. Source Q${q.number}</h3>
        <div><b>EN:</b> ${escapeHtml(q.question_en)}</div><div><b>TH:</b> ${escapeHtml(q.question_th)}</div>
        <div class="answer-line yours"><b>Your answer:</b> ${escapeHtml(answerText(q,displayed))}</div>
        <div class="answer-line correct"><b>Correct:</b> ${escapeHtml(answerText(q,correctFor(q)))}</div>
        <div class="explain-grid"><div class="explain"><strong>คำอธิบายภาษาไทย</strong><div class="preline">${escapeHtml(q.explanation_th)}</div></div><div class="explain"><strong>English explanation</strong><div class="preline">${escapeHtml(q.explanation_en)}</div></div></div>
      </article>`;
    }).join('');
    els.result.innerHTML = `<div class="result-hero"><div class="eyebrow">Results / ผลการสอบ</div><div class="score-ring" style="--scoredeg:${pct*3.6}deg"><span>${pct}%</span></div>
      <h1 class="${passed?'pass':'fail'}">${passed?'PASS — ผ่าน':'FAIL — ไม่ผ่าน'}</h1><p>เกณฑ์ผ่าน ${data.meta.pass_mark_percent}%</p></div>
      <div class="summary-grid"><div class="summary-item"><strong>${correct}</strong>ถูก</div><div class="summary-item"><strong>${wrong}</strong>ผิด</div><div class="summary-item"><strong>${unanswered}</strong>ไม่ได้ตอบ</div><div class="summary-item"><strong>${total}</strong>ทั้งหมด</div></div>
      <div class="actions"><div class="action-group"><button id="restartBtn" class="btn primary">ทำใหม่</button><button id="printBtn" class="btn">พิมพ์ผล</button></div></div>
      <h2 class="review-title">ทบทวนข้อที่ผิดและไม่ได้ตอบ (${incorrectQs.length})</h2><div class="review-list">${review || '<p>ยอดเยี่ยม ตอบถูกทุกข้อ!</p>'}</div>`;
    $('restartBtn').addEventListener('click', reset);
    $('printBtn').addEventListener('click',()=>window.print());
    window.scrollTo({top:0});
  }
  function reset() {
    state=null; els.result.classList.add('hidden'); els.quiz.classList.add('hidden'); els.top.classList.add('hidden'); els.start.classList.remove('hidden'); window.scrollTo({top:0});
  }

  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>start(btn.dataset.mode)));
  els.finish.addEventListener('click',()=>state.mode==='exam'?finishExam():finish());
  els.quit.addEventListener('click',()=>{ if(window.confirm('เริ่มใหม่และล้างคำตอบทั้งหมดหรือไม่?')) reset(); });
  els.note.textContent = `${data.meta.question_count} questions. Source: ${data.meta.source_file}. Compared with Domain 1: no exact or near-duplicate questions were removed.`;
})();
</script>
</body>
</html>
