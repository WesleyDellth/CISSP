 production deployment", "การทดสอบการยอมรับของผู้ใช้ (UAT), การทดสอบ DAST, การทดสอบเจาะระบบ และการติดตั้งขึ้นระบบจริง"]]]}, {"title": "Change / Configuration Management Process", "thTitle": "กระบวนการจัดการการเปลี่ยนแปลงและการกำหนดค่า (Change & Configuration Control)", "type": "kv", "rows": [[["Request Control", "1. การควบคุมคำขอ (Request Control)"], ["Formal framework for submitting modification requests, business cost/benefit analysis, prioritizing change tasks", "กระบวนการยื่นคำขอเปลี่ยนแปลงอย่างเป็นทางการ, วิเคราะห์ความคุ้มค่าและผลกระทบ, จัดลำดับความสำคัญของงาน"]], [["Change Control", "2. การควบคุมการเปลี่ยนแปลง (Change Control)"], ["Engineering framework for developing, testing, and documenting a technical solution before production deployment", "กระบวนการพัฒนาและทดสอบวิธีแก้ไขในสภาพแวดล้อมทดสอบก่อนนำไปติดตั้งบน Production จริง"]], [["Release Control", "3. การควบคุมการส่งมอบ (Release Control)"], ["Formal managerial approval, security verification, and regression testing prior to releasing software to users", "การขออนุมัติจากผู้บริหารและการตรวจสอบความปลอดภัยรอบสุดท้ายก่อนปล่อยซอฟต์แวร์ให้ผู้ใช้ใช้งาน"]], [["SVC (Software Version Control)", "ระบบควบคุมเวอร์ชัน (SVC / Git)"], ["Methodology and tools (e.g. Git) for securely storing, branching, and tracking historical software source code changes", "เครื่องมือและระเบียบวิธีในการจัดเก็บ ติดตาม และบริหารจัดการประวัติการเปลี่ยนแปลงของซอร์สโค้ด (เช่น Git)"]], [["Configuration Identification", "การระบุรายการกำหนดค่า (Configuration Identification)"], ["Cataloging and labelling all hardware, software, and documentation configuration items with unique identifiers", "การขึ้นทะเบียนและกำหนดรหัสเฉพาะให้กับฮาร์ดแวร์ ซอฟต์แวร์ และเอกสารทุกชิ้นในระบบ"]], [["Configuration Control", "การควบคุมรายการกำหนดค่า (Configuration Control)"], ["Ensuring all proposed system modifications comply with change management policies and baseline standards", "การควบคุมให้การปรับแต่งแก้ไขระบบทั้งหมดเป็นไปตามนโยบายและมาตรฐาน Baseline ที่กำหนดไว้"]], [["Configuration Audit", "การตรวจสอบรายการกำหนดค่า (Configuration Audit)"], ["Systematic audits verifying that the actual production environment precisely matches approved configuration records", "การตรวจสอบว่าระบบที่ทำงานอยู่จริงบน Production มีความสอดคล้องถูกต้องตรงกับเอกสารบันทึกการกำหนดค่า"]]]}, {"title": "Capability Maturity Model", "thTitle": "แบบจำลองวัดระดับวุฒิภาวะของกระบวนการ (CMM / CMMI 5 ระดับ)", "type": "list", "rows": [["1. Initial (Level 1) — Ad-hoc, disorganized, chaotic informal processes (reactive)", "ระดับ 1: Initial — กระบวนการแบบตามใจชอบ ไม่มีแบบแผน คาดเดาผลลัพธ์ได้ยาก (เชิงรับ)"], ["2. Repeatable (Level 2) — Basic project management and tracking processes established; repeatable on similar projects (reactive)", "ระดับ 2: Repeatable — มีกระบวนการบริหารโครงการและติดตามผลพื้นฐาน สามารถทำซ้ำได้ในโครงการที่คล้ายกัน"], ["3. Defined (Level 3) — Standardized engineering, project planning, QA, and config mgmt documented org-wide (proactive)", "ระดับ 3: Defined — กระบวนการทางวิศวกรรมและการประกันคุณภาพได้รับการกำหนดเป็นมาตรฐานและจัดทำเอกสารทั่วองค์กร (เชิงรุก)"], ["4. Managed (Level 4) — Quantitative metrics and statistical quality management measuring process performance (proactive)", "ระดับ 4: Managed — มีการวัดผลกระบวนการในเชิงปริมาณและสถิติเพื่อควบคุมคุณภาพอย่างเป็นระบบ"], ["5. Optimizing (Level 5) — Continuous process improvement through quantitative feedback and innovative technologies (proactive)", "ระดับ 5: Optimizing — มีการปรับปรุงและพัฒนากระบวนการอย่างต่อเนื่องโดยใช้นวัตกรรมและการวิเคราะห์ผลเชิงปริมาณ"]]}, {"title": "Project Management Tools", "thTitle": "เครื่องมือบริหารจัดการโครงการ (Project Management Tools)", "type": "kv", "rows": [[["Gantt chart", "แผนภูมิแกนต์ (Gantt Chart)"], ["Bar chart illustrating project task schedules, milestones, dependencies, and progress over time", "แผนภูมิแท่งแสดงกำหนดการทำงาน ลำดับความต่อเนื่องของงาน และความคืบหน้าของโครงการตามช่วงเวลา"]], [["PERT", "แผนภูมิเพิร์ต (PERT Chart)"], ["Program Evaluation and Review Technique — project scheduling network diagram calculating critical paths, task durations, and variance risks", "เทคนิคการประเมินและทบทวนโครงการเพื่อคำนวณเส้นทางวิกฤต (Critical Path) และบริหารจัดการความเสี่ยงด้านเวลา"]]]}, {"title": "Database Systems Terminology", "thTitle": "คำศัพท์สำคัญของระบบฐานข้อมูล", "type": "kv", "rows": [[["Database / DBMS", "ฐานข้อมูล / ระบบ DBMS"], ["Structured repository for storing data / software controlling storage, retrieval, and access to data", "แหล่งจัดเก็บข้อมูลที่มีโครงสร้าง / ซอฟต์แวร์ควบคุมการจัดเก็บ ค้นหา และบริหารจัดการสิทธิ์ข้อมูล"]], [["DBMS Types", "ประเภทของระบบ DBMS"], ["Hierarchical, Network, Relational (RDBMS), Object-Oriented (OODBMS), NoSQL, Graph", "เชิงลำดับชั้น, เชิงเครือข่าย, เชิงสัมพันธ์ (RDBMS), เชิงวัตถุ (OODBMS), NoSQL"]], [["DDL", "ภาษา DDL (Data Definition Language)"], ["SQL subset defining database schema, tables, and structures (CREATE, ALTER, DROP)", "คำสั่ง SQL สำหรับกำหนดโครงสร้างฐานข้อมูลและตาราง (เช่น CREATE, ALTER, DROP)"]], [["Degree of Db", "ดีกรีของฐานข้อมูล (Degree)"], ["Number of attributes (columns) in a database table", "จำนวนของแอตทริบิวต์ (คอลัมน์) ในตารางฐานข้อมูล"]], [["Cardinality", "คาร์ดินัลลิตี (Cardinality)"], ["Number of tuples (rows/records) in a database table", "จำนวนของทูเพิล (แถวหรือเรคอร์ด) ในตารางฐานข้อมูล"]], [["Tuple", "ทูเพิล (Tuple)"], ["A single record / row in a relational database table", "เรคอร์ดข้อมูล 1 แถวในตารางฐานข้อมูลเชิงสัมพันธ์"]], [["DDE", "การแลกเปลี่ยนข้อมูลแบบไดนามิก (DDE)"], ["Dynamic Data Exchange — legacy IPC mechanism in Windows allowing apps to share data", "กลไกส่งผ่านข้อมูลระหว่างโปรแกรมในระบบ Windows"]], [["DCL", "ภาษา DCL (Data Control Language)"], ["SQL subset managing permissions and security access controls (GRANT, REVOKE)", "คำสั่ง SQL สำหรับจัดการสิทธิ์ความปลอดภัยของผู้ใช้ (เช่น GRANT, REVOKE)"]], [["Semantic integrity", "ความถูกต้องเชิงความหมาย (Semantic Integrity)"], ["Enforcing business logic rules and data type constraints on table fields (e.g. age > 0)", "การบังคับใช้กฎตรรกะทางธุรกิจและชนิดข้อมูลในตาราง (เช่น อายุต้องเป็นตัวเลขมากกว่า 0)"]], [["Referential integrity", "ความถูกต้องเชิงการอ้างอิง (Referential Integrity)"], ["Guarantees all Foreign Key values precisely reference existing Primary Keys in related tables", "การรับประกันว่าค่า Foreign Key ทุกตัวต้องอ้างอิงถึง Primary Key ที่มีอยู่จริงในตารางที่เกี่ยวข้อง"]], [["Candidate Key", "คีย์คู่แข่ง (Candidate Key)"], ["Set of unique identifying attributes; one is selected as Primary Key, others serve as Alternate Keys", "กลุ่มของแอตทริบิวต์ที่ระบุข้อมูลเฉพาะตัวได้ โดยตัวหนึ่งจะถูกเลือกเป็น Primary Key ส่วนที่เหลือเป็น Alternate Key"]], [["Primary Key", "คีย์หลัก (Primary Key)"], ["Unique non-null identifier chosen to distinguish every individual tuple in a table", "คอลัมน์ที่ระบุความเฉพาะตัวของแถวข้อมูลในตารางอย่างเป็นเอกลักษณ์และห้ามมีค่าว่าง (Not Null)"]], [["Foreign Key", "คีย์นอก (Foreign Key)"], ["Attribute in one table referencing the Primary Key of another table, establishing table relationships", "คอลัมน์ในตารางหนึ่งที่ชี้ไปยัง Primary Key ของอีกตารางหนึ่ง เพื่อสร้างความสัมพันธ์ระหว่างตาราง"]]]}, {"title": "DBMS Terms", "thTitle": "คำศัพท์และปัญหาเฉพาะในระบบ DBMS", "type": "list", "rows": [["Concurrency Issues: Dirty Reads (reading uncommitted data), Lost Updates (concurrent overwrites), Non-repeatable Reads", "ปัญหาการทำงานพร้อมกัน: Dirty Read (อ่านข้อมูลที่ยังไม่ได้ Commit), Lost Update (เขียนทับข้อมูลกัน), Non-repeatable Read"], ["Dynamic Lifetime Objects: Objects instantiated and destroyed dynamically during OOP execution", "Dynamic Lifetime Objects: ออบเจกต์ที่ถูกสร้างขึ้นและทำลายทิ้งแบบไดนามิกระหว่างโปรแกรมทำงาน"], ["ODBC: Standard middleware allowing apps to communicate with diverse database backends without custom driver code", "ODBC: มิดเดิลแวร์มาตรฐานที่ช่วยให้โปรแกรมติดต่อกับฐานข้อมูลหลากหลายค่ายได้โดยไม่ต้องแก้โค้ด"], ["Database contamination: Inadvertently mixing data of differing security classifications within the same table/schema", "Database Contamination: การปะปนข้อมูลที่มีระดับชั้นความลับต่างกันในตารางหรือสคีมาเดียวกันโดยไม่ได้ตั้งใจ"], ["Database partitioning: Splitting a large single database into separate physical parts for performance and security", "Database Partitioning: การแบ่งฐานข้อมูลขนาดใหญ่ออกเป็นส่วนย่อยๆ เพื่อเพิ่มประสิทธิภาพและความปลอดภัย"], ["Polyinstantiation: Multiple rows having identical primary keys but different contents to prevent data inference attacks", "Polyinstantiation: การมีข้อมูลหลายแถวที่ใช้คีย์หลักเดียวกันแต่เนื้อหาต่างกัน เพื่อป้องกันการอนุมานข้อมูลลับ"]]}, {"title": "Knowledge Management", "thTitle": "การจัดการความรู้และระบบผู้เชี่ยวชาญ (AI / Expert Systems)", "type": "kv", "rows": [[["Expert Systems", "ระบบผู้เชี่ยวชาญ (Expert Systems)"], ["Knowledge base (facts/rules) + Inference engine (reasoning); emulates human decision-making using IF-THEN rules", "ระบบจำลองการตัดสินใจของผู้เชี่ยวชาญ ประกอบด้วย: ฐานความรู้ (Knowledge Base) + กลไกการอนุมาน (Inference Engine)"]], [["Forward chaining", "การอนุมานแบบไปข้างหน้า (Forward Chaining)"], ["Begins with known initial facts, iterates through inference rules to deduce new data to reach a goal (bottom-up / data-driven)", "เริ่มจากข้อเท็จจริงที่มี แล้วนำกฎมาประมวลผลเพื่อหาข้อสรุปหรือเป้าหมาย (จากล่างขึ้นบน / Data-Driven)"]], [["Backward chaining", "การอนุมานแบบย้อนกลับ (Backward Chaining)"], ["Begins with a hypothesized goal, works backward to deduce and verify supporting facts required (top-down / goal-driven)", "เริ่มจากตั้งสมมติฐานเป้าหมาย แล้วสืบค้นย้อนกลับว่าต้องมีข้อเท็จจริงใดสนับสนุนบ้าง (จากบนลงล่าง / Goal-Driven)"]], [["Neural Networks", "โครงข่ายประสาทเทียม (Neural Networks)"], ["Machine learning model simulating biological neurons; accumulates knowledge by processing inputs/outcomes across weighted layers", "โมเดลจำลองการทำงานของสมองมนุษย์ เรียนรู้จากข้อมูลตัวอย่างผ่านการปรับค่าน้ำหนัก (Weights) ในแต่ละชั้น"]]]}, {"title": "Object-Oriented Technology (OOT) — Terminology", "thTitle": "คำศัพท์เทคโนโลยีเชิงวัตถุ (Object-Oriented Technology)", "type": "kv", "rows": [[["Encapsulation", "การห่อหุ้ม (Encapsulation)"], ["Bundling data attributes and methods operating on that data inside an object; restricts direct outside access", "การรวมข้อมูลและฟังก์ชันการทำงานไว้ด้วยกันภายในออบเจกต์ และซ่อนรายละเอียดภายในไว้"]], [["Message", "สาร / เมสเสจ (Message)"], ["Communication request sent to an object instructing it to execute a specific method", "คำร้องขอที่ส่งไปยังออบเจกต์เพื่อสั่งให้เรียกใช้งาน Method นั้นๆ"]], [["Method", "เมธอด (Method)"], ["Programmatic function/code inside an object executed in response to a message", "ชุดคำสั่งหรือฟังก์ชันภายในออบเจกต์ที่ทำงานเมื่อได้รับ Message"]], [["Behavior", "พฤติกรรม (Behavior)"], ["Visible actions and output state changes exhibited by an object in response to messages", "ผลลัพธ์หรือการกระทำที่ออบเจกต์แสดงออกมาเมื่อได้รับการสั่งการ"]], [["Class", "คลาส (Class)"], ["Blueprint / template defining common attributes and methods for a category of objects", "พิมพ์เขียวหรือต้นแบบที่ใช้กำหนดคุณลักษณะและฟังก์ชันของออบเจกต์ประเภทนั้นๆ"]], [["Object", "ออบเจกต์ (Object)"], ["A concrete instance of a class containing allocated memory, state, and callable methods", "อินสแตนซ์ที่ถูกสร้างขึ้นจริงจากพิมพ์เขียวของคลาส มีพื้นที่หน่วยความจำและข้อมูลจริง"]], [["Inheritance", "การสืบทอดคุณสมบัติ (Inheritance)"], ["Subclass automatically inherits data attributes and methods defined in its parent superclass", "คลาสลูก (Subclass) จะได้รับคุณลักษณะและเมธอดทั้งหมดที่กำหนดไว้ในคลาสแม่ (Superclass) มาใช้งาน"]], [["Multiple Inheritance", "การสืบทอดหลายทาง (Multiple Inheritance)"], ["Subclass inherits characteristics and methods from more than one parent superclass", "คลาสลูกที่สืบทอดคุณสมบัติมาจากคลาสแม่มากกว่าหนึ่งคลาสพร้อมกัน"]], [["Polyinstantiation", "การสร้างหลายอินสแตนซ์ (Polyinstantiation)"], ["2+ database rows appear identical by primary key but differ in data content and classification level", "การมีแถวข้อมูลหลายแถวที่ใช้คีย์หลักเดียวกัน แต่มีเนื้อหาและระดับชั้นความลับต่างกัน"]], [["Abstraction", "การซ่อนความซับซ้อน (Abstraction)"], ["Users/clients interact with simplified interfaces without needing to know internal complex implementation details", "การแสดงเฉพาะส่วนสำคัญให้ผู้ใช้เรียกใช้งาน โดยซ่อนความซับซ้อนภายในทั้งหมดไว้"]], [["Process Isolation", "การแยกโปรเซส (Process Isolation)"], ["Operating system allocating distinct, non-overlapping virtual memory address spaces for each process", "การที่ระบบปฏิบัติการจัดสรรพื้นที่หน่วยความจำของแต่ละโปรเซสแยกจากกัน ป้องกันการแทรกแซงข้ามโปรเซส"]]]}, {"title": "Phases of Object-Oriented Design", "thTitle": "ขั้นตอนการออกแบบเชิงวัตถุและการเชื่อมต่อ", "type": "kv", "rows": [[["OORA (Requirements Analysis)", "OORA (การวิเคราะห์ความต้องการ)"], ["Object-Oriented Requirements Analysis — define problem domain, class boundaries, and use case interactions", "การวิเคราะห์ความต้องการเชิงวัตถุเพื่อกำหนดขอบเขตคลาสและกรณีการใช้งาน"]], [["OOA (Analysis)", "OOA (การวิเคราะห์เชิงวัตถุ)"], ["Object-Oriented Analysis — identify classes, objects, relationships, and attributes common across the application domain", "การสร้างโมเดลความสัมพันธ์ของคลาสและออบเจกต์ทั้งหมดในระบบ"]], [["OOD (Design)", "OOD (การออกแบบเชิงวัตถุ)"], ["Object-Oriented Design — refine class hierarchies, design interfaces, method signatures, and message flows", "การออกแบบโครงสร้างคลาส รายละเอียดเมธอด และการไหลของข้อมูลอย่างละเอียด"]], [["OOP (Programming)", "OOP (การเขียนโปรแกรมเชิงวัตถุ)"], ["Object-Oriented Programming — translating design models into actual source code using OOP languages (Java, C++, Python)", "การลงมือเขียนโค้ดตามแบบที่วางไว้ด้วยภาษาเชิงวัตถุ"]], [["ORBs", "ORB (Object Request Broker)"], ["Middleware enabling objects on different machines/platforms to locate and invoke each other across a network", "มิดเดิลแวร์ที่ทำหน้าที่เป็นตัวกลางให้ออบเจกต์ต่างเครื่องสามารถสื่อสารและเรียกใช้งานข้ามเครือข่ายได้"]], [["CORBA", "มาตรฐาน CORBA"], ["Common Object Request Broker Architecture — open vendor-neutral OMG standard using ORBs for cross-platform object interoperability", "สถาปัตยกรรมมาตรฐานเปิดที่ช่วยให้ออบเจกต์ที่เขียนด้วยคนละภาษาและอยู่คนละระบบทำงานร่วมกันได้"]], [["Cohesion", "ความยึดเหนี่ยวภายใน (Cohesion)"], ["High Cohesion (Best practice: module methods perform a single focused task) / Low Cohesion (unfocused, poor design)", "ความสัมพันธ์ของฟังก์ชันภายในโมดูลเดียวกัน (High Cohesion = ดีเยี่ยม ฟังก์ชันทำงานเรื่องเดียวอย่างชัดเจน)"]], [["Coupling", "ความผูกพันระหว่างโมดูล (Coupling)"], ["Loose Coupling (Best practice: minimal dependencies between modules) / Tight Coupling (interdependent, hard to maintain)", "ระดับการพึ่งพาอาศัยกันระหว่างโมดูล (Loose Coupling = ดีเยี่ยม โมดูลเป็นอิสระต่อกัน แก้ไขง่าย)"]]]}, {"title": "Covert Channels (Storage & Timing)", "thTitle": "ช่องทางการสื่อสารลับ (Covert Channels) และมัลแวร์", "type": "kv", "rows": [[["Executable content/Mobile code", "โค้ดเคลื่อนที่ (Mobile Code)"], ["ActiveX controls, Java applets, browser JavaScript — code downloaded from remote server and executed locally", "โค้ดที่ดาวน์โหลดจากเซิร์ฟเวอร์มารันบนเครื่องไคลเอ็นต์ เช่น JavaScript, Java Applet, ActiveX"]], [["Virus / Worm", "ไวรัส vs เวิร์ม"], ["Virus = requires human host file execution to spread / Worm = self-propagating across networks without user interaction", "Virus (ต้องอาศัยผู้ใช้เปิดไฟล์พาหะ) vs Worm (แพร่กระจายตัวเองผ่านเครือข่ายได้โดยอัตโนมัติ)"]], [["Logic Bomb/Code Bomb", "ระเบิดตรรกะ (Logic Bomb)"], ["Malicious code embedded in software that lies dormant until triggered by a specific event or date/time condition", "โค้ดอันตรายที่แฝงตัวอยู่และจะทำงานเมื่อเกิดเหตุการณ์หรือถึงเวลาที่กำหนดไว้"]], [["Buffer Overflow", "ช่องโหว่ Buffer Overflow"], ["Injecting more data into a fixed-size memory buffer than it can hold, overwriting adjacent stack memory and return pointers", "การป้อนข้อมูลเกินขนาดความจุของบัฟเฟอร์หน่วยความจำ ทำให้ล้นไปทับตำแหน่งคำสั่งข้างเคียงและยึดการควบคุมระบบ"]], [["Backdoor", "ประตูหลัง (Backdoor)"], ["Hidden bypass mechanism planted in software allowing unauthorized remote administrative access", "ช่องทางลับที่ฝังไว้ในโปรแกรมเพื่อแอบเข้าสู่ระบบโดยไม่ต้องผ่านการยืนยันตัวตนปกติ"]], [["Covert Channel", "ช่องทางการสื่อสารลับ (Covert Channel)"], ["Unauthorized communication pathway violating security policy: Covert Storage (modifying shared storage attributes) vs Covert Timing (modifying system response timing)", "ช่องทางสื่อสารลับที่ขัดต่อนโยบายความปลอดภัย: Covert Storage (ซ่อนข้อมูลในแอตทริบิวต์แชร์) vs Covert Timing (ส่งสัญญาณผ่านจังหวะเวลาประมวลผล)"]], [["Botnet", "เครือข่ายบอตเน็ต (Botnet)"], ["Network of thousands of compromised zombie computers controlled remotely by a Botmaster (Command & Control / C2)", "กองทัพคอมพิวเตอร์ที่ติดมัลแวร์และถูกควบคุมระยะไกลโดยแฮกเกอร์เพื่อใช้ยิง DDoS"]], [["Trojan", "มัลแวร์โทรจัน (Trojan Horse)"], ["Malicious program disguised as legitimate, harmless software to deceive users into installing it", "โปรแกรมอันตรายที่แฝงตัวมาในรูปแบบของโปรแกรมที่มีประโยชน์เพื่อหลอกให้ผู้ใช้ติดตั้ง"]]]}, {"title": "Virus Types", "thTitle": "ประเภทเฉพาะของไวรัสคอมพิวเตอร์", "type": "kv", "rows": [[["Boot sector", "ไวรัสบูตเซกเตอร์ (Boot Sector)"], ["Infects Master Boot Record (MBR) or bootable sector of storage drives; executes before operating system loads", "ฝังตัวอยู่ในส่วนบูตของฮาร์ดดิสก์ ทำงานตั้งแต่ก่อนที่ระบบปฏิบัติการจะโหลด (อันตรายและมีสิทธิ์สูงสุด)"]], [["System infector", "ไวรัสระบบ (System Infector)"], ["Infects essential executable system files (.EXE, .DLL, system commands) and OS kernels", "ฝังตัวในไฟล์ระบบปฏิบัติการที่สำคัญ เช่น ไฟล์คำสั่งระบบและไลบรารี DLL"]], [["UEFI", "ไวรัสเฟิร์มแวร์ UEFI"], ["Infects motherboard factory-installed UEFI firmware; persists across complete hard drive replacements and OS reinstalls", "ฝังตัวในชิปเฟิร์มแวร์ UEFI บนเมนบอร์ด แม้จะฟอร์แมตหรือเปลี่ยนฮาร์ดดิสก์ใหม่ไวรัสก็ยังคงอยู่"]], [["Companion", "ไวรัสคอมพาเนียน (Companion Virus)"], ["Creates a file with the same name but different extension (e.g. NOTEPAD.COM executing before NOTEPAD.EXE)", "สร้างไฟล์ชื่อเหมือนโปรแกรมจริงแต่ใช้นามสกุลที่มีลำดับการรันก่อน (เช่น NOTEPAD.COM)"]], [["Stealth", "ไวรัสสเตลธ์ (Stealth Virus)"], ["Actively hides its modifications to files and boot sectors by intercepting OS read requests and returning original clean data", "หลบซ่อนตัวโดยการดักจับคำสั่งอ่านไฟล์ของ OS และส่งข้อมูลเดิมที่สะอาดกลับไปเพื่อหลอกโปรแกรมสแกนไวรัส"]], [["Multipart", "ไวรัสมัลติพาร์ไทต์ (Multipartite)"], ["Dual-threat infector attacking both boot sectors and executable application files simultaneously", "ไวรัสที่มีความสามารถโจมตีได้หลายช่องทางพร้อมกัน ทั้งส่วนบูตเซกเตอร์และไฟล์โปรแกรม"]], [["Self-garbling", "ไวรัสแบบเข้ารหัสตัวเอง (Encrypted Virus)"], ["Hides from antivirus scanners by encrypting its payload code with a simple key and decryptor stub", "เข้ารหัสส่วนโค้ดอันตรายของตัวเองไว้และมีตัวถอดรหัสขนาดเล็กเพื่อหลบการตรวจจับของแอนติไวรัส"]], [["Polymorphic", "ไวรัสโพลีมอร์ฟิก (Polymorphic Virus)"], ["Mutates its decryption engine and signature pattern completely every time it infects a new system while preserving function", "เปลี่ยนรูปแบบโค้ดและลายเซ็นดิจิทัลของตัวเองใหม่ทุกครั้งที่แพร่กระจาย ทำให้ Signature ดั้งเดิมตรวจจับไม่ได้"]], [["Resident", "ไวรัสประจำหน่วยความจำ (Resident Virus)"], ["Loads itself into volatile RAM memory and remains active to infect any subsequent files accessed by OS", "ฝังตัวอยู่ในหน่วยความจำแรมตลอดเวลา และจะติดเชื้อไปยังทุกไฟล์ที่ถูกเรียกเปิดใช้งาน"]], [["MBR (Master Boot Record)", "ไวรัส MBR"], ["Overwrites or relocates the physical MBR partition code on storage drive to seize control during hardware POST boot", "เขียนทับโค้ดในพาร์ติชัน MBR เพื่อยึดการควบคุมระบบตั้งแต่ช่วงเปิดเครื่อง"]]]}, {"title": "Trusted Computer Base (TCB)", "thTitle": "ฐานคอมพิวเตอร์ที่เชื่อถือได้ (Trusted Computer Base - TCB)", "type": "kv", "rows": [[["Definition", "นิยามของ TCB"], ["Total combination of all hardware, firmware, and software protection mechanisms critical to enforcing security policy", "ผลรวมของฮาร์ดแวร์ เฟิร์มแวร์ และซอฟต์แวร์ทั้งหมดที่มีหน้าที่รับผิดชอบในการบังคับใช้นโยบายความปลอดภัยของระบบ"]], [["Input/output operations", "การควบคุม I/O"], ["Must execute through higher protection rings and security kernel; communications strictly mediated", "การรับส่งข้อมูล I/O ต้องผ่านการตรวจสอบโดย Security Kernel ในเลเยอร์ที่มีการป้องกันสูงเสมอ"]], [["Execution domain switching", "การสลับโดเมนการประมวลผล"], ["Controls processes invoking services in other security domains (User Mode to Kernel Mode context switches)", "การควบคุมการสลับบริบทเมื่อโปรแกรมร้องขอใช้บริการของระบบ (จาก User Mode สู่ Kernel Mode)"]], [["Memory protection", "การป้องกันหน่วยความจำ"], ["Continuous hardware memory segmentation enforcing confidentiality and integrity between process spaces", "การแบ่งแยกพื้นที่หน่วยความจำในระดับฮาร์ดแวร์เพื่อป้องกันไม่ให้โปรเซสเข้าถึงข้อมูลของกันและกัน"]], [["Process activation", "การตรวจสอบสถานะโปรเซส"], ["Strict monitoring of CPU registers, process control blocks, execution states, and access control lists", "การตรวจสอบรีจิสเตอร์ของซีพียู สถานะโปรเซส และสิทธิ์การเข้าถึงอย่างเคร่งครัด"]]]}, {"title": "Protection Rings", "thTitle": "วงแหวนการป้องกันของซีพียู (Hierarchical Protection Rings)", "type": "kv", "rows": [[["Layer 0", "Ring 0 (ระดับเคอร์เนล)"], ["Operating system kernel — highest privilege, direct hardware access, memory management", "เคอร์เนลของระบบปฏิบัติการ — มีสิทธิ์สูงสุด เข้าถึงฮาร์ดแวร์และหน่วยความจำได้โดยตรง"]], [["Layer 1", "Ring 1 (ส่วนประกอบ OS)"], ["Non-kernel operating system components and privileged OS services", "ส่วนประกอบและเซอร์วิสของระบบปฏิบัติการที่ไม่ใช่เคอร์เนลหลัก"]], [["Layer 2", "Ring 2 (ไดรเวอร์และยูทิลิตี้)"], ["I/O device drivers, system utilities, and hardware abstraction modules", "ไดรเวอร์ควบคุมอุปกรณ์และโปรแกรมยูทิลิตี้ของระบบ"]], [["Layer 3", "Ring 3 (แอปพลิเคชันผู้ใช้)"], ["User applications, programs, and untrusted software — least privilege, strictly mediated access to hardware via System Calls", "แอปพลิเคชันและโปรแกรมทั่วไปของผู้ใช้ — มีสิทธิ์ต่ำสุด ต้องร้องขอผ่าน System Call เพื่อเข้าถึงฮาร์ดแวร์"]]]}, {"title": "Security Assessment & Testing Terms", "thTitle": "คำศัพท์การประเมินและการทดสอบความปลอดภัยซอฟต์แวร์", "type": "kv", "rows": [[["CSRF/XSRF", "Cross-Site Request Forgery"], ["Exploits trusted authenticated browser session to submit unauthorized state-changing requests to third-party web apps", "การหลอกให้เบราว์เซอร์ของเหยื่อที่ล็อกอินค้างไว้ส่งคำสั่งอันตรายไปยังเว็บปลายทางโดยที่เหยื่อไม่รู้ตัว"]], [["XSS", "Cross-Site Scripting"], ["Injects malicious executable scripts into trusted web pages executed within victim's browser (Stored, Reflected, DOM-based)", "การฝังสคริปต์อันตรายลงในเว็บเพจเพื่อให้ทำงานบนเบราว์เซอร์ของผู้ใช้รายอื่น (Stored, Reflected, DOM-based)"]], [["Session Hijacking", "การขโมยเซสชัน (Session Hijacking)"], ["Stealing or predicting active authenticated session tokens/cookies to impersonate a legitimate user without credentials", "การดักจับหรือคาดเดา Session Token เพื่อสวมสิทธิ์เป็นผู้ใช้ที่ล็อกอินแล้วโดยไม่ต้องป้อนรหัสผ่าน"]], [["SQL Injection", "การแทรกคำสั่ง SQL (SQL Injection)"], ["Injecting malicious SQL syntax into untrusted web input fields to manipulate backend database queries directly", "การป้อนคำสั่ง SQL ผ่านช่องรับข้อมูลเพื่อเจาะและขโมยข้อมูลจากฐานข้อมูลโดยตรง"]], [["Hotfix/Update/Security fix", "Hotfix / Security Update"], ["Targeted software patch deployed rapidly to resolve specific critical security vulnerabilities or bugs", "แพตช์แก้ไขด่วนสำหรับอุดช่องโหว่ความปลอดภัยวิกฤตเฉพาะจุด"]], [["Service Pack", "เซอร์วิสแพ็ก (Service Pack)"], ["Cumulative bundle of all previous hotfixes, security patches, updates, and feature enhancements for an OS", "ชุดรวมแพตช์และการอัปเดตความปลอดภัยทั้งหมดของระบบปฏิบัติการ"]], [["Penetration Testing", "การทดสอบเจาะระบบ (Pen-Test)"], ["Authorized simulated attack evaluating technical security defense posture and discoverable vulnerability chains", "การจำลองการโจมตีจริงโดยผู้เชี่ยวชาญเพื่อประเมินความแข็งแกร่งของระบบ"]], [["Patch management system", "ระบบจัดการแพตช์ (Patch Management)"], ["Centralized software workflow to acquire, test, approve, and deploy security updates to mitigate known CVEs", "กระบวนการรวมศูนย์ในการทดสอบและติดตั้งแพตช์อัปเดตความปลอดภัยเพื่อป้องกันช่องโหว่ที่ทราบ"]], [["Open system", "ระบบเปิด (Open System)"], ["Vendor-neutral architecture built on published industry standards and open public APIs (high interoperability)", "ระบบที่สร้างบนมาตรฐานเปิดและมี API สาธารณะ ทำให้เชื่อมต่อกับระบบอื่นได้ง่าย"]], [["Closed system", "ระบบปิด (Closed System)"], ["Proprietary hardware/software architecture with private interfaces and zero third-party integration", "ระบบที่เป็นกรรมสิทธิ์เฉพาะของผู้ผลิต ไม่มี API ให้ภายนอกเชื่อมต่อ"]], [["Open-source", "โอเพนซอร์ส (Open-Source)"], ["Software whose source code is publicly accessible, inspectable, and modifiable under open licenses (GPL, Apache, MIT)", "ซอฟต์แวร์ที่เปิดเผยซอร์สโค้ดสู่สาธารณะให้สามารถตรวจสอบและนำไปพัฒนาต่อได้"]], [["API Keys", "คีย์ API (API Keys)"], ["Cryptographic secret strings used to authenticate application requests to APIs — highly sensitive, must never be hardcoded", "กุญแจลับสำหรับยืนยันสิทธิ์การเรียกใช้งาน API มีความสำคัญเทียบเท่ารหัสผ่าน ห้ามฝังในโค้ด"]]]}, {"title": "Anti-Virus Types", "thTitle": "ประเภทของเทคโนโลยีตรวจจับแอนติไวรัส", "type": "kv", "rows": [[["Signature based", "การตรวจจับตามลายเซ็น (Signature-Based)"], ["Matches file hashes and byte sequences against known malware database — ineffective against new zero-day attacks and polymorphic malware", "เปรียบเทียบลายเซ็นดิจิทัลกับฐานข้อมูลไวรัสเดิม ไม่สามารถตรวจจับมัลแวร์ตัวใหม่ (Zero-Day) หรือไวรัสที่แปลงโค้ดได้"]], [["Heuristic based", "การตรวจจับเชิงพฤติกรรม (Heuristic / Behavior-Based)"], ["Analyzes code structure, instructions, and runtime execution behavior to detect previously unseen threats without exact signature match", "วิเคราะห์โครงสร้างคำสั่งและพฤติกรรมการทำงานของไฟล์ เพื่อตรวจจับมัลแวร์ชนิดใหม่ที่ยังไม่มีในฐานข้อมูล"]]]}]}];

/* ============ RENDER LOGIC ============ */
const main = document.getElementById('main');
const tabsEl = document.getElementById('tabs');
let activeDomain = 1;
let searchMode = false;
let currentMode = 'bi';

function escapeHtml(str){
  if(typeof str !== 'string') return str;
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function formatCell(item, re){
  if(Array.isArray(item)){
    let en = escapeHtml(item[0] || '');
    let th = escapeHtml(item[1] || '');
    if(re){
      en = en.replace(re, m => `<mark>${m}</mark>`);
      th = th.replace(re, m => `<mark>${m}</mark>`);
    }
    return `<div class="bi-row"><div class="en-t">${en}</div><div class="th-t">${th}</div></div>`;
  }
  let txt = escapeHtml(item || '');
  if(re) txt = txt.replace(re, m => `<mark>${m}</mark>`);
  return txt;
}

function cardHTML(sec, secIdx, re = null){
  let body = '';
  if(sec.type === 'kv'){
    body = '<table>' + sec.rows.map(r => `<tr><td class="k">${formatCell(r[0], re)}</td><td class="v">${formatCell(r[1], re)}</td></tr>`).join('') + '</table>';
  } else if(sec.type === 'table'){
    body = '<table class="wide"><tr>' + sec.headers.map(h => `<td class="k">${formatCell(h, re)}</td>`).join('') + '</tr>' +
      sec.rows.map(r => '<tr>' + r.map(c => `<td class="v">${formatCell(c, re)}</td>`).join('') + '</tr>').join('') + '</table>';
  } else if(sec.type === 'list'){
    body = '<ul class="plain">' + sec.rows.map(r => `<li>${formatCell(r, re)}</li>`).join('') + '</ul>';
  }
  
  let titleEn = escapeHtml(sec.title);
  let titleTh = escapeHtml(sec.thTitle || '');
  if(re){
    titleEn = titleEn.replace(re, m => `<mark>${m}</mark>`);
    titleTh = titleTh.replace(re, m => `<mark>${m}</mark>`);
  }
  
  return `<div class="card" data-sec="${secIdx}">
    <h3>
      <div class="title-txt">
        <span>${titleEn}</span>
        ${titleTh ? `<span class="th-sub">${titleTh}</span>` : ''}
      </div>
      <span class="chev">▾</span>
    </h3>
    <div class="body">${body}</div>
  </div>`;
}

function renderDomain(d){
  document.documentElement.style.setProperty('--dcolor', d.color);
  main.innerHTML = `
    <div class="domain-title">
      <div class="badge" style="background:${d.color}">D${d.id}</div>
      <div>
        <span class="tag">Domain ${d.id}</span>
        <h1>${escapeHtml(d.title)}</h1>
        <div class="th-title">${escapeHtml(d.thTitle)}</div>
      </div>
    </div>
    <div class="grid">${d.sections.map((s,i) => cardHTML(s,i)).join('')}</div>
  `;
  attachCardEvents();
}

function attachCardEvents(){
  document.querySelectorAll('.card h3').forEach(h => {
    h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
  });
}

function renderTabs(){
  tabsEl.innerHTML = DOMAINS.map(d => `
    <button class="tab-btn" data-id="${d.id}" style="--dcolor:${d.color}">
      <span class="num">D${d.id}</span> ${escapeHtml(d.title)}
    </button>`).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      searchMode = false;
      document.getElementById('search').value = '';
      activeDomain = parseInt(btn.dataset.id);
      updateActiveTab();
      renderDomain(DOMAINS.find(d => d.id === activeDomain));
    });
  });
  updateActiveTab();
}

function updateActiveTab(){
  tabsEl.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', !searchMode && parseInt(b.dataset.id) === activeDomain);
  });
}

/* ---- Search Engine supporting English and Thai ---- */
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function runSearch(q){
  q = q.trim();
  if(!q){
    searchMode = false;
    updateActiveTab();
    renderDomain(DOMAINS.find(d => d.id === activeDomain));
    return;
  }
  searchMode = true;
  updateActiveTab();
  const re = new RegExp(escapeRe(q), 'ig');
  let html = '';
  let matchCount = 0;

  DOMAINS.forEach(d => {
    let domainCards = '';
    d.sections.forEach((sec, i) => {
      const hay = JSON.stringify(sec).toLowerCase();
      if(!hay.includes(q.toLowerCase())) return;
      matchCount++;
      domainCards += cardHTML(sec, i, re);
    });
    if(domainCards){
      html += `
        <div class="domain-title" style="margin-top:32px;">
          <div class="badge" style="background:${d.color}">D${d.id}</div>
          <div>
            <span class="tag">Domain ${d.id}</span>
            <h1>${escapeHtml(d.title)}</h1>
            <div class="th-title">${escapeHtml(d.thTitle)}</div>
          </div>
        </div>
        <div class="grid">${domainCards}</div>`;
    }
  });

  if(!matchCount){
    main.innerHTML = `<div class="empty-state"><div class="big">🔍</div>ไม่พบข้อมูลที่ตรงกับ "<strong>${escapeHtml(q)}</strong>"<br><span style="font-size:13px;opacity:0.75;">ลองค้นหาด้วยคำค้นอื่นทั้งภาษาไทยหรือภาษาอังกฤษ</span></div>`;
  } else {
    main.innerHTML = html;
    attachCardEvents();
  }
}

// View toggle (Bilingual, English Only, Thai Only)
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    document.body.className = currentMode === 'en' ? 'mode-en' : (currentMode === 'th' ? 'mode-th' : '');
  });
});

document.getElementById('search').addEventListener('input', e => runSearch(e.target.value));
document.getElementById('expandAll').addEventListener('click', () => document.querySelectorAll('.card').forEach(c => c.classList.remove('collapsed')));
document.getElementById('collapseAll').addEventListener('click', () => document.querySelectorAll('.card').forEach(c => c.classList.add('collapsed')));
document.getElementById('printBtn').addEventListener('click', () => window.print());

renderTabs();
renderDomain(DOMAINS.find(d => d.id === activeDomain));
</script>
</body>
</html>
