text หรือรูปแบบที่ถอดกลับได้"},{"en":"CHAP's use by point-to-point protocol servers to validate remote clients","th":"CHAP ใช้โดยเซิร์ฟเวอร์ Point-to-Point Protocol"}],"correct":[2],"explanation_en":"The correct answer:\nThe plaintext storage of client passwords on the CHAP server would be the primary concern in this context. If an attacker gains access to the CHAP server, they would have access to every single client password stored on that server. This represents a significant security vulnerability, as client credentials are a critical asset that, if compromised, could lead to unauthorized access and potentially extensive data breaches.\n\nThe incorrect answers:\nCHAP's inability to protect against replay attacks is incorrect because CHAP does offer protection against replay attacks by using an incrementally changing identifier and a variable challenge value.\nCHAP's use of a three-way handshake mechanism is not a concern as the three-way handshake is actually a security feature of CHAP, used to periodically verify the identity of the client and ensure that no one has hijacked the current session.\nCHAP's use by point-to-point protocol servers to validate remote clients is also not a concern as it's an inherent functionality of the CHAP protocol to validate the identity of remote clients. This functionality helps maintain secure connections between the network and remote clients.","explanation_th":"คำตอบที่ถูกคือ C เพราะ CHAP ต้องมี secret ที่เซิร์ฟเวอร์ใช้คำนวณ challenge response จึงมักต้องเก็บในรูปแบบที่กู้คืนได้ หากเซิร์ฟเวอร์ถูกเจาะ secret เหล่านี้มีความเสี่ยง A ไม่ถูกเพราะ challenge ที่เปลี่ยนช่วยต้าน replay B เป็นกลไกปกติของ CHAP และ D เป็นกรณีใช้งาน ไม่ใช่ช่องโหว่"},{"number":63,"id":102018251,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the Chief Information Security Officer (CISO) of a growing tech company that leverages multiple third-party applications, you're planning to implement a risk-based access control system that leverages machine learning to analyze user behavior and contexts. The goal is to enhance security by identifying any abnormal behavior that could indicate a security risk, such as unusual login times or unfamiliar IP addresses. Which of the following should be the primary consideration when implementing a risk-based access control system in this context?","question_th":"ปัจจัยหลักในการใช้ risk-based access control ที่อาศัย machine learning วิเคราะห์พฤติกรรมผู้ใช้แบบเรียลไทม์คือข้อใด","options":[{"en":"Implementing a strong password policy to ensure all users have secure credentials.","th":"ใช้นโยบายรหัสผ่านที่เข้มแข็ง"},{"en":"Ensuring the system can integrate with the existing Single Sign-On (SSO) system.","th":"ให้ระบบเชื่อมต่อกับ SSO เดิมได้"},{"en":"Setting up a robust data analytics infrastructure to analyze user behavior in real-time.","th":"สร้างโครงสร้างพื้นฐานวิเคราะห์ข้อมูลที่แข็งแรงเพื่อวิเคราะห์พฤติกรรมแบบเรียลไทม์"},{"en":"Confirming that the system is compatible with all third-party applications used by the company.","th":"ตรวจสอบความเข้ากันได้กับแอป third-party ทุกตัว"}],"correct":[2],"explanation_en":"The correct answer:\nA risk-based access control system's primary requirement is the ability to monitor, analyze, and make decisions based on user behavior. It's essential to have a robust analytics infrastructure capable of processing vast amounts of data in real-time to effectively assess risks. This will enable the system to detect abnormal patterns quickly and take necessary actions, thereby mitigating potential security risks.\n\nThe incorrect answers:\nAlthough a strong password policy is important in any cybersecurity strategy, it's not directly related to the implementation of a risk-based access control system that relies on machine learning and data analysis to detect unusual behaviors.\nSSO integration could streamline user access across multiple applications, but it's not the primary factor when it comes to implementing a risk-based access control system. The main focus should be the ability to analyze user behavior in real-time.\nCompatibility with third-party applications is important, but it's not the primary consideration when implementing a risk-based access control system. The main priority should be establishing an infrastructure capable of real-time behavior analysis.","explanation_th":"คำตอบที่ถูกคือ C เพราะระบบต้องรวบรวม ประมวลผล และประเมินสัญญาณจำนวนมาก เช่น เวลา login IP อุปกรณ์ และพฤติกรรม เพื่อคำนวณความเสี่ยงทันที A เป็น control พื้นฐาน B และ D สำคัญต่อการใช้งานจริง แต่หากไม่มี analytics ที่มีคุณภาพ ระบบจะไม่สามารถทำหน้าที่ risk-based ได้"},{"number":64,"id":102018253,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) at a multinational corporation. The company collaborates with several contractors and business partners, giving rise to the need for a system that can manage user identities across various distinct identity management systems. As a CISO, what would you primarily recommend establishing a federated identity management system?","question_th":"องค์กรต้องการ federated identity management ระหว่างระบบตัวตนหลายระบบ ควรใช้มาตรฐานใดเป็นหลัก","options":[{"en":"Security Assertion Markup Language (SAML)","th":"Security Assertion Markup Language (SAML)"},{"en":"OAuth","th":"OAuth"},{"en":"OpenID","th":"OpenID"},{"en":"Single sign-on (SSO)","th":"Single Sign-On (SSO)"}],"correct":[0],"explanation_en":"The correct answer:\nSecurity Assertion Markup Language (SAML) is an XML-based standard for exchanging authentication and authorization data between parties. It helps in establishing trust among different domains by allowing them to share authentication tokens. SAML is crucial in federated identity management as it enables businesses to securely pass user authorization and authentication data between identity providers and service providers, reducing the need for passwords and simplifying the user experience. Its capability for asserting and managing identities across various systems makes it the primary recommendation in this context.\n\nThe incorrect answers:\nOAuth is a widely used protocol for delegated authorization (giving another entity permission to act on your behalf), but it does not provide a comprehensive solution for managing identities across distinct systems. It is more focused on allowing applications to use services with the permission of the user, and less on the assertion of identity and access control, which is the main concern in a federated identity management scenario.\nOpenID is another technology that can be used for single sign-on and allowing users to use an existing account to sign in to multiple websites, without needing to create new passwords. But, OpenID is more about enabling individuals to control how their online identity is shared amongst the websites they visit and less about asserting and managing identities across various systems in an enterprise context.\nSingle sign-on (SSO) can certainly streamline the authentication process by allowing a user to log in once and gain access to different systems without being prompted to log in again, but it's just a subset of federated identity, and its use is primarily focused on the authentication and technical interoperability, not the comprehensive identity and access control needed in a federated identity management system.","explanation_th":"คำตอบที่ถูกคือ A เพราะ SAML แลกเปลี่ยน assertion เกี่ยวกับการยืนยันตัวตนและสิทธิ์ระหว่าง Identity Provider กับ Service Provider ข้ามโดเมน B เน้นการมอบสิทธิ์ให้แอปเข้าถึง resource C เป็นโพรโทคอลยืนยันตัวตนที่ใช้ในบางกรณี และ D เป็นประสบการณ์ใช้งานที่อาจสร้างด้วย federation แต่ไม่ใช่มาตรฐานแลกเปลี่ยน assertion เอง"},{"number":65,"id":102018255,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As an IT consultant, you have been hired by a healthcare facility to recommend a protocol for verifying the identity of medical staff and their devices before granting access to patient records. What is a secure method used to verify the identity of an individual before granting access to a secure system or network?","question_th":"วิธีที่ปลอดภัยในการตรวจสอบตัวตนบุคคลก่อนอนุญาตให้เข้าระบบหรือเครือข่ายที่ปลอดภัยคือข้อใด","options":[{"en":"Encrypting the user's password","th":"เข้ารหัสรหัสผ่านของผู้ใช้"},{"en":"Using biometric data","th":"ใช้ข้อมูลชีวมิติ"},{"en":"Implementing a two-factor authentication process","th":"ใช้กระบวนการยืนยันตัวตนสองปัจจัย"},{"en":"Restricting access based on physical location","th":"จำกัดการเข้าถึงตามตำแหน่งทางกายภาพ"}],"correct":[2],"explanation_en":"The correct answer:\nImplementing a two-factor authentication process, which requires the user to provide two forms of identification, such as a password and a security token, is a common and effective method of authentication. By requiring two separate forms of identification, 2FA greatly reduces the chances of an unauthorized person gaining access to sensitive data. In the context of a healthcare facility, this could provide an extra layer of security for patient records and other sensitive information.\n\nThe incorrect answers:\nEncrypting the user's password is a method used to protect the password from being accessed by unauthorized individuals but it is not a method for verifying the identity of an individual before granting access to a secure system or network. Encryption protects the password data in transit or at rest, but it doesn't provide an authentication mechanism.\nUsing biometric data, such as fingerprints or facial recognition, can be used as part of an authentication process. However, on its own, biometrics should not be the only method of authentication due to potential vulnerabilities such as spoofing attacks. Biometrics are more commonly used in multi-factor authentication scenarios where they can add a layer of security.\nRestricting access based on physical location, such as only allowing access from certain IP addresses, is a method of access control, but it does not verify the user's identity. It is possible for an unauthorized person to be in the right location, just as it is possible for an authorized person to be in the wrong location.","explanation_th":"คำตอบที่ถูกคือ C เพราะ 2FA ตรวจสอบตัวตนด้วยหลักฐานสองประเภท ลดความเสี่ยงจากปัจจัยเดียว A เป็นวิธีปกป้อง credential แต่ไม่เพิ่มปัจจัย B แข็งแรงแต่ยังเป็นปัจจัยเดียว และ D เป็นเงื่อนไขการเข้าถึง ไม่ได้พิสูจน์ตัวบุคคลอย่างเพียงพอ"},{"number":66,"id":102018257,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As ThorTeaches.com continues to grow, it's becoming more important to have a system in place that manages access to resources on our network. What is a software system that manages access to resources on a network?","question_th":"ระบบซอฟต์แวร์ใดจัดการการเข้าถึงทรัพยากรบนเครือข่าย","options":[{"en":"Firewall","th":"Firewall"},{"en":"DNS","th":"DNS"},{"en":"Domain Controller","th":"Domain Controller"},{"en":"VPN","th":"VPN"}],"correct":[2],"explanation_en":"The correct answer:\nDomain Controller: A Domain Controller (DC) is a server that responds to security authentication requests within a Windows Server domain. It manages user access to a network, including logging in, permissions, and access to resources. As ThorTeaches.com grows, a Domain Controller will become increasingly vital to ensure users have the right permissions and can access the resources they need efficiently.\n\nThe incorrect answers:\nFirewall: While a firewall is essential for network security, its primary function is to monitor and control incoming and outgoing network traffic based on predetermined security policies.\nDNS: The Domain Name System (DNS) is a hierarchical and decentralized naming system for computers, services, or other resources connected to the Internet or a private network. It translates human-friendly domain names to IP addresses but does not manage access to resources.\nVPN: A Virtual Private Network (VPN) provides a private connection over a public network. It can help secure data transmission and allow remote access to a network but doesn't directly manage user access to resources.","explanation_th":"คำตอบที่ถูกคือ C เพราะ Domain Controller จัดการบัญชี การยืนยันตัวตน นโยบาย และสิทธิ์ในโดเมน A กรอง traffic B แปลงชื่อเป็นที่อยู่ และ D สร้างการเชื่อมต่อเข้ารหัส แต่ไม่ได้เป็นศูนย์กลางจัดการตัวตนและการเข้าถึงของโดเมน"},{"number":67,"id":102018259,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following authentication methods is the MOST secure?","question_th":"วิธีการยืนยันตัวตนข้อใดปลอดภัยที่สุดตามตัวเลือกที่ให้มา","options":[{"en":"Password-based authentication","th":"ใช้รหัสผ่าน"},{"en":"Biometric authentication","th":"ใช้ชีวมิติ"},{"en":"Token-based authentication","th":"ใช้โทเคน"},{"en":"Single-factor authentication","th":"ใช้ปัจจัยเดียว"}],"correct":[1],"explanation_en":"The correct answer:\nBiometric authentication is generally the most secure among the options provided because it involves the use of unique physical or behavioral characteristics for identification. This could be fingerprints, facial patterns, iris recognition, voice, or even behavior in typing. These characteristics are very hard to replicate and thus provide a higher level of security than the other methods listed. Biometric authentication mitigates the risk associated with easily guessed or stolen passwords and tokens. However, it's important to note that while biometrics offer high security, they are not foolproof. There are methods through which biometrics can be fooled, and there are also privacy considerations and potential issues with false negatives or positives.\n\nThe incorrect answers:\nWhile password-based authentication is one of the most common methods of authentication, it is not the most secure. The security of a password relies heavily on its complexity and the user's ability to keep it confidential. Passwords can be easily compromised through various means such as social engineering, brute force attacks, or simple guesswork if the password is weak. Additionally, users often reuse the same passwords across multiple sites, increasing the risk of compromise.\nToken-based authentication is more secure than password-based authentication because it provides a non-readable token that is exchanged between the user and the service. This token is often dynamically generated and changes each time the user logs in, providing a higher level of security. However, tokens can still be intercepted, stolen, or lost, which puts this method at a disadvantage compared to biometric authentication.\nSingle-factor authentication refers to a security system that requires only one form of identification for access. This could be something you know (like a password), something you have (like a token), or something you are (like a fingerprint). By itself, single-factor authentication is the least secure method among the options listed because it relies on just one form of identification. Multi-factor authentication, which requires two or more forms of identification, is much more secure because it adds additional layers of security. Even if one factor is compromised, an attacker would still need to overcome the other factors to gain access.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะชีวมิติผูกกับลักษณะเฉพาะบุคคลและไม่ต้องจำ secret A อาจถูกเดา ขโมย หรือ phishing C โทเคนอาจสูญหายหรือถูกขโมย และ D เป็นคำกว้างที่บอกว่ามีเพียงปัจจัยเดียว จึงไม่เพิ่มความปลอดภัย"},{"number":68,"id":102018261,"type":"multi","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"For our new startup, we are looking at different types of identity and access management. Which of these are COMMON types of that?","question_th":"ข้อใดเป็นรูปแบบการจัดการตัวตนและการควบคุมการเข้าถึงที่พบได้ทั่วไป เลือกทุกข้อที่ถูก","options":[{"en":"Discretionary Access Control (DAC).","th":"Discretionary Access Control (DAC)"},{"en":"Rule-Based Access Control (RUBAC).","th":"Rule-Based Access Control (RuBAC)"},{"en":"Mandatory Access Control (MAC).","th":"Mandatory Access Control (MAC)"},{"en":"Role Based Access Control (RBAC).","th":"Role-Based Access Control (RBAC)"},{"en":"Trust Ratio Access Control (TRAC).","th":"Trust Ratio Access Control (TRAC)"}],"correct":[0,1,2,3],"explanation_en":"The correct answers:\nDiscretionary Access Control (DAC): In this type of access control, the owner of the information or any resource is responsible for defining who can access it. It is called discretionary because the control is based on the discretion of the owner.\nMandatory Access Control (MAC): In this type of access control, access rights are regulated by a central authority in the system and the owners or users do not have a role in deciding who can access a particular resource. It's usually employed in organizations that require a high level of data security.\nRole Based Access Control (RBAC): In RBAC, access permissions are based on the role of the users within the organization. It's a very efficient method as it groups users based on their job function and assigns access permissions to these groups rather than individuals.\nRule-Based Access Control (RUBAC): In rule-based access control, access is allowed or denied to resource objects based on a set of rules defined by a system or application.\n\nThe incorrect answers:\nTrust Ratio Access Control (TRAC) is not a commonly used type of identity and access management. While there may be some systems that use TRAC, it is not a widely recognized or used type of identity and access management. TRAC is based on the level of trust that is assigned to a user, and access to resources is granted based on that trust level.","explanation_th":"คำตอบที่ถูกคือ A B C และ D เพราะ DAC ให้เจ้าของทรัพยากรตัดสินสิทธิ์ RuBAC ใช้กฎ MAC ใช้ชั้นความลับและนโยบายส่วนกลาง และ RBAC ให้สิทธิ์ตามบทบาท E ไม่ใช่รูปแบบ access control มาตรฐานที่ใช้ในเนื้อหา IAM ของแหล่งต้นฉบับ ข้อนี้ต้องเลือกครบทั้งสี่ข้อจึงจะถูก"},{"number":69,"id":102018263,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"For access control management, which of these is considered something you have?","question_th":"ในบริบทการจัดการ access control ข้อใดเป็นปัจจัยประเภท ‘สิ่งที่คุณมี’","options":[{"en":"Fingerprint.","th":"ลายนิ้วมือ"},{"en":"MAC address.","th":"MAC address"},{"en":"Cookie on computer.","th":"cookie บนคอมพิวเตอร์"},{"en":"Personal Identification Number (PIN).","th":"รหัส PIN"}],"correct":[2],"explanation_en":"The correct answer:\nSomething you have is a factor of authentication that relates to a physical item or piece of data that the user possesses. In this case, a cookie on a computer would be a fitting example. Cookies are small pieces of data stored on your computer by your web browser at the request of the websites you visit. These cookies can be used as a form of identification when returning to a site, and hence fall under the category of something you \"have.\"\n\nThe incorrect answers:\nA fingerprint is something you are, not something you have. This is a form of biometric authentication, where physical or behavioral characteristics are used to verify identity.\nA MAC address could be considered as something the device \"is\" rather than something you have. MAC addresses are unique identifiers assigned to network interfaces for communications on the physical network segment, and they are tied to the hardware of the device itself.\nA PIN (Personal Identification Number) is considered something you know, not something you have. It's a type of knowledge-based authentication where the user is required to prove knowledge of a secret (in this case, a number) in order to authenticate.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะ cookie ที่อยู่บนอุปกรณ์ถูกมองเป็นสิ่งที่เครื่องหรือผู้ใช้ครอบครอง A เป็นสิ่งที่เป็น (biometric) D เป็นสิ่งที่รู้ และ B เป็นตัวระบุของอินเทอร์เฟซเครือข่าย ไม่ใช่ credential possession factor ที่เชื่อถือได้โดยตรง"},{"number":70,"id":102018265,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"We are implementing new access controls at ThorTeaches.com. If we look at the IAAA (Identification, Authentication, Authorization, and Accountability/Auditing) model, which factor could we use for authentication?","question_th":"ในโมเดล IAAA ปัจจัยใดสามารถใช้สำหรับ Authentication","options":[{"en":"Access control","th":"Access control"},{"en":"Identification","th":"Identification"},{"en":"Authorization","th":"Authorization"},{"en":"Biometric verification","th":"การตรวจสอบด้วยชีวมิติ"}],"correct":[3],"explanation_en":"The correct answer:\nBiometric verification: In the context of IAAA (Identification, Authentication, Authorization, and Accountability/Auditing) model, biometric verification is the correct answer. Biometric verification is an authentication process that involves verifying the identity of a user based on unique physical or behavioral characteristics, such as fingerprints, facial recognition, iris scanning, or voice patterns. Authentication is the second step in the IAAA model. After a user or system identifies itself (Identification), that identity is verified through some form of proof (Authentication). The proof could be something the user knows (like a password), something the user has (like a token or smart card), or something the user is, which includes biometric features.\n\nThe incorrect answers:\nAccess control is not a part of authentication but rather a result of it, forming a distinct step in the IAAA model. Access control defines what resources or actions the authenticated user has access to (Authorization). It's about granting or denying permissions to resources, rather than verifying the identity of the user.\nIdentification is the first step in the IAAA model and is different from authentication. Identification involves presenting an identifier to the system, such as a username or email. This is just a claim of identity and doesn't provide proof. The proof comes in the next step, Authentication, where the presented identity is verified.\nAuthorization is the third step in the IAAA model and happens after authentication. Once the system has confirmed a user's identity through authentication, it then decides what that user can do, what files they can access, and what operations they can perform. Authorization is about permissions and rights, not about verifying identity, which is what authentication does.","explanation_th":"คำตอบที่ถูกคือ D เพราะ biometric verification ใช้พิสูจน์ว่าผู้ขอเป็นบุคคลที่อ้างจริง A เป็นแนวทางควบคุมสิทธิ์โดยรวม B เป็นการระบุตัวตนหรือเสนอ identifier และ C เป็นขั้นตอนกำหนดสิทธิ์หลังยืนยันตัวตนแล้ว"},{"number":71,"id":102018267,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Your team is in charge of implementing a new cybersecurity system for the company. One of the options on the table is to use an automation tool to help with the setup and maintenance. What is a popular automation tool used in cyber security?","question_th":"เครื่องมือ automation ที่นิยมใช้ในงาน cybersecurity ตามแหล่งต้นฉบับคือข้อใด","options":[{"en":"Terraform","th":"Terraform"},{"en":"Puppet","th":"Puppet"},{"en":"Ansible","th":"Ansible"},{"en":"Chef","th":"Chef"}],"correct":[2],"explanation_en":"The correct answer:\nAnsible: Ansible is a widely-used automation tool that can manage, provision, and deploy applications, and it's often used in cybersecurity for tasks like configuration management and application deployment in a consistent and repeatable manner. Its agentless design and use of YAML-based playbooks make it popular for automation tasks in various environments.\n\nThe incorrect answers:\nTerraform: Terraform is primarily an infrastructure as code (IaC) tool that automates the provisioning of infrastructure. While it can be used in tandem with cybersecurity solutions, it's more focused on cloud resource provisioning.\nPuppet: Puppet is another configuration management tool used for automating the provisioning and management of infrastructure. It's similar in purpose to Ansible but uses a master-agent setup.\nChef: Chef, like Puppet, is a configuration management tool used for automation. It ensures that infrastructure is configured consistently across various environments.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะ Ansible ใช้ทำ configuration management การ deploy และการทำงานซ้ำอัตโนมัติแบบ agentless จึงนิยมใช้จัดมาตรฐานและ hardening ระบบ A เน้น infrastructure as code ส่วน B และ D ก็ทำ configuration automation ได้ แต่ต้นฉบับเลือก Ansible เป็นคำตอบที่นิยมในบริบทนี้"},{"number":72,"id":102018269,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"If we are using Active Directory (AD) for our Role Based Access Control (RBAC) authentication, we would innately use which authentication protocol?","question_th":"เมื่อใช้ Active Directory สำหรับ RBAC โดยปริยายจะใช้โพรโทคอลยืนยันตัวตนใด","options":[{"en":"NTLM","th":"NTLM"},{"en":"LDAP","th":"LDAP"},{"en":"Kerberos","th":"Kerberos"},{"en":"RADIUS","th":"RADIUS"}],"correct":[2],"explanation_en":"The correct answer:\nKerberos is the correct answer because it's the default authentication protocol used by Microsoft's Active Directory (AD). Kerberos is a network authentication protocol that works on the basis of 'tickets' to allow entities to prove their identity over a non-secure network in a secure manner. It is used to authenticate a user's identity before granting them access to a service. When a user logs into a workstation and tries to access a server, the workstation sends a request to the Kerberos system to authenticate the user. If successful, Kerberos then grants a ticket that can be used to authenticate to the requested server. This is why Kerberos is used in an Active Directory setup.\n\nThe incorrect answers:\nNTLM is an older authentication protocol used by Microsoft but is not the primary protocol used with Active Directory for Role Based Access Control (RBAC) authentication. NTLM operates over a three-way handshake and doesn't use a ticketing system like Kerberos. While it's still supported for backward compatibility, it's less secure and less capable than Kerberos. \nLDAP is a protocol used to access and maintain distributed directory information services, such as those provided by Active Directory. While LDAP plays an integral role in Active Directory, it's not an authentication protocol itself; instead, it's a method for querying and modifying items in an AD service. Therefore, while LDAP is used alongside Active Directory, it is not the authentication protocol innately used with Active Directory for RBAC.\nRADIUS is a networking protocol providing centralized Authentication, Authorization, and Accounting (AAA) management for users who connect and use a network service. While RADIUS is indeed an authentication protocol, it is commonly used with networking hardware like VPNs, routers, and switches, rather than with Active Directory. RADIUS servers maintain user profiles in a central database that the servers can access to authorize access to the network. In Active Directory's context, it would be used more for network access control rather than RBAC authentication within AD.","explanation_th":"คำตอบที่ถูกคือ C เพราะ Active Directory ใช้ Kerberos เป็นโพรโทคอลยืนยันตัวตนหลักในโดเมนสมัยใหม่ A เป็นกลไกเก่าหรือ fallback B ใช้ค้นหาและจัดการข้อมูลใน directory และ D ใช้ AAA สำหรับการเข้าถึงเครือข่าย เช่น VPN หรือ Wi-Fi มากกว่า"},{"number":73,"id":102018271,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the head of IT ThorTeaches.com, you are responsible for ensuring that all employees have appropriate access to the systems and resources they need to do their jobs. What is the process for managing access to information systems and resources within an organization?","question_th":"กระบวนการจัดการการเข้าถึงระบบสารสนเทศและทรัพยากรภายในองค์กรคือข้อใดตามต้นฉบับ","options":[{"en":"Data access control","th":"Data access control"},{"en":"Risk management","th":"Risk management"},{"en":"Configuration management","th":"Configuration management"},{"en":"Information security governance","th":"Information security governance"}],"correct":[0],"explanation_en":"The correct answer:\nData access control: The process of managing access to information systems and resources is typically referred to as data access control. This involves ensuring that only authorized users have access to specific systems and data based on their roles and responsibilities within the organization. Access controls can be discretionary, mandatory, role-based, or rule-based, among others.\n\nThe incorrect answers:\nRisk management: This is the process of identifying, assessing, and prioritizing risks, followed by applying resources to minimize, monitor, and control those risks. While risk management may encompass aspects of data access, it's not solely focused on managing access to systems.\nConfiguration management: This pertains to the process of systematically managing, organizing, and controlling the changes in the software, hardware, firmware, documentation, and other processes during the lifecycle of an information system.\nInformation security governance: While this is an overarching strategy and approach to managing and governing an organization's information security program, it is not specifically the process for managing access to systems and resources.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A เพราะ data access control กำหนดว่าผู้ใช้ใดสามารถใช้ข้อมูลหรือระบบในระดับใด B จัดการความเสี่ยงโดยรวม C จัดการสถานะและการเปลี่ยนแปลงระบบ และ D กำหนดทิศทางและความรับผิดชอบระดับองค์กร ไม่ใช่การจัดสิทธิ์รายทรัพยากร"},{"number":74,"id":102018273,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective way to protect a cloud-native application from security threats?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการปกป้อง cloud-native application จากภัยคุกคามตามแหล่งต้นฉบับ","options":[{"en":"Implementing a strong password policy","th":"ใช้นโยบายรหัสผ่านที่เข้มแข็ง"},{"en":"Using firewalls and intrusion detection systems","th":"ใช้ไฟร์วอลล์และ IDS"},{"en":"Regularly updating security patches and software","th":"อัปเดตแพตช์และซอฟต์แวร์เป็นประจำ"},{"en":"Enforcing strict access controls and authentication methods","th":"บังคับใช้การควบคุมการเข้าถึงและวิธียืนยันตัวตนที่เข้มงวด"}],"correct":[3],"explanation_en":"The correct answer:\nEnforcing strict access controls and authentication methods is the MOST effective way to protect a cloud-native application from security threats. By limiting access to only authorized users and enforcing strong authentication methods, such as multi-factor authentication, an organization can effectively mitigate a wide range of security threats, including unauthorized access, identity theft, and data breaches.\n\nThe incorrect answers:\nWhile a strong password policy is an important part of security, it is not sufficient on its own to protect a cloud-native application from all potential security threats. For example, it cannot prevent attacks that exploit software vulnerabilities or protect against users with legitimate access who misuse their privileges.\nUsing firewalls and intrusion detection systems can help to prevent external threats, but they are not sufficient on their own to ensure the security of a cloud-native application. They do not, for example, control who can access the application or protect against threats from insiders with legitimate access.\nKeeping software and security patches up to date is crucial for protecting against known vulnerabilities. However, it is not enough on its own to protect a cloud-native application from all security threats, particularly those related to unauthorized access or misuse of legitimate access privileges.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ D เพราะ access control และ authentication จำกัดทั้งผู้ใช้และ service identity ให้ใช้เฉพาะทรัพยากรที่จำเป็น A เป็นเพียงส่วนหนึ่ง B และ C สำคัญต่อ defense in depth แต่ไม่ควบคุมว่าใครสามารถเรียกใช้ฟังก์ชันหรือข้อมูลของแอปได้ละเอียดเท่า"},{"number":75,"id":102018275,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As a Chief Information Security Officer (CISO) in a financial technology company, you're planning to implement multifactor authentication to secure customer transactions. Your team is considering various types of authentication methods, including Type 2 (something you have) and Type 1 (something you know). They're debating the efficacy of different combinations of these factors. In the context of a banking transaction at an ATM, which of the following explains why a combination of a card (Type 2) and a PIN (Type 1) is more secure than using a username and a password (both Type 1)?","question_th":"เหตุใดการใช้บัตร ATM (สิ่งที่มี) ร่วมกับ PIN (สิ่งที่รู้) จึงปลอดภัยกว่าการใช้ username และ password ซึ่งเป็นสิ่งที่รู้ทั้งคู่","options":[{"en":"PINs are harder to guess than passwords.","th":"PIN เดายากกว่ารหัสผ่าน"},{"en":"Cards cannot be replicated or stolen.","th":"บัตรไม่สามารถทำสำเนาหรือขโมยได้"},{"en":"The use of different types of authentication factors provides more robust security.","th":"การใช้ปัจจัยยืนยันตัวตนต่างประเภทให้ความปลอดภัยที่แข็งแรงกว่า"},{"en":"A card and a PIN ensure absolute protection against all types of fraudulent activities.","th":"บัตรและ PIN ป้องกันการฉ้อโกงได้ทุกชนิดอย่างสมบูรณ์"}],"correct":[2],"explanation_en":"The correct answer:\nThe combination of a card (Type 2: something you have) and a PIN (Type 1: something you know) provides multifactor authentication, which is inherently more secure than single-factor authentication, such as a username and password (both Type 1). By relying on two different types of factors, the security measure does not fall if one factor is compromised. For instance, even if a card is stolen, without the PIN, it would be useless, and vice versa. On the other hand, if a username and password (both something you know) are compromised, there are no other layers of security in place to protect the user's account.\n\nThe incorrect answers:\nIt's generally true that PINs could be harder to guess due to their random nature and the limitation on the number of attempts, but it isn't always the case. The strength of a password or a PIN depends largely on their complexity and length. Some passwords can be more secure than PINs if they are long and complex enough.\nCards can indeed be stolen, and in some cases, replicated (though it's technically challenging and illegal). That's precisely why relying only on a card (Type 2 authentication) is not sufficient, and a PIN (Type 1) is needed to provide an additional layer of security.\nA card and PIN provide a significantly higher level of security than a single authentication factor, but they do not ensure absolute protection against all types of fraudulent activities. For example, if both the card and the PIN are stolen or if a card skimmer is used, the system can still be compromised.","explanation_th":"คำตอบที่ถูกคือ C เพราะ MFA ต้องการการโจมตีปัจจัยสองประเภท ผู้โจมตีที่รู้ PIN ยังต้องมีบัตรจริง A ไม่จริงเสมอเพราะ PIN มักสั้น B ไม่จริงเพราะบัตรอาจถูกขโมยหรือคัดลอก และ D ไม่มีระบบใดรับประกันการป้องกันการฉ้อโกงทั้งหมด"},{"number":76,"id":102018277,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the MOST important factor when determining a secure password?","question_th":"ปัจจัยที่สำคัญที่สุดในการกำหนดรหัสผ่านที่ปลอดภัยคือข้อใดตามแหล่งต้นฉบับ","options":[{"en":"The length of the password","th":"ความยาวของรหัสผ่าน"},{"en":"The complexity of the password","th":"ความซับซ้อนของรหัสผ่าน"},{"en":"The obscurity of the password","th":"ความคลุมเครือหรือคาดเดายากของรหัสผ่าน"},{"en":"The regularity of the password changes","th":"ความสม่ำเสมอในการเปลี่ยนรหัสผ่าน"}],"correct":[1],"explanation_en":"The correct answer:\nThe complexity of a password refers to the use of a combination of characters, such as uppercase letters, lowercase letters, numbers, and special characters. The more complex a password is, the harder it is for hackers to crack it through guessing or using automated tools.\n\nThe incorrect answers:\nThe length of the password: While having a long password can make it more difficult for hackers to crack, it is not as important as the complexity of the password. A short but complex password is still more secure than a long but simple password.\nThe obscurity of the password: Having a password that is not easily guessed, such as a random string of characters, is important, but it is not as important as the complexity of the password. A complex but easily guessed password is still vulnerable to hacking.\nThe regularity of the password changes: While regularly changing passwords can add an extra layer of security, it is not as important as the complexity of the password. A complex password that is never changed is still more secure than a simple password that is changed frequently.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะความซับซ้อนเพิ่มชนิดอักขระและจำนวนความเป็นไปได้ในการเดารหัส A มีความสำคัญมากเช่นกันแต่ต้นฉบับเลือก complexity เป็นปัจจัยหลัก C เป็นแนวคิดกว้างและวัดได้ยาก ส่วน D การเปลี่ยนบ่อยไม่ได้รับประกันว่ารหัสใหม่จะแข็งแรง และอาจทำให้ผู้ใช้ตั้งรูปแบบเดาง่าย"},{"number":77,"id":102018279,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) at a multinational corporation that has been experiencing a growing number of unauthorized internal network access attempts. The intrusions have been traced back to both external and internal sources. The board is pressing you to implement a solution that guarantees only authorized personnel can access the internal network while providing proof of their actions. To authenticate users and provide non-repudiation for actions within your organization's network, which of the following measures would be the most effective?","question_th":"มาตรการใดมีประสิทธิผลที่สุดในการยืนยันตัวผู้ใช้และให้หลักฐาน non-repudiation สำหรับการกระทำบนเครือข่ายตามตัวเลือกที่ให้มา","options":[{"en":"Implementing a comprehensive Intrusion Prevention System (IPS).","th":"ติดตั้ง Intrusion Prevention System แบบครอบคลุม"},{"en":"Applying IP filtering and restricting network access based on IP addresses.","th":"กรอง IP และจำกัดการเข้าถึงตาม IP address"},{"en":"Enforcing a Two-Factor Authentication (2FA) policy for all network access.","th":"บังคับใช้ Two-Factor Authentication สำหรับการเข้าเครือข่ายทั้งหมด"},{"en":"Requiring all network activities to be signed with Embedded Digital Signatures.","th":"กำหนดให้กิจกรรมเครือข่ายทั้งหมดลงนามด้วย embedded digital signatures"}],"correct":[2],"explanation_en":"The correct answer:\nTwo-Factor Authentication (2FA) requires users to verify their identities through two different factors - something they know (like a password), something they have (like a physical token), or something they are (biometric data). This method can significantly reduce the risk of unauthorized network access, as it requires additional verification even if a user's primary credentials are compromised. Moreover, this approach inherently encourages accountability as each user has unique credentials.\n\nThe incorrect answers:\nIntrusion Prevention System (IPS) can detect and prevent malicious activities in real-time, but it mainly identifies and mitigates threats, rather than ensuring user authentication or non-repudiation. It won't necessarily verify the legitimacy of an authenticated user accessing the system.\nIP filtering is a technique used to block or allow access to an internet protocol (IP) address, but IP addresses can be easily spoofed or bypassed by attackers. Also, IP filtering doesn't provide any form of non-repudiation or validate the legitimacy of the user.\nAn Embedded Digital Signature provides a form of non-repudiation, ensuring that a particular user carried out the action, but it does not authenticate a user before they access the system. It’s a mechanism used after an action has been taken, and it's less effective at preventing unauthorized access compared to 2FA.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะ 2FA เพิ่มความเชื่อมั่นว่าผู้เข้าใช้เป็นบุคคลที่ได้รับอนุญาตและผูกกิจกรรมกับบัญชีที่ผ่านหลายปัจจัย A ป้องกันการโจมตีแต่ไม่พิสูจน์ตัวบุคคล B IP ปลอมแปลงหรือใช้ร่วมกันได้ และ D ให้ non-repudiation ได้ดีแต่การลงนามทุกกิจกรรมไม่ใช่วิธีปฏิบัติทั่วไปสำหรับการควบคุมการเข้าเครือข่ายตามโจทย์"},{"number":78,"id":102018281,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What type of security control is a password policy?","question_th":"นโยบายรหัสผ่านจัดเป็นการควบคุมความปลอดภัยประเภทใด","options":[{"en":"Physical","th":"ทางกายภาพ"},{"en":"Administrative","th":"เชิงบริหาร"},{"en":"Technical","th":"เชิงเทคนิค"},{"en":"Compensating","th":"ทดแทน (Compensating)"}],"correct":[1],"explanation_en":"The correct answer:\nA password policy is a set of rules governing the creation and use of passwords within an organization. It is an administrative control, as it involves the implementation of policies and procedures to ensure the security of passwords and prevent unauthorized access to systems and networks.\n\nThe incorrect answers:\nA password policy is not a physical control, as it does not involve the use of physical security measures such as locks, barriers, or guards.\nA password policy is not a technical control, as it does not involve the use of technology or technical solutions to secure passwords and prevent unauthorized access.\nA password policy is not a compensating control, as it is not implemented as a substitute for another control that is lacking or inadequate. Compensating controls are typically used in situations where it is not possible or practical to implement a required control, and are not as effective as the original control.","explanation_th":"คำตอบที่ถูกคือ B เพราะนโยบายเป็นข้อกำหนดและแนวทางที่ฝ่ายบริหารกำหนดให้บุคลากรและระบบปฏิบัติตาม A เป็นสิ่งกีดขวางหรืออุปกรณ์ทางกายภาพ C คือกลไกที่ระบบบังคับใช้จริง เช่น password filter และ D ใช้แทน control หลักเมื่อใช้วิธีมาตรฐานไม่ได้"},{"number":79,"id":102018283,"type":"multi","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"In implementing type 1 authentication, we could implement which of these?","question_th":"การยืนยันตัวตนประเภทที่ 1 (สิ่งที่รู้) สามารถใช้ข้อใดได้บ้าง เลือกทุกข้อที่ถูก","options":[{"en":"Passwords.","th":"รหัสผ่าน"},{"en":"Personal Identification Numbers (PINs).","th":"รหัส PIN"},{"en":"One-time passwords (OTPs).","th":"One-Time Password (OTP)"},{"en":"Pass phrases.","th":"Passphrase"},{"en":"Tokens","th":"โทเคน"},{"en":"Biometrics.","th":"ชีวมิติ"}],"correct":[0,1,3],"explanation_en":"The correct answers:\n-Passwords are a common form of type 1 authentication, which refers to \"something you know.\" This includes any form of secret information shared between the user and the system.\n-Personal Identification Numbers (PINs) are another form of \"something you know.\" They are typically used in conjunction with other types of authentication (such as an ATM card) but they are a type of type 1 authentication themselves.\n-Pass phrases are similar to passwords but are typically longer for added security. They are a form of \"something you know\" and therefore fall under type 1 authentication.\n\nThe incorrect answers:\nTokens are typically considered type 2 authentication, representing \"something you have.\" This might be a physical device like a smart card or a software-based token.\nBiometrics such as fingerprints, retina scans, or voice recognition represent type 3 authentication, which is \"something you are.\"\nOne-time passwords are a form of type 2 authentication where a unique code is generated and sent to the user, usually via email or SMS, that can only be used once before it expires.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A B และ D เพราะ password, PIN และ passphrase เป็นข้อมูลที่ผู้ใช้รู้ C แม้ผู้ใช้ต้องกรอกรหัส แต่ OTP มักถูกจัดเป็นสิ่งที่มีเมื่อรหัสสร้างจากอุปกรณ์หรือแอป E เป็น possession factor โดยตรง และ F เป็น inherence factor หรือสิ่งที่เป็น ข้อนี้ต้องเลือกครบ A B D จึงจะได้คะแนน"},{"number":80,"id":102018285,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) of a financial services firm that operates on a global scale, dealing with sensitive client data. Your company currently uses the Role-Based Access Control (RBAC) model, where each job function is assigned a specific set of access rights. However, given the increasingly complex business needs and dynamic nature of access requirements, you're considering a shift to a different model. Which of the following access control models would provide the most comprehensive, adaptable, and secure access control for your organization while maintaining necessary restrictions based on job function and other attributes?","question_th":"องค์กรที่ต้องการ access control ที่ยืดหยุ่น ละเอียด และพิจารณาทั้งหน้าที่ คุณลักษณะทรัพยากร และสภาพแวดล้อม ควรใช้โมเดลใด","options":[{"en":"Switch to a Mandatory Access Control (MAC) model, which allows system-level control over data access based on classification levels.","th":"เปลี่ยนเป็น Mandatory Access Control ตามระดับชั้นข้อมูล"},{"en":"Maintain the Role-Based Access Control (RBAC) model, where each job function continues to have a specific set of access rights.","th":"คง Role-Based Access Control เดิม"},{"en":"Switch to a Discretionary Access Control (DAC) model, where each user has total control over their own data.","th":"เปลี่ยนเป็น Discretionary Access Control ให้ผู้ใช้ควบคุมข้อมูลของตน"},{"en":"Implement an Attribute-Based Access Control (ABAC) model, which factors in the user's attributes, the resources, the environmental conditions, and a set of policies to grant access.","th":"ใช้ Attribute-Based Access Control ที่ประเมินผู้ใช้ ทรัพยากร สภาพแวดล้อม และนโยบาย"}],"correct":[3],"explanation_en":"The correct answer:\nAttribute-Based Access Control (ABAC) factors in the user's attributes, the resources, the environmental conditions, and a set of policies to grant access. This model provides a fine-grained access control mechanism that is flexible, adaptable, and able to handle complex access requirements. It can balance the needs of a dynamic business environment with the necessity of maintaining data security. In this scenario, ABAC is the most comprehensive and secure model.\n\nThe incorrect answers:\nMandatory Access Control (MAC) does provide system-level control over data access based on classification levels, but it can be too rigid for a global financial firm with diverse job roles and dynamic access requirements. It can become cumbersome to manage and may not provide the necessary flexibility required in this scenario.\nMaintaining the Role-Based Access Control (RBAC) model will continue to assign access rights based on job functions, but it lacks the flexibility needed in a dynamic business environment. As business needs evolve and job roles diversify, RBAC may not adequately cover all the access requirements.\nDiscretionary Access Control (DAC) provides users with complete control over their data. This model gives users a high level of freedom, but it is not the most secure option for a large financial firm. In such a setting, unrestricted user control over data can lead to significant security risks, especially given the sensitivity of the data involved.","explanation_th":"คำตอบที่ถูกคือ D เพราะ ABAC รวมคุณลักษณะหลายด้านและสร้างนโยบายแบบละเอียด เหมาะกับความต้องการที่เปลี่ยนแปลง A แข็งแรงแต่เน้น classification และยืดหยุ่นน้อย B ง่ายต่อการบริหารแต่บทบาทอาจไม่ละเอียดพอ และ C ให้ดุลยพินิจแก่เจ้าของมากเกินไปสำหรับองค์กรที่ต้องการควบคุมเข้มงวด"},{"number":81,"id":102018287,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What type of security control is implemented when a user is required to enter a password before accessing a system?","question_th":"การกำหนดให้ผู้ใช้ใส่รหัสผ่านก่อนเข้าระบบเป็นการควบคุมประเภทใด","options":[{"en":"Physical security control","th":"การควบคุมทางกายภาพ"},{"en":"Operational security control","th":"การควบคุมเชิงปฏิบัติการ"},{"en":"Technical security control","th":"การควบคุมเชิงเทคนิค"},{"en":"Administrative security control","th":"การควบคุมเชิงบริหาร"}],"correct":[2],"explanation_en":"The correct answer:\n\"Technical security control\": This is the correct answer. A technical (or logical) security control refers to the mechanisms, like software or hardware, used to manage access and provide protection to resources and systems. This involves the use of technology to restrict users' access to resources. When a user is required to enter a password before accessing a system, it's an example of a technical control as it uses system-based methods (password validation through a computer system) to manage access control.\n\nThe incorrect answers:\n\"Administrative security control\": This isn't the correct answer, but administrative controls are also important in a comprehensive security strategy. These controls involve the establishment of policies, procedures, and guidelines to manage the protection of an organization's assets. They include things like security awareness training, background checks, or a clean desk policy.\n\"Physical security control\": This isn't the correct answer, but physical controls are a crucial part of an overall security plan. They provide protection against unauthorized physical access to resources such as servers, network infrastructure, or data storage areas. This could involve locks, security badges, or video surveillance.\n\"Operational security control\": This isn't the correct answer, but operational controls are procedures and mechanisms put in place to handle operational aspects of a system. They ensure that systems and processes operate correctly and recover quickly and effectively in the event of a failure or a security breach. These can include procedures for responding to incidents or disasters, or processes for regularly testing and maintaining systems and backups.","explanation_th":"คำตอบที่ถูกคือ C เพราะระบบซอฟต์แวร์ตรวจรหัสผ่านและบังคับการเข้าถึงโดยอัตโนมัติ A เกี่ยวกับสถานที่หรืออุปกรณ์ B เกี่ยวกับกระบวนการปฏิบัติงานประจำวัน และ D คือข้อกำหนด นโยบาย หรือการกำกับดูแล ไม่ใช่กลไกล็อกอินเอง"},{"number":82,"id":102018289,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the security manager at a large financial institution, you are responsible for implementing measures to ensure that only authorized employees are able to access sensitive client information. What is a common method for ensuring that only authorized users have access to certain resources or systems?","question_th":"วิธีทั่วไปในการรับรองว่าเฉพาะผู้ใช้ที่ได้รับอนุญาตเข้าถึงทรัพยากรหรือระบบบางส่วนได้คือข้อใด","options":[{"en":"Physical access control","th":"การควบคุมการเข้าถึงทางกายภาพ"},{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Network segmentation","th":"การแบ่งส่วนเครือข่าย"},{"en":"Logical access control","th":"การควบคุมการเข้าถึงเชิงตรรกะ"}],"correct":[3],"explanation_en":"The correct answer:\nLogical access control involves the use of authentication and authorization mechanisms, such as user credentials and permissions, to grant or deny access to resources and systems. This may include implementing multi-factor authentication, access control lists, biometrics and more mechanisms. This ensures that only those users who are authorized can access certain resources or systems, and it is the common method for managing digital access to sensitive data.\n\nThe incorrect answers:\nPhysical access control involves the use of physical barriers, such as locks and security guards, to prevent unauthorized access to a facility or building. It's not directly related to controlling access to digital resources or systems, which the question implies.\nEncryption is a method of securing data by transforming it into a coded format that can only be decrypted by authorized users. Although it protects data from being understood if intercepted, it does not control who can access the data or systems.\nNetwork segmentation involves dividing a network into smaller, isolated segments to limit the spread of potential security threats and to improve network performance. However, it does not itself control which users have access to certain resources or systems.","explanation_th":"คำตอบที่ถูกคือ D เพราะ logical access control ใช้บัญชี credentials ACL และ permissions เพื่อควบคุมระบบและข้อมูล A จำกัดการเข้าถึงสถานที่ B ปกป้องเนื้อหาข้อมูล และ C แยกเครือข่ายเพื่อลดการเคลื่อนที่ของผู้โจมตี แต่ไม่แทนการกำหนดสิทธิ์ผู้ใช้"},{"number":83,"id":102018291,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the BEST practice for de-provisioning a user account?","question_th":"แนวปฏิบัติที่ดีที่สุดในการ de-provision บัญชีผู้ใช้คือข้อใด","options":[{"en":"Immediately disabling the account","th":"ปิดใช้งานบัญชีทันที"},{"en":"Notifying the user and giving them a grace period to transfer their files","th":"แจ้งผู้ใช้และให้ช่วงเวลาย้ายไฟล์"},{"en":"Automatically deleting the account after a set period of time","th":"ลบบัญชีอัตโนมัติหลังระยะเวลาที่กำหนด"},{"en":"Keeping the account active in case it is needed again in the future","th":"คงบัญชีไว้เผื่อใช้ในอนาคต"}],"correct":[0],"explanation_en":"The correct answer:\nThe best practice for deprovisioning a user account is to immediately disable the account to prevent unauthorized access. This ensures that the account cannot be used for malicious purposes and minimizes the potential for data breaches.\n\nThe incorrect answers:\nNotifying the user and giving them a grace period to transfer their files is not the best practice for deprovisioning a user account. This can leave the account vulnerable to unauthorized access during the grace period and may not be practical in emergency situations.\nAutomatically deleting the account after a set period of time is not the best practice for deprovisioning a user account. This can lead to data loss if the user has important files on the account that are not transferred before the deletion occurs.\nKeeping the account active in case it is needed again in the future is not the best practice for deprovisioning a user account. This can create security vulnerabilities and increase the risk of data breaches if the account is not properly monitored and secured.","explanation_th":"คำตอบที่ถูกคือ A เพราะการ disable ทันทีหยุดการเข้าสู่ระบบ แต่ยังเก็บข้อมูลและ audit trail ไว้ให้ดำเนินการตามขั้นตอน B เปิดสิทธิ์ต่อโดยไม่จำเป็น C การลบอาจทำให้สูญเสียหลักฐานหรือข้อมูล และ D สร้าง orphan account ที่ผู้โจมตีอาจนำไปใช้"},{"number":84,"id":102018293,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"When we look at using type 3 authentication, we will talk about all these terms EXCEPT which?","question_th":"เมื่อกล่าวถึงการยืนยันตัวตนประเภทที่ 3 (สิ่งที่เป็น) ข้อใดไม่อยู่ในกลุ่มนี้","options":[{"en":"Face recognition","th":"การจดจำใบหน้า"},{"en":"Voice recognition","th":"การจดจำเสียง"},{"en":"Signature verification","th":"การตรวจสอบลายเซ็น"},{"en":"Password verification","th":"การตรวจสอบรหัสผ่าน"}],"correct":[3],"explanation_en":"The correct answer:\nPassword verification falls under type 1 authentication, also known as \"something you know\". This form of authentication involves information only the user should know, like a password, a PIN (Personal Identification Number), or answers to security questions. Because this information can be shared, stolen, or guessed, it doesn't belong in the category of type 3 authentication.\n\nThe incorrect answers:\nFace recognition definitely falls under type 3 authentication. Facial recognition systems analyze unique patterns and characteristics of the face, such as distance between the eyes or shape of the jawline, which are unique to every individual. It's a form of biometric authentication, thus categorized as type 3 authentication.\nVoice recognition, like facial recognition, falls under the umbrella of biometric, type 3 authentication. Voice recognition systems analyze the unique characteristics of a person's voice, including tone, pitch, cadence, and even accent, to verify the identity of an individual.\nSignature verification is another incorrect choice because it too falls under type 3 authentication. The way an individual signs their name, including the speed, pressure, and rhythm of the signature, is unique to each person. Signature verification systems use these characteristics for identification, making it a form of biometric authentication.","explanation_th":"คำตอบที่ถูกคือ D เพราะรหัสผ่านเป็นสิ่งที่ผู้ใช้รู้ หรือ Type 1 ส่วน A B และ C ใช้คุณลักษณะทางกายภาพหรือพฤติกรรมของบุคคล จึงอยู่ในกลุ่ม biometric หรือ Type 3"},{"number":85,"id":102018295,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As a Chief Information Security Officer (CISO) of a global organization, you are tasked with the responsibility of securing your organization's remote administration system. This system is integral for various teams, including network, server, storage, and backup teams, to perform maintenance and configuration tasks remotely. The system is accessible from anywhere in the world, which opens potential vulnerabilities that need to be mitigated. Given the security requirements for your organization, what would be the most effective approach to enhance the security of your remote administration system?","question_th":"แนวทางใดมีประสิทธิผลที่สุดในการเพิ่มความปลอดภัยให้ระบบบริหารระยะไกลที่เข้าถึงได้จากทั่วโลก","options":[{"en":"Implement stringent authentication mechanisms","th":"ใช้กลไกยืนยันตัวตนที่เข้มงวด"},{"en":"Use Caller ID for verifying the location of remote users","th":"ใช้ Caller ID ยืนยันตำแหน่งผู้ใช้ระยะไกล"},{"en":"Utilize Callback security mechanism for remote connections","th":"ใช้ Callback security สำหรับการเชื่อมต่อระยะไกล"},{"en":"Rely on voice phishing (vishing) techniques for user validation","th":"ใช้เทคนิค voice phishing เพื่อตรวจสอบผู้ใช้"}],"correct":[0],"explanation_en":"The correct answer:\nStrong authentication mechanisms such as multi-factor authentication (MFA), risk-based authentication, and biometrics could significantly enhance the security of your remote administration system. These mechanisms ensure that only authorized individuals have access to the system, reducing the potential risk of unauthorized access. They are also designed to thwart modern hacking techniques, making it harder for malicious actors to breach the system.\n\nThe incorrect answers:\nUsing Caller ID could provide an additional layer of security by verifying the location of the remote user, but it's relatively easy for a determined attacker to spoof a Caller ID, making this measure less secure. Caller ID also does not provide any form of authentication for the user.\nThe callback security mechanism, where a server would verify a user by calling back a pre-registered phone number, is outdated and is not a practical solution in a modern environment. It also lacks the sophistication and flexibility needed in a global organization, given the various ways in which people can connect to systems today.\nIt's true that one could potentially use vishing techniques to validate a user's identity in a pinch, but this method is not a suitable primary security mechanism for a remote administration system. Vishing is a form of social engineering attack, not a security measure, and is typically used by attackers to trick people into giving up sensitive information.","explanation_th":"คำตอบที่ถูกคือ A เพราะ strong authentication เช่น MFA ใบรับรอง และ privileged access controls ตรวจสอบผู้ดูแลระบบโดยตรง B ปลอมแปลงได้ C เป็นเทคนิคเก่าที่ไม่เหมาะกับเครือข่ายสมัยใหม่และยังมีข้อจำกัด ส่วน D เป็นการโจมตี social engineering ไม่ใช่มาตรการรักษาความปลอดภัย"},{"number":86,"id":102018297,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective way to implement dual control for sensitive data access?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการใช้ dual control สำหรับการเข้าถึงข้อมูลอ่อนไหว","options":[{"en":"Having one person handle all access requests and approve them without any oversight","th":"ให้คนเดียวรับและอนุมัติคำขอทั้งหมดโดยไม่มีการตรวจสอบ"},{"en":"Having two people independently verify and approve access requests","th":"ให้คนสองคนตรวจสอบและอนุมัติคำขออย่างเป็นอิสระ"},{"en":"Having one person handle access requests and have another person randomly check a small percentage of them","th":"ให้คนหนึ่งจัดการคำขอและอีกคนสุ่มตรวจเพียงบางส่วน"},{"en":"Having one person handle access requests and have another person randomly check all of them","th":"ให้คนหนึ่งจัดการคำขอและอีกคนสุ่มตรวจทั้งหมด"}],"correct":[1],"explanation_en":"The correct answer:\nThe most effective way to implement dual control for sensitive data access is to have two people independently verify and approve access requests. This ensures that there is a check and balance system in place, as each person is not relying on the other to catch any potential errors or issues with access requests.\n\nThe incorrect answers:\nHaving one person handle all access requests and approve them without any oversight does not provide any checks and balances to ensure that access requests are properly handled and authorized. This could lead to potential security issues, such as unauthorized access to sensitive data.\nHaving one person handle access requests and have another person randomly check a small percentage of them does not provide adequate oversight for sensitive data access. The random checking of a small percentage of access requests does not guarantee that all requests will be properly verified and authorized, leaving potential security vulnerabilities.\nHaving one person handle access requests and have another person randomly check all of them does not provide a robust dual control system for sensitive data access. While this approach may catch some potential issues with access requests, it does not guarantee that all requests will be properly verified and authorized, leaving potential security vulnerabilities.","explanation_th":"คำตอบที่ถูกคือ B เพราะ dual control ต้องมีบุคคลสองคนมีส่วนร่วมอย่างแท้จริงก่อนให้สิทธิ์ ลดโอกาสทุจริตหรือผิดพลาดจากคนเดียว A ไม่มีการแบ่งหน้าที่ C และ D เป็นการตรวจย้อนหลังแบบสุ่ม ไม่ใช่การอนุมัติร่วมก่อนให้เข้าถึง"},{"number":87,"id":102018299,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective method for identifying and authenticating users in a network?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการระบุและยืนยันตัวผู้ใช้บนเครือข่ายตามแหล่งต้นฉบับ","options":[{"en":"Using usernames and passwords","th":"ใช้ username และ password"},{"en":"Using biometric data such as fingerprints or iris scans","th":"ใช้ข้อมูลชีวมิติ เช่น ลายนิ้วมือหรือม่านตา"},{"en":"Using IP addresses to track user activity","th":"ใช้ IP address ติดตามกิจกรรม"},{"en":"Using security tokens with rotating numbers","th":"ใช้ security token ที่เปลี่ยนตัวเลขตามเวลา"}],"correct":[1],"explanation_en":"The correct answer: \nUsing biometric data such as fingerprints or iris scans: Biometric data such as fingerprints or iris scans are currently the most effective method for identifying and authenticating users in a network. Biometrics refers to the measurement of unique physical or behavioral characteristics. Since these characteristics are inherent to each individual, they are extremely difficult to forge or steal, thus offering a high level of security. Fingerprints or iris scans specifically offer a high level of uniqueness and permanence: traits that are crucial for reliable identification and authentication. Using biometrics can improve user experience as it often eliminates the need to remember complex passwords.\n\nThe incorrect answers:\nUsing usernames and passwords: While this method is the most common way of user authentication, it is not the most effective. Passwords can be easily forgotten, guessed, stolen, or cracked through various techniques such as brute force attacks, dictionary attacks, or social engineering. Additionally, users often use weak passwords or reuse them across multiple services, which increases security risk.\nUsing IP addresses to track user activity: IP addresses can be used for identifying devices on a network, not for authenticating users. IP addresses can change frequently (for instance, when a user changes their location or uses a different device), and multiple users can share the same IP address (for example, users connected to the same Wi-Fi network). IP addresses can be easily spoofed or obfuscated, making this method ineffective for user authentication.\nUsing security tokens with rotating numbers: Security tokens with rotating numbers, often referred to as one-time passwords (OTPs), add an additional layer of security. This method is part of two-factor or multi-factor authentication processes. While this significantly improves security compared to using just usernames and passwords, it can still be vulnerable to attacks such as phishing, man-in-the-middle attacks, or if the physical token is stolen. This method relies on the user having the token at hand, which may not always be convenient or possible.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะชีวมิติผูกกับลักษณะเฉพาะบุคคลและยากต่อการแบ่งปัน A อาจถูกขโมยหรือแบ่งปัน C ระบุอุปกรณ์หรือจุดเชื่อมต่อมากกว่าตัวบุคคล และ D เป็นปัจจัยที่แข็งแรงแต่โทเคนอาจถูกขโมยหรือส่งต่อได้"},{"number":88,"id":102018301,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Leilani chose Security Assertion Markup Language (SAML) for our federated identity management (FIdM). Which type of Single Sign-On (SSO) is that?","question_th":"SAML ที่ใช้สำหรับ federated identity management จัดเป็น Single Sign-On ประเภทใด","options":[{"en":"Basic SSO","th":"Basic SSO"},{"en":"Federated SSO","th":"Federated SSO"},{"en":"Third-party SSO","th":"Third-Party SSO"},{"en":"Spoke SSO","th":"Spoke SSO"}],"correct":[1],"explanation_en":"The correct answer:\nFederated Single Sign-On (SSO) is the correct answer because it aligns with the concept of federated identity management. In this approach, organizations share a trust relationship and agree on an interoperable standard for exchanging authentication and authorization data. Security Assertion Markup Language (SAML) is one such standard commonly used in federated SSO systems. SAML allows for secure exchange of user authentication data across different networks, making it easier to manage identities across multiple systems or organizations.\n\nThe incorrect answers:\nBasic Single Sign-On (SSO) allows a user to sign in once and gain access to multiple systems without needing to sign in again at each of them. While SAML can be used in Basic SSO, this choice is not the best answer. Basic SSO generally pertains to systems within the same organization, not across federated identities from different organizations. Hence, it does not fully encapsulate the idea of federated identity management that SAML embodies.\nThird-party SSO refers to situations where authentication is delegated to a third-party service, such as Google or Facebook, that many users already have accounts with. While SAML could theoretically be used by a third-party SSO service, its main purpose is not for third-party SSO, but rather for federated SSO across different organizations or systems. Therefore, this option is not the best fit for the question.\nSpoke SSO is a less common term and might be used to describe a hub-and-spoke architecture where one primary (hub) application handles authentication and other (spoke) applications rely on the hub for user authentication information. While SAML could be used in such a setup, it is not specific or inherent to a \"Spoke SSO\" system. Again, the focus of SAML is on facilitating federated identity management, making the \"Federated SSO\" option the most suitable answer.","explanation_th":"คำตอบที่ถูกคือ B เพราะ SAML เชื่อม Identity Provider และ Service Provider ที่อยู่คนละโดเมนความไว้วางใจ ทำให้ผู้ใช้ยืนยันตัวตนครั้งเดียวแล้วใช้บริการภายนอกได้ A ไม่อธิบายการข้ามองค์กร C ไม่ใช่ชื่อประเภทมาตรฐานที่โจทย์ต้องการ และ D ไม่ใช่หมวด SSO ทั่วไป"},{"number":89,"id":102018303,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST common type of IDaaS solution?","question_th":"โซลูชัน IDaaS ประเภทที่พบบ่อยที่สุดคือข้อใดตามแหล่งต้นฉบับ","options":[{"en":"Single sign-on","th":"Single Sign-On"},{"en":"Federated identity management","th":"Federated Identity Management"},{"en":"Identity and access management","th":"Identity and Access Management"},{"en":"Multi-factor authentication","th":"Multi-Factor Authentication"}],"correct":[2],"explanation_en":"The correct answer:\nIdentity and access management (IAM) is the most comprehensive IDaaS solution, as it includes a wide range of identity management and access control capabilities, such as SSO, federated identity management, multi-factor authentication, and more.\n\nThe incorrect answers:\nSingle sign-on (SSO) is a component of IDaaS that allows users to log in once with a single set of credentials and then access multiple applications without having to re-authenticate. It simplifies the login process but is only one aspect of an IDaaS solution.\nFederated identity management enables the sharing of identity and access information across multiple organizations or applications. It allows users to access different systems with the same credentials, which is an important aspect of IDaaS, but not the complete solution itself.\nMulti-factor authentication (MFA) is an added layer of security that requires users to provide two or more forms of identification before granting access. It is an essential security feature within an IDaaS solution but does not constitute the entire solution on its own.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะ IDaaS ให้ความสามารถ IAM จากคลาวด์ เช่น lifecycle, authentication, authorization และ reporting A B และ D เป็นฟังก์ชันที่มักรวมอยู่ในบริการ แต่มีขอบเขตแคบกว่า IAM โดยรวม"},{"number":90,"id":102018305,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the Chief Information Security Officer (CISO) for a defense contracting company, you are implementing an access control system that handles highly classified information. This information is categorized into various domains, such as nuclear submarines, advanced AI, and space exploration, each with a further subset of information. It is crucial to maintain strict controls and adhere to the principle of least privilege. How should you configure the access control system to maintain high confidentiality and granularity of access while ensuring that users only have access to the exact information they require?","question_th":"ระบบควบคุมข้อมูลลับหลายโดเมนต้องการความละเอียดสูงและให้ผู้ใช้เข้าถึงเฉพาะงานของตน ควรกำหนดอย่างไร","options":[{"en":"Assign the same level of clearance to all users who require access to top-secret information.","th":"ให้ clearance ระดับเดียวกันแก่ทุกคนที่ต้องใช้ข้อมูล top secret"},{"en":"Implement a broad classification of information domains and assign users access based on their clearance.","th":"แบ่งข้อมูลเป็นโดเมนกว้างและให้สิทธิ์ตาม clearance เท่านั้น"},{"en":"Assign users clearance and specific labels that match their exact area of work and information they require.","th":"ให้ผู้ใช้มี clearance และ label เฉพาะที่ตรงกับขอบเขตงานและข้อมูลที่ต้องใช้"},{"en":"Implement Discretionary Access Control (DAC), allowing data owners to decide who gets access.","th":"ใช้ DAC ให้เจ้าของข้อมูลตัดสินสิทธิ์"}],"correct":[2],"explanation_en":"The correct answer:\nAssigning users clearance and specific labels that match their exact area of work and information they require follows the principle of least privilege, ensuring that each user has access only to the information necessary for their role. It uses Mandatory Access Control (MAC) principles and provides the highest level of security by combining clearance levels with specific labels tied to the information domains and sub-domains.\n\nThe incorrect answers:\nAssigning the same level of clearance to all users who require access to top-secret information lacks granularity and the principle of least privilege. It could give users access to information that they don't need for their role, increasing the risk of information leakage or misuse.\nImplementing a broad classification of information domains and assign users access based on their clearance is more granular but still lacks the necessary specificity. Broad classifications could still give users access to information that they don't require for their role, compromising the principle of least privilege and increasing the risk.\nDAC, while effective in some scenarios, does not offer the rigorous control necessary for highly classified information. DAC could lead to inconsistencies and potential breaches due to the discretionary decisions made by data owners. This option may not be suitable for an organization that deals with highly sensitive information, where the confidentiality of data is paramount.","explanation_th":"คำตอบที่ถูกคือ C เพราะ MAC ที่ใช้ clearance ร่วมกับ category หรือ compartment labels บังคับทั้งระดับชั้นและ need-to-know ได้ละเอียด A และ B ให้สิทธิ์กว้างเกินไป และ D ให้อำนาจเจ้าของข้อมูลซึ่งไม่เหมาะกับข้อมูลลับสูงที่ต้องใช้นโยบายส่วนกลาง"},{"number":91,"id":102018307,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the HIGHEST level of control in a DAC (Discretionary Access Control) system?","question_th":"ระดับการควบคุมสูงที่สุดในระบบ Discretionary Access Control คือข้อใด","options":[{"en":"Owner-controlled access","th":"เจ้าของทรัพยากรควบคุมการเข้าถึง"},{"en":"Group-controlled access","th":"กลุ่มควบคุมการเข้าถึง"},{"en":"Role-based access","th":"บทบาทควบคุมการเข้าถึง"},{"en":"Public access","th":"เปิดให้สาธารณะเข้าถึง"}],"correct":[0],"explanation_en":"The correct answer:\nIn a discretionary access control (DAC) system, the owner-controlled access is the highest level of control. This means that the owner of the system or resource has the ultimate authority to grant or deny access to specific individuals or groups. This level of control allows the owner to set specific access permissions and restrictions for specific users or groups, based on their roles and responsibilities within the organization.\n\nThe incorrect answers:\nGroup-controlled access is a level of control in a DAC system, but it is not the highest level. This level of control allows a designated group or individual to grant or deny access to specific users or groups based on their membership in a particular group. This level of control is often used to grant access to specific resources or systems based on an individual's role within the organization.\nRole-based access is also a level of control in a DAC system, but it is not the highest level. This level of control allows access to specific resources or systems based on an individual's role within the organization. For example, a user with the role of \"administrator\" would have more access rights than a user with the role of \"employee.\" However, this level of control is not the highest as it is still subject to the owner's discretion.\nPublic access is not a level of control in a discretionary access control (DAC) system. Public access refers to resources or systems that are available to anyone without any restrictions or permissions. Public access does not fall under the category of discretionary access control, as it does not involve granting or denying access based on specific permissions or restrictions.","explanation_th":"คำตอบที่ถูกคือ A เพราะ DAC ให้เจ้าของ object มีอำนาจสูงสุดในการอนุญาตหรือเพิกถอนสิทธิ์ B อาจได้รับสิทธิ์จากเจ้าของ C เป็นแนวคิดของ RBAC และ D เป็นการเปิดสิทธิ์กว้าง ไม่ใช่ระดับควบคุมสูง"},{"number":92,"id":102018309,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following statements is true regarding the difference between access control and identity and access management?","question_th":"ข้อใดกล่าวถูกต้องเกี่ยวกับความแตกต่างระหว่าง access control กับ identity and access management","options":[{"en":"Access control focuses on managing user access to resources, while identity and access management focuses on verifying user identities.","th":"Access control จัดการสิทธิ์เข้าทรัพยากร ส่วน IAM เน้นตรวจสอบตัวตนเท่านั้น"},{"en":"Access control and identity and access management are the same thing.","th":"Access control และ IAM เป็นสิ่งเดียวกัน"},{"en":"Access control is a subset of identity and access management.","th":"Access control เป็นส่วนย่อยของ IAM"},{"en":"Access control focuses on managing user identities, while identity and access management focuses on verifying user access to resources.","th":"Access control จัดการตัวตน ส่วน IAM ตรวจสอบสิทธิ์เข้าทรัพยากร"}],"correct":[2],"explanation_en":"The correct answer:\nAccess control is a subset of identity and access management: Access Control is a component within IAM, it specifically focuses on the authorization part of the process: determining what actions, resources, or areas a user is permitted to access once their identity has been confirmed. This can involve mechanisms such as role-based access control (RBAC), which assigns permissions based on a user's role within the organization, or attribute-based access control (ABAC), which considers multiple attributes, including user's attributes, resource's attributes, environmental conditions, etc.\n\nThe incorrect answers:\nAccess control focuses on managing user access to resources, while identity and access management focuses on verifying user identities: This statement is not accurate because both access control and identity and access management are involved in managing user access to resources. However, the key difference is that identity and access management also includes aspects like identification and authentication, whereas access control is specifically about what a user is allowed to do after their identity has been authenticated. In other words, IAM has a broader scope than just verifying user identities.\nAccess control and identity and access management are the same thing: This statement is incorrect because access control is just one part of identity and access management. While access control focuses on the authorization part (what a user is allowed to do after they have been authenticated), IAM covers the whole process from identification (who the user is), through authentication (proving the user is who they say they are), to authorization (deciding what the user is allowed to do).\nAccess control focuses on managing user identities, while identity and access management focuses on verifying user access to resources: This statement is incorrect because it reverses the roles of access control and IAM. Access control does not focus on managing user identities; rather, it focuses on what actions or resources a user is allowed to access after their identity has been authenticated.
