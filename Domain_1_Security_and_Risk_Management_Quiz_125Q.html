 terming it 'gross negligence' might be too strong without further information on their motives for the decision.","explanation_th":"เมื่อทราบความเสี่ยงแต่ไม่ใช้ความระมัดระวังหรือมาตรการที่สมเหตุสมผล การละเว้นนั้นเป็น negligence ตามคำตอบต้นฉบับ"},{"number":89,"id":102017771,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the HIGHEST level in the COBIT framework?","question_th":"ระดับใดสูงที่สุดในกรอบ COBIT","options":[{"en":"Governance","th":"Governance"},{"en":"Control","th":"Control"},{"en":"Management","th":"Management"},{"en":"Operations","th":"Operations"}],"correct":[0],"explanation_en":"The correct answer: The COBIT framework is structured in a hierarchical manner, with governance being the top level and representing the overall strategic direction, decision-making, and monitoring mechanisms for the organization's information technology. It provides oversight, strategic direction, and accountability mechanisms, and it ensures the alignment of the organization's IT strategy with its broader business strategy. The incorrect answers: Control in the context of the COBIT framework is not a level but a part of management processes. Controls are mechanisms put in place to manage risks, ensure compliance with policies and regulations, and align with strategic objectives. However, they are not a level within the COBIT framework itself. Management, in the context of the COBIT framework, is the execution of governance. It encompasses planning, building, running, and monitoring of activities in alignment with the direction set by the governance body to achieve the enterprise objectives. While it plays a critical role in COBIT, it is subordinate to governance. Operations, in the context of the COBIT framework, typically falls under the management activities that include the day-to-day activities necessary for the running and monitoring of systems. Like management, operations are not a level but a part of the processes within the COBIT framework and are subordinate to both management and governance levels.","explanation_th":"Governance กำหนดทิศทาง ประเมินความต้องการผู้มีส่วนได้ส่วนเสีย และติดตามผล ส่วน management วางแผน สร้าง ดำเนินการ และติดตามตามทิศทางดังกล่าว"},{"number":90,"id":102017773,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Who is responsible for the financial day-to-day leadership of our organization?","question_th":"ใครรับผิดชอบการนำด้านการเงินประจำวันขององค์กร","options":[{"en":"The CEO","th":"CEO"},{"en":"The CFO","th":"CFO"},{"en":"The CIO","th":"CIO"},{"en":"The CTO","th":"CTO"}],"correct":[1],"explanation_en":"The correct answer: The Chief Financial Officer (CFO) is typically responsible for the financial day-to-day leadership of an organization. This role includes overseeing all financial operations, such as accounting, budgeting, and financial planning. They are also in charge of analyzing the company's financial strengths and weaknesses and proposing corrective actions. CFOs often play a key role in company strategy and may participate in investment decisions, capital structuring, and risk management. In essence, they have a broad perspective on the organization's financial health and are instrumental in making strategic financial decisions. The incorrect answers: The Chief Executive Officer (CEO) is incorrect because, although they are the highest-ranking individual in the company and responsible for making major corporate decisions, their role is more strategic and overall in nature. While they may guide the financial direction of the company at a high level, the day-to-day financial leadership and decision-making typically falls to the CFO. It's also worth noting that the CEO is often more outward-facing, dealing with public relations and serving as the company's main point of contact for investors and the media. The Chief Information Officer (CIO) is incorrect because their role is primarily focused on the company's information technology (IT) strategy and the management of its IT resources. While they may have some involvement in financial matters related to IT budgeting and investment, they are not typically involved in the broader financial management of the company. Their main responsibilities include managing the company's technology operations and the implementation of new IT systems and policies. The Chief Technology Officer (CTO) is incorrect because they are typically in charge of managing the company's technology and engineering department, not its finances. They are responsible for making decisions about the technological direction of the company, which can include researching new technologies, overseeing the development of new products, and ensuring the company's tech strategy aligns with its business goals. While they may manage a budget within their department, they do not have overarching responsibility for the financial leadership of the organization.","explanation_th":"Chief Financial Officer ดูแลการวางแผน การบัญชี งบประมาณ กระแสเงินสด การรายงาน และการบริหารการเงินประจำวัน"},{"number":91,"id":102017775,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the LEAST important aspect of an Information Security Management System (ISMS)?","question_th":"ข้อใดสำคัญน้อยที่สุดในระบบบริหารความมั่นคงปลอดภัยสารสนเทศ (ISMS) ตามคำตอบต้นฉบับ","options":[{"en":"Policies and procedures","th":"นโยบายและขั้นตอน"},{"en":"Risk assessment and management","th":"การประเมินและบริหารความเสี่ยง"},{"en":"Access control","th":"การควบคุมการเข้าถึง"},{"en":"Employee training","th":"การฝึกอบรมพนักงาน"}],"correct":[3],"explanation_en":"The correct answer: While employee training is an important aspect of an Information Security Management System (ISMS), it is not as crucial as the other options in terms of overall effectiveness of the system. Policies and procedures, risk assessment and management, and access control are all crucial components of an ISMS and should be prioritized over employee training. The incorrect answers: Policies and procedures are a crucial aspect of an ISMS, as they outline the guidelines and rules for information security in the organization. Without clear policies and procedures, it is difficult to effectively manage and protect sensitive information. Risk assessment and management are essential to an ISMS, as they help identify potential threats and vulnerabilities and implement controls to mitigate those risks. Without proper risk assessment and management, an ISMS is not able to effectively protect against potential security incidents. Access control is a critical component of an ISMS, as it ensures that only authorized individuals have access to sensitive information. Without proper access control measures, an organization is at risk of unauthorized access to sensitive data.","explanation_th":"ต้นฉบับจัด employee training เป็นตัวเลือกที่สำคัญน้อยกว่าองค์ประกอบแกนกลาง ได้แก่ policies, risk management และ access control แม้ในทางปฏิบัติการฝึกอบรมยังจำเป็น"},{"number":92,"id":102017777,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the MOST important principle of the ISO 31004 standard?","question_th":"หลักการสำคัญที่สุดของมาตรฐาน ISO 31004 คือข้อใด","options":[{"en":"Access control","th":"การควบคุมการเข้าถึง"},{"en":"Information security management","th":"การบริหารความมั่นคงปลอดภัยสารสนเทศ"},{"en":"Risk management","th":"การบริหารความเสี่ยง"},{"en":"Business continuity","th":"ความต่อเนื่องทางธุรกิจ"}],"correct":[2],"explanation_en":"The correct answer: The ISO 31004 standard provides guidelines on implementing risk management processes and protocols. This is the most important principle of this standard, as it is designed specifically to assist organizations in managing risk effectively. It details how to integrate risk management into a company's decision-making process, the elements of a risk management framework, how to evaluate the effectiveness of risk management, and how to continually improve risk management. The incorrect answers: Information Security Management: While information security management is a critical aspect of any organization, it's not the primary focus of ISO 31004. Information security management typically relates to the processes and methodologies used to protect electronic and digital information from unauthorized access, use, disclosure, disruption, modification, or destruction. The ISO 27000 series, particularly ISO 27001, specifically covers this area, not ISO 31004. Business Continuity: Business continuity is an important principle for any business. It involves the processes and procedures an organization puts in place to ensure that essential functions can continue during and after a disaster. Although risk management, including ISO 31004, can contribute to business continuity planning by helping identify and mitigate risks that could disrupt business operations, the specific standards for business continuity are the ISO 22301 series. Access Control: Access control is a key part of information security, dealing with the selective restriction of access to a place or resource. The goal of access control is to provide control over the facilities, which essentially helps in minimizing risk. It is usually implemented in the context of information systems and technology. This principle is part of the ISO 27000 series, specifically ISO 27001 and not ISO 31004.","explanation_th":"ISO 31004 ให้แนวทางในการนำหลักการและกรอบการบริหารความเสี่ยงไปใช้ บูรณาการกับการตัดสินใจ และปรับปรุงประสิทธิผลของ risk management"},{"number":93,"id":102017779,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the MOST significant aspect of ISO 15489-1","question_th":"สาระสำคัญที่สุดของ ISO 15489-1 คืออะไร","options":[{"en":"It specifies requirements for records management systems.","th":"ระบุข้อกำหนดสำหรับระบบบริหารจัดการบันทึก"},{"en":"It outlines best practices for information security management.","th":"ให้แนวปฏิบัติด้าน ISMS"},{"en":"It provides guidelines for the protection of personal data.","th":"ให้แนวทางคุ้มครองข้อมูลส่วนบุคคล"},{"en":"It defines standards for the preservation of historical records.","th":"กำหนดมาตรฐานอนุรักษ์บันทึกประวัติศาสตร์"}],"correct":[0],"explanation_en":"The correct answer: ISO 15489-1 relates to the field of records management. Specifically, this standard provides a high-level framework for creating, capturing, and managing records. It outlines the principles for records management, its objectives, and the factors that organizations should consider to ensure effective records management. As such, its primary focus is on specifying the requirements for records management systems. The incorrect answers: It outlines best practices for information security management: This description relates more to ISO/IEC 27001, which provides the criteria for an information security management system (ISMS). ISO 15489-1 doesn't delve deeply into information security management best practices. It provides guidelines for the protection of personal data: ISO 15489-1 might touch upon the importance of maintaining the integrity and confidentiality of records, detailed guidelines on the protection of personal data would fall under standards related to data protection, such as the GDPR or even ISO/IEC 27701, which relates to privacy information management. It defines standards for the preservation of historical records: Although ISO 15489-1 provides principles for the proper management and retention of records, it doesn't specifically focus on the preservation of historical records. Instead, its primary purpose is to ensure organizations have a framework for managing all their records, regardless of historical significance.","explanation_th":"ISO 15489-1 ว่าด้วยหลักการสร้าง รับ เก็บ ใช้ และควบคุม records อย่างเป็นระบบตลอดวงจรชีวิต จึงเกี่ยวข้องกับ records management"},{"number":94,"id":102017781,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following security policies is NOT appropriate for a small business?","question_th":"นโยบายความปลอดภัยข้อใดไม่เหมาะสมที่สุดสำหรับธุรกิจขนาดเล็กตามโจทย์","options":[{"en":"Access control policy","th":"นโยบายควบคุมการเข้าถึง"},{"en":"Incident response policy","th":"นโยบายตอบสนองเหตุการณ์"},{"en":"Data retention policy","th":"นโยบายเก็บรักษาข้อมูล"},{"en":"Employee monitoring policy","th":"นโยบายเฝ้าติดตามพนักงาน"}],"correct":[3],"explanation_en":"The correct answer: A small business may not have the resources or need for employee monitoring, as it can be seen as intrusive and may violate employee privacy. Access control, incident response, and data retention policies are all important for any business, regardless of size. The incorrect answers: Access control is crucial for any business, as it ensures that only authorized individuals have access to sensitive data and systems. An incident response policy outlines the steps to take in the event of a security breach or other emergency situation, which is important for all businesses to have in place. Data retention policies outline how long certain data must be kept and how it should be disposed of, which is important for all businesses to have in place to comply with regulations and protect sensitive information.","explanation_th":"ต้นฉบับมองว่า employee monitoring อาจเกินความจำเป็น ใช้ทรัพยากรสูง และกระทบความเป็นส่วนตัวมากกว่านโยบายพื้นฐานอื่นสำหรับธุรกิจเล็ก"},{"number":95,"id":102017783,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"As the head of the cybersecurity department, you are in charge of assessing the current security program and making recommendations for improvement. What is a key component of an effective security program?","question_th":"องค์ประกอบสำคัญของโครงการความมั่นคงปลอดภัยที่มีประสิทธิผลคืออะไร","options":[{"en":"Regularly performing risk assessments","th":"ประเมินความเสี่ยงเป็นประจำ"},{"en":"Ensuring all employees are trained in cybersecurity","th":"ฝึกอบรมพนักงานทุกคน"},{"en":"Maintaining an inventory of all assets","th":"จัดทำ inventory สินทรัพย์ทั้งหมด"},{"en":"Implementing firewalls on all network devices","th":"ติดตั้งไฟร์วอลล์ทุกอุปกรณ์เครือข่าย"}],"correct":[0],"explanation_en":"The correct answer: An effective security program should include regular risk assessments as a key component. Risk assessments involve identifying, evaluating, and prioritizing risks that could potentially harm an organization's operations and assets. This helps an organization understand its vulnerabilities, threat landscape, and the potential impact of those threats. It allows them to make informed decisions about where to allocate resources to manage risks effectively, contributing to the overall resilience of the organization. The incorrect answers: While training employees in cybersecurity is a crucial part of a company's security strategy, it's not the only key component. An effective security program should include a comprehensive range of measures, including risk assessments, incident response plans, access control measures, data protection policies, and more. Employee training is a piece of the puzzle but is not by itself sufficient. Asset management is an important part of a security program, as it allows a company to know what it needs to protect. However, simply having an inventory of assets doesn't constitute a key component of a security program if those assets are not adequately protected. This option is a part of a bigger process but on its own, it is not the most effective measure. While firewalls are a crucial element of network security, an effective security program should not solely rely on them. A comprehensive security program should also consider other aspects of security, such as user access controls, intrusion detection systems, data encryption, and more. Firewalls, while important, form part of a broader security infrastructure and strategy.","explanation_th":"การประเมินความเสี่ยงเป็นกระบวนการต่อเนื่องที่ช่วยระบุการเปลี่ยนแปลงของภัย ช่องโหว่ และผลกระทบ แล้วปรับลำดับและมาตรการให้เหมาะสม"},{"number":96,"id":102017785,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"We are in a court where the proof must be \"more likely than not.\" Which court are we in?","question_th":"ศาลประเภทใดใช้มาตรฐานพิสูจน์ว่า ‘มีแนวโน้มเป็นจริงมากกว่าไม่จริง’","options":[{"en":"Civil court","th":"ศาลแพ่ง"},{"en":"Criminal court","th":"ศาลอาญา"},{"en":"Probate court","th":"ศาลมรดก"},{"en":"Small claims court","th":"ศาลคดีมโนสาเร่"}],"correct":[0],"explanation_en":"The correct answer: In a civil court, the standard of proof is typically \"preponderance of the evidence\", which essentially means \"more likely than not\". This is different from the \"beyond a reasonable doubt\" standard used in criminal cases. The standard of proof \"more likely than not\" implies that it's more than 50% likely that the claim is true. The evidence presented must be compelling enough to persuade the judge or jury that the facts being asserted by the claimant are indeed more probable than not. The incorrect answers: In a criminal court, the burden of proof is \"beyond a reasonable doubt\", which is a much higher standard than \"more likely than not\". This is because of the serious implications of criminal charges, which can include imprisonment and other severe penalties. The prosecution must convince the judge or jury that there is no reasonable doubt in the mind of a reasonable person that the defendant is guilty. While probate courts do operate under the civil law system, their purpose is more specific: they deal with matters of estate administration, wills, and disputes over an individual's property after death. While the standard of proof in probate court can be \"preponderance of the evidence\" or \"clear and convincing evidence\" depending on the jurisdiction and the issue at hand, it's more accurate to say we are in a civil court when the standard is \"more likely than not\", since probate court is a specific type of civil court and not all probate issues rely on this standard of proof. Small claims courts are a subtype of civil courts designed to handle minor disputes quickly and without the need for expensive legal representation. While the \"preponderance of the evidence\" standard does apply in small claims court, it's more precise to answer \"civil court\" when the standard is \"more likely than not\". Similar to probate court, small claims court is a subset of civil court, and choosing it as the answer would be less comprehensive than \"civil court\".","explanation_th":"คดีแพ่งมักใช้มาตรฐาน preponderance of the evidence หรือ more likely than not ส่วนคดีอาญาใช้ beyond a reasonable doubt ที่เข้มกว่า"},{"number":97,"id":102017787,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the primary goal of implementing security measures on a network?","question_th":"เป้าหมายหลักของการใช้มาตรการความปลอดภัยบนเครือข่ายคืออะไร","options":[{"en":"To protect against external threats","th":"ป้องกันภัยคุกคามจากภายนอก"},{"en":"To ensure compliance with industry regulations","th":"ทำให้เป็นไปตามกฎอุตสาหกรรม"},{"en":"To improve the efficiency of the network","th":"เพิ่มประสิทธิภาพเครือข่าย"},{"en":"To reduce the number of IT staff required","th":"ลดจำนวนพนักงาน IT"}],"correct":[0],"explanation_en":"The correct answer: The primary goal of implementing security measures on a network is to protect against external threats, such as hackers, viruses, and malware. These threats can compromise the confidentiality, integrity, and availability of the network and its data, leading to significant damage and disruption. By implementing appropriate security measures, such as firewalls, intrusion detection systems, and antivirus software, organizations can minimize the risk of external threats and maintain the security and reliability of their networks. The incorrect answers: While compliance with industry regulations is an important consideration for many organizations, it is not the primary goal of implementing security measures on a network. While compliance with regulations such as HIPAA, PCI DSS, and GDPR may require organizations to implement certain security measures, the primary goal of these measures is to protect against external threats and ensure the security and reliability of the network. Security measures do not directly improve the efficiency of a network. They protect the network from threats that could disrupt its operation, but they do not inherently make the network run more smoothly or quickly. Security measures may have some indirect effects on the staffing requirements of an organization, such as reducing the need for IT staff to respond to security breaches, this is not the primary goal of implementing security measures.","explanation_th":"ตามตัวเลือกและคำตอบต้นฉบับ มาตรการเครือข่ายมีเป้าหมายหลักเพื่อป้องกันการเข้าถึงและการโจมตีจากภายนอก แม้ควรครอบคลุมภัยภายในด้วยในทางปฏิบัติ"},{"number":98,"id":102017789,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"If we want to implement a governance standard and control framework focused on IT service management, which of these should we implement?","question_th":"กรอบธรรมาภิบาลและการควบคุมใดมุ่งเน้นการบริหารบริการ IT","options":[{"en":"COBIT","th":"COBIT"},{"en":"ITIL","th":"ITIL"},{"en":"NIST","th":"NIST"},{"en":"ISO 27001","th":"ISO 27001"}],"correct":[1],"explanation_en":"The correct answer: The Information Technology Infrastructure Library (ITIL) is the correct answer because it is specifically designed as a set of best practices and guidelines for IT service management. ITIL provides a comprehensive framework for managing IT services, from inception and design, through to operation and continual improvement. It enables organizations to align their IT services with business needs, improves service delivery and customer satisfaction, reduces costs through improved utilization of resources, and supports business change while maintaining a stable service environment. The incorrect answers: COBIT (Control Objectives for Information and Related Technologies) is a framework created by ISACA for IT governance and management. While it does address IT services to some extent, its primary focus is on establishing controls and meeting business governance objectives. It provides guidance to ensure that IT is aligned with business goals, that IT resources are used responsibly, and that risks are managed effectively. Therefore, while COBIT is very useful for establishing a governance framework, it is not as focused on IT service management as ITIL. The National Institute of Standards and Technology (NIST) develops and promotes a wide range of standards, including for cybersecurity, but it does not provide a specific framework for IT service management. The NIST Cybersecurity Framework is a widely recognized set of guidelines and best practices to manage cybersecurity risks, but it doesn't cover the full spectrum of IT service management activities that ITIL does. ISO 27001 is an international standard for information security management. It lays out requirements for establishing, implementing, maintaining, and continually improving an information security management system (ISMS) within the context of an organization. It also includes requirements for the assessment and treatment of information security risks. However, like NIST, it does not provide a specific framework for IT service management.","explanation_th":"ITIL เป็นชุดแนวปฏิบัติสำหรับ IT Service Management ครอบคลุมการออกแบบ ส่งมอบ สนับสนุน และปรับปรุงบริการ IT"},{"number":99,"id":102017791,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the term for a security model that focuses on a single point of control for all security functions and policies?","question_th":"โมเดลความปลอดภัยที่มีจุดควบคุมเดียวสำหรับหน้าที่และนโยบายความปลอดภัยทั้งหมดเรียกว่าอะไร","options":[{"en":"Decentralized security","th":"ความปลอดภัยแบบกระจายศูนย์"},{"en":"Federated security","th":"ความปลอดภัยแบบสหพันธรัฐ"},{"en":"Centralized security","th":"ความปลอดภัยแบบรวมศูนย์"},{"en":"Peripheral security","th":"ความปลอดภัยรอบนอก"}],"correct":[2],"explanation_en":"The correct answer: A centralized security model focuses on a single point of control for all security functions and policies. This approach allows for a unified and consistent application of security policies across an organization, and it often simplifies management tasks such as monitoring, incident response, and policy enforcement. Centralized security is typically associated with more straightforward administration, better visibility into security events, and a more consistent application of security controls. The incorrect answers: Decentralized security entails various security controls and policies being managed independently across different parts of an organization. While this model can offer more localized control and potentially faster response times in certain scenarios, it does not provide the single point of control described in the question. Federated security generally refers to a model where separate organizations agree on standards for mutual recognition of authentication, authorization, and other security controls. Federated security is often used in situations where users from different organizations need to access shared resources, but it doesn't pertain to a single point of control for all security functions and policies within one organization. Peripheral security isn't commonly used in the context of information security. When used, it might refer to the security of peripheral devices (like printers or external hard drives) or security measures at the \"periphery\" of a network (like firewalls). However, it doesn't align with the concept of a single point of control for all security functions and policies.","explanation_th":"Centralized security รวมการตัดสินใจ นโยบาย การกำหนดค่า และการกำกับไว้ที่ศูนย์กลาง ทำให้ควบคุมสม่ำเสมอแต่ต้องจัดการจุดล้มเหลวหรือคอขวด"},{"number":100,"id":102017793,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following statements is the MOST accurate definition of information security?","question_th":"ข้อใดเป็นคำนิยาม information security ที่ถูกต้องที่สุด","options":[{"en":"Information security is the practice of protecting information from unauthorized access, use, disclosure, disruption, modification, or destruction.","th":"การปกป้องข้อมูลจากการเข้าถึง ใช้ เปิดเผย รบกวน แก้ไข หรือทำลายโดยไม่ได้รับอนุญาต"},{"en":"Information security is the process of securing computer systems and networks from unauthorized access, attacks, and damage.","th":"การป้องกันระบบและเครือข่ายจากการเข้าถึง การโจมตี และความเสียหาย"},{"en":"Information security is the practice of protecting information from accidental or intentional destruction.","th":"การป้องกันข้อมูลจากการทำลายโดยอุบัติเหตุหรือเจตนา"},{"en":"Information security is the process of protecting information from being stolen or leaked to unauthorized individuals or organizations.","th":"การป้องกันข้อมูลถูกขโมยหรือรั่วให้บุคคลที่ไม่ได้รับอนุญาต"}],"correct":[0],"explanation_en":"The correct answer: Information security is the practice of protecting information from unauthorized access, use, disclosure, disruption, modification, or destruction: This definition encompasses all aspects of information security, from unauthorized access and use to potential disruptions and intentional modifications or destruction. The incorrect answers: Information security is the process of securing computer systems and networks from unauthorized access, attacks, and damage: While this definition touches on securing systems and networks, it doesn't cover all aspects of information security like protecting the information from unauthorized use, disclosure, and other potential threats. Information security is the practice of protecting information from accidental or intentional destruction: This definition is too narrow, focusing only on the destruction of information. It doesn't address unauthorized access, use, or other potential security breaches. Information security is the process of protecting information from being stolen or leaked to unauthorized individuals or organizations: While this focuses on unauthorized access or leakage, it doesn't encompass all the potential threats to information, such as disruption or modification.","explanation_th":"คำนิยามที่ครอบคลุมที่สุดรวมภัยต่อการเข้าถึง การใช้ การเปิดเผย การรบกวน การแก้ไข และการทำลาย จึงครอบคลุม Confidentiality, Integrity และ Availability"},{"number":101,"id":102017795,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which security principle is Clark-Wilson based on?","question_th":"โมเดล Clark-Wilson อิงหลักความมั่นคงปลอดภัยใด","options":[{"en":"Confidentiality","th":"Confidentiality"},{"en":"Integrity","th":"Integrity"},{"en":"Availability","th":"Availability"},{"en":"None of these","th":"ไม่ใช่ข้อใดเลย"}],"correct":[1],"explanation_en":"The correct answer: Integrity: The Clark-Wilson security model primarily focuses on the principle of integrity. It is a widely acknowledged model for ensuring data integrity within a system. The model achieves this by enforcing well-formed transaction and separation of duties principles. A well-formed transaction concept is similar to the atomicity principle in databases, ensuring that a system transitions from one consistent state to another. Separation of duties, on the other hand, is a principle that aims to prevent fraud and error by dividing critical tasks among multiple individuals. The Clark-Wilson model uses these principles to maintain and assure the integrity of data within a system. The incorrect answers: Confidentiality: Although confidentiality is a vital security principle, it is not the primary focus of the Clark-Wilson security model. Confidentiality involves protecting information from unauthorized access and disclosure. While Clark-Wilson may indirectly contribute to confidentiality through its integrity mechanisms, its main purpose is not ensuring confidentiality but rather ensuring the accuracy and reliability of data. Availability: This principle pertains to ensuring that data or a system is available for use when needed. Although important in any system security plan, the Clark-Wilson model does not focus primarily on the availability principle. Its main concern is maintaining data integrity, not guaranteeing system availability. None of these: This choice would be correct if none of the previous options represented the primary principle that the Clark-Wilson model is based on. However, as stated above, the Clark-Wilson model is primarily concerned with data integrity, making this choice incorrect.","explanation_th":"Clark-Wilson มุ่งรักษา Integrity ด้วย well-formed transactions, separation of duties และการเปลี่ยนแปลงข้อมูลผ่านโปรแกรมที่ได้รับอนุญาต"},{"number":102,"id":102017797,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following best describes the EU-US Privacy Shield?","question_th":"ข้อใดอธิบาย EU-US Privacy Shield ได้ดีที่สุดตามเนื้อหาต้นฉบับ","options":[{"en":"A framework for international data transfers between the US and the EU","th":"กรอบสำหรับการโอนข้อมูลระหว่างประเทศจาก EU ไปยังสหรัฐฯ"},{"en":"A framework for protecting personal data of US citizens from foreign entities","th":"กรอบคุ้มครองข้อมูลพลเมืองสหรัฐฯ จากหน่วยงานต่างประเทศ"},{"en":"A framework for regulating the use of cookies on websites","th":"กรอบกำกับการใช้คุกกี้บนเว็บไซต์"},{"en":"A framework for protecting personal data of EU citizens from US entities","th":"กรอบคุ้มครองข้อมูลพลเมือง EU จากทุกหน่วยงานสหรัฐฯ"}],"correct":[0],"explanation_en":"The correct answer: The EU-US Privacy Shield is a framework established by the European Commission and the US Department of Commerce to provide a legal mechanism for the transfer of personal data between the European Union and the United States. It sets out requirements for companies to protect the personal data of EU citizens when it is transferred to the US, and allows for the free flow of data across the Atlantic while ensuring an adequate level of protection for personal data.. The incorrect answers: A framework for protecting personal data of US citizens from foreign entities is incorrect because the EU-US Privacy Shield is specifically focused on the transfer of personal data between the EU and the US. It does not have provisions for protecting the personal data of US citizens from foreign entities, as that is not the scope of the framework. A framework for regulating the use of cookies on websites is incorrect because the EU-US Privacy Shield does not address the use of cookies on websites. While cookies may collect personal data, the EU-US Privacy Shield is focused on the transfer of personal data between the EU and the US, and not the specific use of cookies on websites. A framework for protecting personal data of EU citizens from US entities is partially correct as the EU-US Privacy Shield is focused on the transfer of personal data between the EU and the US and sets out requirements for companies to protect the personal data of EU citizens when it is transferred to the US. However, the EU-US Privacy Shield does not only protect the personal data of EU citizens from US entities but also allows for the free flow of data across the Atlantic while ensuring an adequate level of protection for personal data.","explanation_th":"Privacy Shield ถูกออกแบบเป็นกลไกสำหรับการถ่ายโอนข้อมูลส่วนบุคคลระหว่างสหภาพยุโรปและสหรัฐฯ โดยกำหนดข้อผูกพันด้านความเป็นส่วนตัวสำหรับองค์กรที่เข้าร่วมตามบริบทของต้นฉบับ"},{"number":103,"id":102017799,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which is the MOST effective way of transferring risk in a business?","question_th":"วิธีใดมีประสิทธิผลมากที่สุดในการโอนความเสี่ยงทางธุรกิจ","options":[{"en":"Purchasing insurance","th":"ซื้อประกันภัย"},{"en":"Implementing security controls","th":"ติดตั้งมาตรการควบคุมความปลอดภัย"},{"en":"Outsourcing to a third party","th":"จ้างบุคคลที่สามดำเนินงาน"},{"en":"Ignoring the risk","th":"เพิกเฉยต่อความเสี่ยง"}],"correct":[0],"explanation_en":"The correct answer: Purchasing insurance is the most effective way of transferring risk in a business. Insurance is a risk transfer mechanism where, for a predetermined premium, an insurance company agrees to indemnify the insured party for any loss suffered due to insured risks. This means that if the specified risk event happens (like property damage due to fire or theft, liability claims, etc.), the insurance company would compensate the insured party for the financial loss, thereby effectively transferring the risk from the business to the insurance company. Insurance can cover a wide variety of risks that businesses face, from physical damage to lawsuits. The incorrect answers: Implementing security controls does not transfer risk; rather, it mitigates or reduces risk. Security controls are measures taken to safeguard an organization's assets, including its information and technology. These measures include firewalls, intrusion detection systems, physical access controls, and policies and procedures. While these controls can significantly reduce the likelihood or impact of a risk, they do not eliminate it completely or transfer it elsewhere. If a breach or failure still occurs, the business remains responsible for the loss or damage. Outsourcing to a third party can be an effective way to manage certain types of risk, especially operational risks tied to specific functions or tasks. However, it is not a means of transferring risk entirely. In fact, it can introduce new risks, such as the risk of the third-party failing to deliver, confidentiality breaches, or reputational damage due to the third-party's actions. It's also important to note that, legally, some responsibilities and liabilities cannot be transferred or outsourced and remain with the business, such as compliance with data protection regulations. Ignoring the risk is not a method of handling risk at all and is the least effective option. In fact, it can have disastrous consequences. Ignoring risks implies that no action is taken to identify, evaluate, control, or monitor potential threats to the business. This exposes the business to unnecessary vulnerabilities and can result in unexpected losses or damages. This approach is not recommended under any circumstance, as proactive risk management is critical for the sustainability and success of a business.","explanation_th":"การประกันภัยโอนภาระทางการเงินของความสูญเสียบางประเภทไปยังบริษัทประกันตามเงื่อนไขกรมธรรม์ แม้ความรับผิดชอบและความเสี่ยงบางส่วนยังคงอยู่กับองค์กร"},{"number":104,"id":102017801,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Our senior management wants to collect more Personal Identifiable Information (PII) from our customers in order to be able to sell more products to them. Which of these should be the MOST important when we decide how much PII (Personally Identifiable Information) we collect?","question_th":"ผู้บริหารต้องการเก็บ PII ลูกค้าเพิ่มเพื่อขายสินค้าได้มากขึ้น ปัจจัยใดสำคัญที่สุดในการกำหนดปริมาณข้อมูลที่ควรเก็บ","options":[{"en":"The amount of data we need for our project","th":"ปริมาณข้อมูลที่โครงการต้องใช้"},{"en":"The laws and regulations that apply to the data","th":"กฎหมายและข้อบังคับที่ใช้กับข้อมูล"},{"en":"The potential value of the data to malicious actors","th":"มูลค่าข้อมูลต่อผู้ไม่หวังดี"},{"en":"The convenience for the user","th":"ความสะดวกของผู้ใช้"}],"correct":[1],"explanation_en":"The correct answer: The laws and regulations that apply to the data: The collection, use, and storage of Personal Identifiable Information (PII) is highly regulated. Different jurisdictions may have differing rules for what constitutes PII and how it can be collected, stored, used, and shared. Notably, regulations like the General Data Protection Regulation (GDPR) in the European Union and the California Consumer Privacy Act (CCPA) in the United States provide strict guidelines about consent, transparency, data minimization, and purpose limitation. Companies must ensure compliance with these laws to avoid heavy fines and potential damage to their reputation. Therefore, when deciding how much PII to collect, the most important consideration should be the laws and regulations that apply to the data. The incorrect answers: The amount of data we need for our project: While it might be tempting to gather as much data as possible for a project or business need, this should not be the primary consideration when collecting PII. Not only is this approach not always legal depending on jurisdiction and consent received, but it can also lead to unnecessary risks, such as the potential for a data breach. The principle of data minimization, which is part of many data protection regulations, dictates that only the necessary amount of data for a specific purpose should be collected. The potential value of the data to malicious actors: While understanding the potential value of the data to malicious actors is an important consideration for data security measures, it should not be the primary factor in deciding how much PII to collect. If we start with the presumption that we should not collect data that could be valuable if breached, we might end up collecting no data at all, as virtually all PII has some value to malicious actors. Instead, we should focus on collecting data legally and protecting it appropriately. The convenience for the user: User convenience is an important aspect of designing a good user experience, but it should not be the primary consideration when deciding how much PII to collect. While a seamless and convenient user experience often requires some amount of data collection, it's critical to balance this with privacy considerations and legal compliance. Moreover, in some cases, users may actually prefer less data collection as a means of protecting their privacy. Hence, while this is an important factor to consider, it's not the most important in this context.","explanation_th":"องค์กรต้องปฏิบัติตามฐานกฎหมาย วัตถุประสงค์ การเก็บเท่าที่จำเป็น และข้อจำกัดการใช้ข้อมูลก่อนความต้องการทางการตลาดหรือความสะดวก"},{"number":105,"id":102017803,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following acts is the BEST at protecting sensitive information in a computer system?","question_th":"กฎหมายใดเหมาะที่สุดในการคุ้มครองข้อมูลอ่อนไหวในระบบคอมพิวเตอร์ตามตัวเลือก","options":[{"en":"The Computer Fraud and Abuse Act","th":"Computer Fraud and Abuse Act"},{"en":"The Health Insurance Portability and Accountability Act","th":"Health Insurance Portability and Accountability Act"},{"en":"The Computer Security Act","th":"Computer Security Act"},{"en":"The Children's Online Privacy Protection Act","th":"Children's Online Privacy Protection Act"}],"correct":[2],"explanation_en":"The correct answer: The Computer Security Act, enacted in 1987, is specifically designed to protect sensitive information in federal computer systems by establishing standards and procedures for the protection of that information. The Act made it a requirement for federal systems that contained sensitive information to have proper security protocols in place, helping establish standards and guidelines for security practices. It helped bring about the creation of meaningful security controls and prompted federal systems to prioritize cybersecurity. The incorrect answers: The Computer Fraud and Abuse Act provides protections against unauthorized access but it is primarily an anti-hacking law and does not deal directly with the protection of sensitive information once that data is inside a system. Its primary focus is to prevent unauthorized access and fraudulent activities on computer systems. The Health Insurance Portability and Accountability Act, or HIPAA, does indeed have stringent requirements for protecting sensitive health data, it is specific to health-related information. Therefore, while it's an excellent law for protecting sensitive health information, it's not necessarily the best law for protecting sensitive information more broadly. The Children's Online Privacy Protection Act is focused on protecting the privacy of children online. It does not deal directly with the broader category of sensitive information protection, making it less comprehensive compared to the Computer Security Act for this particular question.","explanation_th":"ตามคำตอบต้นฉบับ Computer Security Act มุ่งยกระดับการรักษาความปลอดภัยข้อมูลและระบบคอมพิวเตอร์ที่มีข้อมูลอ่อนไหว โดยกฎหมายอื่นมีขอบเขตเฉพาะด้านมากกว่า"},{"number":106,"id":102017805,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the FASTEST way to implement a new security policy within an organization?","question_th":"วิธีใดเร็วที่สุดในการนำนโยบายความมั่นคงปลอดภัยใหม่ไปใช้ในองค์กร","options":[{"en":"Conducting a thorough risk assessment and implementing controls based on the findings","th":"ประเมินความเสี่ยงอย่างละเอียดแล้วติดตั้ง controls"},{"en":"Implementing the new policy immediately without any prior testing or evaluation","th":"บังคับใช้นโยบายใหม่ทันทีโดยไม่ทดสอบหรือประเมินก่อน"},{"en":"Consulting with the company's legal team to ensure the policy complies with all relevant laws and regulations","th":"ปรึกษาฝ่ายกฎหมายให้ตรวจ compliance"},{"en":"Rolling out the new policy in phases, starting with a small group of employees and gradually expanding it to the entire organization","th":"ทยอยใช้เป็นระยะจากกลุ่มเล็กไปทั่วองค์กร"}],"correct":[1],"explanation_en":"The correct answer: From a pure time perspective, implementing the new policy immediately without any prior testing or evaluation would be the fastest way to implement a new security policy within an organization. However, this method is highly risky and not recommended. It could lead to unforeseen consequences, including potential conflicts with existing policies, adverse effects on business operations, and potential legal or regulatory non-compliance. It's usually better to take the time to properly assess, test, and gradually implement a new policy to ensure it's effective and doesn't negatively impact the organization. The incorrect answers: Conducting a thorough risk assessment is a key part of any policy implementation, but it is not the fastest method. A risk assessment involves identifying potential threats, assessing vulnerabilities, and evaluating the potential impact of those risks on the organization. This process requires time and resources to ensure it is done correctly. While it's a crucial step in the implementation process, it does delay the implementation of the policy itself. Consulting with the company's legal team is another important step when implementing a new security policy. This is also not the fastest method. Legal reviews can be time-consuming as they involve a thorough examination of the policy to ensure it aligns with all relevant laws and regulations. As with risk assessments, legal reviews are important and should not be skipped, but they do add time to the policy implementation process. Phased rollout is a common method used to implement new policies within an organization. Starting with a small group allows for testing and fine-tuning before the policy is applied to the entire organization. While this method is beneficial for identifying potential issues and ensuring a smoother transition, it is not the fastest method for policy implementation. It involves a careful and methodical process that can take weeks or even months, depending on the size and complexity of the organization.","explanation_th":"การใช้ทันทีโดยไม่ทดสอบเป็นวิธีที่เร็วที่สุดตามคำถาม แต่ไม่ใช่วิธีที่ปลอดภัยหรือเหมาะสมที่สุด เพราะอาจเกิดผลกระทบที่ไม่คาดคิดและปัญหา compliance"},{"number":107,"id":102017807,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the PRIMARY difference between governance and management in terms of information security?","question_th":"ความแตกต่างหลักระหว่าง governance และ management ด้านความมั่นคงปลอดภัยสารสนเทศคืออะไร","options":[{"en":"Governance focuses on implementing security controls, while management focuses on monitoring and evaluating them.","th":"Governance ติดตั้ง controls ส่วน management ติดตามและประเมิน"},{"en":"Governance focuses on strategic decision-making, while management focuses on tactical execution.","th":"Governance เน้นการตัดสินใจเชิงกลยุทธ์ ส่วน management เน้นการดำเนินงานเชิงยุทธวิธี"},{"en":"Governance focuses on compliance and regulatory requirements, while management focuses on risk management.","th":"Governance เน้น compliance ส่วน management เน้น risk management"},{"en":"Governance focuses on maintaining confidentiality, while management focuses on maintaining availability.","th":"Governance ดูแล Confidentiality ส่วน management ดูแล Availability"}],"correct":[1],"explanation_en":"The correct answer: Governance focuses on strategic decision-making, while management focuses on tactical execution: Governance in information security refers to the overall strategy and framework of policies, procedures, and guidelines that guide an organization's approach to securing its information. It involves setting the vision, mission, objectives, and goals for information security and defining how they will be achieved. This is a strategic activity as it sets the direction for the organization. On the other hand, management refers to the tactical execution of the governance strategy. This involves activities like managing day-to-day security operations, implementing security measures, handling incidents, and reporting on the performance of the security program. Management essentially takes the strategic vision from governance and translates it into actionable tasks and processes. While governance is concerned with \"what\" and \"why\", management deals with \"how\". The incorrect answers: Governance focuses on implementing security controls, while management focuses on monitoring and evaluating them: This is incorrect because both the implementation of security controls and their monitoring and evaluation fall under the remit of management, not governance. Governance is more about setting the strategic direction and objectives for security, while management is about executing those strategies and objectives, which includes implementing, monitoring, and evaluating controls. Governance focuses on compliance and regulatory requirements, while management focuses on risk management: This is not entirely accurate. While governance does indeed involve ensuring that the organization's security strategy aligns with compliance and regulatory requirements, management is also heavily involved in ensuring compliance at a tactical level. Similarly, risk management is a concern for both governance and management: governance sets the risk appetite and strategy, while management identifies, assesses, mitigates, and monitors risks. Governance focuses on maintaining confidentiality, while management focuses on maintaining availability: This statement is incorrect as both confidentiality and availability, along with integrity, are part of the triad of information security objectives and are the responsibility of both governance and management. Governance sets the strategic direction and policies for maintaining these three aspects, and management implements and maintains controls to ensure their realization.","explanation_th":"Governance กำหนดทิศทาง วัตถุประสงค์ และการกำกับดูแล ส่วน management วางแผนและดำเนินกิจกรรมเพื่อให้บรรลุทิศทางนั้น"},{"number":108,"id":102017809,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is NOT a phase of the risk management process?","question_th":"ข้อใดไม่ใช่ขั้นตอนของกระบวนการบริหารความเสี่ยง","options":[{"en":"Risk identification","th":"การระบุความเสี่ยง"},{"en":"Risk assessment","th":"การประเมินความเสี่ยง"},{"en":"Risk implementation","th":"การนำความเสี่ยงไปใช้"},{"en":"Risk mitigation","th":"การลดความเสี่ยง"}],"correct":[2],"explanation_en":"The correct answer: Risk implementation is not a recognized phase in the standard risk management process. The typical steps in the risk management process include risk identification, risk assessment, risk response, and risk monitoring. In other words, risks are identified, evaluated in terms of their potential impact and likelihood, strategies are then developed to address or mitigate those risks, and finally, the situation is continually monitored for changes. Risk implementation, as a term, is misleading because it could be misinterpreted as the act of putting risks into effect, which is contrary to the purpose of risk management: that is, to identify, assess, and control or mitigate risks. The incorrect answers: Risk identification: This is indeed a part of the risk management process. In this phase, potential risks are identified in a systematic manner to ensure they are recognized before they become problems. Risk identification can involve a combination of techniques, including brainstorming sessions, checklists, and historical data analysis. Risk assessment: This too is a critical part of the risk management process. Once risks are identified, they are then evaluated or assessed to understand their potential impact and likelihood of occurrence. The assessment usually involves determining the qualitative and/or quantitative value of risk related to a concrete situation and recognized threat. This helps in prioritizing the risks based on their potential severity of impact and likelihood of occurring. Risk mitigation: This is also a part of the risk management process. Once risks are identified and assessed, appropriate strategies need to be developed to manage the risks. Risk mitigation involves developing options and actions to enhance opportunities and reduce threats to project objectives. The risk mitigation step involves implementing risk response measures that might include risk avoidance, risk reduction, risk sharing, or even risk acceptance depending on the risk and the project or organizational context.","explanation_th":"ไม่มีขั้นตอน Risk implementation โดยทั่วไปจะระบุ ประเมิน จัดลำดับ เลือก response หรือลดความเสี่ยง แล้วติดตามทบทวน"},{"number":109,"id":102017811,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"In what ways do the concepts of non-repudiation and authentication differ, and how do they relate to each other in the context of cyber security?","question_th":"Non-repudiation และ authentication แตกต่างและเกี่ยวข้องกันอย่างไร","options":[{"en":"Non-repudiation involves proving the authenticity of a digital signature, while authentication involves verifying the identity of a user.","th":"Non-repudiation พิสูจน์ digital signature ส่วน authentication ตรวจตัวตนผู้ใช้เท่านั้น"},{"en":"Non-repudiation ensures that a digital communication cannot be denied by the sender, while authentication ensures that the sender is who they claim to be.","th":"Non-repudiation ทำให้ผู้ส่งปฏิเสธการสื่อสารไม่ได้ ส่วน authentication ยืนยันว่าผู้ส่งเป็นบุคคลที่อ้างจริง"},{"en":"Non-repudiation and authentication are essentially the same concept, both involving the verification of a user's identity.","th":"ทั้งสองเป็นแนวคิดเดียวกัน"},{"en":"Non-repudiation involves protecting the confidentiality of a message, while authentication involves protecting the integrity of a message.","th":"Non-repudiation ปกป้องความลับ ส่วน authentication ปกป้อง Integrity"}],"correct":[1],"explanation_en":"The correct answer: Non-repudiation ensures that a digital communication cannot be denied by the sender, while authentication ensures that the sender is who they claim to be: In cybersecurity, the term non-repudiation refers to a measure that prevents an individual or entity from denying having performed a particular action in the digital space. This often relates to the transmission and receipt of messages or transactions. In this way, non-repudiation serves as a form of digital accountability, ensuring that a sender of a message cannot later deny having sent the message. Authentication, on the other hand, is a process that confirms or verifies the identity of an individual, system, or entity. This ensures that a user is who they claim to be before granting access to a certain resource, such as a network or a system. So, in a conversation between two parties, the process of authentication would verify the identity of the sender, while non-repudiation would make it impossible for that sender to deny the communication. The incorrect answers: Non-repudiation involves proving the authenticity of a digital signature, while authentication involves verifying the identity of a user: This answer is partially correct but it inaccurately defines non-repudiation. Non-repudiation indeed involves digital signatures but it is not about proving the authenticity of a digital signature per se, but more about ensuring that the sender of a message cannot deny having sent the message. On the other hand, authentication does indeed involve verifying the identity of a user. Non-repudiation and authentication are essentially the same concept, both involving the verification of a user's identity: This statement is incorrect because non-repudiation and authentication are two distinct concepts in cybersecurity. While both are crucial for securing digital communications, they serve different functions. Authentication verifies the identity of the users, while non-repudiation ensures the sender cannot deny the authenticity of their sent message. Non-repudiation involves protecting the confidentiality of a message, while authentication involves protecting the integrity of a message: This statement is incorrect. Confidentiality, a key concept in cybersecurity, involves ensuring that data or information is accessible only to those authorized to access it. This differs from non-repudiation, which is about ensuring a sender cannot deny the authenticity of their sent message. Similarly, integrity, another cybersecurity principle, involves ensuring that the data has not been altered in transit. Authentication doesn't necessarily protect the integrity of a message; it only verifies the identity of the users or entities involved.","explanation_th":"Authentication ยืนยันตัวตนในขณะเข้าถึงหรือสื่อสาร ส่วน non-repudiation สร้างหลักฐานผูกการกระทำกับบุคคลเพื่อไม่ให้ปฏิเสธภายหลัง มักใช้ลายเซ็นดิจิทัลร่วมกัน"},{"number":110,"id":102017813,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the main purpose of a PII (Personally Identifiable Information) policy?","question_th":"วัตถุประสงค์หลักของนโยบาย PII คืออะไร","options":[{"en":"To prevent unauthorized access to personal data","th":"ป้องกันการเข้าถึงข้อมูลส่วนบุคคลโดยไม่ได้รับอนุญาต"},{"en":"To ensure compliance with privacy regulations","th":"ทำให้ปฏิบัติตามกฎความเป็นส่วนตัว"},{"en":"To enforce password complexity requirements","th":"บังคับความซับซ้อนของรหัสผ่าน"},{"en":"To provide guidelines for data classification and handling","th":"กำหนดแนวทางจำแนกและจัดการข้อมูลทั่วไป"}],"correct":[1],"explanation_en":"The correct answer: The main purpose of a PII (Personally Identifiable Information) policy is to ensure that the organization is compliant with privacy regulations. This means that the policy will outline the steps that the organization must take to protect personal data, such as implementing appropriate access controls and conducting regular risk assessments. Such a policy typically includes guidelines on how to identify PII, how to protect it, who can access it, when and how it can be shared, how to respond to data breaches, and how to dispose of PII properly. The incorrect answers: While preventing unauthorized access to personal data is an important goal of a PII policy, it is not the main purpose. This objective is part of the broader purpose of complying with privacy regulations and protecting individuals' privacy rights. Password complexity requirements are typically a part of an organization's general security policy or an access control policy, not specifically a PII policy. Although strong passwords can help protect PII, the enforcement of password complexity requirements is not the primary focus of a PII policy. Although a PII policy will contain guidelines for how to handle and process PII, this is not its main purpose. Data classification and handling are part of broader data management and information security policies. A PII policy focuses specifically on personal data and is driven by the need to comply with privacy regulations.","explanation_th":"PII policy กำหนดวิธีเก็บ ใช้ เปิดเผย ปกป้อง เก็บรักษา และทำลายข้อมูลส่วนบุคคลเพื่อให้สอดคล้องกับกฎหมายและสิทธิของเจ้าของข้อมูล"},{"number":111,"id":102017815,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the name of the process that identifies, analyzes, and prioritizes potential security threats to a system or network?","question_th":"กระบวนการที่ระบุ วิเคราะห์ และจัดลำดับภัยคุกคามความปลอดภัยที่อาจเกิดกับระบบหรือเครือข่ายเรียกว่าอะไร","options":[{"en":"Threat modeling","th":"Threat modeling"},{"en":"Risk assessment","th":"Risk assessment"},{"en":"Vulnerability scanning","th":"Vulnerability scanning"},{"en":"Incident response","th":"Incident response"}],"correct":[1],"explanation_en":"The correct answer: Risk assessment is the correct answer as this is the process that identifies, analyzes, and prioritizes potential security threats to a system or network. Risk assessment is a critical part of any information security program, which helps to identify threats and vulnerabilities, quantify the potential damage and impact to the system or network, and provide data to enable the organization to make informed decisions about security policies and procedures. The incorrect answers: Threat modeling is an incorrect answer because it is a process that is designed to identify and evaluate the potential threats to a system or network. While threat modeling can contribute to risk assessment by helping to identify potential threats, it does not analyze and prioritize these threats. Vulnerability scanning is not the correct answer because this process is primarily focused on identifying security weaknesses in a system or network, not prioritizing or analyzing these potential threats. Vulnerability scanning is an important part of maintaining system security, but it is not the same as a risk assessment. Incident response is also incorrect because this process is the reaction to an already realized threat or security incident, rather than the preemptive identification, analysis, and prioritization of potential threats. Incident response is a critical part of any security program, but it is not involved in the risk assessment process.","explanation_th":"ตามคำตอบต้นฉบับ Risk assessment รวมการระบุภัยและช่องโหว่ วิเคราะห์ likelihood กับ impact และจัดลำดับเพื่อเลือกการจัดการ"},{"number":112,"id":102017817,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the MOST important aspect of a risk assessment as an iterative process?","question_th":"สิ่งใดสำคัญที่สุดที่ทำให้ risk assessment เป็นกระบวนการวนซ้ำ","options":[{"en":"Regularly reviewing and updating the risk assessment","th":"ทบทวนและปรับปรุงการประเมินเป็นประจำ"},{"en":"Identifying all potential risks","th":"ระบุความเสี่ยงที่เป็นไปได้ทั้งหมด"},{"en":"Implementing controls to reduce risks","th":"ติดตั้ง controls เพื่อลดความเสี่ยง"},{"en":"Communicating the results to stakeholders","th":"สื่อสารผลแก่ผู้มีส่วนได้ส่วนเสีย"}],"correct":[0],"explanation_en":"The correct answer: Regularly reviewing and updating the risk assessment: Risk assessment is not a one-time event but an ongoing process that requires regular reviews and updates. This is because the environment in which an organization operates is dynamic and constantly changing. The risks that an organization faces today may not be the same risks it will face tomorrow. It is important to regularly review and update the risk assessment to reflect any changes in the organization's risk profile. For instance, new risks may emerge, existing risks may change, and some risks may no longer be relevant. By continuously reviewing and updating the risk assessment, an organization can ensure that it is always prepared for and can effectively manage its current risks. The incorrect answers: While it's important to identify all potential risks in a risk assessment, this is not the most crucial part of an iterative risk assessment process. This is because risk identification is generally the first step in the risk assessment process. Without the subsequent steps of evaluating, treating, and regularly reviewing these risks, identifying them would not be much help. It's also practically impossible to identify all potential risks, as the business environment and other factors continually change, bringing about new risks. Implementing controls to reduce risks is a vital part of the risk management process, but it's not the most crucial part of an iterative risk assessment process. This stage comes after the identification and evaluation of risks. Without regularly reviewing and updating the risk assessment, the controls may become outdated or ineffective as new risks emerge or existing risks evolve. Therefore, even though important, it's not the most critical aspect in the context of the question. Communication of the results to stakeholders is a necessary step in the risk management process to ensure all relevant parties are aware of the risks and the measures taken to manage them. However, this step alone does not guarantee an effective risk assessment process. The regular review and update of the risk assessment, the communicated information may become outdated, and stakeholders may not be aware of the current risk profile of the organization. It's crucial, it's not the most important aspect of an iterative risk assessment process.","explanation_th":"สภาพแวดล้อม ภัยคุกคาม ระบบ และธุรกิจเปลี่ยนตลอดเวลา จึงต้องทบทวนและอัปเดต risk assessment อย่างสม่ำเสมอ ไม่ใช่ทำครั้งเดียวแล้วจบ"},{"number":113,"id":102017819,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the PRIMARY property of the Bell-LaPadula model?","question_th":"คุณสมบัติหลักของโมเดล Bell-LaPadula คืออะไร","options":[{"en":"Confidentiality","th":"Confidentiality"},{"en":"Integrity","th":"Integrity"},{"en":"Availability","th":"Availability"},{"en":"Non-repudiation","th":"Non-repudiation"}],"correct":[0],"explanation_en":"The correct answer: Confidentiality: The Bell-LaPadula (BLP) model is a state-transition model of a computer system for the preservation of confidentiality. The primary goal of this model is to prevent information from flowing from a high-security level to a lower one, thus ensuring the confidentiality of information. The model is built upon two main principles or rules: the Simple Security Property (no read up, or SSR) and the *-property (no write down, or Star Property). These principles prevent a subject with a certain security level from reading an object with a higher security level or writing to an object with a lower security level, respectively. This maintains confidentiality by ensuring that sensitive information is not leaked to unauthorized entities. The incorrect answers: Integrity is not the primary property of the Bell-LaPadula model, although it is a vital aspect of information security in general. Integrity refers to maintaining the accuracy and consistency of data over its entire lifecycle, which is not the main focus of the BLP model. There are other models, like the Biba model, that are primarily focused on maintaining data integrity, ensuring that data is not improperly modified. Availability is also a fundamental aspect of information security, but it is not the primary property of the Bell-LaPadula model. Availability refers to ensuring that authorized parties are able to access information when needed, which includes considerations like preventing denial-of-service attacks and managing system downtime for maintenance or failures. While the BLP model might indirectly contribute to availability (by preventing unauthorized access to critical system functions), it is not its primary goal. Non-repudiation is an aspect of security that ensures that a party to a communication cannot deny the authenticity of their signature or the sending of a message. While non-repudiation is crucial in many security contexts, especially those involving digital signatures or secure communications, it is not the primary property of the Bell-LaPadula model. The BLP model is focused on confidentiality, not on the authentication or identification of parties involved in a communication or transaction.","explanation_th":"Bell-LaPadula ป้องกันการเปิดเผยข้อมูลข้ามระดับชั้นความลับด้วย no read up และ no write down จึงเป็น confidentiality model"},{"number":114,"id":102017821,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the primary goal of the NIST Cybersecurity Framework?","question_th":"เป้าหมายหลักของ NIST Cybersecurity Framework คืออะไรตามคำตอบต้นฉบับ","options":[{"en":"To provide guidance on how to implement cybersecurity measures","th":"ให้แนวทางในการนำมาตรการ cybersecurity ไปใช้"},{"en":"To establish a common language for cybersecurity","th":"สร้างภาษากลางด้าน cybersecurity"},{"en":"To regulate the use of technology in government agencies","th":"กำกับการใช้เทคโนโลยีในหน่วยงานรัฐ"},{"en":"To protect critical infrastructure and national security","th":"ปกป้องโครงสร้างพื้นฐานสำคัญและความมั่นคงแห่งชาติ"}],"correct":[0],"explanation_en":"The correct answer: To provide guidance on how to implement cybersecurity measures: The NIST (National Institute of Standards and Technology) Cybersecurity Framework was developed to provide organizations with a set of industry standards and best practices to help manage cybersecurity risk. Its core functions – Identify, Protect, Detect, Respond, and Recover – offer a comprehensive and high-level strategic view of the lifecycle of an organization's management of cybersecurity risk. The framework's flexibility allows it to be implemented across various sectors and organizations, regardless of size or complexity. Its primary goal is to guide organizations in developing and improving their cybersecurity processes and measures. The incorrect answers: To establish a common language for cybersecurity: While one of the beneficial outcomes of the NIST Cybersecurity Framework is indeed the establishment of a common language for cybersecurity, allowing for better communication and understanding among stakeholders within and across organizations, this is more of a secondary goal. The framework aids in standardizing the terminology used in cybersecurity across different sectors, but its primary purpose is more operational, focusing on guiding the implementation of cybersecurity practices. To regulate the use of technology in government agencies: The NIST Cybersecurity Framework is not a regulatory tool designed specifically to govern the use of technology within government agencies. Instead, it serves as a voluntary framework intended to help organizations manage cybersecurity risks. Although it is highly influential in shaping cybersecurity policies and is used by various government and private sector organizations, its primary goal is not regulatory enforcement. To protect critical infrastructure and national security: While protecting critical infrastructure and enhancing national security are significant concerns that the NIST Cybersecurity Framework indirectly supports by improving the cybersecurity posture of organizations, these are broader objectives. The framework itself is aimed more directly at providing organizations with a structured and systematic approach to managing cybersecurity risk, which, in turn, contributes to the protection of critical infrastructure and national security.","explanation_th":"NIST CSF ให้กรอบแนวทางสำหรับระบุ ปกป้อง ตรวจจับ ตอบสนอง และกู้คืนความเสี่ยงไซเบอร์ เพื่อให้องค์กรปรับใช้ตามบริบทได้"},{"number":115,"id":102017823,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"How do Confidentiality and Integrity differ in regard to data protection?","question_th":"Confidentiality และ Integrity แตกต่างกันอย่างไรในการคุ้มครองข้อมูล","options":[{"en":"Confidentiality protects against unauthorized access to data while Integrity protects against unauthorized modification of data.","th":"Confidentiality ป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต ส่วน Integrity ป้องกันการแก้ไขโดยไม่ได้รับอนุญาต"},{"en":"Confidentiality protects against unauthorized modification of data while Integrity protects against unauthorized access to data.","th":"Confidentiality ป้องกันการแก้ไข ส่วน Integrity ป้องกันการเข้าถึง"},{"en":"Confidentiality and Integrity are the same concept and are interchangeable terms.","th":"ทั้งสองเป็นแนวคิดเดียวกัน"},{"en":"Confidentiality protects against unauthorized access to and modification of data, while Integrity only protects against unauthorized access.","th":"Confidentiality ป้องกันทั้งการเข้าถึงและแก้ไข ส่วน Integrity ป้องกันเฉพาะการเข้าถึง"}],"correct":[0],"explanation_en":"The correct answer: Confidentiality protects against unauthorized access to data while Integrity protects against unauthorized modification of data: In the context of data protection and cybersecurity, confidentiality and integrity are two key elements of the commonly referenced CIA triad (Confidentiality, Integrity, and Availability). Confidentiality refers to measures that prevent or minimize unauthorized access to data. This means that data or information is only available or visible to individuals who have the necessary permissions to access it. This is usually achieved through encryption, access controls, and security protocols. On the other hand, Integrity refers to the assurance that the data or information is accurate and consistent, and has not been altered or tampered with in an unauthorized or unexpected manner. It ensures that data remains intact from the time it is created to the time it is received, which is often managed through checksums, hashes, and digital signatures. The incorrect answers: Confidentiality protects against unauthorized modification of data while Integrity protects against unauthorized access to data: This statement is incorrect because it swaps the definitions of confidentiality and integrity. Confidentiality does not protect against unauthorized modification of data, but against unauthorized access to it. Conversely, integrity does not protect against unauthorized access to data, but ensures the data is not modified or tampered with in an unauthorized way. Confidentiality and Integrity are the same concept and are interchangeable terms: This statement is incorrect because confidentiality and integrity are different concepts within data protection, each with a distinct purpose. Confidentiality relates to preventing unauthorized access to data, while integrity involves ensuring the data has not been changed in an unauthorized or unexpected manner. They are not interchangeable terms. Confidentiality protects against unauthorized access to and modification of data, while Integrity only protects against unauthorized access: This statement is incorrect because it misrepresents the roles of confidentiality and integrity in data protection. Confidentiality indeed protects against unauthorized access, but it does not protect against unauthorized modification of data—that's the role of integrity. Conversely, integrity doesn't protect against unauthorized access; it ensures the data remains unaltered from its original form unless changes are authorized.","explanation_th":"Confidentiality ควบคุมว่าใครสามารถเห็นข้อมูล ส่วน Integrity ทำให้ข้อมูลถูกต้อง ครบถ้วน และไม่ถูกแก้ไขโดยบุคคลหรือกระบวนการที่ไม่ได้รับอนุญาต"},{"number":116,"id":102017825,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the most effective method for preventing unauthorized access to an organization's network?","question_th":"วิธีใดมีประสิทธิผลมากที่สุดในการป้องกันการเข้าถึงเครือข่ายขององค์กรโดยไม่ได้รับอนุญาตตามคำตอบต้นฉบับ","options":[{"en":"Implementing a firewall","th":"ติดตั้งไฟร์วอลล์"},{"en":"Enforcing strong passwords","th":"บังคับใช้รหัสผ่านที่แข็งแรง"},{"en":"Implementing two-factor authentication","th":"ใช้การยืนยันตัวตนสองปัจจัย"},{"en":"Regularly updating software and patches","th":"อัปเดตซอฟต์แวร์และแพตช์เป็นประจำ"}],"correct":[0],"explanation_en":"The correct answer: Implementing a firewall. A firewall is the most effective method among the given options for preventing unauthorized access to an organization's network. Firewalls act as a barrier or shield between the internal network of an organization (which is trusted) and the external network (like the internet, which is untrusted). They inspect and control incoming and outgoing network traffic based on predetermined security rules, thereby providing a first line of defense against unauthorized access to the network. The incorrect answers: Enforcing strong passwords: Enforcing strong passwords is an important security measure, but it primarily secures individual user accounts rather than the overall network. While strong passwords make it more difficult for attackers to gain access using brute-force or guessing techniques, they do not protect against other types of network-level attacks, such as those exploiting unpatched vulnerabilities or network misconfigurations. Implementing two-factor authentication: Two-factor authentication (2FA) provides an additional layer of security for user accounts by requiring a second form of verification in addition to a password. While 2FA enhances the security of individual user accounts, it doesn't directly protect the overall network from unauthorized access. Regularly updating software and patches: Regularly updating software and applying patches is critical for mitigating known vulnerabilities. However, this practice, while important, primarily secures individual systems or software rather than the overall network. Even with the latest patches and updates, the network can still be vulnerable to unauthorized access if proper network-level security controls, such as a firewall, are not in place.","explanation_th":"คำตอบต้นฉบับเลือก firewall เพราะควบคุมและกรองการรับส่งข้อมูลระหว่างเครือข่ายตามกฎที่กำหนด แม้ในทางปฏิบัติควรใช้ MFA, patching และ controls อื่นร่วมกันแบบ defense in depth"},{"number":117,"id":102017827,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"In our risk analysis, we are looking at the risk. What would that comprise?","question_th":"ในการวิเคราะห์ความเสี่ยง ตัวความเสี่ยงประกอบด้วยสิ่งใดตามตัวเลือก","options":[{"en":"The likelihood of a threat exploiting a vulnerability","th":"โอกาสที่ภัยคุกคามจะใช้ประโยชน์จากช่องโหว่"},{"en":"The potential damage to our organization","th":"ความเสียหายที่อาจเกิดแก่องค์กรเท่านั้น"},{"en":"The amount of money we have to spend on security measures","th":"งบประมาณสำหรับมาตรการความปลอดภัย"},{"en":"The expected return on investment for security measures","th":"ผลตอบแทนที่คาดจากมาตรการความปลอดภัย"}],"correct":[0],"explanation_en":"The correct answer: The likelihood of a threat exploiting a vulnerability: Risk in the context of risk analysis typically refers to the potential that a threat will exploit a vulnerability, causing harm to an organization. This is the basic principle of risk analysis in information security. A threat could be anything that has the potential to cause harm, such as a hacker or a natural disaster, while a vulnerability refers to weaknesses that make an organization susceptible to the threat. The risk is a function of the likelihood of a particular threat exploiting a particular vulnerability and the impact that would have. It's about understanding and quantifying the potential negative outcomes that could result from unaddressed vulnerabilities being exploited by threats. The incorrect answers: The potential damage to our organization: This answer is partially correct but not complete. The potential damage to an organization, or impact, is indeed a component of risk, but risk analysis also involves evaluating the likelihood of that damage occurring. In other words, risk is not just about what could go wrong, but also how likely it is to go wrong. Therefore, while potential damage is an important factor in risk analysis, it is not the entirety of what comprises risk. The amount of money we have to spend on security measures: While the cost of implementing security measures is a crucial factor in the decision-making process of an organization, it is not a component of risk itself. Rather, it is part of the cost-benefit analysis that an organization might perform when deciding how to respond to a risk. In risk analysis, you're identifying and assessing potential threats and vulnerabilities, not determining how much to spend to address them. The expected return on investment (ROI) for security measures is an important consideration when deciding what security measures to implement. However, this is not part of the risk itself. Risk analysis helps identify and assess
