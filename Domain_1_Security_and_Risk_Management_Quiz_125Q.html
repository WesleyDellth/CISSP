 the potential threats and vulnerabilities that exist. The ROI comes into play later, when the organization is deciding how best to mitigate those risks. It's about the effectiveness of the security measures, not the risk they are designed to mitigate.","explanation_th":"Risk เกิดจากความเป็นไปได้ที่ threat จะ exploit vulnerability และก่อผลกระทบ ตัวเลือก A แสดงส่วนสำคัญของความสัมพันธ์นี้ได้ตรงที่สุด"},{"number":118,"id":102017829,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"A company is looking to improve its IT security practices to better protect sensitive data and systems. The CEO (Chief Executive Officer) has asked you, the Chief Information Security Officer (CISO), to make recommendations on how to do this. Given the following scenario, which of the following options would be the most effective way to improve the company's IT security?","question_th":"วิธีใดมีประสิทธิผลมากที่สุดในการปรับปรุงความมั่นคงปลอดภัย IT ของบริษัทตามสถานการณ์","options":[{"en":"Implement multi-factor authentication for all employees","th":"ใช้ MFA สำหรับพนักงานทุกคน"},{"en":"Conduct regular employee training on cybersecurity best practices","th":"ฝึกอบรมพนักงานเรื่องแนวปฏิบัติ cybersecurity เป็นประจำ"},{"en":"Invest in a comprehensive cybersecurity insurance policy","th":"ซื้อประกันภัย cybersecurity แบบครอบคลุม"},{"en":"Upgrade all servers, workstations, and laptops to the latest hardware and software with enhanced security features","th":"อัปเกรดฮาร์ดแวร์และซอฟต์แวร์ทั้งหมดเป็นรุ่นล่าสุด"}],"correct":[1],"explanation_en":"The correct answer: Regular employee training on cybersecurity best practices addresses a critical element of security: the human factor. Many security breaches occur due to human error, such as phishing attacks, weak passwords, and improper handling of sensitive data. By educating employees on how to recognize and respond to security threats, the company strengthens its first line of defense. Regular training ensures that all employees are up-to-date on the latest security threats and best practices, significantly reducing the likelihood of successful attacks. The incorrect answers: Implement multi-factor authentication for all employees: While multi-factor authentication is an essential security measure, it alone might not be sufficient to address the security issues in the given scenario. Employee training on security best practices can have a broader impact, as it can prevent various types of threats, not just unauthorized access. Invest in a comprehensive cybersecurity insurance policy: While a cybersecurity insurance policy can provide financial protection in the event of a cyber attack, it does not prevent attacks from occurring in the first place. The priority should be on implementing practices that can prevent breaches and attacks. Upgrade all servers, workstations, and laptops to the latest hardware and software with enhanced security features: While this could certainly improve security, given the company's limited budget and resources, this might not be the most cost-effective solution. Employee training can provide significant security improvements without the need for substantial capital investments.","explanation_th":"ตามคำตอบต้นฉบับ การฝึกอบรมสม่ำเสมอช่วยลดความเสี่ยงจาก phishing, social engineering และความผิดพลาดของคนในหลายสถานการณ์ ขณะที่ตัวเลือกอื่นแก้เพียงบางด้าน"},{"number":119,"id":102017831,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the FIRST step in determining security compliance and other requirements for a new system implementation?","question_th":"ขั้นตอนแรกในการกำหนดข้อกำหนด security compliance และข้อกำหนดอื่นสำหรับระบบใหม่คืออะไร","options":[{"en":"Conduct a risk assessment","th":"ประเมินความเสี่ยง"},{"en":"Create a security policy","th":"สร้างนโยบายความปลอดภัย"},{"en":"Implement security controls","th":"ติดตั้ง controls"},{"en":"Test and verify compliance","th":"ทดสอบและยืนยัน compliance"}],"correct":[0],"explanation_en":"The correct answer: Conduct a risk assessment: Before implementing any system, especially in terms of security, a risk assessment is usually the first step. Risk assessment involves identifying potential threats, vulnerabilities, and impacts to the system in question. It evaluates the probability and severity of the adverse effects that could happen. This provides a foundation for understanding the security risks associated with the system and helps in determining the appropriate controls and requirements. Without first identifying the potential risks, it's impossible to know what kind of policies, controls, or compliance checks will be necessary. The incorrect answers: Creating a security policy is a crucial part of ensuring security compliance, but it's not the first step. A security policy defines the rules and procedures for protecting an organization's assets. However, before a policy can be created, an understanding of the system’s risks is necessary to ensure that the policy addresses those specific threats. A risk assessment should precede the creation of a security policy. Implementing security controls is a step that occurs after identifying the risks through a risk assessment and defining a security policy to address those risks. Controls are specific mechanisms that help mitigate the risks identified. These could be technical controls like firewalls or antivirus software, administrative controls like training and procedures, or physical controls like locks or access badges. Without understanding the risks and having a policy to guide which controls are necessary, implementing controls is premature. Testing and verifying compliance is usually one of the final steps in determining security compliance. It involves checking whether the implemented security controls are working as intended and if the system adheres to the security policy and complies with regulatory standards. This step comes after the risk assessment, creation of a security policy, and implementation of controls, as it aims to ensure that all these previous steps were executed correctly and effectively.","explanation_th":"ต้องเข้าใจสินทรัพย์ ข้อมูล ภัย ช่องโหว่ ผลกระทบ และข้อผูกพันที่เกี่ยวข้องก่อน จึงจะกำหนดข้อกำหนดและ controls ที่เหมาะสมได้"},{"number":120,"id":102017833,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the MOST accurate way to calculate the qualitative risk for a cybersecurity threat?","question_th":"วิธีใดถูกต้องที่สุดในการคำนวณความเสี่ยงเชิงคุณภาพของภัยคุกคามไซเบอร์","options":[{"en":"By using the maximum impact of the threat on the organization","th":"ใช้ผลกระทบสูงสุดเท่านั้น"},{"en":"By using the average impact of the threat on the organization","th":"ใช้ผลกระทบเฉลี่ยเท่านั้น"},{"en":"By using the minimum impact of the threat on the organization","th":"ใช้ผลกระทบต่ำสุดเท่านั้น"},{"en":"By using the probability of the threat occurring and the impact of the threat on the organization","th":"ใช้โอกาสเกิดของภัยคุกคามร่วมกับผลกระทบต่อองค์กร"}],"correct":[3],"explanation_en":"The correct answer: By using the probability of the threat occurring and the impact of the threat on the organization: This is the most accurate way to calculate risk. Risk is commonly defined as the potential for loss or damage when a threat exploits a vulnerability. A qualitative risk assessment involves determining the probability of a threat exploiting a vulnerability (threat likelihood) and the potential damage that could be caused by the threat (impact). This method provides a balanced view of the potential risk, considering both impact and likelihood. The incorrect answers: By using the maximum impact of the threat on the organization: This is not the most accurate way because it considers only the worst-case scenario, which might overestimate the risk. Risk assessment involves both the impact and the likelihood of an event. By using the average impact of the threat on the organization: This method could be misleading as it does not account for the frequency or probability of the threat occurring. An event with a high impact but low probability might be incorrectly assessed as a high-risk event. By using the minimum impact of the threat on the organization: This approach might underestimate the risk as it only considers the best-case scenario. Like the previous cases, this method doesn't account for the likelihood of the event.","explanation_th":"Qualitative risk rating ประเมิน likelihood และ impact แล้วรวมกันในเมทริกซ์หรือเกณฑ์ระดับ เช่น ต่ำ กลาง สูง เพื่อจัดลำดับ"},{"number":121,"id":102017835,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the MOST effective approach to full disclosure?","question_th":"แนวทางใดมีประสิทธิผลมากที่สุดสำหรับ full disclosure ตามคำตอบต้นฉบับ","options":[{"en":"Hiding the information and only sharing it with a select few","th":"ซ่อนข้อมูลและแจ้งเฉพาะคนกลุ่มเล็ก"},{"en":"Disclosing the information to only those who are directly affected by it","th":"แจ้งเฉพาะผู้ได้รับผลกระทบโดยตรง"},{"en":"Disclosing the information to the general public as soon as it is discovered","th":"เปิดเผยข้อมูลต่อสาธารณะทันทีเมื่อค้นพบ"},{"en":"Disclosing the information to the authorities and allowing them to handle the situation","th":"แจ้งหน่วยงานรัฐและให้หน่วยงานจัดการ"}],"correct":[2],"explanation_en":"The correct answer: Full disclosure is about being transparent and open about potential vulnerabilities or security breaches. The most effective approach is to disclose the information to the general public as soon as it is discovered. This allows individuals and organizations to take necessary precautions to protect themselves and prevent further damage. The incorrect answers: Hiding the information and only sharing it with a select few does not align with the principles of full disclosure. It may lead to the situation being handled in a biased or inadequate manner, and can also cause trust issues among those who are not privy to the information. Disclosing the information to only those who are directly affected by it is not the most effective approach. While it may provide immediate protection to those individuals, it does not address the broader implications of the vulnerability or breach. It also leaves others who may be indirectly affected in the dark, and can lead to further damage. Disclosing the information to the authorities and allowing them to handle the situation may not always be the best approach. Depending on the nature of the vulnerability or breach, the authorities may not have the necessary expertise or resources to handle the situation effectively. Additionally, relying solely on the authorities can delay the dissemination of important information to the general public.","explanation_th":"Full disclosure หมายถึงเผยแพร่รายละเอียดต่อสาธารณะอย่างกว้างขวาง ต้นฉบับจึงเลือกการเปิดเผยทันที แม้การเปิดเผยช่องโหว่ในทางปฏิบัติควรพิจารณา responsible disclosure เพื่อลดอันตราย"},{"number":122,"id":102017837,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the LEAST effective way to evaluate and apply security governance principles?","question_th":"วิธีใดมีประสิทธิผลน้อยที่สุดในการประเมินและประยุกต์หลัก security governance","options":[{"en":"Conducting regular risk assessments","th":"ประเมินความเสี่ยงเป็นประจำ"},{"en":"Implementing security policies and procedures","th":"ใช้นโยบายและขั้นตอนความปลอดภัย"},{"en":"Ignoring input from stakeholders","th":"เพิกเฉยต่อความคิดเห็นของผู้มีส่วนได้ส่วนเสีย"},{"en":"Regularly reviewing and updating security measures","th":"ทบทวนและปรับปรุงมาตรการเป็นประจำ"}],"correct":[2],"explanation_en":"The correct answer: Ignoring input from stakeholders is the least effective way to evaluate and apply security governance principles. This is because stakeholders (employees, managers, shareholders, customers, etc.) have unique perspectives and can provide valuable input based on their roles, experiences, and interactions with various aspects of the organization. They may bring to attention potential vulnerabilities, security breaches, or ineffective procedures that might have been overlooked. By ignoring their input, the organization misses the opportunity to address these issues, leading to weaker security governance. In addition, ignoring stakeholders' inputs could also lead to lower compliance and awareness of security measures, increasing the risk of security breaches. The incorrect answers: Conducting regular risk assessments is an effective way to evaluate and apply security governance principles. Regular risk assessments allow an organization to identify, evaluate, and prioritize potential vulnerabilities and threats. This allows the organization to allocate resources effectively to address these risks, improving the overall security governance. Regular risk assessments also ensure that the organization's security measures are up-to-date with the evolving threat landscape. Implementing security policies and procedures is also an effective way to evaluate and apply security governance principles. These policies and procedures establish the framework for how an organization manages its security. They provide guidelines on how to handle data, use technology, respond to security incidents, etc. Implementing these policies and procedures across the organization ensures a consistent approach to security, reduces the risk of breaches, and promotes compliance with regulations and standards. Regularly reviewing and updating security measures is a critical part of effective security governance. The cyber threat landscape is continually evolving, with new types of threats emerging regularly. By continually reviewing and updating their security measures, organizations can ensure they are equipped to handle these new threats, enhancing their overall security posture. Additionally, regular reviews can help to identify any gaps or weaknesses in the current security measures, allowing the organization to improve and strengthen these measures over time.","explanation_th":"Governance ต้องสะท้อนความต้องการ ความเสี่ยง และวัตถุประสงค์ของผู้มีส่วนได้ส่วนเสีย การละเลยความคิดเห็นทำให้การตัดสินใจไม่สอดคล้องกับธุรกิจและขาดการสนับสนุน"},{"number":123,"id":102017839,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following is the BEST way to protect intellectual property rights?","question_th":"วิธีใดดีที่สุดในการปกป้องสิทธิในทรัพย์สินทางปัญญา","options":[{"en":"Establishing a strong security perimeter around the property","th":"สร้างขอบเขตความปลอดภัยรอบทรัพย์สิน"},{"en":"Implementing strict access controls for employees with access to the property","th":"ควบคุมการเข้าถึงของพนักงานอย่างเข้มงวด"},{"en":"Using encryption to secure the property","th":"เข้ารหัสทรัพย์สิน"},{"en":"Registering the property with the appropriate government agency","th":"จดทะเบียนทรัพย์สินกับหน่วยงานรัฐที่เกี่ยวข้อง"}],"correct":[3],"explanation_en":"The correct answer: Registering intellectual property (IP) with the appropriate agency (e.g., the Patent and Trademark Office for patents and trademarks or the Copyright Office for copyrights) grants legal protection and recognition to the owner. This means that the owner has a legal basis to defend their IP against unauthorized use or infringement. Registration makes it easier to take legal action against infringers and often provides stronger protection than relying solely on trade secret laws or contracts. The incorrect answers: Establishing a strong security perimeter around the property: Physical security measures are essential to protect tangible assets and data, they do not directly protect intellectual property rights. Intellectual property can be copied or misappropriated without breaching a physical security barrier, especially in digital formats. Implementing strict access controls for employees with access to the property: Restricting access is a useful measure to protect sensitive information from being leaked or stolen. However, it does not, by itself, protect the rights to the intellectual property. Even with strict access controls, there is no legal recourse against external entities that might infringe upon the IP unless it's registered or protected by law. Using encryption to secure the property: Encryption is an effective way to protect data from unauthorized access. While it can prevent unauthorized copying or sharing of sensitive data, it doesn't provide legal protection for the intellectual property itself. If someone had a legitimate reason to access the data and then decided to misuse it, encryption alone wouldn't protect the intellectual rights associated with that data.","explanation_th":"การจดทะเบียน เช่น สิทธิบัตร ลิขสิทธิ์ หรือเครื่องหมายการค้าในกรณีที่เกี่ยวข้อง ช่วยสร้างหลักฐานและสิทธิทางกฎหมายในการบังคับคุ้มครอง ส่วน controls ปกป้องการเข้าถึงแต่ไม่สร้างสิทธิ"},{"number":124,"id":102017841,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"Which of the following provisions in the USA PATRIOT Act is considered the MOST controversial?","question_th":"บทบัญญัติใดใน USA PATRIOT Act ถูกมองว่าเป็นข้อถกเถียงมากที่สุด","options":[{"en":"Increased surveillance and search powers for law enforcement agencies","th":"เพิ่มอำนาจการสอดส่องและค้นหาของหน่วยงานบังคับใช้กฎหมาย"},{"en":"Creation of the Terrorist Financing Tracking Program","th":"จัดตั้ง Terrorist Financing Tracking Program"},{"en":"Authority to detain and deport immigrants suspected of terrorist activity","th":"ให้อำนาจควบคุมตัวและเนรเทศผู้อพยพที่ต้องสงสัย"},{"en":"Requirement for banks to report suspicious transactions","th":"กำหนดให้ธนาคารรายงานธุรกรรมน่าสงสัย"}],"correct":[0],"explanation_en":"The correct answer: Increased surveillance and search powers for law enforcement agencies: The provisions in the USA PATRIOT Act that allowed for increased surveillance and search powers for law enforcement agencies have arguably been the most controversial. These provisions significantly expanded the authority of federal law enforcement and intelligence gathering agencies to monitor and collect data on the activities of individuals, often without the need for a warrant. Critics argue that such powers infringe upon civil liberties and privacy rights, as enshrined in the Fourth Amendment to the United States Constitution. Critics also point out that these powers have potential for misuse and abuse. The incorrect answers: Creation of the Terrorist Financing Tracking Program: While there have been some concerns and debate over the Terrorist Financing Tracking Program (TFTP), it has not reached the same level of controversy as the surveillance and search powers. The TFTP is aimed at identifying and tracking financial transactions linked to terrorist activity. Critics do argue it could infringe on individual privacy rights, particularly with regards to financial privacy, and there are questions around data security. However, these concerns are somewhat mitigated by the fact that this program primarily focuses on larger, suspicious transactions, which are already regulated to a certain extent under anti-money laundering laws. Authority to detain and deport immigrants suspected of terrorist activity: The power to detain and deport immigrants suspected of terrorist activities, while contentious in its own right, has not created as much controversy as the surveillance provisions of the PATRIOT Act. Critics argue that these provisions could lead to racial profiling, xenophobia, and other forms of discrimination. However, these provisions are generally seen as extensions of pre-existing immigration laws and controls, which have always had mechanisms for dealing with individuals seen as threats to national security. Requirement for banks to report suspicious transactions: The requirement for banks to report suspicious transactions to authorities has also not stirred as much controversy as the surveillance and search provisions. Such requirements were already part of the regulatory landscape under anti-money laundering and counter-terrorism financing laws before the PATRIOT Act. While there are some concerns about the burden this places on banks and potential infringement on financial privacy, these requirements are generally seen as a reasonable measure for preventing criminal activity.","explanation_th":"การเพิ่มอำนาจเฝ้าระวังและค้นหาก่อข้อถกเถียงอย่างมากเรื่องความเป็นส่วนตัว การตรวจสอบถ่วงดุล และสิทธิเสรีภาพของประชาชน"},{"number":125,"id":102017843,"type":"single","section":"CISSP Domain 1: Security and Risk Management","question_en":"What is the term for a collection of policies, standards, guidelines, and procedures that dictate how an organization's security should be managed and implemented?","question_th":"ชุดของนโยบาย มาตรฐาน แนวทาง และขั้นตอนที่กำหนดวิธีบริหารและนำความมั่นคงปลอดภัยขององค์กรไปใช้เรียกว่าอะไร","options":[{"en":"Security management","th":"Security management"},{"en":"Security architecture","th":"Security architecture"},{"en":"Security framework","th":"Security framework"},{"en":"Security protocol","th":"Security protocol"}],"correct":[2],"explanation_en":"The correct answer: Security framework: A security framework refers to a collection of guidelines, standards, policies, and procedures that dictate how an organization's security should be managed and implemented. Security frameworks are strategic, comprehensive, and flexible structures that provide a systematic approach to managing an organization's cybersecurity risks. They establish the guidelines for identifying, protecting, detecting, responding, and recovering from security incidents. Some well-known security frameworks include the NIST Cybersecurity Framework, ISO 27001/27002, and the CIS Critical Security Controls. The incorrect answers: Security management: This term refers to the managerial and administrative activities in an organization related to its security measures. Security management is part of the overall security framework, and involves handling the resources, operations, and strategies necessary to maintain an organization's information security. However, security management itself does not encompass all the elements of a security framework. Security architecture is a detailed design that outlines the components, structure, and behavior of an organization's security controls. It includes security measures, rules, and procedures that are meant to protect an organization's data. While security architecture is an important part of the security framework, it doesn't encapsulate the entire collection of policies, standards, guidelines, and procedures that make up the security framework. A security protocol is a specific procedure or set of rules that defines how to provide security in a system. It could be a method of encryption, a login process, or a procedure for secure communications. These protocols are elements of a security framework, used in the implementation of security measures, but they don't include the overarching guidelines, policies, and standards that are part of a security framework.","explanation_th":"Security framework รวมองค์ประกอบการกำกับ เช่น policies, standards, guidelines และ procedures ไว้เป็นโครงสร้างสำหรับบริหารและดำเนินโครงการความปลอดภัยอย่างสอดคล้อง"}]};</script>
<script>
(() => {
  'use strict';
  const data = window.QUIZ_DATA;
  if (!data || !Array.isArray(data.questions)) {
    document.body.innerHTML = '<p style="padding:24px">ไม่พบ questions data file / Missing quiz data.</p>';
    return;
  }
  const $ = id => document.getElementById(id);
  const els = {
    start: $('startScreen'), quiz: $('quizScreen'), result: $('resultScreen'), top: $('topbar'),
    card: $('questionCard'), nav: $('navGrid'), finish: $('finishBtn'), quit: $('quitBtn'),
    modeText: $('modeText'), current: $('currentStat'), total: $('totalStat'), answered: $('answeredStat'),
    score: $('scoreStat'), scorePill: $('scorePill'), progress: $('progressBar'), toast: $('toast'), note: $('sourceNote')
  };
  let state = null;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function cloneQuestions() {
    return data.questions.map(q => ({...q, options:q.options.map((o, i) => ({...o, originalIndex:i}))}));
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function sameSet(a, b) {
    const x = [...a].sort((m,n)=>m-n), y = [...b].sort((m,n)=>m-n);
    return x.length === y.length && x.every((v,i)=>v===y[i]);
  }
  function correctFor(q) {
    return q.options.map((o,i)=>q.correct.includes(o.originalIndex)?i:null).filter(v=>v!==null);
  }
  function selectedOriginal(q, displayedSelections) {
    return displayedSelections.map(i => q.options[i].originalIndex);
  }
  function isCorrect(q, displayedSelections) {
    return sameSet(selectedOriginal(q, displayedSelections), q.correct);
  }
  function answerText(q, indices) {
    if (!indices || !indices.length) return 'ไม่ได้ตอบ / Unanswered';
    return indices.map(i => `${letters[i]}. ${q.options[i].en} — ${q.options[i].th}`).join(' | ');
  }
  function toast(msg) {
    els.toast.textContent = msg; els.toast.classList.remove('hidden');
    clearTimeout(toast.timer); toast.timer = setTimeout(()=>els.toast.classList.add('hidden'), 2200);
  }
  function start(mode) {
    const qs = cloneQuestions();
    if ($('shuffleOptions').checked) qs.forEach(q=>shuffle(q.options));
    if ($('shuffleQuestions').checked) shuffle(qs);
    state = {mode, questions:qs, index:0, answers:{}, checked:{}, completed:false};
    els.start.classList.add('hidden'); els.result.classList.add('hidden'); els.quiz.classList.remove('hidden'); els.top.classList.remove('hidden');
    els.modeText.textContent = mode === 'practice' ? 'Practice Mode / เฉลยทันที' : 'Exam Mode / เฉลยตอนจบ';
    els.total.textContent = qs.length; els.scorePill.classList.toggle('hidden', mode === 'exam');
    renderNav(); renderQuestion(); updateStats(); window.scrollTo({top:0});
  }
  function renderQuestion() {
    const q = state.questions[state.index];
    const chosen = state.answers[q.id] || [];
    const checked = !!state.checked[q.id];
    const exact = checked ? isCorrect(q, chosen) : false;
    const type = q.type === 'multi' ? 'checkbox' : 'radio';
    const optionHTML = q.options.map((o, i) => {
      const selected = chosen.includes(i);
      let cls = selected ? ' selected' : '';
      if (checked) {
        if (correctFor(q).includes(i)) cls += ' correct';
        else if (selected) cls += ' incorrect';
      }
      return `<label class="option${cls}">
        <input type="${type}" name="answer" value="${i}" ${selected?'checked':''} ${checked?'disabled':''}>
        <div><div class="opt-en"><span class="letter">${letters[i]}</span>${escapeHtml(o.en)}</div><div class="opt-th">${escapeHtml(o.th)}</div></div>
      </label>`;
    }).join('');
    const feedback = checked ? `<section class="feedback ${exact?'good':'bad'}">
      <h3>${exact?'✅ Correct — ถูกต้อง':'❌ Incorrect — ยังไม่ถูกต้อง'}</h3>
      <div><b>Correct answer:</b> ${escapeHtml(answerText(q, correctFor(q)))}</div>
      <div class="explain-grid">
        <div class="explain"><strong>คำอธิบายภาษาไทย</strong><div class="preline">${escapeHtml(q.explanation_th)}</div></div>
        <div class="explain"><strong>English explanation (source)</strong><div class="preline">${escapeHtml(q.explanation_en)}</div></div>
      </div>
    </section>` : '';
    els.card.innerHTML = `<div class="qmeta"><div><div class="qcount">Question ${state.index+1} of ${state.questions.length}</div><div class="tag">${q.type==='multi'?'Select all that apply / เลือกทุกข้อที่ถูก':'Single answer / เลือกหนึ่งข้อ'}</div></div><div class="tag">Source Q${q.number}</div></div>
      <div class="lang-label">ENGLISH</div><div class="question-en">${escapeHtml(q.question_en)}</div>
      <div class="lang-label">ภาษาไทย</div><div class="question-th">${escapeHtml(q.question_th)}</div>
      ${q.type==='multi'?'<div class="instruction">ข้อนี้ต้องเลือกคำตอบที่ถูกให้ครบทั้งหมดจึงจะได้คะแนน</div>':''}
      <div class="options">${optionHTML}</div>${feedback}
      <div class="actions"><div class="action-group"><button id="prevBtn" class="btn" ${state.index===0?'disabled':''}>← ก่อนหน้า</button><button id="nextBtn" class="btn" ${state.index===state.questions.length-1?'disabled':''}>ถัดไป →</button></div>
      <div class="action-group">${state.mode==='practice'&&!checked?'<button id="checkBtn" class="btn primary">ตรวจคำตอบ</button>':''}${state.mode==='exam'&&state.index===state.questions.length-1?'<button id="submitHereBtn" class="btn primary">ส่งข้อสอบ</button>':''}</div></div>`;
    els.card.querySelectorAll('input[name="answer"]').forEach(input => input.addEventListener('change', onSelect));
    $('prevBtn').addEventListener('click',()=>go(state.index-1));
    $('nextBtn').addEventListener('click',()=>go(state.index+1));
    if ($('checkBtn')) $('checkBtn').addEventListener('click', checkPractice);
    if ($('submitHereBtn')) $('submitHereBtn').addEventListener('click', finishExam);
    updateStats(); renderNav();
  }
  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
  function onSelect(e) {
    const q = state.questions[state.index];
    if (state.checked[q.id]) return;
    const inputs = [...els.card.querySelectorAll('input[name="answer"]:checked')];
    state.answers[q.id] = inputs.map(x=>Number(x.value));
    renderQuestion();
  }
  function checkPractice() {
    const q = state.questions[state.index];
    const selected = state.answers[q.id] || [];
    if (!selected.length) return toast('กรุณาเลือกคำตอบก่อนตรวจ');
    state.checked[q.id] = true;
    renderQuestion();
  }
  function go(index) {
    if (index < 0 || index >= state.questions.length) return;
    state.index = index; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function answeredCount() { return Object.values(state.answers).filter(a=>a&&a.length).length; }
  function practiceCorrect() {
    return state.questions.filter(q=>state.checked[q.id] && isCorrect(q,state.answers[q.id]||[])).length;
  }
  function updateStats() {
    if (!state) return;
    const answered = answeredCount();
    els.current.textContent = state.index+1; els.answered.textContent = answered;
    els.progress.style.width = `${answered/state.questions.length*100}%`;
    if (state.mode==='practice') {
      const checkedCount = Object.keys(state.checked).length;
      els.score.textContent = checkedCount ? `${practiceCorrect()}/${checkedCount}` : '0/0';
    }
  }
  function renderNav() {
    if (!state) return;
    els.nav.innerHTML = state.questions.map((q,i)=>{
      const ans = state.answers[q.id] || [];
      let cls = i===state.index?' current':'';
      if (state.checked[q.id]) cls += isCorrect(q,ans)?' correct':' incorrect';
      else if (ans.length) cls += ' answered';
      return `<button class="nav-btn${cls}" data-i="${i}" title="Question ${i+1} / Source Q${q.number}">${i+1}</button>`;
    }).join('');
    els.nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i))));
  }
  function finishExam() {
    const unanswered = state.questions.length - answeredCount();
    const message = unanswered ? `ยังไม่ได้ตอบ ${unanswered} ข้อ ต้องการส่งข้อสอบหรือไม่?` : 'ต้องการส่งข้อสอบและดูผลหรือไม่?';
    if (!window.confirm(message)) return;
    finish();
  }
  function finish() {
    state.completed = true;
    const total = state.questions.length;
    const correct = state.questions.filter(q=>isCorrect(q,state.answers[q.id]||[])).length;
    const answered = answeredCount();
    const wrong = answered - correct;
    const unanswered = total - answered;
    const pct = Math.round((correct/total)*10000)/100;
    const passed = pct >= data.meta.pass_mark_percent;
    els.quiz.classList.add('hidden'); els.top.classList.add('hidden'); els.result.classList.remove('hidden');
    const incorrectQs = state.questions.filter(q=>!isCorrect(q,state.answers[q.id]||[]));
    const review = incorrectQs.map((q,idx)=>{
      const displayed = state.answers[q.id]||[];
      return `<article class="review-card"><h3>${idx+1}. Source Q${q.number}</h3>
        <div><b>EN:</b> ${escapeHtml(q.question_en)}</div><div><b>TH:</b> ${escapeHtml(q.question_th)}</div>
        <div class="answer-line yours"><b>Your answer:</b> ${escapeHtml(answerText(q,displayed))}</div>
        <div class="answer-line correct"><b>Correct:</b> ${escapeHtml(answerText(q,correctFor(q)))}</div>
        <div class="explain-grid"><div class="explain"><strong>คำอธิบายภาษาไทย</strong><div class="preline">${escapeHtml(q.explanation_th)}</div></div><div class="explain"><strong>English explanation</strong><div class="preline">${escapeHtml(q.explanation_en)}</div></div></div>
      </article>`;
    }).join('');
    els.result.innerHTML = `<div class="result-hero"><div class="eyebrow">Results / ผลการสอบ</div><div class="score-ring" style="--scoredeg:${pct*3.6}deg"><span>${pct}%</span></div>
      <h1 class="${passed?'pass':'fail'}">${passed?'PASS — ผ่าน':'FAIL — ไม่ผ่าน'}</h1><p>เกณฑ์ผ่าน ${data.meta.pass_mark_percent}%</p></div>
      <div class="summary-grid"><div class="summary-item"><strong>${correct}</strong>ถูก</div><div class="summary-item"><strong>${wrong}</strong>ผิด</div><div class="summary-item"><strong>${unanswered}</strong>ไม่ได้ตอบ</div><div class="summary-item"><strong>${total}</strong>ทั้งหมด</div></div>
      <div class="actions"><div class="action-group"><button id="restartBtn" class="btn primary">ทำใหม่</button><button id="printBtn" class="btn">พิมพ์ผล</button></div></div>
      <h2 class="review-title">ทบทวนข้อที่ผิดและไม่ได้ตอบ (${incorrectQs.length})</h2><div class="review-list">${review || '<p>ยอดเยี่ยม ตอบถูกทุกข้อ!</p>'}</div>`;
    $('restartBtn').addEventListener('click', reset);
    $('printBtn').addEventListener('click',()=>window.print());
    window.scrollTo({top:0});
  }
  function reset() {
    state=null; els.result.classList.add('hidden'); els.quiz.classList.add('hidden'); els.top.classList.add('hidden'); els.start.classList.remove('hidden'); window.scrollTo({top:0});
  }

  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>start(btn.dataset.mode)));
  els.finish.addEventListener('click',()=>state.mode==='exam'?finishExam():finish());
  els.quit.addEventListener('click',()=>{ if(window.confirm('เริ่มใหม่และล้างคำตอบทั้งหมดหรือไม่?')) reset(); });
  els.note.textContent = `${data.meta.question_count} questions. Source: ${data.meta.source_file}. No duplicate IDs or normalized question texts were found.`;
})();
</script>
</body>
</html>
