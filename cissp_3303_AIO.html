function applyStaticTranslations(){
  document.querySelectorAll('[data-t]').forEach(node=>{
    const key = node.getAttribute('data-t');
    node.textContent = '';
    node.appendChild(document.createTextNode(t(key)));
  });
  document.querySelectorAll('[data-t-ph]').forEach(node=>{
    const key = node.getAttribute('data-t-ph');
    node.setAttribute('placeholder', t(key));
  });
  el('creatorName').textContent = CREATOR_NAME;
  document.documentElement.lang = state.lang === 'th' ? 'th' : 'en';
}

function renderDomainGrid(){
  const grid = el('domainGrid');
  grid.innerHTML = '';
  Object.keys(DOMAIN_NAMES_EN).map(Number).sort((a,b)=>a-b).forEach(domNum=>{
    const count = domainCounts[domNum] || 0;
    const label = document.createElement('label');
    label.className = 'domain-item';
    const nameEn = DOMAIN_NAMES_EN[domNum];
    const nameTh = DOMAIN_NAMES_TH[domNum];
    let nameHtml;
    if(state.lang === 'th') nameHtml = escapeHtml(nameTh || nameEn);
    else if(state.lang === 'enth') nameHtml = escapeHtml(nameEn) + (nameTh ? ' <span style="color:var(--text-dim);font-style:italic;">/ '+escapeHtml(nameTh)+'</span>' : '');
    else nameHtml = escapeHtml(nameEn);
    label.innerHTML = '<input type="checkbox" data-dom="'+domNum+'" '+(state.selectedDomains.has(domNum)?'checked':'')+'>'
      + '<span>Domain '+domNum+': '+nameHtml+'</span>'
      + '<span class="dcount">'+count+'</span>';
    grid.appendChild(label);
  });
  grid.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const dom = Number(cb.getAttribute('data-dom'));
      if(cb.checked) state.selectedDomains.add(dom); else state.selectedDomains.delete(dom);
      updateCountOptions();
    });
  });
}

const COUNT_CANDIDATES = [10,25,50,100,150,200,250,300,400,500,750,1000,1500,2000];
function getPoolSize(){
  let sum = 0;
  state.selectedDomains.forEach(d=> sum += (domainCounts[d]||0));
  return sum;
}
function updateCountOptions(){
  const pool = getPoolSize();
  const sel = el('selectCount');
  const prevVal = sel.value;
  sel.innerHTML = '';
  const opts = COUNT_CANDIDATES.filter(n=>n < pool);
  opts.forEach(n=>{
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  const allLabel = (state.lang==='th') ? ('ทั้งหมด ('+pool+')') : (state.lang==='enth' ? ('All / ทั้งหมด ('+pool+')') : ('All ('+pool+')'));
  const allOpt = document.createElement('option');
  allOpt.value = pool; allOpt.textContent = allLabel;
  sel.appendChild(allOpt);
  if(pool === 0){
    sel.disabled = true;
  } else {
    sel.disabled = false;
    if(opts.map(String).includes(prevVal)) sel.value = prevVal;
    else sel.value = opts.length ? opts[0] : pool;
  }
  el('btnStart').disabled = pool === 0;
}

function wireToggleGroup(selector, attr, onChange){
  document.querySelectorAll(selector).forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll(selector).forEach(o=>o.classList.remove('active'));
      opt.classList.add('active');
      onChange(opt.getAttribute(attr));
    });
  });
}

function initStartScreen(){
  renderDomainGrid();
  updateCountOptions();
  applyStaticTranslations();

  el('btnSelectAll').addEventListener('click', ()=>{
    state.selectedDomains = new Set(Object.keys(DOMAIN_NAMES_EN).map(Number));
    renderDomainGrid();
    updateCountOptions();
  });
  el('btnClearAll').addEventListener('click', ()=>{
    state.selectedDomains = new Set();
    renderDomainGrid();
    updateCountOptions();
  });

  wireToggleGroup('[data-order]', 'data-order', (v)=>{ state.order = v; });
  wireToggleGroup('[data-mode]', 'data-mode', (v)=>{ state.mode = v; });
  wireToggleGroup('[data-lang]', 'data-lang', (v)=>{
    state.lang = v;
    applyStaticTranslations();
    renderDomainGrid();
    updateCountOptions();
  });

  el('inputName').addEventListener('input', (e)=>{ state.name = e.target.value; });

  el('btnStart').addEventListener('click', onStartClicked);
}

function onStartClicked(){
  let ok = true;
  const name = el('inputName').value.trim();
  if(!name){
    el('warnName').textContent = t('nameRequiredWarning');
    ok = false;
  } else {
    el('warnName').textContent = '';
  }
  if(state.selectedDomains.size === 0){
    el('warnDomains').textContent = t('selectDomainWarning');
    ok = false;
  } else {
    el('warnDomains').textContent = '';
  }
  if(!ok) return;
  state.name = name;
  const countVal = Number(el('selectCount').value);
  buildQuizSet(countVal);
  goToQuizScreen();
}

/* =========================================================
   BUILD QUIZ SET
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuizSet(count){
  let pool = QUESTION_BANK.filter(q=>state.selectedDomains.has(q.dom));
  if(state.order === 'random'){
    pool = shuffle(pool);
  } else {
    pool = pool.slice().sort((a,b)=> a.id - b.id);
  }
  state.quizQuestions = pool.slice(0, count);
  state.currentIndex = 0;
  state.answers = {};
  state.startedAt = Date.now();
}

/* =========================================================
   QUIZ SCREEN
   ========================================================= */
function goToQuizScreen(){
  screenStart.classList.add('hidden');
  screenResults.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  renderQuestion();
}

function currentQuestion(){
  return state.quizQuestions[state.currentIndex];
}

function renderQuestion(){
  applyStaticTranslations();
  clearTimer();
  state.locked = false;
  el('btnNext').classList.add('hidden');
  el('explainBox').classList.add('hidden');
  el('explainBox').innerHTML = '';

  const q = currentQuestion();
  el('qNum').textContent = state.currentIndex + 1;
  el('qTotal').textContent = state.quizQuestions.length;
  const domName = state.lang==='th' ? (DOMAIN_NAMES_TH[q.dom]||DOMAIN_NAMES_EN[q.dom]) : DOMAIN_NAMES_EN[q.dom];
  el('qDomainLabel').textContent = 'Domain ' + q.dom + (domName ? (' · ' + domName) : '');

  el('questionText').innerHTML = biHtml(q.question, q.question_th);

  const optsWrap = el('optionsList');
  optsWrap.innerHTML = '';
  q.options.forEach((optEn, idx)=>{
    const optTh = (q.options_th && q.options_th[idx]) ? q.options_th[idx] : null;
    const div = document.createElement('div');
    div.className = 'option';
    div.dataset.idx = idx;
    div.innerHTML = biHtml(optEn, optTh);
    div.addEventListener('click', ()=> onOptionClick(idx));
    optsWrap.appendChild(div);
  });

  // restore previous answer if navigating (shouldn't normally happen, no back-nav, but safe)
  const existing = state.answers[q.id];
  if(existing){
    state.locked = true;
    highlightAnswered(existing.selectedIdx);
    if(state.mode === 'practice') showExplanation(q, existing.selectedIdx);
    el('btnNext').classList.remove('hidden');
  }

  startTimer();
}

function onOptionClick(idx){
  if(state.locked) return;
  const q = currentQuestion();
  if(state.mode === 'exam'){
    // neutral highlight only, allow changing selection until Next/timeout
    Array.from(el('optionsList').children).forEach(c=>c.classList.remove('selected-neutral'));
    el('optionsList').children[idx].classList.add('selected-neutral');
    state._pendingExamIdx = idx;
    el('btnNext').classList.remove('hidden');
    return;
  }
  // practice mode: lock immediately
  lockAnswer(idx, false);
}

function lockAnswer(selectedIdx, timedOut){
  const q = currentQuestion();
  state.locked = true;
  clearTimer();
  const correct = (selectedIdx !== null && selectedIdx === q.correct_idx);
  state.answers[q.id] = { selectedIdx: selectedIdx, correct: correct, skipped: selectedIdx === null };

  if(state.mode === 'practice'){
    highlightAnswered(selectedIdx);
    showExplanation(q, selectedIdx);
    el('btnNext').classList.remove('hidden');
  } else {
    // exam mode - only auto here on timeout; manual clicks handled via Next button flow
    if(timedOut){
      setTimeout(()=> advance(), EXAM_TIMEOUT_ADVANCE_MS);
    }
  }
}

function highlightAnswered(selectedIdx){
  const q = currentQuestion();
  Array.from(el('optionsList').children).forEach((c,idx)=>{
    c.classList.add('disabled');
    c.classList.remove('selected-neutral');
    if(idx === q.correct_idx) c.classList.add('correct');
    else if(idx === selectedIdx) c.classList.add('incorrect');
  });
}

function showExplanation(q, selectedIdx){
  const box = el('explainBox');
  box.classList.remove('hidden');
  const yourAnsEn = selectedIdx !== null ? q.options[selectedIdx] : null;
  const yourAnsTh = (selectedIdx !== null && q.options_th && q.options_th[selectedIdx]) ? q.options_th[selectedIdx] : null;
  const corrAnsEn = q.options[q.correct_idx];
  const corrAnsTh = (q.options_th && q.options_th[q.correct_idx]) ? q.options_th[q.correct_idx] : null;
  let html = '';
  if(selectedIdx === null){
    html += '<div><strong>'+escapeHtml(t('timeUp'))+'</strong></div>';
  }
  html += '<div class="ans-row"><strong>'+escapeHtml(t('yourAnswerLabel'))+'</strong> ' + (selectedIdx!==null ? biHtml(yourAnsEn, yourAnsTh) : '<em>'+escapeHtml(t('skippedTag'))+'</em>') + '</div>';
  html += '<div class="ans-row"><strong>'+escapeHtml(t('correctAnswerLabel'))+'</strong> ' + biHtml(corrAnsEn, corrAnsTh) + '</div>';
  html += '<div style="margin-top:10px;"><strong>'+escapeHtml(t('explanationLabel'))+':</strong><br>' + biHtml(q.explanation, q.explanation_th) + '</div>';
  box.innerHTML = html;
}

function advance(){
  if(state.currentIndex < state.quizQuestions.length - 1){
    state.currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

el('btnNext').addEventListener('click', ()=>{
  if(state.mode === 'exam' && !state.locked){
    const idx = (state._pendingExamIdx !== undefined) ? state._pendingExamIdx : null;
    lockAnswer(idx, false);
    state._pendingExamIdx = undefined;
  }
  advance();
});

el('btnFinishNow').addEventListener('click', ()=>{
  const ok = window.confirm(t('finishConfirm'));
  if(ok){
    // if current question unanswered, mark as skipped
    const q = currentQuestion();
    if(q && !state.answers[q.id]){
      state.answers[q.id] = { selectedIdx:null, correct:false, skipped:true };
    }
    finishQuiz();
  }
});

/* Timer */
function startTimer(){
  state.timerRemaining = SECONDS_PER_QUESTION;
  state.timerStartTs = Date.now();
  const bar = el('timerBar');
  bar.style.width = '100%';
  bar.classList.remove('urgent');
  tickTimer();
}
function tickTimer(){
  const elapsed = (Date.now() - state.timerStartTs) / 1000;
  const remaining = Math.max(0, SECONDS_PER_QUESTION - elapsed);
  state.timerRemaining = remaining;
  const pct = (remaining / SECONDS_PER_QUESTION) * 100;
  const bar = el('timerBar');
  bar.style.width = pct + '%';
  if(remaining <= URGENT_THRESHOLD) bar.classList.add('urgent');
  else bar.classList.remove('urgent');

  if(remaining <= 0){
    onTimerExpire();
    return;
  }
  state.timerRAF = requestAnimationFrame(tickTimer);
}
function clearTimer(){
  if(state.timerRAF){ cancelAnimationFrame(state.timerRAF); state.timerRAF = null; }
}
function onTimerExpire(){
  clearTimer();
  if(state.locked) return;
  if(state.mode === 'practice'){
    lockAnswer(null, true);
    // practice: manual Next button already shown by lockAnswer via showExplanation path
  } else {
    const idx = (state._pendingExamIdx !== undefined) ? state._pendingExamIdx : null;
    lockAnswer(idx, true);
    state._pendingExamIdx = undefined;
  }
}

/* =========================================================
   RESULTS
   ========================================================= */
function finishQuiz(){
  clearTimer();
  state.finishedAt = Date.now();
  screenQuiz.classList.add('hidden');
  screenResults.classList.remove('hidden');
  renderResults();
}

function computeStats(){
  let correct=0, incorrect=0, skipped=0;
  state.quizQuestions.forEach(q=>{
    const a = state.answers[q.id];
    if(!a || a.skipped){ skipped++; }
    else if(a.correct){ correct++; }
    else { incorrect++; }
  });
  const total = state.quizQuestions.length;
  const answered = correct+incorrect;
  const scorePct = total ? Math.round((correct/total)*100) : 0;
  const allAnswered = skipped === 0;
  const passed = allAnswered && scorePct >= 70;
  return {correct, incorrect, skipped, total, scorePct, allAnswered, passed};
}

function renderScoreDial(pct, passed){
  const size=140, stroke=14, r=(size-stroke)/2, c=2*Math.PI*r;
  const offset = c - (pct/100)*c;
  const color = passed ? '#2fbf6a' : '#ff3b4e';
  const svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#241419" stroke-width="'+stroke+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" '
    +   'stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'" '
    +   'transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    + '<text x="'+size/2+'" y="'+(size/2+8)+'" text-anchor="middle" font-size="28" font-weight="700" fill="'+color+'">'+pct+'%</text>'
    + '</svg>';
  el('dialWrap').innerHTML = svg;
}

function renderResults(){
  applyStaticTranslations();
  const stats = computeStats();
  renderScoreDial(stats.scorePct, stats.passed);
  el('statCorrect').textContent = stats.correct;
  el('statIncorrect').textContent = stats.incorrect;
  el('statSkipped').textContent = stats.skipped;
  el('statScore').textContent = stats.scorePct + '%';

  let bannerHtml = '';
  if(stats.passed){
    bannerHtml = '<div class="banner pass">'+escapeHtml(t('passLabel'))+' — '+escapeHtml(t('passBanner'))+'</div>';
  } else {
    let reasons = [];
    if(!stats.allAnswered) reasons.push(t('incompleteBanner').split('{n}').join(stats.skipped));
    if(stats.scorePct < 70) reasons.push(t('lowScoreBanner'));
    bannerHtml = '<div class="banner fail">'+escapeHtml(t('failLabel'))+' — '+reasons.map(escapeHtml).join(' ')+'</div>';
  }
  el('resultBanner').innerHTML = bannerHtml;

  const reviewList = el('reviewList');
  reviewList.innerHTML = '';
  const incorrectOnes = state.quizQuestions.filter(q=>{
    const a = state.answers[q.id];
    return !a || a.skipped || !a.correct;
  });
  if(incorrectOnes.length === 0){
    reviewList.innerHTML = '<div class="review-item">'+escapeHtml(t('noneSkippedReview'))+'</div>';
  } else {
    incorrectOnes.forEach(q=>{
      const a = state.answers[q.id];
      const item = document.createElement('div');
      item.className = 'review-item';
      let yourAnsHtml;
      if(!a || a.skipped || a.selectedIdx === null || a.selectedIdx === undefined){
        yourAnsHtml = '<em>'+escapeHtml(t('skippedTag'))+'</em>';
      } else {
        yourAnsHtml = biHtml(q.options[a.selectedIdx], q.options_th ? q.options_th[a.selectedIdx] : null);
      }
      const corrHtml = biHtml(q.options[q.correct_idx], q.options_th ? q.options_th[q.correct_idx] : null);
      item.innerHTML = '<div class="rq">'+biHtml(q.question, q.question_th)+'</div>'
        + '<div class="ans-row your-ans"><strong>'+escapeHtml(t('yourAnswerLabel'))+'</strong> '+yourAnsHtml+'</div>'
        + '<div class="ans-row correct-ans"><strong>'+escapeHtml(t('correctAnswerLabel'))+'</strong> '+corrHtml+'</div>';
      reviewList.appendChild(item);
    });
  }

  saveLocalBackup(stats);
  sendTracking(stats);
  buildPrintReport(stats);
}

el('btnRestart').addEventListener('click', ()=>{
  screenResults.classList.add('hidden');
  screenStart.classList.remove('hidden');
  state.answers = {};
  state.quizQuestions = [];
});

el('btnPrint').addEventListener('click', ()=>{
  window.print();
});

/* =========================================================
   PRINT REPORT (always bilingual EN+TH)
   ========================================================= */
function buildPrintReport(stats){
  const container = el('printReport');
  let html = '';
  html += '<h1>CISSP Practice Exam — Result Report / รายงานผลแบบทดสอบ CISSP</h1>';
  html += '<p><strong>Candidate / ผู้เข้าสอบ:</strong> '+escapeHtml(state.name)+'</p>';
  html += '<p><strong>Date / วันที่:</strong> '+escapeHtml(new Date().toLocaleString())+'</p>';
  html += '<p><strong>Mode / โหมด:</strong> '+escapeHtml(state.mode)+'</p>';
  html += '<p><strong>Score / คะแนน:</strong> '+stats.scorePct+'% — '+(stats.passed ? 'PASS / ผ่าน' : 'FAIL / ไม่ผ่าน')+'</p>';
  html += '<p>Correct/ตอบถูก: '+stats.correct+' &nbsp; Incorrect/ตอบผิด: '+stats.incorrect+' &nbsp; Skipped/ไม่ได้ตอบ: '+stats.skipped+'</p>';
  html += '<hr>';
  state.quizQuestions.forEach((q, i)=>{
    const a = state.answers[q.id];
    const correct = a && a.correct;
    const yourIdx = a ? a.selectedIdx : null;
    html += '<div class="print-q">';
    html += '<div class="pen">'+(i+1)+'. '+escapeHtml(q.question)+'</div>';
    if(q.question_th) html += '<div class="pth">'+escapeHtml(q.question_th)+'</div>';
    q.options.forEach((optEn, idx)=>{
      const optTh = q.options_th ? q.options_th[idx] : null;
      const mark = idx === q.correct_idx ? ' ✓' : (idx === yourIdx ? ' ✗' : '');
      html += '<div>'+String.fromCharCode(65+idx)+'. '+escapeHtml(optEn)+mark;
      if(optTh) html += ' <span class="pth">('+escapeHtml(optTh)+')</span>';
      html += '</div>';
    });
    html += '<div class="print-badge '+(correct?'correct':'incorrect')+'">'
      + (yourIdx===null||yourIdx===undefined ? 'Skipped / ไม่ได้ตอบ' : (correct ? 'Correct / ถูกต้อง' : 'Incorrect / ไม่ถูกต้อง'))
      + '</div>';
    html += '<div>Explanation/คำอธิบาย: '+escapeHtml(q.explanation)+(q.explanation_th ? ' — '+escapeHtml(q.explanation_th) : '')+'</div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

/* =========================================================
   TRACKING / STORAGE
   ========================================================= */
function saveLocalBackup(stats){
  try{
    const key = 'cissp_quiz_attempts';
    const existing = JSON.parse(localStorage.getItem(key) || '[]');
    existing.push({
      name: state.name,
      mode: state.mode,
      order: state.order,
      lang: state.lang,
      domains: Array.from(state.selectedDomains),
      startedAt: state.startedAt,
      finishedAt: state.finishedAt,
      stats: stats,
      answers: state.answers,
    });
    localStorage.setItem(key, JSON.stringify(existing));
  }catch(e){
    console.warn('localStorage backup failed', e);
  }
}

function sendTracking(stats){
  if(!TRACKING_URL) return;
  const payload = {
    name: state.name,
    mode: state.mode,
    order: state.order,
    lang: state.lang,
    domains: Array.from(state.selectedDomains),
    startedAt: state.startedAt,
    finishedAt: state.finishedAt,
    stats: stats,
  };
  const body = JSON.stringify(payload);
  try{
    let sent = false;
    if(navigator.sendBeacon){
      const blob = new Blob([body], {type:'application/json'});
      sent = navigator.sendBeacon(TRACKING_URL, blob);
    }
    if(!sent){
      fetch(TRACKING_URL, {method:'POST', mode:'no-cors', body: body, headers:{'Content-Type':'application/json'}}).catch(()=>{});
    }
  }catch(e){
    console.warn('tracking send failed', e);
  }
}

/* =========================================================
   BOOT
   ========================================================= */
initStartScreen();
</script>
