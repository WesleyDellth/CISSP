2],"explanation_en":"The correct answer:\nThe Lightweight Directory Access Protocol (LDAP) is a protocol used to access and maintain directory services over an Internet Protocol (IP) network. LDAP is widely used in various forms of IT infrastructure for authenticating users and devices. With LDAP, you can consolidate all your user information into a central repository instead of manually managing multiple authentication systems. It's flexible enough to record not only user names and passwords but also more complex attributes needed in the modern enterprise for device management, email, permissions, and other factors.\n\nThe incorrect answers:\nHTTPS (Hypertext Transfer Protocol Secure) is a protocol for secure communication over a computer network, and is widely used on the internet. While HTTPS encrypts the session data of the user, it is not used for verifying the identity of a user or device for the purpose of network access control. It is a way to secure the transport of data but it's not exactly an authentication protocol.\nSecure Shell (SSH) is a cryptographic network protocol for operating network services securely over an unsecured network. SSH provides a secure channel over an unsecured network in a client-server architecture, but it's more commonly used for secure remote login from one computer to another rather than verifying the identity of users or devices for network access control.\nSSL (Secure Sockets Layer) is a standard security technology for establishing an encrypted link between a server and a client—typically a web server (website) and a browser, or a mail server and a mail client. SSL allows sensitive information such as credit card numbers, social security numbers, and login credentials to be transmitted securely. But it is not a protocol used for verifying the identity of a user or device for network access control.","explanation_th":"คำตอบที่ถูกตามแหล่งต้นฉบับคือ C เพราะ LDAP ใช้เข้าถึงบริการไดเรกทอรีที่เก็บข้อมูลตัวตนและรองรับการตรวจสอบข้อมูลบัญชีผู้ใช้ A และ SSL/TLS เน้นการเข้ารหัสการสื่อสาร ส่วน B ใช้เข้าสู่ระบบระยะไกลอย่างปลอดภัย ไม่ใช่บริการไดเรกทอรีสำหรับจัดการตัวตนโดยทั่วไป"},{"number":32,"id":102018189,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the FIRST measure of the effectiveness of a biometric system?","question_th":"ตัวชี้วัดแรกของประสิทธิผลระบบชีวมิติคือข้อใดตามแหล่งต้นฉบับ","options":[{"en":"False acceptance rate","th":"อัตราการยอมรับผิด (FAR)"},{"en":"False rejection rate","th":"อัตราการปฏิเสธผิด (FRR)"},{"en":"Crossover error rate","th":"อัตราความผิดพลาดตัดกัน (CER)"},{"en":"Failure to enroll rate","th":"อัตราความล้มเหลวในการลงทะเบียน (Failure to Enroll)"}],"correct":[3],"explanation_en":"The correct answer:\nThe Failure to Enroll Rate (FTER) is often the first measure of the effectiveness of a biometric system. This rate indicates the percentage of attempts to create a biometric reference that fail. Before a system can accurately authenticate or identify an individual, it must first be able to successfully enroll them. If a significant number of users cannot enroll in the system (high FTER), it suggests that the system may not be user-friendly, or it may not be effective for the particular population it's meant to serve. It's the initial measure before considering the performance measures such as False Acceptance Rate (FAR), False Rejection Rate (FRR), or Crossover Error Rate (CER).\n\nThe incorrect answers:\nThe False Acceptance Rate (FAR) is a measure of a system's accuracy in correctly rejecting unauthorized users. It's an important measure, but it's not the first one you would look at because it comes into play only after users are successfully enrolled.\nThe False Rejection Rate (FRR) is a measure of a system's accuracy in correctly accepting authorized users. Similar to FAR, FRR is an important measure of a biometric system's effectiveness but is only relevant after successful user enrollment.\nThe Crossover Error Rate (CER) or Equal Error Rate (EER) is a composite measure that considers both the False Acceptance Rate and the False Rejection Rate. It's an important measure of a system's overall performance, but it's not the first measure you would consider. It also comes into play after the enrollment phase.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ D เพราะหากผู้ใช้ไม่สามารถลงทะเบียนตัวอย่างชีวมิติได้ ระบบย่อมไม่สามารถนำไปยืนยันตัวตนบุคคลนั้นได้ A วัดการยอมรับผู้ไม่ถูกต้อง B วัดการปฏิเสธผู้ถูกต้อง และ C เป็นจุดที่ FAR เท่ากับ FRR เพื่อใช้เปรียบเทียบความแม่นยำโดยรวม"},{"number":33,"id":102018191,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the IT security manager for a large corporation, you want to implement a system to ensure that only authorized employees can access sensitive company data. Which security mechanism is used to manage and control access to network resources?","question_th":"กลไกใดใช้จัดการและควบคุมการเข้าถึงทรัพยากรเครือข่ายเพื่อให้เฉพาะพนักงานที่ได้รับอนุญาตเข้าถึงข้อมูลอ่อนไหว","options":[{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Firewall","th":"ไฟร์วอลล์"},{"en":"Access control list","th":"Access Control List (ACL)"},{"en":"Two-factor authentication","th":"Two-Factor Authentication"}],"correct":[2],"explanation_en":"The correct answer:\nAccess control list (ACL): An ACL is a mechanism used to define who (or what) is allowed access to a specific system resource, and what operations they are allowed to perform on that resource. In the context of ensuring only authorized employees can access sensitive data, ACLs can specify which users or groups of users have access to certain data or network segments, and the type of access they have (e.g., read, write, execute).\n\nThe incorrect answers:\nEncryption: Encryption is a method of converting data into a code to prevent unauthorized access. While it's an essential tool for data security and ensures that data remains confidential, it doesn't manage or control access to network resources by itself.\nFirewall: A firewall is a network security system that monitors and controls incoming and outgoing network traffic based on predetermined security policies. While it can prevent unauthorized external access to a network, it doesn't manage specific user access to individual network resources.\nTwo-factor authentication: This is an authentication mechanism where a user provides two different types of evidence to prove their identity. While it's a strong method for verifying the identity of users before granting them access, it doesn't determine what specific resources the user can access once authenticated.","explanation_th":"คำตอบที่ถูกคือ C เพราะ ACL ระบุว่า subject ใดทำสิ่งใดกับทรัพยากรได้ A ปกป้องความลับของข้อมูล B กรองการรับส่งข้อมูลเครือข่าย และ D เพิ่มความเชื่อมั่นในการยืนยันตัวตน แต่ไม่ใช่รายการสิทธิ์ที่กำหนดการเข้าถึงทรัพยากรโดยตรง"},{"number":34,"id":102018193,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the main security control of a secure password?","question_th":"การควบคุมหลักของรหัสผ่านที่ปลอดภัยคือข้อใดตามต้นฉบับ","options":[{"en":"Password expiration","th":"อายุรหัสผ่าน"},{"en":"Password complexity","th":"ความซับซ้อนของรหัสผ่าน"},{"en":"Password length","th":"ความยาวของรหัสผ่าน"},{"en":"Password encryption","th":"การเข้ารหัสรหัสผ่าน"}],"correct":[1],"explanation_en":"The correct answer:\nA password with a high level of complexity, including a combination of uppercase and lowercase letters, numbers, and special characters, is more difficult for attackers to guess or crack through brute force methods.\n\nThe incorrect answers:\nPassword expiration can help prevent the reuse of a compromised password, it does not directly address the security of the password itself.\nA longer password may be more difficult to guess, it is not necessarily more secure if it lacks complexity. A shorter, complex password can be more secure than a long, simple password.\nEncrypting a password does not increase its security, as it is the complexity of the password itself that makes it secure. Encrypting the password simply protects it from being viewed in plaintext.","explanation_th":"คำตอบที่ถูกตามแหล่งต้นฉบับคือ B เพราะการกำหนดความซับซ้อนเพิ่มชนิดอักขระและลดโอกาสเดารหัสได้ง่าย A ช่วยจำกัดเวลาที่รหัสที่ถูกขโมยใช้ได้ C มีความสำคัญมากต่อความแข็งแรงแต่ต้นฉบับเลือกความซับซ้อนเป็น control หลัก และ D เกี่ยวกับการจัดเก็บหรือส่งรหัสผ่าน ไม่ได้กำหนดคุณภาพของรหัสที่ผู้ใช้ตั้ง"},{"number":35,"id":102018195,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As part of her regular duties, Anastasia is reviewing our logs. When she does that, it is which type of control?","question_th":"การที่ Anastasia ตรวจสอบ log เป็นประจำ จัดเป็นการควบคุมประเภทใด","options":[{"en":"Active detective control","th":"Active detective control"},{"en":"Passive detective control","th":"Passive detective control"},{"en":"Active physical control","th":"Active physical control"},{"en":"Passive preventative control","th":"Passive preventative control"}],"correct":[0],"explanation_en":"The correct answer:\nAn active detective control involves manual intervention, such as audits and reviews to identify and react to issues or irregularities. In this case, Anastasia is actively reviewing logs, a proactive measure to detect anomalies, errors, or security threats. This active process of checking and verifying the logs can help to quickly identify and respond to potential problems. The term \"active\" refers to the proactive nature of this process, while \"detective\" signifies its purpose of detecting potential issues.\n\nThe incorrect answers:\nPassive detective control: This type of control involves automated systems that detect and alert anomalies, errors, or potential security issues without human intervention. An example of a passive detective control could be an intrusion detection system (IDS) that continuously monitors network traffic for suspicious activity. In Anastasia's case, her duties involve active engagement and manual review of logs, so it doesn't fit the definition of a passive detective control.\nActive physical control: This type of control refers to physical measures that prevent unauthorized access to physical assets, like CCTV cameras, security personnel, or locked doors. It actively prevents incidents by existing as a physical barrier or deterrent. Anastasia's duty of reviewing logs is a procedural task and doesn't involve any physical barrier to prevent unauthorized access or threats, so this isn't the correct category for her duties.\nPassive preventative control: These controls are designed to prevent an undesirable event from occurring, and they are typically \"passive\" in the sense that they don't require regular active human intervention. Examples of passive preventative controls are firewall systems, encryption, or user access controls. Jane's task, however, involves actively reviewing logs to detect anomalies, which is a detective measure, not a preventative one.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A เพราะมีบุคคลลงมือทบทวน log เพื่อค้นหาพฤติกรรมผิดปกติอย่างตั้งใจ B มักหมายถึงการบันทึกหรือแจ้งเตือนที่ทำงานเองโดยไม่มีการตอบสนองทันที C เป็นการควบคุมทางกายภาพ และ D เป็นการป้องกัน ไม่ใช่การตรวจพบเหตุการณ์ที่เกิดขึ้นแล้ว"},{"number":36,"id":102018197,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST secure way to implement multifactor authentication?","question_th":"วิธีใดเป็นการใช้ multifactor authentication ที่ปลอดภัยที่สุด","options":[{"en":"Using a single password for all accounts","th":"ใช้รหัสผ่านเดียวกับทุกบัญชี"},{"en":"Using a combination of a password and a security token","th":"ใช้รหัสผ่านร่วมกับ security token"},{"en":"Using a combination of a password and biometric authentication","th":"ใช้รหัสผ่านร่วมกับชีวมิติ"},{"en":"Using a combination of a password, security token, and biometric authentication","th":"ใช้รหัสผ่าน security token และชีวมิติร่วมกัน"}],"correct":[3],"explanation_en":"The correct answer:\nUsing a combination of a password, security token, and biometric authentication: This method is the most secure because it combines three distinct factors: something you know (password), something you have (security token), and something you are (biometric authentication, such as a fingerprint or facial recognition). By combining all three, even if one factor is compromised, the other factors still provide protection, making it extremely challenging for attackers to gain unauthorized access.\n\nThe incorrect answers:\nUsing a single password for all accounts: This is the least secure method. Using a single password across multiple accounts can lead to multiple breaches if the password is compromised.\nUsing a combination of a password and a security token: While this approach is more secure than just using a password, it only involves two factors. Though it's relatively robust, it doesn't offer the same level of protection as including biometrics.\nUsing a combination of a password and biometric authentication: This method combines two factors, and while it's significantly more secure than just a password, it doesn't provide the layered protection that comes from including a security token as well.","explanation_th":"คำตอบที่ถูกคือ D เพราะรวมสามปัจจัยต่างประเภท: สิ่งที่รู้ สิ่งที่มี และสิ่งที่เป็น จึงต้องผ่านหลายชั้น A ไม่ใช่ MFA และยังเพิ่มความเสี่ยงจากการใช้รหัสซ้ำ B และ C ใช้สองปัจจัยจึงแข็งแรง แต่มีชั้นน้อยกว่า D"},{"number":37,"id":102018199,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following best defines the concept of least privilege?","question_th":"ข้อใดนิยามหลักสิทธิ์น้อยที่สุด (least privilege) ได้ดีที่สุด","options":[{"en":"The practice of granting users the minimum access necessary to perform their job functions","th":"ให้ผู้ใช้มีสิทธิ์ขั้นต่ำเท่าที่จำเป็นต่อการทำงาน"},{"en":"The practice of granting users the maximum access possible to perform their job functions","th":"ให้ผู้ใช้มีสิทธิ์สูงสุดเท่าที่ทำได้เพื่อให้งานเสร็จ"},{"en":"The practice of granting users the same level of access as the system administrator","th":"ให้ผู้ใช้มีสิทธิ์ระดับเดียวกับผู้ดูแลระบบ"},{"en":"The practice of granting users access to all resources and systems on the network","th":"ให้ผู้ใช้เข้าถึงทรัพยากรและระบบทั้งหมดในเครือข่าย"}],"correct":[0],"explanation_en":"The correct answer:\nThe practice of granting users the minimum access necessary to perform their job functions is the most accurate definition of least privilege. This security principle ensures that users only have access to the resources and systems that they need to do their job, and are not granted unnecessary privileges that could potentially be exploited by attackers.\n\nThe incorrect answers:\nThe practice of granting users the maximum access possible to perform their job functions is not a correct definition of least privilege goes against the principle of least privilege, as it would give users access to more resources than they need, increasing the attack surface and potential security risks.\nWhile system administrators typically have more access than regular users, it is not necessary or advisable to grant all users the same level of access as the administrator. This could lead to security vulnerabilities and unauthorized access to sensitive systems and data.\nThe practice of granting users access to all resources and systems on the network is not a correct definition of least privilege. This would give users access to a vast amount of resources and systems, regardless of their job function or need, which could lead to security breaches and potential misuse of access privileges.","explanation_th":"คำตอบที่ถูกคือ A เพราะ least privilege จำกัดสิทธิ์ให้พอดีกับงาน ลดพื้นผิวการโจมตีและผลกระทบหากบัญชีถูกยึด B C และ D ให้สิทธิ์เกินความจำเป็นและเพิ่มโอกาสเกิดความผิดพลาด การใช้สิทธิ์ในทางที่ผิด หรือการแพร่กระจายของผู้โจมตี"},{"number":38,"id":102018201,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You work in the IT department at a government agency and are responsible for implementing security measures to regulate who or what can view or use resources in the agency's information system. What type of security measure is used to regulate who or what can view or use resources in an information system?","question_th":"มาตรการความปลอดภัยใดใช้ควบคุมว่าใครหรือสิ่งใดสามารถดูหรือใช้ทรัพยากรในระบบสารสนเทศได้","options":[{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Firewall","th":"ไฟร์วอลล์"},{"en":"Virtual private network","th":"Virtual Private Network"},{"en":"Access control","th":"การควบคุมการเข้าถึง"}],"correct":[3],"explanation_en":"The correct answer:\nAccess control is a security measure that regulates who or what can view or use resources in an information system. It essentially determines who is allowed to access what data, when, and from where. Access control can be based on several factors such as user roles, user attributes, environmental conditions, etc. Access control systems can provide layered security, allowing permissions to be set for entire groups of users or customized to the individual level.\n\nThe incorrect answers:\nEncryption is a method of converting data into a form, called a ciphertext, that cannot be easily understood by unauthorized people. It's used to protect sensitive information from unauthorized access during transmission or while in storage, but it doesn't regulate who or what can view or use resources in an information system directly.\nA firewall is a network security device that monitors incoming and outgoing network traffic and permits or blocks data packets based on a set of security rules. While firewalls can control traffic and provide a degree of access control between networks (like between the internet and a corporate network), they do not manage access to specific resources within the network.\nA VPN is a technology used to create a secure network connection over a public network such as the internet or a private network owned by a service provider. VPNs can hide your IP address and location, and they encrypt data transfers between your system and the VPN server, providing privacy and security. However, they do not regulate who or what can view or use resources in an information system.","explanation_th":"คำตอบที่ถูกคือ D เพราะ access control กำหนดและบังคับว่า subject ใดเข้าถึง object ใดได้ A ทำให้ข้อมูลอ่านไม่ได้หากไม่มีกุญแจ B กรองการสื่อสาร และ C สร้างช่องทางสื่อสารที่ปลอดภัย แต่ทั้งสามไม่ใช่คำจำกัดความโดยรวมของการกำหนดสิทธิ์ใช้ทรัพยากร"},{"number":39,"id":102018203,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST common cause of false positives in security systems?","question_th":"สาเหตุที่พบบ่อยที่สุดของ false positive ในระบบความปลอดภัยคือข้อใด","options":[{"en":"Improper configuration of security systems","th":"การกำหนดค่าระบบความปลอดภัยไม่เหมาะสม"},{"en":"Lack of regular security system updates","th":"ไม่ได้อัปเดตระบบความปลอดภัยเป็นประจำ"},{"en":"Lack of user education and training","th":"ขาดการให้ความรู้และอบรมผู้ใช้"},{"en":"Human error","th":"ความผิดพลาดของมนุษย์"}],"correct":[0],"explanation_en":"The correct answer:\nImproper configuration of security systems can lead to false positives as the system may not be able to distinguish between normal and abnormal behavior. For example, if the system is not configured to ignore certain types of traffic or protocols, it may flag them as a potential threat, resulting in a false positive.\n\nThe incorrect answers:\nRegular updates to security systems can address known vulnerabilities and improve the system's ability to detect and respond to threats. Missing updates alone is not typically the most common cause of false positives as updates are typically designed to improve the system's ability to detect and respond to threats.\nUser education and training are important to ensure that users understand how to use security systems and respond appropriately to alerts. A lack of user education and training alone is not typically the most common cause of false positives as false positives are typically caused by issues with the system itself.\nHuman error can play a role in false positives, for example, when users accidentally trigger a security alert. Human error by itself is not typically the most common cause of false positives as false positives are typically caused by issues with the system itself.","explanation_th":"คำตอบที่ถูกคือ A เพราะ threshold กฎ หรือลายเซ็นที่ตั้งไม่เหมาะสมอาจมองกิจกรรมปกติว่าเป็นภัย B อาจทำให้ตรวจไม่พบภัยใหม่มากกว่า C มีผลต่อพฤติกรรมผู้ใช้ และ D เป็นคำกว้าง แต่สาเหตุโดยตรงที่ต้นฉบับเน้นคือการตั้งค่าระบบผิด"},{"number":40,"id":102018205,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is an example of an access control mechanism?","question_th":"ข้อใดเป็นตัวอย่างของกลไกควบคุมการเข้าถึง","options":[{"en":"Firewall","th":"ไฟร์วอลล์"},{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Steganography","th":"Steganography"},{"en":"Biometric authentication","th":"การยืนยันตัวตนด้วยชีวมิติ"}],"correct":[3],"explanation_en":"The correct answer:\n\"Biometric authentication\": This is the correct answer. Biometric authentication is an access control mechanism that verifies an individual's identity based on physical or behavioral characteristics. These characteristics could include fingerprints, face recognition, voice patterns, or iris scans. This method of authentication is considered to be very secure because these physical or behavioral characteristics are unique to each individual and extremely difficult to replicate.\n\nThe incorrect answers:\n\"Firewall\": A firewall is a network security device that monitors and filters incoming and outgoing network traffic based on an organization's previously established security policies. Firewalls act as a barrier between trusted internal networks and untrusted external networks such as the Internet. While firewalls can control access to a network or system, they are more associated with network security rather than access control.\n\"Encryption\": Encryption is a method of converting data into a code to prevent unauthorized access. It is used to protect sensitive information as it is sent across networks, ensuring that the data cannot be read if it is intercepted during transmission. While encryption protects data, it is not specifically an access control mechanism.\n\"Steganography\": Steganography is the practice of hiding secret data within non-secret data. Steganography can be used to conceal messages within images, audio files, video files, or even text documents. Like encryption, steganography is used to protect information but it is not an access control mechanism. Instead, it is more about hiding information rather than controlling access to it.","explanation_th":"คำตอบที่ถูกคือ D เพราะชีวมิติใช้ยืนยันว่าผู้ขอเข้าถึงเป็นบุคคลที่ได้รับอนุญาต A ควบคุมการรับส่งข้อมูลเครือข่าย B ปกป้องความลับ และ C ซ่อนการมีอยู่ของข้อมูล จึงไม่ใช่กลไกยืนยันตัวตนของผู้ใช้โดยตรงตามโจทย์"},{"number":41,"id":102018207,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is an example of a non-repudiation service?","question_th":"ข้อใดเป็นตัวอย่างของบริการ non-repudiation","options":[{"en":"Digital signature","th":"ลายมือชื่อดิจิทัล"},{"en":"Encryption","th":"การเข้ารหัส"},{"en":"Access control","th":"การควบคุมการเข้าถึง"},{"en":"Data leakage prevention","th":"Data Leakage Prevention"}],"correct":[0],"explanation_en":"The correct answer: \nDigital Signature: A digital signature is a cryptographic technology that is used to verify the authenticity and integrity of a digital message, software, or document. It provides non-repudiation services because it prevents someone from denying having signed a message or document after the fact. It achieves this by creating a unique hash of the data, which is then encrypted using the sender's private key. If the receiver can decrypt the hash using the sender's public key and it matches the hash of the data, it proves that the data came from the sender and was not tampered with, therefore providing non-repudiation.\n\nThe incorrect answers:\nEncryption is a method of securing data by converting it into a format that is unreadable by anyone except those possessing the key to decode it. While it does provide data confidentiality, it does not provide non-repudiation. Encryption is designed to prevent unauthorized access to information, but it does not inherently link a particular action or piece of data to a specific individual in an undeniable manner. Encryption on its own is insufficient to provide non-repudiation.\nAccess control refers to methods that are used to restrict access to resources in a computing environment. It's about defining who (or what) is allowed to access what resources. This includes techniques such as usernames and passwords, access control lists (ACLs), and more complex role-based access control. While access control can help prevent unauthorized actions, it does not provide non-repudiation because it does not provide a method of tying a particular action definitively to a specific individual in a manner that cannot be denied.\nData leakage prevention (DLP) refers to a set of tools and processes used to ensure that sensitive data is not lost, misused, or accessed by unauthorized users. It's about identifying potential data breaches/data ex-filtration transmissions and preventing them by monitoring, detecting, and blocking sensitive data in motion, in use, and at rest. While DLP is an important part of many security strategies, it does not provide non-repudiation as it does not definitively link actions to individuals in a manner that cannot be denied.","explanation_th":"คำตอบที่ถูกคือ A เพราะ digital signature พิสูจน์แหล่งที่มาและความสมบูรณ์ของข้อมูล ทำให้ผู้ลงนามปฏิเสธการกระทำได้ยาก B ให้ความลับ C กำหนดสิทธิ์ และ D ป้องกันข้อมูลรั่วไหล แต่ไม่ให้หลักฐานการลงนามหรือการส่งข้อความแบบเดียวกัน"},{"number":42,"id":102018209,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Louise is the IT security manager for a large financial institution. She has recently implemented a new access control system that utilizes multi-factor authentication for all employees to access sensitive data. One of her employees, Hanna, has reported that she is unable to access certain data that she should have access to. After investigating the issue, Louise discovers that Hanna's access privileges were inadvertently revoked by another employee. What is the most appropriate action to take in this situation?","question_th":"พนักงานถูกเพิกถอนสิทธิ์โดยไม่ตั้งใจและไม่สามารถเข้าถึงข้อมูลที่ควรใช้ได้ การดำเนินการใดเหมาะสมที่สุด","options":[{"en":"Reassign Hanna's access privileges to the appropriate level.","th":"คืนสิทธิ์ของพนักงานให้ถูกต้องตามระดับที่ควรได้รับ"},{"en":"Have Hanna go through the multi-factor authentication process again to verify her identity.","th":"ให้พนักงานทำ MFA ใหม่"},{"en":"Have Hanna go through the entire onboarding process again, including security training and background checks.","th":"ให้พนักงานผ่าน onboarding ทั้งหมดใหม่"},{"en":"Terminate Hanna's employment for security breaches.","th":"เลิกจ้างพนักงานเนื่องจากเหตุละเมิดความปลอดภัย"}],"correct":[0],"explanation_en":"The correct answer: \nReassign Hanna's access privileges to the appropriate level: This is the most reasonable and efficient solution. The issue at hand is that Hanna's access privileges were mistakenly revoked. The most direct way to resolve the problem is to reassign these privileges at the level that is appropriate for her role. This should allow Hanna to access the data she needs for his work. We might also want to investigate how it happened to see if we want to implement further checks to avoid this in the future.\n\nThe incorrect answers:\nHave Hanna go through the multi-factor authentication process again to verify her identity: The issue isn't with Hanna's identity verification, but rather with her access privileges. Re-doing the multi-factor authentication won't restore the access to the resources she needs. \nHave Hanna go through the entire onboarding process again, including security training and background checks: This approach is unnecessary and time-consuming. The issue doesn't stem from Hanna's actions or a lack of training. It's a mistake in the access control settings. Also, making an employee repeat the onboarding process because of a simple administrative error could lead to frustration and lower morale. \nTerminate Hanna's employment for security breaches: This is inappropriate because Hanna didn't commit any security breaches. In fact, she reported the problem. Her access was revoked due to an internal administrative error, not because of her own actions. Taking such a drastic step as termination would not only be unjust, but it could also create a hostile environment where employees may be afraid to report problems in the future.","explanation_th":"คำตอบที่ถูกคือ A เพราะสาเหตุคือการกำหนด authorization ผิด จึงควรแก้สิทธิ์ให้ตรงกับบทบาท B ยืนยันตัวตนซ้ำแต่ไม่แก้สิทธิ์ที่ถูกเพิกถอน C เกินความจำเป็นเพราะตัวตนและสถานะพนักงานยังถูกต้อง และ D ไม่มีเหตุผลเพราะพนักงานไม่ได้ก่อเหตุละเมิด"},{"number":43,"id":102018211,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the definition of access control?","question_th":"คำจำกัดความของ access control คือข้อใด","options":[{"en":"The management and distribution of keys for physical security","th":"การจัดการและแจกจ่ายกุญแจสำหรับความปลอดภัยทางกายภาพ"},{"en":"The ability to access and manipulate data within a system","th":"ความสามารถในการเข้าถึงและแก้ไขข้อมูลภายในระบบ"},{"en":"The prevention of unauthorized access to assets","th":"การป้องกันการเข้าถึงสินทรัพย์โดยไม่ได้รับอนุญาต"},{"en":"The provision of resources to users based on their roles and responsibilities","th":"การจัดสรรทรัพยากรให้ผู้ใช้ตามบทบาทและความรับผิดชอบ"}],"correct":[2],"explanation_en":"The correct answer:\nAccess control is a security measure that is implemented to prevent unauthorized access to assets within a system. It's a process that allows, denies, or restricts access to a resource. It ensures that only authenticated and authorized users can access specific resources, thus preventing unauthorized access. It does this through a variety of methods, such as implementing passwords, biometrics, two-factor authentication, and more.\n\nThe incorrect answers:\nWhile physical keys might be part of an organization's overall security strategy, access control in the context of information technology is much broader. It involves managing digital access to data and network resources, not just physical locations.\nThe ability to access and manipulate data within a system is not a correct definition of access control. While access control policies do govern who can access and manipulate data, they also cover access to networks, systems, applications, functions, and even physical locations. The focus of access control is limiting and regulating access based on a user's identity and authorization level, not the ability to access and manipulate data itself.\nThe provision of resources to users based on their roles and responsibilities is a description of role-based access control (RBAC), a type of access control. However, it does not capture the full definition of access control, which includes other models like discretionary access control (DAC) and mandatory access control (MAC). Access control involves more than just role-based provisions; it encompasses a range of methodologies to prevent unauthorized access to assets.","explanation_th":"คำตอบที่ถูกคือ C เพราะเป้าหมายกว้างของ access control คือป้องกัน subject ที่ไม่ได้รับอนุญาตจากการใช้สินทรัพย์ A จำกัดเฉพาะกุญแจทางกายภาพ B อธิบายความสามารถของผู้ใช้โดยไม่กล่าวถึงการอนุญาต และ D เป็นวิธีหนึ่งของ RBAC ไม่ใช่นิยามครอบคลุมทั้งหมด"},{"number":44,"id":102018213,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As a Chief Information Security Officer (CISO), you are evaluating the access control protocols of your organization. Your team is deliberating over the use of Type 2 (something you have) and Type 3 (something you are) authentication factors to strengthen the security posture. During a discussion about various options available within these categories, the potential of using cookies on a user's computer as a Type 2 authentication factor comes up. Which of the following best articulates the limitations of using cookies on a user's computer as a Type 2 authentication factor?","question_th":"ข้อจำกัดสำคัญของการใช้ cookie บนคอมพิวเตอร์เป็นปัจจัย Type 2 (สิ่งที่มี) คือข้อใด","options":[{"en":"Cookies can be easily deleted by the user.","th":"ผู้ใช้ลบ cookie ได้ง่าย"},{"en":"Cookies can be easily manipulated or stolen.","th":"cookie ถูกแก้ไขหรือขโมยได้ง่าย"},{"en":"Cookies do not provide unique identification.","th":"cookie ไม่สามารถระบุตัวตนแบบไม่ซ้ำได้"},{"en":"Cookies require regular updates to maintain their integrity.","th":"cookie ต้องอัปเดตสม่ำเสมอเพื่อรักษาความสมบูรณ์"}],"correct":[1],"explanation_en":"The correct answer:\nCookies on a user's PC, while serving as a token of authentication, present a serious risk as they can be easily manipulated or stolen by attackers. Once an attacker has access to a user's machine, they can steal cookies to gain unauthorized access to the user's session, often bypassing other forms of authentication. This is known as session hijacking. Also, Cross-Site Scripting (XSS) attacks can be used to steal cookies over the internet, enhancing the vulnerability of relying on cookies as a Type 2 authentication factor.\n\nThe incorrect answers:\nIt is true that users can easily delete cookies, leading to inconvenience and potentially requiring reauthentication, but this is not a primary security concern. Deletion is a user-controlled action and typically doesn't expose the system to external threats.\nAlthough cookies do not provide unique identification themselves (that's the role of Type 1 and Type 3 factors), they do serve as tokens representing authenticated sessions. Their role isn't to identify the user, but to verify that the user has already been authenticated.\nRegular updates might be necessary for some forms of tokens, but cookies themselves do not generally require updates to maintain their integrity. However, the systems handling cookies (like browsers or servers) need to be updated and patched regularly to avoid vulnerabilities that may affect cookie security. Still, this is less of a fundamental limitation and more of an operational requirement.","explanation_th":"คำตอบที่ถูกคือ B เพราะ cookie เป็นข้อมูลซอฟต์แวร์ที่มัลแวร์หรือผู้โจมตีอาจคัดลอก ขโมย หรือดัดแปลง แล้วนำไปสวมรอยได้ A เป็นข้อจำกัดด้านความคงอยู่แต่ไม่ใช่ความเสี่ยงหลัก C ไม่จริงเสมอเพราะ cookie สามารถบรรจุค่าเฉพาะได้ และ D ไม่ใช่ข้อจำกัดหลักของการใช้เป็น possession factor"},{"number":45,"id":102018215,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the IT Security Manager for a multinational corporation, your organization is considering transitioning from Kerberos to the Secure European System for Applications in Multi-vendor Environments (SESAME) due to its enhanced security measures. However, you're aware of some of the challenges that could come with this shift. When considering a transition to SESAME, what should be your primary concern?","question_th":"เมื่อต้องเปลี่ยนจาก Kerberos ไปใช้ SESAME ความกังวลหลักควรเป็นข้อใด","options":[{"en":"SESAME's use of Public Key Infrastructure (PKI)","th":"SESAME ใช้ PKI"},{"en":"Resistance to change because Kerberos is native to most operating systems","th":"แรงต้านการเปลี่ยนแปลง เพราะ Kerberos มีติดมากับระบบปฏิบัติการส่วนใหญ่"},{"en":"SESAME's enhanced security over Kerberos","th":"SESAME มีความปลอดภัยสูงกว่า Kerberos"},{"en":"Management of plaintext storage of the symmetric keys","th":"การจัดการกุญแจสมมาตรที่เก็บเป็นข้อความธรรมดา"}],"correct":[1],"explanation_en":"The correct answer:\nKerberos, despite its limitations, is natively integrated into most operating systems, which means a transition to a different protocol like SESAME can encounter substantial resistance. This resistance can come from both a technical standpoint (reconfiguring systems, training IT staff on the new protocol) and a human standpoint (end-user training, familiarity). The cost of the transition, both in terms of time and resources, may be significant and might face opposition from different stakeholders in the organization.\n\nThe incorrect answers:\nAlthough SESAME's use of PKI adds an additional layer of security by utilizing asymmetric encryption, this should not be viewed as a primary concern. The integration of PKI into the SESAME protocol enhances security by eliminating some of the vulnerabilities associated with Kerberos. It might require some additional configuration and management, but this is generally seen as a benefit, not a concern.\nSESAME's enhanced security over Kerberos is generally a positive aspect and a driving reason for considering the transition to SESAME in the first place. It will require some work to implement, but the enhanced security provided by SESAME (including the use of PKI and more secure handling of credentials) should be seen as a benefit to the organization rather than a primary concern.\nManaging the plaintext storage of symmetric keys is a concern with Kerberos, but SESAME resolves this issue by using PKI and asymmetric encryption. This is not a primary concern when considering a transition to SESAME, but rather a benefit of making the switch.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะ Kerberos มีการใช้อย่างแพร่หลายและรองรับโดยระบบปฏิบัติการจำนวนมาก การย้ายไป SESAME จึงมีต้นทุนด้านความเข้ากันได้ การฝึกอบรม และการยอมรับ A และ C เป็นคุณลักษณะหรือประโยชน์ ไม่ใช่ความท้าทายหลัก ส่วน D ไม่ใช่ประเด็นหลักที่ต้นฉบับระบุสำหรับการเปลี่ยนครั้งนี้"},{"number":46,"id":102018217,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the fastest way to securely access cloud data?","question_th":"วิธีที่เร็วและปลอดภัยที่สุดในการเข้าถึงข้อมูลบนคลาวด์คือข้อใด","options":[{"en":"Use a virtual private network (VPN)","th":"ใช้ VPN"},{"en":"Use an unsecured public Wi-Fi network","th":"ใช้ Wi-Fi สาธารณะที่ไม่ปลอดภัย"},{"en":"Use a private connection over a dedicated line","th":"ใช้การเชื่อมต่อส่วนตัวผ่านวงจรเฉพาะ"},{"en":"Use a shared password with authorized users","th":"แบ่งปันรหัสผ่านกับผู้ใช้ที่ได้รับอนุญาต"}],"correct":[2],"explanation_en":"The correct answer:\nA private connection over a dedicated line, such as a leased line or a direct internet connection (DIC), provides the most secure method for accessing cloud data. This type of connection offers higher speed and less latency compared to other options because you are not sharing bandwidth with other users. In terms of security, because it is private, the chances of unauthorized access are significantly lower compared to shared or public connections.\n\nThe incorrect answers:\nVPNs can offer a secure way to access cloud data as they create a private tunnel for data transmission over a public network. This tunnel is encrypted to maintain the confidentiality and integrity of data. However, VPNs can often introduce some latency due to the encryption/decryption process and the extra distance that data needs to travel to reach the VPN server, so they might not be the fastest way to access cloud data.\nUsing an unsecured public Wi-Fi network to access cloud data is not recommended due to the significant security risks involved. Public Wi-Fi networks are common targets for attackers to intercept data, making them unsuitable for accessing sensitive information in the cloud.\nSharing passwords with multiple users can lead to significant security risks, such as unauthorized data access if the shared password is compromised. It also makes it difficult to track individual user activity. Furthermore, this practice doesn't necessarily enhance the speed of accessing cloud data.","explanation_th":"คำตอบที่ถูกคือ C เพราะ dedicated private connection ให้เส้นทางตรง ควบคุมได้ มีความหน่วงคงที่ และลดการสัมผัสอินเทอร์เน็ตสาธารณะ A ปลอดภัยแต่มี overhead และขึ้นกับอินเทอร์เน็ต B เสี่ยงต่อการดักข้อมูล และ D ทำลายการระบุตัวตนและ accountability"},{"number":47,"id":102018219,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"ThorTeaches.com has implemented a new access control system for its employees. The system requires all employees to use a unique username and password to log in to the company's network. However, you have received reports from some employees that they are able to log in using someone else's username and password. What is the most likely cause of this issue?","question_th":"ระบบกำหนดชื่อผู้ใช้และรหัสผ่านเฉพาะบุคคล แต่พนักงานกลับเข้าสู่ระบบด้วยข้อมูลของผู้อื่นได้ สาเหตุที่เป็นไปได้มากที่สุดคือข้อใด","options":[{"en":"The access control system is not configured correctly","th":"ระบบควบคุมการเข้าถึงตั้งค่าไม่ถูกต้อง"},{"en":"Employees are sharing their login information","th":"พนักงานแบ่งปันข้อมูลล็อกอินกัน"},{"en":"The employees' passwords are too easy to guess","th":"รหัสผ่านของพนักงานเดาง่ายเกินไป"},{"en":"The access control system has been hacked","th":"ระบบควบคุมการเข้าถึงถูกแฮ็ก"}],"correct":[1],"explanation_en":"The correct answer: \nEmployees are sharing their login information: This is the most likely cause. If employees can log in using someone else's credentials, it's often because they have been shared, intentionally or unintentionally. While it's possible that other factors, such as a misconfigured system, weak passwords, or even a breach, could be contributing factors, the ability for one employee to use another's credentials typically points to credential sharing directly. It's essential to ensure employees know the risks of sharing their login information and are educated about keeping their credentials confidential. \n\nThe incorrect answers: \nThe access control system needs to be configured correctly: While configuration errors can lead to security issues, it's less likely that such an error would allow employees to log in with each other's credentials. Access control systems are generally designed to prevent this behavior, and a misconfiguration that will enable it would be a severe and obvious mistake. \nThe employees' passwords are too easy to guess: If employees can log in using another person's credentials, it's not likely due to simple or easy-to-guess passwords. Easy-to-guess passwords can lead to unauthorized access, but typically, this would be by external actors, not other employees. Moreover, guessing someone else's password correctly is still quite challenging unless the password is straightforward, such as \"password\" or \"123456\". \nThe access control system has been hacked: While this is a possibility, it's relatively unlikely compared to the possibility of employees sharing their login information. Hacking would typically involve more sophisticated methods of unauthorized access rather than simply logging in with another employee's credentials. A hacking incident may present additional signs of a breach, such as unusual network traffic or unauthorized activities.","explanation_th":"คำตอบที่ถูกคือ B เพราะการใช้ username/password ของผู้อื่นได้โดยตรงบ่งชี้ว่าข้อมูลรับรองถูกส่งต่อกัน A C และ D เป็นไปได้ในบางสถานการณ์ แต่โจทย์ไม่ได้ให้หลักฐานว่าระบบผิดพลาด รหัสถูกเดา หรือมีการเจาะระบบ การแบ่งปัน credentials เป็นคำอธิบายตรงที่สุด"},{"number":48,"id":102018221,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the HIGHEST level of assurance provided by a Credential Service Provider (CSP)?","question_th":"ระดับการรับประกัน (assurance) สูงที่สุดที่ Credential Service Provider ให้ได้ตามตัวเลือกคือระดับใด","options":[{"en":"Level 1","th":"Level 1"},{"en":"Level 2","th":"Level 2"},{"en":"Level 3","th":"Level 3"},{"en":"Level 4","th":"Level 4"}],"correct":[3],"explanation_en":"The correct answer:\nIn a credential service provider (CSP) framework, Level 4 provides the highest level of assurance. This level is often used in situations that require a very high level of security, such as in government or military applications. Level 4 requires a robust identity proofing process, hardware cryptographic tokens, and strict control over the token's distribution and activation. Level 4 also requires strong, two-factor authentication, where two separate and independent factors must be used in the authentication process.\n\nThe incorrect answers:\nLevel 1 is the lowest level of assurance provided by a CSP. It requires little or no identity proofing and provides only basic assurance that the user is who they claim to be. The authentication mechanism may be susceptible to simple threats.\nLevel 2 provides a higher level of assurance than Level 1, requiring identity proofing and authentication mechanisms that are resistant to straightforward physical and online threats. However, it's still not as secure as Level 3 or Level 4.\nLevel 3 provides a higher level of assurance than Level 2 and requires identity proofing and authentication mechanisms that are resistant to a variety of threats, including those from knowledgeable attackers. Still, Level 3 does not offer as much assurance as Level 4.","explanation_th":"คำตอบที่ถูกคือ D เพราะในโมเดลสี่ระดับที่แหล่งต้นฉบับใช้ Level 4 ต้องการการพิสูจน์ตัวตนและการป้องกัน credentials ที่เข้มงวดที่สุด A มีความเชื่อมั่นต่ำสุด ส่วน B และ C เพิ่มข้อกำหนดขึ้นตามลำดับแต่ยังต่ำกว่า Level 4"},{"number":49,"id":102018223,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the LEAST effective method for identifying individuals in a network?","question_th":"วิธีใดมีประสิทธิผลน้อยที่สุดในการระบุตัวบุคคลบนเครือข่าย","options":[{"en":"Biometric authentication","th":"การยืนยันตัวตนด้วยชีวมิติ"},{"en":"Knowledge-based authentication","th":"การยืนยันตัวตนโดยใช้ความรู้"},{"en":"Passwords","th":"รหัสผ่าน"},{"en":"Smart cards","th":"สมาร์ตการ์ด"}],"correct":[1],"explanation_en":"The correct answer:\nKnowledge-based authentication, also known as challenge-response authentication, relies on the user being able to provide answers to specific questions or challenges. This method can be easily bypassed if an attacker is able to obtain this information through social engineering or other means.\n\nThe incorrect answers:\nBiometric authentication is considered to be a more effective method for identification as it relies on unique physical characteristics of the user, such as their fingerprint or facial recognition, which are difficult to replicate.\nPasswords, while not as secure as biometric authentication, are still considered to be a fairly effective method of identification as long as they are strong and regularly changed.\nSmart cards, which use a physical card with a chip or magnetic strip containing authentication information, are also considered to be more effective than knowledge-based authentication.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะคำถามหรือข้อมูลความรู้ส่วนบุคคลอาจถูกเดา ค้นจากสื่อสังคม หรือรั่วจากฐานข้อมูลได้ง่าย ชีวมิติผูกกับลักษณะบุคคล สมาร์ตการ์ดเป็นสิ่งที่ผู้ใช้มี และรหัสผ่านแม้เป็น knowledge factor เช่นกันแต่สามารถเพิ่มความยาวและความซับซ้อนได้มากกว่าคำถามความรู้ทั่วไป"},{"number":50,"id":102018225,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following security control strategies is the MOST effective in preventing unauthorized access to sensitive information?","question_th":"กลยุทธ์การควบคุมใดมีประสิทธิผลที่สุดในการป้องกันการเข้าถึงข้อมูลอ่อนไหวโดยไม่ได้รับอนุญาต","options":[{"en":"Implementing two-factor authentication","th":"ใช้การยืนยันตัวตนสองปัจจัย"},{"en":"Installing antivirus software","th":"ติดตั้งซอฟต์แวร์ป้องกันไวรัส"},{"en":"Conducting regular security audits","th":"ตรวจสอบความปลอดภัยเป็นประจำ"},{"en":"Training employees on security best practices","th":"อบรมพนักงานเรื่องแนวปฏิบัติด้านความปลอดภัย"}],"correct":[0],"explanation_en":"The correct answer:\nTwo-factor authentication is the most effective option for preventing unauthorized access to sensitive information. It provides an additional layer of security beyond just a username and password. With two-factor authentication, even if an attacker is able to steal a user's password, they would still need the second factor (which could be a code sent to the user's phone, a fingerprint scan, etc.) to gain access. This makes it much more difficult for unauthorized individuals to access sensitive information.\n\nThe incorrect answers:\nWhile antivirus software is a crucial part of a holistic security strategy, it is not the most effective control for preventing unauthorized access to sensitive information. Antivirus software is primarily designed to detect and eliminate malware, but it doesn't directly protect against unauthorized access by individuals who obtain valid user credentials.\nSecurity audits are important for identifying vulnerabilities and ensuring that security controls are functioning as intended. However, they are reactive measures rather than proactive controls. Although they can identify where an unauthorized access may have occurred or where vulnerabilities exist, they do not in themselves prevent unauthorized access.\nTraining is an important part of any security strategy, but it is not the most effective control for preventing unauthorized access to sensitive data. Human error or negligence can still lead to security breaches, even when employees have been trained. Additionally, training does not protect against attacks that bypass the user entirely, such as those that exploit technical vulnerabilities.","explanation_th":"คำตอบที่ถูกคือ A เพราะ 2FA ทำให้ผู้โจมตีที่ได้รหัสผ่านยังต้องมีปัจจัยที่สองก่อนเข้าถึง B ป้องกันมัลแวร์เป็นหลัก C ตรวจหาจุดอ่อนแต่ไม่ขวางการล็อกอินในทันที และ D ลดความเสี่ยงจากมนุษย์แต่ไม่ใช่กลไกบังคับการเข้าถึงโดยตรง"},{"number":51,"id":102018227,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective method for preventing unauthorized access to sensitive data?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการป้องกันการเข้าถึงข้อมูลอ่อนไหวโดยไม่ได้รับอนุญาต","options":[{"en":"Implementing strong password policies","th":"ใช้นโยบายรหัสผ่านที่เข้มแข็ง"},{"en":"Conducting regular security audits","th":"ตรวจสอบความปลอดภัยเป็นประจำ"},{"en":"Implementing two-factor authentication","th":"ใช้การยืนยันตัวตนสองปัจจัย"},{"en":"Enabling firewalls on all network devices","th":"เปิดใช้ไฟร์วอลล์บนอุปกรณ์เครือข่ายทั้งหมด"}],"correct":[2],"explanation_en":"The correct answer:\nTwo-factor authentication (2FA) requires a user to present two separate forms of identification before they can access sensitive data. This typically involves something the user knows (such as a password) and something the user has (like a text message sent to their phone, or a physical token). This method provides an additional layer of security beyond a single-factor authentication method (like a password), as it ensures that even if a password is compromised, an attacker would still need the second factor to gain access.\n\nThe incorrect answers:\nWhile implementing strong password policies, such as requiring complex passwords and regular password changes, can help prevent unauthorized access to sensitive data, it is not the most effective method on its own. Hackers can still use various methods, such as dictionary attacks or social engineering, to guess or obtain users' passwords.\nRegular security audits, which involve assessing an organization's security systems and processes to identify vulnerabilities and potential risks, can help identify potential security issues and improve the organization's overall security posture. However, they do not directly prevent unauthorized access to sensitive data.\nFirewalls are important security tools that can help prevent unauthorized access to an organization's network by blocking incoming and outgoing traffic based on predefined rules. They do not prevent unauthorized access to sensitive data once an attacker has gained access to the network.","explanation_th":"คำตอบที่ถูกคือ C เพราะ 2FA ทำให้ผู้โจมตีต้องมีหลักฐานมากกว่ารหัสผ่านเพียงอย่างเดียว จึงลดความเสี่ยงจากรหัสผ่านรั่วหรือถูกเดา A ช่วยได้แต่ยังเป็นปัจจัยเดียว B ตรวจพบจุดอ่อนแต่ไม่ได้ขวางการเข้าถึงทันที และ D ป้องกันการรับส่งข้อมูลเครือข่ายแต่ไม่ยืนยันตัวผู้ใช้ที่เข้าถึงข้อมูล"},{"number":52,"id":102018229,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the FIRST step in implementing a hybrid IDaaS (Identity as a Service) solution?","question_th":"ขั้นตอนแรกในการนำโซลูชัน IDaaS แบบ hybrid มาใช้คือข้อใด","options":[{"en":"Identifying the specific business needs and requirements","th":"ระบุความต้องการและข้อกำหนดทางธุรกิจที่ชัดเจน"},{"en":"Migrating all existing user accounts and data to the cloud","th":"ย้ายบัญชีผู้ใช้และข้อมูลทั้งหมดขึ้นคลาวด์"},{"en":"Selecting a suitable cloud provider and negotiating a contract","th":"เลือกผู้ให้บริการคลาวด์และเจรจาสัญญา"},{"en":"Establishing secure and reliable connectivity between on-premises and cloud infrastructure","th":"สร้างการเชื่อมต่อที่ปลอดภัยระหว่างระบบภายในกับคลาวด์"}],"correct":[0],"explanation_en":"The correct answer:\nThe first step in implementing a hybrid IDaaS solution is to assess the organization's specific business needs and requirements. This includes identifying the type and amount of data that needs to be stored in the cloud, the level of security and access controls required, and the integration requirements with existing on-premises systems. Only after this assessment can the organization proceed to the next steps of selecting a cloud provider, establishing connectivity, and migrating user accounts and data.\n\nThe incorrect answers:\nMigrating user accounts and data to the cloud should not be the first step in implementing a hybrid IDaaS solution. This step should only be performed after the organization has assessed its specific business needs and requirements, selected a suitable cloud provider, and established secure and reliable connectivity between on-premises and cloud infrastructure.\nSelecting a cloud provider and negotiating a contract should not be the first step in implementing a hybrid IDaaS solution. This step should only be performed after the organization has assessed its specific business needs and requirements and established secure and reliable connectivity between on-premises and cloud infrastructure.\nEstablishing secure and reliable connectivity between on-premises and cloud infrastructure should not be the first step in implementing a hybrid IDaaS solution. This step should only be performed after the organization has assessed its specific business needs and requirements and selected a suitable cloud provider.","explanation_th":"คำตอบที่ถูกคือ A เพราะต้องเข้าใจกรณีใช้งาน ขอบเขต ความเสี่ยง และข้อกำหนดก่อนจึงจะออกแบบสถาปัตยกรรมหรือเลือกผู้ให้บริการได้ B อาจไม่เหมาะกับ hybrid และเร็วเกินไป C ควรเกิดหลังทราบความต้องการ และ D เป็นขั้นตอนทางเทคนิคที่ตามมาหลังการวางแผน"},{"number":53,"id":102018231,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is NOT a characteristic of the public cloud deployment model?","question_th":"ข้อใดไม่ใช่ลักษณะของรูปแบบการใช้งาน public cloud","options":[{"en":"The provider manages and maintains the infrastructure and services","th":"ผู้ให้บริการบริหารและบำรุงรักษาโครงสร้างพื้นฐานและบริการ"},{"en":"Data is stored on the provider's physical premises","th":"ข้อมูลถูกจัดเก็บในสถานที่ทางกายภาพของผู้ให้บริการ"},{"en":"Users access the cloud services over the internet","th":"ผู้ใช้เข้าถึงบริการคลาวด์ผ่านอินเทอร์เน็ต"},{"en":"Users have full control over the data and infrastructure","th":"ผู้ใช้ควบคุมข้อมูลและโครงสร้างพื้นฐานได้ทั้งหมด"}],"correct":[3],"explanation_en":"The correct answer:\nUsers have full control over the data and infrastructure is NOT a characteristic of the public cloud deployment model. In a public cloud model, the cloud service provider owns, manages, and maintains the underlying infrastructure, which is shared by multiple users or organizations. Customers have limited control and visibility over the infrastructure.\n\nThe incorrect answers:\nThe provider manages and maintains the infrastructure and services: This is true for public cloud, as the cloud service provider is responsible for managing and maintaining the underlying infrastructure and services.\nData is stored on the provider's physical premises: In public cloud, data is stored on the provider's physical infrastructure, which is shared among multiple customers.\nUsers access the cloud services over the internet: Public cloud services are accessed via the internet, allowing users to access resources and services from any location with an internet connection.","explanation_th":"คำตอบที่ถูกคือ D เพราะใน public cloud ผู้ให้บริการเป็นผู้ควบคุมโครงสร้างพื้นฐานพื้นฐาน ลูกค้าควบคุมเฉพาะส่วนที่บริการอนุญาต A B และ C เป็นลักษณะทั่วไปของ public cloud ได้แก่ ผู้ให้บริการดูแลระบบ ข้อมูลอยู่ในศูนย์ข้อมูลของผู้ให้บริการ และเข้าถึงผ่านเครือข่ายสาธารณะ"},{"number":54,"id":102018233,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"After our CEO had issues getting her finger printer reader to recognize her fingerprint, she wanted us to lower the sensitivity of the readers. What could be a NEGATIVE side effect of doing what she is asking us to do?","question_th":"หากลดความไวของเครื่องอ่านลายนิ้วมือเพื่อให้รับลายนิ้วมือได้ง่ายขึ้น ผลเสียที่อาจเกิดขึ้นคือข้อใด","options":[{"en":"It could increase the number of false positives.","th":"จำนวน false positive อาจเพิ่มขึ้น"},{"en":"It could decrease the number of false negatives.","th":"จำนวน false negative อาจลดลง"},{"en":"It could reduce the overall security of the system.","th":"ความปลอดภัยโดยรวมของระบบอาจลดลง"},{"en":"It could increase the overall security of the system.","th":"ความปลอดภัยโดยรวมของระบบอาจเพิ่มขึ้น"}],"correct":[2],"explanation_en":"The correct answer:\nIt could reduce the overall security of the system: Lowering the sensitivity of a fingerprint reader would make it less stringent in its verification of fingerprints. This could potentially allow more false positives, i.e., situations where unauthorized users are granted access because their fingerprints were wrongly recognized as a match. Essentially, by lowering the sensitivity, we're compromising on the strictness of the verification process, which directly impacts the overall security of the system.\n\nThe incorrect answers:\nIt could increase the number of false positives: Although this answer might seem correct at first glance, it's not the best choice because the number of false positives is only one aspect of system security. While it's true that lowering the sensitivity of the fingerprint reader might lead to an increase in false positives, the most significant and direct effect is on the overall security of the system. This answer is not entirely incorrect, but it doesn't capture the full breadth of the impact on the system as the correct answer does.\nIt could decrease the number of false negatives: A false negative occurs when a legitimate user is incorrectly denied access, because the system fails to recognize their fingerprint. While it's true that lowering the sensitivity might decrease the number of false negatives, this is not a negative side effect as implied by the question. Reducing false negatives could improve user experience, but it might be at the cost of system security.\nIt could increase the overall security of the system: Lowering the sensitivity of a fingerprint reader generally reduces the overall security of the system, not increase it. This is because the system becomes less strict in verifying the identity of users, potentially granting access to unauthorized individuals. This is the opposite of the intended effect, making this answer incorrect.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะการผ่อนเกณฑ์จับคู่ทำให้ระบบยอมรับตัวอย่างที่ไม่ตรงกันได้ง่ายขึ้น จึงลดความเชื่อมั่นของการยืนยันตัวตน A อาจเป็นกลไกที่นำไปสู่ความปลอดภัยลดลง และ B เป็นประโยชน์ด้าน usability ไม่ใช่ผลเสีย ส่วน D ตรงข้ามกับผลที่คาด"},{"number":55,"id":102018235,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"ThorTeaches.com has recently undergone a merger and acquisition, resulting in a significant increase in the number of employees and access points to the company's network and systems. As the IT security manager, you are responsible for ensuring the security of the company's data and systems. What is the best practice for de-provisioning employee access to the company's network and systems?","question_th":"แนวปฏิบัติที่ดีที่สุดในการยกเลิกสิทธิ์พนักงานหลังสิ้นสุดการจ้างงานคือข้อใด","options":[{"en":"Terminating employee access immediately upon termination of employment","th":"ยกเลิกสิทธิ์ทันทีเมื่อการจ้างงานสิ้นสุด"},{"en":"Waiting 30 days after termination of employment to terminate employee access","th":"รอ 30 วันก่อนยกเลิกสิทธิ์"},{"en":"Reviewing and revoking access rights on a weekly basis","th":"ทบทวนและเพิกถอนสิทธิ์สัปดาห์ละครั้ง"},{"en":"Implementing a multi-factor authentication system","th":"ใช้ระบบ MFA"}],"correct":[0],"explanation_en":"The correct answer:\nTerminating employee access immediately upon termination of employment: When an employee leaves a company, it is a best practice to terminate their access to the company's systems and data immediately. This is done to protect the company's information and systems from unauthorized access and potential misuse. Even if the employee leaves on good terms, there is still a risk associated with the potential for their credentials to be compromised. Therefore, the immediate termination of access helps to minimize this risk. This approach also aligns with the principle of least privilege, which suggests that individuals should only have the access necessary to perform their job functions and no more.\n\nThe incorrect answers:\nWaiting 30 days after termination of employment to terminate employee access: Waiting for 30 days after an employee's termination to revoke their access is a poor security practice. During this period, the former employee still has the potential to access sensitive company data and systems, which could lead to data breaches, intellectual property theft, or other security incidents. Even if the employee does not have malicious intent, their account could be compromised by a third party during this period.\nReviewing and revoking access rights on a weekly basis: While regular reviews of access rights is a good security practice, this approach is not sufficient for managing the deprovisioning of employee access. When an employee leaves the company, their access should be terminated immediately, not during the next scheduled review. Waiting until the next review cycle would leave a window of time during which the former employee could still potentially access company systems and data.\nImplementing a multi-factor authentication system: While multi-factor authentication is a critical component of a robust security program and can help protect against unauthorized access, it doesn't directly address the deprovisioning of access when an employee leaves the company. An ex-employee's account with multi-factor authentication is still a potential security risk if not deactivated immediately upon termination. Furthermore, this option is more about enhancing access control measures for current employees rather than managing the access of departing ones.","explanation_th":"คำตอบที่ถูกคือ A เพราะบัญชีของอดีตพนักงานควรถูกปิดตามเวลาที่ HR ยืนยันการสิ้นสุดงาน เพื่อลดโอกาสใช้สิทธิ์หลังหมดหน้าที่ B และ C เปิดช่องว่างเวลาให้บัญชียังใช้งานได้ ส่วน D เพิ่มความปลอดภัยในการล็อกอินแต่ไม่ทดแทนการ de-provision บัญชีที่ไม่ควรมีอยู่"},{"number":56,"id":102018237,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"We have implemented contactless ID cards in our organization. Which type of technology do they use?","question_th":"บัตรประจำตัวแบบไร้สัมผัสใช้เทคโนโลยีประเภทใด","options":[{"en":"Magnetic stripe technology","th":"แถบแม่เหล็ก"},{"en":"Radio-frequency identification (RFID) technology","th":"Radio-Frequency Identification (RFID)"},{"en":"Barcode technology","th":"บาร์โค้ด"},{"en":"Optical character recognition (OCR) technology","th":"Optical Character Recognition (OCR)"}],"correct":[1],"explanation_en":"The correct answer: \nRadio-frequency identification (RFID) technology is typically used in contactless ID cards. This technology uses radio waves to read and capture data stored on a tag attached to an object (in this case, an ID card). The tag can be read from several feet away and doesn't need to be within the direct line of sight of the reader to be tracked, which makes it ideal for contactless applications. Contactless ID cards are often used in organizations for access control, attendance tracking, and even cashless transactions.\n\nThe incorrect answers:\nMagnetic stripe technology is not usually used in contactless ID cards. Instead, this technology is often used in credit and debit cards, hotel key cards, or other swipe cards. A magnetic stripe card must be physically swiped through a reader for the data to be read, which doesn't fit the contactless requirement.\nBarcode technology also doesn't typically feature in contactless ID cards. With this technology, an optical machine-readable representation of data is used, which must be physically scanned with a laser scanner. Like magnetic stripe technology, this requires direct contact or close proximity, and hence, doesn't suit the definition of contactless technology.\nOptical character recognition (OCR) technology converts different types of documents, such as scanned paper documents, PDF files, or images captured by a digital camera, into editable and searchable data. While this technology is widely used in many applications like data entry, passport recognition, and invoice scanning, it isn't commonly used in contactless ID cards. OCR would require a visual scanner and direct line of sight, which does not align with the concept of contactless technology.","explanation_th":"คำตอบที่ถูกคือ B เพราะ RFID ใช้คลื่นวิทยุสื่อสารระหว่างบัตรกับเครื่องอ่านโดยไม่ต้องสัมผัส A ต้องรูดหรือสัมผัสหัวอ่าน C ต้องใช้การสแกนภาพ และ D ใช้แปลงตัวอักษรจากภาพ ไม่ใช่เทคโนโลยีบัตรไร้สัมผัส"},{"number":57,"id":102018239,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST effective way to prevent unauthorized access to sensitive data in an organization?","question_th":"วิธีใดมีประสิทธิผลที่สุดในการป้องกันการเข้าถึงข้อมูลอ่อนไหวโดยไม่ได้รับอนุญาตภายในองค์กรตามแหล่งต้นฉบับ","options":[{"en":"Implementing user authentication and access control measures","th":"ใช้การยืนยันตัวตนและมาตรการควบคุมการเข้าถึง"},{"en":"Regularly conducting penetration testing","th":"ทดสอบเจาะระบบเป็นประจำ"},{"en":"Implementing network segmentation and firewalls","th":"ใช้การแบ่งส่วนเครือข่ายและไฟร์วอลล์"},{"en":"Implementing compartmentalization","th":"ใช้การแบ่งข้อมูลเป็นส่วนจำกัด (compartmentalization)"}],"correct":[3],"explanation_en":"The correct answer:\nCompartmentalization involves dividing an organization's data and systems into smaller, separate units or compartments, with access to each compartment strictly controlled and limited to only those who need it for their job tasks. This helps prevent unauthorized access to sensitive data and ensures that only authorized personnel can access the data they need.\n\nThe incorrect answers:\nImplementing user authentication and access control measures are critical components of an effective security strategy, they may not be the most effective way to protect sensitive data. For instance, if a user's credentials are compromised, an attacker may still be able to access sensitive data. Even though important, they are not the most comprehensive solution.\nPenetration testing is a proactive method of identifying vulnerabilities in a system. It does not directly prevent unauthorized access but helps organizations identify weak points that could be exploited, thus allowing for the improvement of their defenses.\nNetwork segmentation and firewalls are important security measures, but they primarily protect against network-level attacks and might not be effective against other forms of attacks like social engineering or physical breaches. Moreover, these measures do not directly control access to specific data once inside the network. While they can help to prevent unauthorized network access, they might not be the most effective at preventing unauthorized data access.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ D เพราะ compartmentalization แยกข้อมูลและสิทธิ์ออกเป็นส่วน ๆ ทำให้ผู้ใช้เข้าถึงได้เฉพาะส่วนที่จำเป็นและจำกัดผลกระทบเมื่อบัญชีถูกเจาะ A เป็นพื้นฐานสำคัญแต่กว้างกว่า B ใช้ค้นหาจุดอ่อน และ C จำกัดเส้นทางเครือข่ายแต่ไม่จำกัดข้อมูลเชิงหน้าที่ได้ละเอียดเท่า"},{"number":58,"id":102018241,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"The HR department at ThorTeaches.com has approached you with a request to create an access control system for their employee records. What is the main goal of an access control system?","question_th":"เป้าหมายหลักของระบบควบคุมการเข้าถึงคือข้อใด","options":[{"en":"To prevent unauthorized access to resources","th":"ป้องกันการเข้าถึงทรัพยากรโดยไม่ได้รับอนุญาต"},{"en":"To monitor user activity","th":"เฝ้าติดตามกิจกรรมผู้ใช้"},{"en":"To encrypt data","th":"เข้ารหัสข้อมูล"},{"en":"To restrict access based on user attributes","th":"จำกัดสิทธิ์ตามคุณลักษณะผู้ใช้"}],"correct":[0],"explanation_en":"The correct answer:\nThe main goal of an access control system is to prevent unauthorized access to resources. This can involve a range of resources, including physical locations, computer systems, network resources, or data. An access control system helps an organization ensure that only individuals who have been granted appropriate permissions can access specific resources, thus maintaining security and integrity.\n\nThe incorrect answers:\nWhile monitoring user activity is an important aspect of security, it is not the main goal of an access control system. The primary function of access control is to regulate who can access resources, not to monitor what they do once they have access.\nEncrypting data is a common security measure that transforms plaintext data into an unreadable format until it's decrypted using a specific key. Encryption is a vital part of data security but it's not the primary goal of an access control system.\nRestricting access based on user attributes is a common approach in attributed-based access control (ABAC) systems but it is not the main goal of an access control system. The main goal is to prevent unauthorized access, not to restrict access based on user attributes.","explanation_th":"คำตอบที่ถูกคือ A เพราะวัตถุประสงค์หลักของ access control คือให้เฉพาะ subject ที่ได้รับอนุญาตใช้ resource ได้ B เป็นส่วนของ monitoring และ accountability C เป็นการปกป้องความลับ ส่วน D เป็นวิธีหนึ่งของ ABAC ไม่ใช่เป้าหมายครอบคลุมทั้งหมด"},{"number":59,"id":102018243,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the primary function of access control?","question_th":"หน้าที่หลักของ access control คือข้อใด","options":[{"en":"To ensure data confidentiality","th":"รับรองความลับของข้อมูล"},{"en":"To prevent unauthorized access to systems and networks","th":"ป้องกันการเข้าถึงระบบและเครือข่ายโดยไม่ได้รับอนุญาต"},{"en":"To ensure data integrity","th":"รับรองความถูกต้องครบถ้วนของข้อมูล"},{"en":"To protect against external threats","th":"ป้องกันภัยคุกคามภายนอก"}],"correct":[1],"explanation_en":"The correct answer:\nTo prevent unauthorized access to systems and networks: Access control is primarily about defining who or what can access a particular resource and under what conditions. Its main function is to restrict unauthorized users, programs, or processes from accessing systems, networks, and associated data.\n\nThe incorrect answers:\nTo ensure data confidentiality: While access control can help in maintaining data confidentiality by restricting unauthorized access, data confidentiality is also ensured by methods like encryption.\nTo ensure data integrity: Data integrity ensures that data remains accurate and consistent over its lifecycle. While access control can help by limiting who can modify the data, other mechanisms such as checksums and hashing are directly responsible for ensuring data integrity.\nTo protect against external threats: While access control can be a part of a defense against external threats, other security measures such as firewalls, intrusion detection systems, and malware scanners also play significant roles in this defense.","explanation_th":"คำตอบที่ถูกคือ B เพราะ access control ตรวจสอบและบังคับว่าใครเข้าถึงระบบหรือทรัพยากรได้ A และ C เป็นวัตถุประสงค์ด้านความปลอดภัยที่ access control อาจช่วยสนับสนุน แต่ไม่ใช่หน้าที่โดยตรงทั้งหมด D แคบเกินไปเพราะ access control ป้องกันได้ทั้งผู้ใช้ภายในและภายนอกที่ไม่มีสิทธิ์"},{"number":60,"id":102018245,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST secure way to access a cloud-native application?","question_th":"วิธีที่ปลอดภัยที่สุดในการเข้าถึง cloud-native application คือข้อใด","options":[{"en":"Using a shared password","th":"ใช้รหัสผ่านร่วมกัน"},{"en":"Using a personal VPN","th":"ใช้ VPN ส่วนตัว"},{"en":"Using multi-factor authentication","th":"ใช้การยืนยันตัวตนหลายปัจจัย"},{"en":"Using a single-factor authentication","th":"ใช้การยืนยันตัวตนปัจจัยเดียว"}],"correct":[2],"explanation_en":"The correct answer:\nUsing multi-factor authentication is considered the most secure way to access a cloud-native application among the options given. Multi-factor authentication (MFA) involves the use of two or more independent credentials: what the user knows (password), what the user has (security token), and what the user is (biometric verification). MFA is considered one of the best ways to prevent unauthorized users from gaining access to sensitive data because even if one factor is compromised, there are still additional layers of protection.\n\nThe incorrect answers:\nUsing a shared password is a poor security practice. Shared passwords increase the risk of unauthorized access because they are more likely to be mishandled, stolen, or misused. Moreover, shared passwords make it challenging to maintain accountability for actions taken using shared credentials.\nWhile a personal VPN can provide a secure connection to the internet by encrypting the data in transit and masking the user's IP address, it doesn't inherently secure access to a specific cloud-native application. It's not an authentication method for the application, and unauthorized users can still gain access if they obtain the login credentials.\nSingle-factor authentication, typically in the form of a password, is the least secure method of the options provided. Single-factor authentication is vulnerable to a range of attacks, including phishing, brute force, and keylogging. If the single factor (like a password) is compromised, an attacker has easy access to the application.","explanation_th":"คำตอบที่ถูกคือ C เพราะ MFA ลดโอกาสที่ credential ปัจจัยเดียวซึ่งรั่วหรือถูกขโมยจะนำไปสู่การเข้าถึงสำเร็จ A ทำลาย accountability และเพิ่มการแพร่ของรหัสผ่าน B ปกป้องช่องทางแต่ไม่รับประกันตัวตนของผู้ใช้ และ D มีชั้นป้องกันน้อยกว่า"},{"number":61,"id":102018247,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the IT manager, Luna has noticed that some employees have been having difficulty accessing certain network resources. She wants to investigate the access control policies to see if there are any issues. What is the main concept behind the access control policies for network resources?","question_th":"แนวคิดหลักเบื้องหลังนโยบายควบคุมการเข้าถึงทรัพยากรเครือข่ายคือข้อใดตามต้นฉบับ","options":[{"en":"Confidentiality","th":"Confidentiality"},{"en":"Integrity","th":"Integrity"},{"en":"Availability","th":"Availability"},{"en":"Proprietary","th":"Proprietary"}],"correct":[0],"explanation_en":"The correct answer:\nConfidentiality is the main concept behind access control policies for network resources. These policies are created to restrict access to network resources, so that only authorized individuals or systems have access. This maintains the confidentiality of sensitive information and prevents unauthorized users from gaining access to data that they shouldn't have. Access control policies might be enforced through methods like permissions, access control lists, or role-based access control.\n\nThe incorrect answers:\n The principle of integrity ensures that data is accurate, consistent, and unaltered during its lifecycle. While access control policies can contribute to integrity by preventing unauthorized modification of data, they are primarily concerned with maintaining confidentiality.\nAvailability, one of the pillars of the CIA triad (Confidentiality, Integrity, and Availability), is not the main concept behind access control policies for network resources. Rather, ensuring availability is usually managed via other mechanisms such as load balancing, redundancy, and failover systems, rather than through access control.\nProprietary information does require special access control considerations to maintain its exclusive knowledge within the organization. However, it's not the main concept behind access control policies. The term \"proprietary\" typically refers to something owned by a specific company or individual, not the principle of managing who can access particular resources or data within a network.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A เพราะ access control จำกัดการเปิดเผยข้อมูลและทรัพยากรให้เฉพาะผู้ที่ได้รับอนุญาต จึงสนับสนุน confidentiality B เน้นป้องกันการแก้ไข C เน้นให้ระบบพร้อมใช้ และ D ไม่ใช่องค์ประกอบมาตรฐานของ CIA triad"},{"number":62,"id":102018249,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) for a large organization. The organization uses the Challenge-Handshake Authentication Protocol (CHAP) protocol for validating remote clients. Your team recently reported that a potential attacker had gained unauthorized access to the network, but the intrusion was mitigated before any significant data loss. However, the attack raised concerns about the current security protocols in place. What would be your primary concern regarding the use of the CHAP protocol in this context?","question_th":"ความกังวลหลักในการใช้ CHAP เพื่อตรวจสอบ remote client คือข้อใด","options":[{"en":"CHAP's inability to protect against replay attacks","th":"CHAP ป้องกัน replay attack ไม่ได้"},{"en":"CHAP's use of a three-way handshake mechanism","th":"CHAP ใช้ three-way handshake"},{"en":"The plaintext storage of client passwords on the CHAP server","th":"เซิร์ฟเวอร์ CHAP ต้องเก็บรหัสผ่านของ client แบบ plain
