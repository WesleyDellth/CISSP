On the other hand, IAM covers the whole process, including identification, authentication, and authorization.","explanation_th":"คำตอบที่ถูกคือ C เพราะ IAM ครอบคลุมวงจรชีวิตตัวตน การยืนยันตัวตน การอนุญาต และการตรวจสอบ ส่วน access control เป็นกลไกหรือชุดนโยบายที่บังคับการใช้ทรัพยากร A จำกัด IAM แคบเกินไป B มองขอบเขตเท่ากัน และ D สลับบทบาทของทั้งสองแนวคิด"},{"number":93,"id":102018311,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the head of a cybersecurity firm, you are developing a new security system for a high-value client. The system must utilize Identification, Authentication, Authorization, and Accountability (IAAA) to ensure maximum security. What would be the most secure method to implement this IAAA system?","question_th":"วิธีใดปลอดภัยที่สุดในการนำ IAAA มาใช้ตามตัวเลือกที่ให้มา","options":[{"en":"Enforce a strong password policy and use an ID number as identification.","th":"ใช้นโยบายรหัสผ่านแข็งแรงและหมายเลข ID สำหรับ identification"},{"en":"Implement multifactor authentication including biometric factors and enforce an access control policy based on user roles.","th":"ใช้ MFA รวมชีวมิติและบังคับ access control ตามบทบาท"},{"en":"Use a combination of a unique username and strong password for identification and authentication.","th":"ใช้ username ไม่ซ้ำและรหัสผ่านแข็งแรงสำหรับ identification และ authentication"},{"en":"Use Social Security numbers as identification and implement a single-factor authentication with strong passwords.","th":"ใช้หมายเลขประกันสังคมเป็น identifier และรหัสผ่านปัจจัยเดียว"}],"correct":[1],"explanation_en":"The correct answer:\nMultifactor authentication including biometric factors significantly improves security by asking users to present multiple pieces of evidence to verify their identity (Authentication). Implementing an access control policy based on user roles helps regulate who is allowed to perform certain actions (Authorization). This option provides a comprehensive IAAA system and is the most secure method among all options provided.\n\nThe incorrect answers:\nA strong password policy and an ID number as identification can be a start for a secure system, but this method does not address the multifactor authentication approach, which adds another layer of security. Additionally, it does not specify the implementation of access control based on user roles (Authorization), and does not indicate how Accountability would be maintained.\nUsing a unique username and strong password for identification and authentication provides a basic level of security, but it does not implement multifactor authentication, which significantly improves the security level. Also, it does not address Authorization and Accountability aspects of IAAA.\nUsing Social Security numbers can provide a unique identifier (Identification), but it's generally not recommended due to privacy concerns. Moreover, using single-factor authentication may not be as secure as multifactor authentication, and this approach does not address Authorization and Accountability, which are essential components of IAAA.","explanation_th":"คำตอบที่ถูกคือ B เพราะมีการระบุตัวตนและยืนยันด้วยหลายปัจจัย จากนั้นใช้ RBAC กำหนดสิทธิ์และสามารถบันทึกกิจกรรมเพื่อ accountability A และ C ยังพึ่งรหัสผ่านเป็นหลัก ส่วน D ใช้ข้อมูลอ่อนไหวเป็น identifier และมีเพียงปัจจัยเดียว จึงเสี่ยงสูง"},{"number":94,"id":102018313,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the correct access control method for a system with sensitive information that requires authentication and authorization for access?","question_th":"วิธีควบคุมการเข้าถึงที่เหมาะสมสำหรับระบบข้อมูลอ่อนไหวซึ่งต้องมีทั้ง authentication และ authorization คือข้อใดตามต้นฉบับ","options":[{"en":"Access control matrix","th":"Access Control Matrix"},{"en":"Role-based access control","th":"Role-Based Access Control"},{"en":"Discretionary access control","th":"Discretionary Access Control"},{"en":"Mandatory access control","th":"Mandatory Access Control"}],"correct":[3],"explanation_en":"The correct answer:\nMandatory Access Control (MAC) is an access policy that is typically used in systems that require a high level of security, such as military systems or systems that handle sensitive data. In MAC, access to system resources is controlled by the operating system (based on settings configured by the system administrator) according to a security policy. This security policy includes labeling information and user data with security clearances, which can limit what data a user can access and what they can do with it.\n\nThe incorrect answers:\nAn Access Control Matrix is a grid that uses columns and rows to illustrate the rights of different subjects (typically users or processes) in relation to various objects (like files or processes). While this can help visualize and manage permissions, it does not inherently provide an access control method specific to systems with sensitive information.\nRole-Based Access Control (RBAC) is a method where access permissions are based on the roles of individual users within an organization. Roles are created for various job functions, and permissions to perform certain operations are assigned to specific roles. While RBAC can be used in systems with sensitive information, it's not necessarily the \"correct\" access control method as it depends on the specific needs and structure of the organization.\nDiscretionary Access Control (DAC) is a type of access control system that allows the owner of the information or any object to change the access policy for that object. DAC has the potential for data to be exposed to unauthorized users, especially if the owner of the information is not completely aware of the security implications. This can be risky in a system with sensitive information, making it not the best choice for such systems.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ D เพราะ MAC ใช้นโยบายส่วนกลาง ชั้นความลับ และ clearance เพื่อควบคุมข้อมูลอ่อนไหวอย่างเข้มงวด A เป็นรูปแบบแสดงความสัมพันธ์สิทธิ์ B เหมาะกับงานตามบทบาทแต่ไม่บังคับ classification ในระดับเดียวกัน และ C ให้เจ้าของทรัพยากรมีดุลยพินิจมากเกินไป"},{"number":95,"id":102018315,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"In which of the following scenarios is it appropriate to use an OTP (One-Time Password)?","question_th":"สถานการณ์ใดเหมาะสมที่จะใช้ One-Time Password มากที่สุดตามตัวเลือก","options":[{"en":"When a user is logging into a secure website from a trusted device","th":"ผู้ใช้ล็อกอินเว็บไซต์ปลอดภัยจากอุปกรณ์ที่เชื่อถือได้"},{"en":"When a user is logging into a secure website from an untrusted device","th":"ผู้ใช้ล็อกอินเว็บไซต์ปลอดภัยจากอุปกรณ์ที่ไม่เชื่อถือ"},{"en":"When a user is logging into a secure website for the first time","th":"ผู้ใช้ล็อกอินเว็บไซต์ปลอดภัยเป็นครั้งแรก"},{"en":"When a user is logging into a secure website from an unknown location","th":"ผู้ใช้ล็อกอินเว็บไซต์ปลอดภัยจากตำแหน่งที่ไม่รู้จัก"}],"correct":[1],"explanation_en":"The correct answer:\nA one-time password (OTP) is an automatically generated numeric or alphanumeric string of characters that authenticates a user for a single transaction or login session. It's an effective tool for reducing the risk of exposure to data breaches as the password is valid for only one login session or transaction. The primary purpose of an OTP is to prevent fraud by ensuring that even if a password is intercepted or stolen, it cannot be used again. When a user is logging in from an untrusted device, an OTP is particularly useful as it can provide an additional layer of security beyond the regular login credentials. If the untrusted device is compromised in some way (such as being infected with malware), the risk of ongoing unauthorized access is limited because the OTP is not reusable.\n\nThe incorrect answers:\nIn this scenario, it is not necessary to use an OTP because the user is accessing the website from a trusted device. Trusted devices are typically ones that a user controls and regularly uses, and security measures like device recognition, saved passwords, and even biometric authentication may already be in place. The main purpose of an OTP is to provide an extra layer of security in uncertain or potentially risky situations, which generally wouldn't include logging in from a trusted device.\nWhile it is true that OTPs are often used to provide additional security for first-time users, it is not a requirement for their use. In this scenario, other security measures, such as strong password policies and multi-factor authentication, may be sufficient to protect the user's account.\nA user is logging into a secure website from an unknown location is another scenario where an OTP might add an extra layer of security, but the location of the user is often less relevant than the security of the device being used. For instance, a user could log in from an unknown location but still use a trusted device, and the connection may still be secure (such as through a VPN). Therefore, while OTPs might be used in this case, the critical factor driving OTP use is typically the trustworthiness of the device rather than the user's location.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะอุปกรณ์ที่ไม่เชื่อถืออาจมีความเสี่ยง จึงควรใช้รหัสที่หมดอายุหลังใช้ครั้งเดียวเพื่อลดผลกระทบหากถูกดัก A มีความเสี่ยงต่ำกว่า C ไม่ใช่เหตุผลด้านความเสี่ยงโดยตรง และ D ก็ควรเพิ่มการตรวจสอบได้ แต่ต้นฉบับเน้นสถานะอุปกรณ์ที่ไม่เชื่อถือ"},{"number":96,"id":102018317,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the MOST secure method of using OTP (One-Time Passwords)?","question_th":"วิธีใช้ OTP ที่ปลอดภัยที่สุดคือข้อใด","options":[{"en":"Using a physical OTP token","th":"ใช้ physical OTP token"},{"en":"Using a text message to receive OTPs","th":"รับ OTP ผ่านข้อความ SMS"},{"en":"Using a voice call to receive OTPs","th":"รับ OTP ผ่านสายโทรศัพท์"},{"en":"Using a static password as the OTP","th":"ใช้รหัสผ่านคงที่เป็น OTP"}],"correct":[0],"explanation_en":"The correct answer:\nUsing a physical OTP token is the most secure method as it requires the user to have physical possession of the token in order to generate and use the OTP, making it much harder for an attacker to gain access.\n\nThe incorrect answers:\nWhile using a text message to receive OTPs is more secure than using a static password, it is still vulnerable to attackers intercepting the text message and gaining access to the OTP.\nUsing a voice call to receive OTPs is even less secure than using a text message, as it is easier for attackers to intercept and gain access to the OTP.\nUsing a static password as the OTP is the least secure method as it does not provide any additional security beyond a regular password, making it easily compromised by attackers.","explanation_th":"คำตอบที่ถูกคือ A เพราะ hardware token แยก secret ออกจากช่องทางโทรศัพท์และยากต่อการดักหรือ SIM swap B และ C พึ่งเครือข่ายโทรคมนาคมที่อาจถูกโอนหมายเลขหรือดักรับได้ ส่วน D ไม่ใช่ one-time password เพราะค่าไม่เปลี่ยน"},{"number":97,"id":102018319,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is a common type of network access protocol that allows for remote user authentication and authorization?","question_th":"โพรโทคอลการเข้าถึงเครือข่ายใดนิยมใช้สำหรับ authentication และ authorization ของผู้ใช้ระยะไกล","options":[{"en":"LDAP","th":"LDAP"},{"en":"Kerberos","th":"Kerberos"},{"en":"TACACS+","th":"TACACS+"},{"en":"SAML","th":"SAML"}],"correct":[2],"explanation_en":"The correct answer:\nTACACS+ is a network access control protocol that provides remote authentication and authorization, authorization, and accounting (AAA) services. It is typically used for network devices like routers and switches to authenticate administrators before they can access and manage the device.\n\nThe incorrect answers:\nLDAP (Lightweight Directory Access Protocol) is a protocol for accessing directory services over an IP network. It's primarily used for viewing and editing directories of users, not specifically for remote user authentication and authorization. It can be used as part of an authentication system but it is not a dedicated remote user authentication and authorization protocol like TACACS+.\nKerberos is a network authentication protocol that provides strong authentication for client/server applications. While it does provide authentication, it does so in a more generalized client-server model and is not typically associated with remote user access to networks, particularly for network devices like routers and switches.\nSAML (Security Assertion Markup Language) is a standard for exchanging authentication and authorization data between parties. SAML is used primarily for web-based authentication and authorization and is often associated with single sign-on (SSO) solutions. It is not commonly used as a network access protocol for remote user authentication and authorization to network devices.","explanation_th":"คำตอบที่ถูกคือ C เพราะ TACACS+ เป็นโพรโทคอล AAA ที่ใช้ควบคุมการเข้าใช้อุปกรณ์เครือข่ายและแยก authentication, authorization และ accounting ได้ A เป็น directory protocol B ใช้ยืนยันตัวตนในโดเมน และ D ใช้แลกเปลี่ยน assertion สำหรับ federation และ web SSO"},{"number":98,"id":102018321,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Your company has recently implemented a new biometric authentication system for accessing sensitive data. The system is based on fingerprint recognition, and your IT security team is now concerned about the False Rejection Rate (FRR) of the system. What are some ways to reduce the False Rejection Rate (FRR) of a biometric authentication system?","question_th":"วิธีใดช่วยลด False Rejection Rate ของระบบลายนิ้วมือได้ตามแหล่งต้นฉบับ","options":[{"en":"Increasing the sensitivity of the fingerprint scanner","th":"เพิ่มความไวของเครื่องสแกนลายนิ้วมือ"},{"en":"Lowering the threshold for matching fingerprints","th":"ลด threshold สำหรับการจับคู่ลายนิ้วมือ"},{"en":"Regularly updating the fingerprint database","th":"อัปเดตฐานข้อมูลลายนิ้วมือเป็นประจำ"},{"en":"Implementing a multi-factor authentication system","th":"ใช้ MFA"}],"correct":[1],"explanation_en":"The correct answer:\nLowering the threshold for matching fingerprints means that the system will be less strict in its comparison of the fingerprint being scanned to the fingerprints stored in the database. This can reduce the False Rejection Rate (FRR) because the system will be more likely to match the fingerprint and allow access, even if there is a slight difference between the scanned fingerprint and the stored fingerprint.\n\nThe incorrect answers:\nIncreasing the sensitivity of the fingerprint scanner\nExplanation: Increasing the sensitivity of the fingerprint scanner will not necessarily reduce the False Rejection Rate (FRR) as it will capture more details of the fingerprint, but it will not change the threshold for matching fingerprints.\nRegularly updating the fingerprint database is important for the overall security of the system, but it does not directly affect the False Rejection Rate (FRR). It will ensure that the system is using the most current and accurate information, but it will not change the threshold for matching fingerprints.\nImplementing a multi-factor authentication system, such as using a combination of a fingerprint scan and a password, can increase the overall security of the system, but it does not directly affect the False Rejection Rate (FRR) of the fingerprint scanner. The threshold for matching fingerprints will remain the same.","explanation_th":"คำตอบที่ถูกคือ B เพราะการลดเกณฑ์จับคู่ทำให้ตัวอย่างที่มีความแตกต่างเล็กน้อยยังผ่าน จึงลดการปฏิเสธผู้ใช้ที่ถูกต้อง A อาจใช้คำกำกวมและไม่บอกทิศทาง threshold ชัดเจน C ช่วยเมื่อ template ล้าสมัยแต่ไม่ใช่วิธีตรงที่สุด และ D เพิ่มชั้นยืนยันตัวตนแต่ไม่ได้ลด FRR ของตัว biometric matcher เอง"},{"number":99,"id":102018323,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You have been tasked with implementing a new data center for your organization. The data center will host crucial, sensitive data for your company. As the IT security manager, you are responsible for ensuring the right access control mechanisms are in place to protect the data center and the assets it contains. As part of your layered defense strategy, which of the following approaches is the best to apply when setting up access control for your new data center?","question_th":"แนวทางใดดีที่สุดสำหรับ access control ของศูนย์ข้อมูลภายใต้กลยุทธ์ layered defense","options":[{"en":"Use a variety of technical controls such as biometrics and smart card readers","th":"ใช้เฉพาะ technical controls หลายชนิด เช่น ชีวมิติและ smart card"},{"en":"Install a number of physical controls such as locked cabinets and security doors","th":"ใช้ physical controls เช่น ตู้ล็อกและประตูนิรภัย"},{"en":"Emphasize on administrative controls by establishing policies, procedures, and training programs","th":"เน้น administrative controls เช่น นโยบาย ขั้นตอน และการอบรม"},{"en":"Employ a mix of administrative, technical, and physical controls while also focusing on continuous training and awareness","th":"ผสม administrative, technical และ physical controls พร้อมอบรมและสร้างความตระหนักต่อเนื่อง"}],"correct":[3],"explanation_en":"The correct answer:\nA robust access control system incorporates a balanced mix of administrative, technical, and physical controls, but it doesn't stop at just establishing these controls. Continuous training and awareness programs are crucial to ensure these controls work effectively. The best-laid plans could fall through if an employee like 'Bob' is not aware of the implications of his actions (like propping open a secure door).\n\nThe incorrect answers:\nTechnical controls, such as biometrics and smart card readers, are critical components of an access control system, but they need to be complemented by sound policies (administrative controls) and physical barriers (physical controls). Over-reliance on technical controls could leave the system vulnerable to non-technical threats, such as social engineering attacks.\nPhysical controls like locked cabinets and security doors provide an important layer of defense, but they cannot protect against threats that originate from within the system, such as a well-intentioned but unaware employee like 'Bob' propping open a door, or cyber attacks. Physical controls need to be supplemented with technical controls and administrative policies.\nAdministrative controls such as policies, procedures, and training programs lay the foundation for an effective access control system, but without technical and physical controls to enforce these policies, and continuous training and awareness programs, these policies may not be effectively implemented, leading to potential vulnerabilities.","explanation_th":"คำตอบที่ถูกคือ D เพราะ defense in depth ต้องใช้หลายชั้นที่เสริมกัน หากชั้นหนึ่งล้มเหลวยังมีชั้นอื่นรองรับ A B และ C แต่ละข้อครอบคลุมเพียงประเภทเดียว จึงมีช่องว่างและจุดล้มเหลวมากกว่า"},{"number":100,"id":102018325,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which security issue in Kerberos was addressed in SESAME with Public Key Infrastructure (PKI)?","question_th":"ปัญหาความปลอดภัยใดของ Kerberos ที่ SESAME แก้ไขด้วย PKI ตามแหล่งต้นฉบับ","options":[{"en":"Encryption strength","th":"ความแข็งแรงของการเข้ารหัส"},{"en":"Unauthorized access to network resources","th":"การเข้าถึงทรัพยากรเครือข่ายโดยไม่ได้รับอนุญาต"},{"en":"Replay attacks","th":"Replay attack"},{"en":"Single sign-on","th":"Single Sign-On"}],"correct":[2],"explanation_en":"The correct answer: \nReplay attacks are a significant security issue in Kerberos that was addressed by SESAME (Secure European System for Applications in a Multivendor Environment) with the use of Public Key Infrastructure (PKI). In a replay attack, an adversary intercepts data and retransmits it later, impersonating the legitimate user to gain unauthorized access to systems or information. SESAME enhanced the security of Kerberos by employing PKI to ensure the integrity and authenticity of data, making it much more difficult for attackers to successfully carry out replay attacks. By incorporating asymmetric cryptography and digital signatures, PKI provides a robust solution against these types of attacks.\n\nThe incorrect answers:\nEncryption strength: While encryption strength is crucial for securing transmitted data, it was not the specific issue in Kerberos that SESAME with PKI addressed. Kerberos already uses symmetric-key cryptography for its encryption needs, and the problem of replay attacks isn't solved simply by increasing the strength of encryption.\nUnauthorized access to network resources: Unauthorized access to network resources is a broad issue that encompasses more than just replay attacks. While SESAME with PKI helps prevent unauthorized access by addressing replay attacks, it does not resolve all potential sources of unauthorized access.\nSingle sign-on: Single sign-on (SSO) is a feature of Kerberos that allows a user to authenticate once and gain access to multiple services without re-authenticating. This was not a security issue that needed addressing in SESAME. Instead, SSO is a desirable feature that enhances user convenience while maintaining security.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะการใช้กลไก public key และหลักฐานที่เหมาะสมช่วยเพิ่มการป้องกันการนำข้อความยืนยันตัวตนเก่ากลับมาใช้ซ้ำ A เป็นประเด็นทั่วไปของอัลกอริทึม B กว้างเกินไป และ D เป็นความสามารถด้านความสะดวก ไม่ใช่ช่องโหว่ที่ต้องแก้"},{"number":101,"id":102018327,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the PRIMARY responsibility of a cloud customer in ensuring the security of their data?","question_th":"ความรับผิดชอบหลักของลูกค้าคลาวด์ในการรักษาความปลอดภัยข้อมูลของตนคือข้อใด","options":[{"en":"Implementing security controls on the cloud provider's infrastructure","th":"ติดตั้ง security controls บนโครงสร้างพื้นฐานของผู้ให้บริการคลาวด์"},{"en":"Regularly monitoring the security of the cloud provider's infrastructure","th":"เฝ้าติดตามความปลอดภัยของโครงสร้างพื้นฐานผู้ให้บริการเป็นประจำ"},{"en":"Ensuring that the data is encrypted at all times","th":"ทำให้ข้อมูลถูกเข้ารหัสตลอดเวลา"},{"en":"Establishing and maintaining secure access controls for their data","th":"สร้างและดูแล access controls ที่ปลอดภัยสำหรับข้อมูลของตน"}],"correct":[3],"explanation_en":"The correct answer: \nEstablishing and maintaining secure access controls for their data: The cloud customer, who is the owner of the data, has the primary responsibility for establishing and maintaining secure access controls for their data. These access controls include mechanisms like authentication (ensuring that only authorized users can access the data), authorization (ensuring that users can only access data they are supposed to), and audit logging (keeping a record of who accesses what data and when). While a cloud provider will likely offer tools to help with these tasks, it is ultimately the responsibility of the customer to use these tools effectively and ensure their data is secure.\n\nThe incorrect answers: Implementing security controls on the cloud provider's infrastructure: The cloud provider is responsible for securing their infrastructure, not the customer. The cloud provider should have a robust security posture, including firewalls, intrusion detection/prevention systems, and secure servers. The customer, on the other hand, is responsible for using the infrastructure securely, including properly configuring any services they use and maintaining secure access controls to their data.\nRegularly monitoring the security of the cloud provider's infrastructure: While it's good practice for customers to stay informed about the security of their cloud provider, they don't have the responsibility or even the capacity to regularly monitor the security of the cloud provider's infrastructure. This duty is the responsibility of the cloud service provider, who maintains the infrastructure and has the necessary access, tools, and expertise to monitor and maintain its security.\nEnsuring that the data is encrypted at all times: Encrypting data at all times (in transit and at rest) is certainly an important aspect of data security in the cloud, but it's not the primary responsibility of the customer. The customer should ensure their sensitive data is encrypted, especially when required by regulations or best practices. However, encryption is just one part of a broader security strategy that should also include secure access controls, secure configurations, and awareness of potential threats. Furthermore, the responsibility for encryption may be shared between the customer and the provider, depending on the service model (e.g., IaaS, PaaS, SaaS) and specific agreements in place.","explanation_th":"คำตอบที่ถูกคือ D เพราะภายใต้ shared responsibility model ลูกค้าต้องกำหนดว่าใครเข้าถึงข้อมูลได้และดูแล identities, permissions และการตั้งค่าของตน A และ B ส่วนใหญ่เป็นความรับผิดชอบของผู้ให้บริการในชั้นโครงสร้างพื้นฐาน ส่วน C สำคัญแต่ไม่ใช่ความรับผิดชอบเดียวหรือหลักที่สุดตามโจทย์ และการเข้ารหัสทุกสถานะอาจขึ้นกับกรณีใช้งาน"},{"number":102,"id":102018329,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As part of improving the security posture of our organization, we have added multifactor authentication. Which of these pairs does NOT constitute multifactor authentication?","question_th":"คู่ใดไม่ถือเป็น multifactor authentication","options":[{"en":"Password plus a physical token","th":"รหัสผ่านกับ physical token"},{"en":"Fingerprint scan plus a password","th":"สแกนลายนิ้วมือกับรหัสผ่าน"},{"en":"Security question plus a password","th":"คำถามความปลอดภัยกับรหัสผ่าน"},{"en":"Facial recognition plus a password","th":"จดจำใบหน้ากับรหัสผ่าน"}],"correct":[2],"explanation_en":"The correct answer:\nA security question plus a password does not constitute multifactor authentication because both of these belong to the same category, i.e., \"something you know\". A security question is just another form of a password or secret known to the user.\n\nThe incorrect answers:\nPassword plus a physical token: This option does constitute multifactor authentication. The password is \"something you know\" and the physical token is \"something you have\". These two factors belong to different categories and satisfy the definition of multifactor authentication.\nFingerprint scan plus a password: This option is also an example of multifactor authentication. The password is \"something you know\" and the fingerprint scan is \"something you are\". These two factors come from different categories, meeting the requirements of multifactor authentication.\nFacial recognition plus a password: This pair also constitutes multifactor authentication. The password is \"something you know\" and the facial recognition is \"something you are\". Again, these two factors belong to different categories and this complies with the concept of multifactor authentication.","explanation_th":"คำตอบที่ถูกคือ C เพราะคำถามความปลอดภัยและรหัสผ่านเป็นปัจจัยประเภทเดียวกัน คือสิ่งที่ผู้ใช้รู้ จึงเป็นเพียงหลายขั้นตอนแต่ไม่ใช่หลายปัจจัย A รวมสิ่งที่รู้กับสิ่งที่มี ส่วน B และ D รวมสิ่งที่รู้กับสิ่งที่เป็น จึงเป็น MFA"},{"number":103,"id":102018331,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Zahra is explaining the IAAA model to one of the directors from payroll. Which of these is NOT is not one of the A's from the model?","question_th":"ข้อใดไม่ใช่หนึ่งในตัว A ของโมเดล IAAA","options":[{"en":"Authentication.","th":"Authentication"},{"en":"Access.","th":"Access"},{"en":"Authorization.","th":"Authorization"},{"en":"Accountability.","th":"Accountability"}],"correct":[1],"explanation_en":"The correct answer:\nAccess is not one of the A's in the IAAA model. The IAAA model stands for Identification, Authentication, Authorization, and Accountability/Auditing. Identification refers to the process of identifying an individual or entity. Authentication is the process of verifying the identity of an individual or entity. Authorization is the process of granting access or privileges to an individual or entity. Accountability refers to the ability to hold individuals or entities responsible for their actions.\n\nThe incorrect answers:\nAuthentication is part of the IAAA model. It refers to the process of confirming the correctness of claimed identity. This can be achieved by what the user knows (like a password), what the user has (like a smart card), or what the user is (like a fingerprint).\nAuthorization is also part of the IAAA model. After an entity is authenticated, the next step is to determine what that entity is allowed to do. This process is called Authorization.\nAccountability, the final 'A' in the IAAA model, refers to the ability to track actions back to the entity performing them. This ensures that actions can be traced and audited if necessary, holding users accountable for their actions.","explanation_th":"คำตอบที่ถูกคือ B เพราะ IAAA ย่อมาจาก Identification, Authentication, Authorization และ Accountability/Auditing คำว่า Access ไม่ใช่ขั้นตอนที่มีชื่อเป็น A ในโมเดลนี้ A C และ D เป็นองค์ประกอบโดยตรง"},{"number":104,"id":102018333,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the principle of least privilege in the context of access control?","question_th":"หลัก least privilege ในบริบท access control หมายถึงข้อใด","options":[{"en":"The principle that states that an individual should have the minimum amount of privileges necessary to perform their job duties","th":"ให้บุคคลมีสิทธิ์ขั้นต่ำเท่าที่จำเป็นต่อการทำหน้าที่"},{"en":"The principle that states that an individual should have the maximum amount of privileges to perform their job duties","th":"ให้บุคคลมีสิทธิ์สูงสุดเพื่อทำหน้าที่"},{"en":"The principle that states that an individual should only have access to the resources they need to perform their job duties","th":"ให้บุคคลเข้าถึงเฉพาะทรัพยากรที่จำเป็นต่อหน้าที่"},{"en":"The principle that states that an individual should only have access to resources that are not related to their job duties","th":"ให้บุคคลเข้าถึงเฉพาะทรัพยากรที่ไม่เกี่ยวข้องกับงาน"}],"correct":[0],"explanation_en":"The correct answer:\nThe principle of least privilege states that an individual should have the minimum amount of privileges necessary to perform their job duties. This principle is used to reduce the potential damage caused by errors or malicious actions. It minimizes the risks associated with excessive access rights by limiting access to the resources an individual needs to perform their job, thereby reducing the attack surface and potential for misuse.\n\nThe incorrect answers: \nThe principle that states that an individual should have the maximum amount of privileges to perform their job duties: This is incorrect. Granting maximum privileges would be the opposite of the principle of least privilege and could introduce numerous security risks.\nThe principle that states that an individual should only have access to the resources they need to perform their job duties: This option is very similar to the first one and captures the essence of the principle of least privilege. However, the first option is more precise in highlighting the \"minimum amount of privileges.\"\nThe principle that states that an individual should only have access to resources that are not related to their job duties: This is incorrect. Providing access to unrelated resources contradicts the principle of least privilege.","explanation_th":"คำตอบที่ถูกตามแหล่งต้นฉบับคือ A เพราะนิยามเน้นจำนวนและระดับ privileges ขั้นต่ำที่จำเป็น C มีความหมายใกล้เคียงและเป็นผลของหลักเดียวกัน แต่ A ใช้ถ้อยคำตรงกับนิยาม privilege มากที่สุด B ให้สิทธิ์เกินจำเป็น และ D ไม่สนับสนุนการทำงาน"},{"number":105,"id":102018335,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"We're setting up a new network for our office at ThorTeaches.com, and we need to decide which type of server to use for managing access to resources. Which type of server is used to manage access to network resources?","question_th":"เซิร์ฟเวอร์ประเภทใดใช้จัดการการเข้าถึงทรัพยากรเครือข่าย","options":[{"en":"Mail server","th":"Mail server"},{"en":"File server","th":"File server"},{"en":"Domain controller","th":"Domain controller"},{"en":"Web server","th":"Web server"}],"correct":[2],"explanation_en":"The correct answer:\nA domain controller is a type of server that manages access to network resources and authenticates users within a domain. It stores all user account information, checks user credentials, and enforces security policies. When a user logs in, the domain controller verifies their identity and determines their access rights, providing a centralized location for managing network access.\n\nThe incorrect answers:\nA mail server is a computerized system that sends and receives emails. It provides a system for sending, receiving, and storing mail, but does not handle authentication or access to resources other than email.\nA file server is a computer attached to a network that provides a location for shared disk access, such as file storage or the storage of shared applications. While a file server does control access to files, it does not manage broader network authentication or access rights.\nA web server is a system that delivers web pages to users in response to their requests, which are forwarded by their computers' HTTP clients. Web servers do not manage access to general network resources; their function is limited to delivering web pages and related content.","explanation_th":"คำตอบที่ถูกคือ C เพราะ domain controller จัดการผู้ใช้ กลุ่ม การยืนยันตัวตน และนโยบายสิทธิ์ของโดเมน A ให้บริการอีเมล B ให้บริการไฟล์แต่ไม่ได้บริหารตัวตนทั้งเครือข่าย และ D ให้บริการเว็บไซต์"},{"number":106,"id":102018337,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following is the MOST secure way to implement PEAP (Protected Extensible Authentication Protocol)?","question_th":"วิธีที่ปลอดภัยที่สุดในการใช้ PEAP คือข้อใด","options":[{"en":"Using a pre-shared key","th":"ใช้ pre-shared key"},{"en":"Using a certificate-based authentication","th":"ใช้การยืนยันตัวตนด้วย certificate"},{"en":"Using a username and password","th":"ใช้ username และ password"},{"en":"Using a one-time password","th":"ใช้ one-time password"}],"correct":[1],"explanation_en":"The correct answer:\nPEAP is a secure authentication protocol that uses Transport Layer Security (TLS) to encrypt communications between a client and a server. The most secure way to implement PEAP is to use a certificate-based authentication, which provides strong authentication through the use of digital certificates.\n\nThe incorrect answers:\nWhile using a pre-shared key can provide some level of security, it is not as secure as using a certificate-based authentication. A pre-shared key is a static, shared secret that must be shared between the client and the server. This means that if the key is compromised, the security of the entire system is at risk.\nUsing a username and password for authentication is less secure than using a certificate-based authentication. Passwords can be easily compromised through various methods, such as phishing or dictionary attacks.\nUsing a one-time password can provide some level of security, but it is not as secure as using a certificate-based authentication. One-time passwords are generated using a secret key and a clock, and they can only be used once. While this can prevent replay attacks, it does not provide the same level of security as using a digital certificate.","explanation_th":"คำตอบที่ถูกคือ B เพราะ certificate ช่วยยืนยันตัวเซิร์ฟเวอร์และสามารถใช้ยืนยัน client ลดความเสี่ยงจาก rogue access point และ credential phishing A เป็น secret ร่วมที่กระจายยาก C พึ่ง credential ที่อาจถูกขโมย และ D เพิ่มความปลอดภัยแต่ยังต้องมีการตรวจสอบความน่าเชื่อถือของช่องทางและเซิร์ฟเวอร์"},{"number":107,"id":102018339,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the difference between access control and access management?","question_th":"access control และ access management แตกต่างกันอย่างไร","options":[{"en":"Access control involves setting up security measures to prevent unauthorized access to a system, while access management involves setting up policies and procedures to ensure that authorized users have the appropriate level of access.","th":"Access control ใช้มาตรการป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต ส่วน access management ใช้นโยบายและกระบวนการเพื่อให้ผู้ใช้ที่ได้รับอนุญาตมีสิทธิ์เหมาะสม"},{"en":"Access control involves setting up policies and procedures to ensure that authorized users have the appropriate level of access, while access management involves implementing security measures to prevent unauthorized access to a system.","th":"Access control ใช้นโยบายจัดระดับสิทธิ์ ส่วน access management ใช้มาตรการป้องกันการเข้าถึงโดยไม่ได้รับอนุญาต"},{"en":"Access control and access management are the same thing, and both involve setting up security measures to prevent unauthorized access to a system.","th":"ทั้งสองเหมือนกันและเน้นมาตรการป้องกันเท่านั้น"},{"en":"Access control and access management are the same thing, and both involve setting up policies and procedures to ensure that authorized users have the appropriate level of access.","th":"ทั้งสองเหมือนกันและเน้นนโยบายกับกระบวนการเท่านั้น"}],"correct":[0],"explanation_en":"The correct answer:\nAccess control involves setting up security measures to prevent unauthorized access to a system, while access management involves setting up policies and procedures to ensure that authorized users have the appropriate level of access. \nAccess Control: Primarily deals with the mechanisms and barriers in place that either permit or deny specific actions in an environment. It's all about the \"controls\", whether they are digital (like user authentication systems) or physical (like a gate or a door lock). \nAccess Management: It's the overarching strategy and processes about how these access controls are managed, governed, and implemented. This encompasses defining who has access to what, under what conditions, and how those conditions are maintained or changed over time.\n\nThe incorrect answers:\nAccess control involves setting up policies and procedures to ensure that authorized users have the appropriate level of access, while access management involves implementing security measures to prevent unauthorized access to a system: This option flips the definitions of access control and access management. In reality, access control is more about the security measures or barriers in place, while access management is about the policies and procedures surrounding how those controls are used.\nAccess control and access management are the same thing, and both involve setting up security measures to prevent unauthorized access to a system: While both access control and access management deal with permissions and preventing unauthorized access, they are not the same thing. As discussed, access control is about the mechanisms of preventing unauthorized access, and access management is the strategy and process surrounding the use of these mechanisms. Simply put, one is about the \"tools\" and the other is about the \"rules\".\nAccess control and access management are the same thing, and both involve setting up policies and procedures to ensure that authorized users have the appropriate level of access: Again, this option conflates the two terms. Access control is focused on the security measures that restrict or allow actions. Access management is more about the overarching strategy and procedures that define how those controls are used. While they are closely related, they are distinct concepts with different emphases.","explanation_th":"คำตอบที่ถูกคือ A เพราะ access control คือกลไกและมาตรการที่บังคับการอนุญาตหรือปฏิเสธ ส่วน access management ครอบคลุมการกำหนด อนุมัติ ทบทวน และยกเลิกสิทธิ์ตลอดวงจรชีวิต B สลับความหมาย และ C กับ D มองว่าทั้งสองมีขอบเขตเหมือนกัน ซึ่งไม่ถูกต้อง"},{"number":108,"id":102018341,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Franco is implementing SSO for our internal applications; he is adding a fingerprint reader to each workstation for users to authenticate with. What is Franco implementing?","question_th":"Franco เพิ่มเครื่องอ่านลายนิ้วมือให้ผู้ใช้ยืนยันตัวตนกับระบบ SSO เขากำลังใช้สิ่งใด","options":[{"en":"Multi-factor authentication","th":"Multifactor authentication"},{"en":"Single-factor authentication","th":"Single-factor authentication"},{"en":"Biometric authentication","th":"Biometric authentication"},{"en":"Authentication token","th":"Authentication token"}],"correct":[2],"explanation_en":"The correct answer:\nBiometric authentication: Franco is implementing biometric authentication. This type of authentication relies on the unique biological characteristics of individuals, such as fingerprints, retina patterns, and facial recognition, to verify identity. In this case, Franco is using fingerprint readers at each workstation, which is a form of biometric authentication. The use of fingerprint readers will check the users' fingerprints against a stored database of prints to validate the identity of the user.\n\nThe incorrect answers:\nMulti-factor authentication: Although biometric authentication can be a part of multi-factor authentication, in this specific case, Franco is not implementing multi-factor authentication because there is no mention of a second (or more) factor being required for users to authenticate. Multi-factor authentication typically combines two or more independent credentials: something the user knows (password), something the user has (security token), and something the user is (biometric verification).\nSingle-factor authentication: This would be incorrect because single-factor authentication often refers to methods such as username and password. While the fingerprint reader is technically a single form of authentication in this scenario, it falls under the category of biometric authentication, not single-factor authentication. Single-factor authentication is generally understood to be less secure than multi-factor or biometric because it relies on one set of credentials that can potentially be compromised.\nAuthentication tokens are something a user possesses, like a hardware or software token. They often generate a one-time password or PIN, which the user enters as a part of their authentication process. In this scenario, Franco is implementing fingerprint readers, which is a form of biometric authentication, not an authentication token. Although both are methods of authentication, they are different in their nature and how they validate a user's identity.","explanation_th":"คำตอบที่ถูกคือ C เพราะลายนิ้วมือเป็นคุณลักษณะชีวมิติของผู้ใช้ โจทย์ระบุเพียงปัจจัยลายนิ้วมือจึงไม่ยืนยันว่าเป็น MFA A ต้องมีปัจจัยต่างประเภทมากกว่าหนึ่ง B อธิบายจำนวนปัจจัยแต่ไม่ระบุชนิดที่กำลังติดตั้ง และ D เป็นสิ่งที่ผู้ใช้มี ไม่ใช่ลักษณะร่างกาย"},{"number":109,"id":102018343,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the CIO of a large multinational corporation, you are responsible for implementing a new authentication system for all employees. The new system will require all employees to use a biometric identifier, such as a fingerprint or facial recognition, to access company resources. What are the potential risks associated with implementing a biometric authentication system for employees?","question_th":"ความเสี่ยงที่อาจเกิดขึ้นจากการใช้ระบบยืนยันตัวตนด้วยชีวมิติสำหรับพนักงานคือข้อใดตามต้นฉบับ","options":[{"en":"The risk of employee privacy violations","th":"การละเมิดความเป็นส่วนตัวของพนักงาน"},{"en":"The risk of employee identity theft","th":"การขโมยตัวตนพนักงาน"},{"en":"The risk of unauthorized access to company resources","th":"การเข้าถึงทรัพยากรบริษัทโดยไม่ได้รับอนุญาต"},{"en":"The risk of system failure and downtime","th":"ระบบล้มเหลวและหยุดให้บริการ"}],"correct":[0],"explanation_en":"The correct answer: \nThe risk of employee privacy violations\nBiometric authentication systems, while providing enhanced security, could potentially lead to employee privacy violations. Biometric data, such as fingerprints or facial recognition details, are personally identifiable information (PII) that, if improperly handled or stored, could compromise an individual's privacy. There are legal and ethical considerations related to the collection, storage, and processing of such sensitive data, and failure to appropriately protect it can lead to regulatory penalties and loss of trust among employees.\n\nThe incorrect answers: \nThe risk of employee identity theft: While biometric data, if stolen, could indeed be used in identity theft, the likelihood is much lower compared to traditional authentication methods (like passwords). This is because biometric identifiers are unique to each individual and generally harder for criminals to replicate or use without sophisticated techniques.\nThe risk of unauthorized access to company resources: Biometric authentication systems, by nature, are designed to reduce the risk of unauthorized access to company resources, as they use unique physiological or behavioral characteristics of the user, which are hard to fake or steal. If properly implemented and maintained, such systems should theoretically decrease the likelihood of unauthorized access, not increase it.\nThe risk of system failure and downtime: While any technological system carries a risk of failure and downtime, this is not a risk unique to biometric authentication systems. Good IT practices, like having robust redundancy and recovery plans, should mitigate this risk, regardless of the type of authentication system used.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A เพราะการเก็บและประมวลผลลายนิ้วมือหรือใบหน้าเป็นข้อมูลส่วนบุคคลที่ละเอียดอ่อน ต้องมีฐานกฎหมาย วัตถุประสงค์ และการปกป้องที่เหมาะสม B C และ D เป็นความเสี่ยงที่เป็นไปได้ แต่โจทย์เน้นผลกระทบเฉพาะของการบังคับใช้ข้อมูลชีวมิติกับพนักงาน ซึ่งคือ privacy"},{"number":110,"id":102018345,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Amelia is the IT security manager at a large financial institution. One of her employees has recently left the company, and she needs to ensure that their access to all company systems is terminated as soon as possible. What is the most important step in the access management lifecycle to take in this situation?","question_th":"เมื่อพนักงานลาออก ขั้นตอนสำคัญที่สุดใน access management lifecycle คือข้อใดตามแหล่งต้นฉบับ","options":[{"en":"Update the employee's access privileges to reflect their departure","th":"อัปเดตสิทธิ์ของพนักงานให้สะท้อนการออกจากงาน"},{"en":"Conduct a review of all systems the employee had access to","th":"ทบทวนทุกระบบที่พนักงานเคยเข้าถึง"},{"en":"Notify the employee that their access has been terminated","th":"แจ้งพนักงานว่าสิทธิ์ถูกยกเลิกแล้ว"},{"en":"Remove the employee's access credentials from all systems","th":"ลบ credentials ของพนักงานออกจากทุกระบบ"}],"correct":[0],"explanation_en":"The correct answer: \nWhen an employee leaves a company, it is crucial to modify their access privileges to prevent unauthorized access to company resources. In many systems, this could mean deactivating their user accounts or changing their user status. It is a proactive measure that ensures the security of the company's data and systems, adhering to the principle of least privilege.\n\nThe incorrect answers:\nConducting a review is an important part of the process, it isn't the most immediate step. The immediate necessity is to prevent potential unauthorized access, which is achieved by modifying the former employee's access privileges.\nInforming the employee is a courtesy but not necessarily a security measure. The immediate need is to secure the systems, and notification can come after.\nRemoving access might seem like the logical step, but in practice, this could lead to audit issues or problems in tracking historical data or actions. Hence, the immediate step should be to modify their access privileges to prevent unauthorized access. The removal of credentials can be done later in a controlled manner after ensuring all dependencies and potential impacts are taken into account.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ A เพราะ lifecycle ต้องเปลี่ยนสถานะตัวตนและสิทธิ์ตามเหตุการณ์ทางธุรกิจ การอัปเดตสถานะให้ออกจากงานควรกระตุ้นการ disable หรือ revoke ในระบบที่เกี่ยวข้อง B เป็นขั้นตอนตรวจสอบเพิ่มเติม C ไม่ได้ป้องกันการเข้าใช้ และ D เป็นการดำเนินการทางเทคนิคที่อยู่ภายใต้การอัปเดตสิทธิ์และอาจไม่ควรลบหลักฐานทั้งหมด"},{"number":111,"id":102018347,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is the MOST important security principle to follow when implementing access control for a new system?","question_th":"หลักความปลอดภัยที่สำคัญที่สุดเมื่อนำ access control ไปใช้กับระบบใหม่คือข้อใด","options":[{"en":"Confidentiality","th":"Confidentiality"},{"en":"Integrity","th":"Integrity"},{"en":"Availability","th":"Availability"},{"en":"Least privilege","th":"Least privilege"}],"correct":[3],"explanation_en":"The correct answer:\nThe principle of least privilege is a crucial computer security concept in which a user is given the minimum levels of access necessary to complete his or her job functions. When implemented correctly, this principle reduces the risk of users maliciously, accidentally, or through privilege escalation (gaining access to resources they aren't supposed to access), causing damage to the system or accessing sensitive information. Therefore, it's a fundamental principle when implementing access control for a new system.\n\nThe incorrect answers:\nWhile confidentiality, which means keeping data secret and only allowing authorized access, is essential in many contexts, it's not the primary principle in implementing access controls. Access control could also involve ensuring appropriate access to non-confidential resources.\nIntegrity, ensuring data is correct and has not been tampered with, is another important principle in security. However, it's more related to how data is handled, stored, or transferred rather than who has access to systems or resources, which is the focus of access control.\nAvailability ensures that authorized users have reliable access to data and resources. It's a critical principle in designing robust and resilient systems but doesn't address who should have access to what, which is the primary concern when implementing access controls.","explanation_th":"คำตอบที่ถูกคือ D เพราะ least privilege กำหนดให้แต่ละบัญชีมีสิทธิ์เท่าที่งานต้องใช้ ลดทั้งโอกาสและผลกระทบของการใช้สิทธิ์ผิด A B และ C เป็นเป้าหมายของความปลอดภัยที่ access control สนับสนุน แต่ไม่ใช่หลักการออกแบบสิทธิ์ที่ตรงที่สุด"},{"number":112,"id":102018349,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"ThorTeaches.com has recently implemented a biometric security system in order to increase the security of your information systems and data. The system utilizes fingerprint scanning as a means of authentication for employees when accessing sensitive information. However, you have received a report that some employees are having difficulty with the new system and are unable to access their work accounts. You have been tasked with finding a solution to this issue. Which of the following options would be the most effective way to resolve the issue of employees being unable to access their accounts through the biometric security system?","question_th":"พนักงานบางคนใช้ระบบสแกนลายนิ้วมือไม่ได้ วิธีแก้ที่มีประสิทธิผลที่สุดคือข้อใด","options":[{"en":"Increase employee training on how to use the biometric system","th":"เพิ่มการอบรมวิธีใช้ระบบชีวมิติ"},{"en":"Implement a backup authentication method, such as a password or security token","th":"เพิ่มวิธียืนยันตัวตนสำรอง เช่น รหัสผ่านหรือ security token"},{"en":"Replace the fingerprint scanning technology with a different type of biometric authentication, such as facial recognition","th":"เปลี่ยนจากลายนิ้วมือเป็นการจดจำใบหน้า"},{"en":"Temporarily disable the biometric system and revert to a previous authentication method","th":"ปิดระบบชีวมิติชั่วคราวและกลับไปใช้วิธีเดิม"}],"correct":[1],"explanation_en":"The correct answer: \nImplement a backup authentication method, such as a password or security token. A strong security approach is to have multiple layers of authentication (Multi-factor Authentication, MFA). By implementing a backup authentication method such as a password or security token, you ensure that if one method fails, the other can be used as a fallback. This will allow employees to access their accounts even if the biometric system fails or if they have difficulty using it. It also adds an additional layer of security because even if one factor is compromised, the attacker still has to bypass the other.\n\nThe incorrect answers:\nIncrease employee training on how to use the biometric system: Although this is a valid approach, it does not fully address the immediate issue at hand. While training will help employees to use the system better in the future, it doesn't provide a solution for those who are currently unable to access their accounts.\nReplace the fingerprint scanning technology with a different type of biometric authentication, such as facial recognition: Changing the type of biometric authentication is a costly and time-consuming process. There's also no guarantee that employees would have fewer difficulties with a new type of biometric technology. Therefore, this option is not the most effective solution to the current problem.\nTemporarily disable the biometric system and revert to a previous authentication method: This approach could potentially lead to more issues. First, disabling a security system temporarily can open up vulnerabilities and risks. Second, it doesn't address the fact that the biometric system was put in place for enhanced security. Reverting to a less secure method doesn't solve the issue, but rather steps back from the original goal. It's better to complement the biometric system with another form of authentication.","explanation_th":"คำตอบที่ถูกคือ B เพราะ fallback method ที่ควบคุมอย่างเหมาะสมช่วยให้ผู้ใช้ที่ลงทะเบียนไม่ได้หรือสแกนไม่ผ่านยังทำงานได้โดยไม่ต้องลดความปลอดภัยทั้งระบบ A ช่วยเฉพาะปัญหาการใช้งาน C อาจสร้างปัญหาใหม่และมีต้นทุนสูง และ D ลดการป้องกันสำหรับผู้ใช้ทั้งหมด"},{"number":113,"id":102018351,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the IT security manager at a large corporation, and the company has experienced several cybersecurity incidents recently. The incidents have raised serious concerns about the accountability and auditability of actions within the company's IT systems. Some of the issues identified include the use of shared accounts, administrators having full access to logs, and a lack of proper backups for logs. What is the most effective strategy to enhance accountability and auditing in your organization?","question_th":"กลยุทธ์ใดมีประสิทธิผลที่สุดในการเพิ่ม accountability และ auditability เมื่อมีบัญชีร่วม ผู้ดูแลระบบแก้ log ได้ และ log ไม่มีการป้องกัน","options":[{"en":"Implement a backup system for all logs and move them to an off-site storage.","th":"สำรอง log ทั้งหมดและย้ายไปเก็บนอกสถานที่"},{"en":"Train all employees about the risks of shared accounts and promote a culture of personal accountability.","th":"อบรมความเสี่ยงของบัญชีร่วมและส่งเสริมความรับผิดชอบส่วนบุคคล"},{"en":"Limit the access administrators have to logs and implement tamper-proof mechanisms for log data.","th":"จำกัดสิทธิ์ผู้ดูแลระบบต่อ log และใช้กลไกป้องกันการแก้ไข log"},{"en":"Implement a centralized logging system where all access logs are stored and can be easily audited.","th":"ใช้ระบบรวมศูนย์สำหรับเก็บ access logs เพื่อให้ตรวจสอบง่าย"}],"correct":[2],"explanation_en":"The correct answer:\nLimit the access administrators have to logs and implement tamper-proof mechanisms for log data. Given the issues identified, it's essential to ensure that logs cannot be manipulated and that even administrators have limited access. This would increase accountability, as logs would provide an accurate history of all actions, and any changes to log data would be detectable.\n\nThe incorrect answers:\nImplement a backup system for all logs and move them to an off-site storage: While this is a good practice for ensuring data protection and availability, it does not directly increase accountability and auditing ability in the organization.\nTrain all employees about the risks of shared accounts and promote a culture of personal accountability: Although training is essential and can help in reducing risks associated with shared accounts, it may not provide a thorough solution for the issues raised, especially concerning log manipulation.\nImplement a centralized logging system where all access logs are stored and can be easily audited: While centralization can make auditing easier, it does not directly address the issue of administrators having full access to logs and the potential for log manipulation at its source.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ C เพราะต้องป้องกันผู้มีสิทธิ์สูงจากการแก้หรือลบหลักฐาน และใช้ tamper-evident หรือ immutable logging เพื่อรักษาความน่าเชื่อถือ A ช่วยเรื่องการเก็บรักษา B ช่วยด้านพฤติกรรม และ D เพิ่มความสะดวกในการตรวจสอบ แต่หากผู้ดูแลยังแก้ log ได้ หลักฐานก็ยังไม่น่าเชื่อถือ"},{"number":114,"id":102018353,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Which of the following security controls would be the FIRST to be implemented in a cost-effective manner?","question_th":"security control ใดควรนำมาใช้เป็นอันดับแรกในลักษณะที่คุ้มค่า","options":[{"en":"Implementing firewalls on all network devices","th":"ติดตั้งไฟร์วอลล์บนอุปกรณ์เครือข่ายทั้งหมด"},{"en":"Conducting regular security training for employees","th":"อบรมความปลอดภัยให้พนักงานเป็นประจำ"},{"en":"Implementing two-factor authentication for all users","th":"ใช้ 2FA กับผู้ใช้ทุกคน"},{"en":"Conducting regular penetration testing","th":"ทดสอบเจาะระบบเป็นประจำ"}],"correct":[1],"explanation_en":"The correct answer:\nConducting regular security training for employees is usually the most cost-effective strategy to implement first. Employee awareness and training are crucial in any organization's cybersecurity posture. Many cybersecurity incidents originate from human error, such as falling for phishing emails, so providing regular training can significantly reduce these risks. Also, training programs can be implemented relatively inexpensively, especially compared to other security measures, and can often be done in-house or through online courses.\n\nThe incorrect answers:\nFirewalls are a critical part of any security strategy, but they can be expensive to implement and maintain, particularly if the organization has a large number of network devices. Furthermore, firewalls require skilled professionals to configure and manage them properly, adding to the cost.\nTwo-factor authentication is a highly effective security control, but it can be more expensive and complex to implement than security training. It involves setting up additional authentication mechanisms and educating users about the new login process. Moreover, ongoing costs can include licensing fees for authentication software or hardware.\nPenetration testing involves simulating attacks on a system to identify vulnerabilities. While it's a highly effective security measure, it's often one of the more expensive options. Penetration testing typically requires hiring outside experts or investing in sophisticated software, making it less cost-effective as a first measure, especially for small businesses with limited resources.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะการอบรมครอบคลุมผู้ใช้จำนวนมากด้วยต้นทุนต่ำ ช่วยลด phishing ความผิดพลาด และการละเมิดนโยบาย A C และ D มีคุณค่าแต่ต้องใช้เทคโนโลยี ค่าใบอนุญาต ผู้เชี่ยวชาญ หรือเวลาในการติดตั้งมากกว่า"},{"number":115,"id":102018355,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"As the Chief Information Security Officer (CISO) for a large corporation, you are tasked with implementing a biometric authentication system for access to secure company facilities and systems. With this in mind, you must balance the prevention of unauthorized access and ensuring that authorized personnel are not inadvertently locked out. Which biometric authentication method would be the most suitable for your organization, given the need to balance security, cost-effectiveness, and user experience?","question_th":"วิธีชีวมิติใดเหมาะสมที่สุดเมื่อคำนึงถึงความปลอดภัย ต้นทุน และประสบการณ์ผู้ใช้ พร้อมลดทั้ง false accept และ false reject","options":[{"en":"Implementing a facial recognition system with a high threshold for pattern matching to minimize false accepts.","th":"ระบบจดจำใบหน้าที่ตั้ง threshold สูงเพื่อลด false accept"},{"en":"Implementing a fingerprint recognition system with a high threshold for pattern matching to minimize false accepts.","th":"ระบบลายนิ้วมือที่ตั้ง threshold สูงเพื่อลด false accept"},{"en":"Implementing a fingerprint recognition system with a balanced threshold for pattern matching to minimize both false accepts and false rejects.","th":"ระบบลายนิ้วมือที่ตั้ง threshold สมดุลเพื่อลดทั้ง false accept และ false reject"},{"en":"Implementing an iris recognition system with a high threshold for pattern matching to minimize false accepts.","th":"ระบบสแกนม่านตาที่ตั้ง threshold สูงเพื่อลด false accept"}],"correct":[2],"explanation_en":"The correct answer:\nA fingerprint recognition system with a balanced threshold for pattern matching represents an ideal compromise between security and user experience. It provides robust security by leveraging the uniqueness of individual fingerprints while minimizing both false accepts (unauthorized users gaining access) and false rejects (authorized users being denied access). Fingerprint technology is mature, reliable, and cost-effective, and it is widely accepted by users, reducing potential resistance to implementation. Although no biometric system is perfect, a balanced approach to pattern matching can significantly reduce the risk of errors while ensuring that authorized personnel can access the system or facility as needed.\n\nThe incorrect answers:\nImplementing a facial recognition system with a high threshold for pattern matching to minimize false accepts might reduce false accepts but would likely result in a high number of false rejects, frustrating legitimate users and possibly hindering productivity. Facial recognition systems can also be more susceptible to errors due to changes in lighting, user position, or facial features (e.g., beard growth, glasses).\nImplementing a fingerprint recognition system with a high threshold for pattern matching to minimize false accepts would reduce false accepts, but it would likely result in a high number of false rejects, causing frustration among authorized users. In a large corporation, a high false reject rate could significantly disrupt operations and productivity.\nAlthough iris recognition is highly accurate and secure, it can be cost-prohibitive due to the specialized hardware required. Setting a high threshold for pattern matching would likely lead to a high number of false rejects. Iris recognition can also be perceived as more intrusive than other methods, potentially leading to resistance among users.","explanation_th":"คำตอบที่ถูกคือ C เพราะ fingerprint มีต้นทุนและความสะดวกเหมาะกับองค์กรทั่วไป และ threshold ที่สมดุลลดทั้งความเสี่ยงรับคนผิดกับปัญหาปฏิเสธคนถูก A B และ D ที่ตั้ง threshold สูงเน้นความปลอดภัยด้านเดียวและอาจทำให้ FRR สูง ส่วน iris มักมีต้นทุนและความยุ่งยากมากกว่า"},{"number":116,"id":102018357,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"ThorTeaches.com has recently experienced a data breach due to a malware attack that was able to bypass your current security measures. As the IT security manager, you need to implement additional security measures to prevent similar attacks in the future. Which of the following is the most accurate description of a default deny policy?","question_th":"ข้อใดอธิบาย default deny policy ได้ถูกต้องที่สุด","options":[{"en":"A default deny policy allows access to all resources unless explicitly prohibited.","th":"อนุญาตทุกทรัพยากรเว้นแต่มีข้อห้ามชัดเจน"},{"en":"A default deny policy denies access to all resources unless explicitly allowed.","th":"ปฏิเสธทุกทรัพยากรเว้นแต่ได้รับอนุญาตอย่างชัดเจน"},{"en":"A default deny policy allows access to all resources unless explicitly denied by the system administrator.","th":"อนุญาตทุกทรัพยากรเว้นแต่ผู้ดูแลระบบปฏิเสธ"},{"en":"A default deny policy denies access to all resources unless explicitly allowed by the system administrator.","th":"ปฏิเสธทุกทรัพยากรเว้นแต่ผู้ดูแลระบบเป็นผู้อนุญาตเท่านั้น"}],"correct":[1],"explanation_en":"The correct answer:\nA default deny policy denies access to all resources unless explicitly allowed: A default deny policy is a network security approach where all traffic, whether internal or external, is blocked by default and only explicitly permitted traffic is allowed. This approach is often considered the safest, as it begins from a standpoint of maximum security and only lowers these safeguards when necessary and safe. It reduces the likelihood of unauthorized or malicious access, as permissions have to be intentionally and explicitly given for access to be granted.\n\nThe incorrect answers:\nA default deny policy allows access to all resources unless explicitly prohibited: This is incorrect because it describes a 'default allow' policy, not a 'default deny' policy. In a default allow policy, all traffic is allowed by default, unless explicitly blocked. This is a more risky approach, as it potentially allows unauthorized or malicious traffic to access resources, unless these sources are explicitly recognized and blocked.\nA default deny policy allows access to all resources unless explicitly denied by the system administrator: This answer is also incorrect for the same reason as the first incorrect option. It describes a 'default allow' policy where the system administrator explicitly denies access to certain resources. This approach can be risky as it could allow unauthorized or malicious traffic access to resources.\nA default deny policy denies access to all resources unless explicitly allowed by the system administrator: This answer is technically correct, but the wording is misleading. While a default deny policy does indeed operate by denying access unless explicitly allowed, the key decision maker in this process is the policy itself, not the system administrator. The system administrator may implement and manage the policy, but the policy operates according to its own rules and parameters. In other words, it's not the administrator's explicit permission that allows access, but rather the policy that the administrator has put in place. This may seem like a minor distinction, but it's important for understanding how these policies work.","explanation_th":"คำตอบที่ถูกคือ B เพราะ default deny เริ่มจากไม่ให้สิทธิ์และเปิดเฉพาะสิ่งที่นโยบายอนุญาต A และ C เป็น default allow ส่วน D จำกัดว่าต้องเป็นผู้ดูแลระบบเท่านั้น ทั้งที่การอนุญาตอาจมาจากเจ้าของข้อมูล ระบบ workflow หรือนโยบายที่ได้รับมอบอำนาจ"},{"number":117,"id":102018359,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"What is a CRL used for in a certificate-based authentication system?","question_th":"CRL ใช้ทำอะไรในระบบยืนยันตัวตนด้วย certificate","options":[{"en":"To store user credentials","th":"เก็บ credentials ของผู้ใช้"},{"en":"To verify the authenticity of a certificate","th":"ตรวจสอบความแท้ของ certificate"},{"en":"To encrypt communication between users","th":"เข้ารหัสการสื่อสารระหว่างผู้ใช้"},{"en":"To store a list of revoked certificates","th":"เก็บรายการ certificate ที่ถูกเพิกถอน"}],"correct":[3],"explanation_en":"The correct answer:\nA Certificate Revocation List (CRL) is a list of digital certificates that have been revoked by the issuing Certificate Authority (CA) before their scheduled expiration date. CRLs are a crucial part of the public key infrastructure (PKI) as they provide a way to invalidate certificates that are no longer trusted. This could be due to the private key associated with the certificate being compromised, the identity information in the certificate no longer being valid, or for other security reasons.\n\nThe incorrect answers:\nUser credentials, such as usernames and passwords, are typically stored in a secure database, not in a CRL. The purpose of a CRL is not to store credentials but to list digital certificates that have been revoked and are no longer trusted.\nWhile CRLs are a part of the process to verify the authenticity of a certificate, they don't perform the verification themselves. A CRL is checked as part of the process to determine if a certificate is valid (i.e., not revoked). The actual verification of the authenticity of a certificate, typically through checking the digital signature of the issuing CA, is a separate process.\nCRLs are not involved in the encryption of communications. Encryption in a certificate-based system is typically achieved using the public and private keys associated with a valid digital certificate, not a CRL. The role of a CRL is to provide a means to check whether a certificate has been revoked and should no longer be trusted, not to enable encrypted communication.","explanation_th":"คำตอบที่ถูกคือ D เพราะ Certificate Revocation List เผยแพร่หมายเลข certificate ที่ CA ยกเลิกก่อนวันหมดอายุ A ไม่ใช่ที่เก็บบัญชีผู้ใช้ B การตรวจความแท้ใช้ลายเซ็นและ chain of trust ร่วมกับการตรวจสถานะ และ C เป็นหน้าที่ของโพรโทคอลเข้ารหัส ไม่ใช่ CRL"},{"number":118,"id":102018361,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are working on a project that requires access to sensitive data. You have been told that you need to go through the process of verifying your identity before you can be granted access to the resources you need. In an information security system, what is the process of verifying the identity of a user before granting access to resources?","question_th":"ในระบบความปลอดภัยสารสนเทศ กระบวนการตรวจสอบตัวตนผู้ใช้ก่อนให้เข้าถึงทรัพยากรคือข้อใดตามตัวเลือก","options":[{"en":"Information detection","th":"Information detection"},{"en":"Identity verification","th":"Identity verification"},{"en":"Access control","th":"Access control"},{"en":"User accountability","th":"User accountability"}],"correct":[2],"explanation_en":"The correct answer:\nAccess control is the process of verifying the identity of a user and granting or denying access to resources based on their identity and permissions. Access control mechanisms are systems that manage the authorization of rights and privileges to resources within an information system. This includes identification, where a user claims an identity, and authentication, where a system verifies the claimed identity. It is crucial for enforcing security policies and maintaining the integrity and confidentiality of information.\n\nThe incorrect answers:\nInformation detection is not a term commonly used in the context of identity verification or access control. It can refer to various aspects of data analysis or intrusion detection, but it doesn't pertain to verifying a user's identity for access to resources.\nWhile \"identity verification\" might seem a valid answer, in information security, \"identity verification\" often refers more generally to the process of validating identity documents or confirming personal details. \nUser accountability is a concept related to accountability and auditability but it is not the process of verifying the identity of a user before granting access to resources. Rather, user accountability refers to the tracking of actions on a system back to the individual user, ensuring that all activities can be attributed to a specific person.","explanation_th":"คำตอบที่ถูกตามแหล่งต้นฉบับคือ C โดยมอง access control เป็นกระบวนการรวมที่ตรวจสอบตัวตนและบังคับสิทธิ์ก่อนเปิดทรัพยากร B มีความหมายใกล้กับ authentication แต่ต้นฉบับเลือก access control เป็นคำตอบ A ไม่ใช่กระบวนการ IAM และ D เน้นการตรวจสอบย้อนหลังหลังผู้ใช้ดำเนินการ"},{"number":119,"id":102018363,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"You are the Chief Information Security Officer (CISO) of a growing IT company that is undergoing an internal audit to ensure robust security practices. You are wanting to enhance your security policies with a focus on maintaining a defense-in-depth strategy, fraud prevention, and enhanced internal controls. Given your goal to ensure a robust defense-in-depth strategy and decrease the likelihood of fraudulent activities, which among the following administrative controls should be prioritized?","question_th":"administrative control ใดควรให้ความสำคัญเพื่อสนับสนุน defense in depth และลดการทุจริต","options":[{"en":"Implementation of Non-Disclosure Agreements (NDAs) for all employees.","th":"ใช้ NDA กับพนักงานทุกคน"},{"en":"Enforcing mandatory, unannounced vacations for key personnel and subsequently auditing their accounts.","th":"บังคับให้บุคลากรสำคัญหยุดพักโดยไม่แจ้งล่วงหน้าและตรวจสอบบัญชีระหว่างนั้น"},{"en":"Application of the separation of duties principle throughout the organization.","th":"ใช้หลัก separation of duties ทั่วทั้งองค์กร"},{"en":"Regular, unannounced password changes for all employees.","th":"บังคับเปลี่ยนรหัสผ่านแบบไม่แจ้งล่วงหน้าเป็นประจำ"}],"correct":[1],"explanation_en":"The correct answer:\nEnforcing mandatory, unannounced vacations for key personnel and subsequently auditing their accounts serves multiple purposes. It offers the chance to uncover potential fraudulent activity that might be concealed when certain individuals are always present. Also, by locking and auditing the accounts of personnel on vacation, potential security vulnerabilities can be identified and rectified, contributing to a robust defense-in-depth strategy.\n\nThe incorrect answers:\nNDAs play a crucial role in preventing information leaks by ensuring that employees are legally bound to keep sensitive company information confidential. However, they don't directly address the goal of preventing internal fraud or enhancing a defense-in-depth strategy. They primarily work to protect sensitive information from being disclosed outside the organization.\nApplication of the separation of duties principle throughout the organizations is an important administrative control that minimizes the chance of fraud by ensuring that no single individual has control over all parts of a critical process. Although it contributes to preventing fraud and enhancing internal controls, it may not be needed across the organization and it may not detect fraud already occurring within the organization.\nRegular, unannounced password changes for all employees can help enhance security by making unauthorized access more difficult, but it does not directly help in detecting ongoing fraudulent activities. Frequent password changes can also often lead to poor password practices among employees, such as writing down passwords, which can inadvertently weaken the overall security posture.","explanation_th":"คำตอบที่ถูกตามต้นฉบับคือ B เพราะ mandatory vacation ทำให้บุคคลอื่นต้องรับช่วงงานและเปิดโอกาสตรวจพบธุรกรรมหรือการปกปิดที่ต้องอาศัยผู้กระทำอยู่ตลอด A ปกป้องข้อมูลทางกฎหมาย C เป็น control สำคัญมากในการลดการทุจริตเช่นกัน แต่ต้นฉบับเน้นการตรวจพบผ่านการหยุดงานและ audit ส่วน D อาจสร้างปัญหาการใช้งานและไม่ใช่มาตรการตรวจทุจริตที่ดี"},{"number":120,"id":102018365,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"We have realized our current use of magnetic stripe ID cards does not match the security profile senior management wants. What could we use on the cards in addition to the magnetic stripe to make them smart cards?","question_th":"ควรเพิ่มสิ่งใดลงในบัตรแถบแม่เหล็กเพื่อทำให้เป็น smart card","options":[{"en":"A holographic image","th":"ภาพโฮโลแกรม"},{"en":"A microchip","th":"ไมโครชิป"},{"en":"A barcode","th":"บาร์โค้ด"},{"en":"A fingerprint scanner","th":"เครื่องสแกนลายนิ้วมือ"}],"correct":[1],"explanation_en":"The correct answer:\nA microchip: Smart cards are a type of security token that have an embedded microchip. The microchip can be loaded with data, used for telephone calling, accessing a bank account, shopping, or using a computer system. A smart card may also be a security token that has an embedded system such as a strip of metal, or a microchip with memory, or even a completely self-contained processor. Some may have cryptographic capabilities, like storing cryptographic keys and performing cryptographic operations. By adding a microchip to a magnetic stripe ID card, the card becomes a smart card that can have more complex, encrypted information stored on it, making it more secure and versatile.\n\nThe incorrect answers:\nWhile a holographic image may add a visual element of security to an ID card, it doesn't actually contribute to the card becoming a \"smart card\". A hologram can provide a degree of protection against card cloning and forgery, but it doesn't store data or interact with card readers in the way a microchip does. Therefore, while it may enhance physical security, it won't provide the additional data storage or processing capabilities associated with smart cards.\nBarcodes are one-dimensional or two-dimensional ways to encode information visually. While they can store information, their capacity is very limited compared to a microchip. Barcodes can be easily copied or tampered with, making them less secure. Also, they do not have the processing power or the ability to store encrypted data, which is a significant characteristic of smart cards.\nEmbedding a fingerprint scanner into a card would add a biometric component to the security process, but this alone wouldn't make the card a smart card. Smart cards are characterized by their ability to store and process data through an embedded microchip. Although adding a fingerprint scanner might increase the security level of the card by introducing biometric authentication, the scanner does not provide the data storage or processing capabilities inherent to smart cards. It's also worth noting that integrating a reliable fingerprint scanner into a card presents considerable practical and technical challenges.","explanation_th":"คำตอบที่ถูกคือ B เพราะ smart card มีวงจรรวมสำหรับเก็บ secret ประมวลผล cryptographic operation หรือยืนยันตัวตน A และ C เพิ่มคุณลักษณะให้ตรวจดูหรือสแกนได้แต่ไม่ทำให้บัตรประมวลผลได้ ส่วน D เป็นอุปกรณ์อ่านชีวมิติ ไม่ใช่องค์ประกอบพื้นฐานของ smart card"},{"number":121,"id":102018367,"type":"single","section":"CISSP Domain 5: Identity and Access Management (IAM)","question_en":"Nestor is working on adding content-based access control in addition to our existing security controls. Which of these could be part of what he implements?","question_th":"สิ่งใดอาจเป็นส่วนหนึ่งของ content-based access control","options":[{"en":"Retina scanners","th":"เครื่องสแกนจอประสาทตา"},{"en":"Acces
