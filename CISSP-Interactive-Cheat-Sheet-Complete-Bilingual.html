ธิ์ในการเข้าถึง vs สิทธิ์ในการกระทำ"], ["Permissions = access to object / Rights = ability to act on system / Privileges = combination of rights + permissions", "Permissions (สิทธิ์ต่อไฟล์/ออบเจกต์) / Rights (สิทธิ์กระทำต่อระบบ เช่น ปรับเวลา) / Privileges (การรวมสิทธิ์ทั้งหมดเข้าด้วยกัน)"]]]}, {"title": "Access Control Categories", "thTitle": "หมวดหมู่ของมาตรการควบคุมตามฟังก์ชันการทำงาน", "type": "table", "headers": [["Category", "หมวดหมู่"], ["Purpose", "วัตถุประสงค์"], ["Example", "ตัวอย่างมาตรการ"]], "rows": [[["Compensative", "มาตรการชดเชย (Compensative)"], ["Risk mitigation action when primary control unavailable", "มาตรการทดแทนเมื่อไม่สามารถติดตั้งมาตรการหลักได้"], ["Two keys or key+combo for a safe, dual signatures", "การใช้กุญแจ 2 ดอก, การลงนามคู่"]], [["Corrective", "มาตรการแก้ไข (Corrective)"], ["Reduce attack impact and restore normal operation", "แก้ไขปัญหาและลดผลกระทบหลังเกิดเหตุ"], ["Fire extinguishers, offsite backups, patching vulnerabilities", "ถังดับเพลิง, กู้ข้อมูลจากแบ็กอัป, อุดช่องโหว่"]], [["Detective", "มาตรการตรวจจับ (Detective)"], ["Detect an attack or policy violation during or after occurrence", "ตรวจจับเหตุการณ์ไม่พึงประสงค์หรือการบุกรุก"], ["CCTV, IDS, motion detectors, audit logs", "กล้องวงจรปิด, ระบบ IDS, บันทึก Log"]], [["Deterrent", "มาตรการป้องปราม (Deterrent)"], ["Discourages a potential attacker from attempting an attack", "ข่มขู่หรือป้องปรามไม่ให้ผู้บุกรุกลงมือ"], ["Warning signs, visible guards, perimeter fences, auth banners", "ป้ายเตือนทางกฎหมาย, รปภ., รั้วรอบขอบชิด"]], [["Directive", "มาตรการสั่งการ (Directive)"], ["Define/document mandatory acceptable practices and rules", "กำหนดและสั่งการแนวทางปฏิบัติที่ต้องทำตาม"], ["Acceptable Use Policy (AUP), exit procedures", "นโยบายการใช้งานที่ยอมรับได้ (AUP), ขั้นตอนความปลอดภัย"]], [["Preventative", "มาตรการป้องกัน (Preventative)"], ["Stop an unauthorized attack or breach before it happens", "ป้องกันไม่ให้การบุกรุกเกิดขึ้นได้สำเร็จ"], ["Locks, biometrics, encryption, IPS, strong passwords", "แม่กุญแจ, ไบโอเมตริกซ์, การเข้ารหัส, ระบบ IPS"]], [["Recovery", "มาตรการฟื้นฟู (Recovery)"], ["Recover and restore system environment after a disaster or outage", "กู้คืนระบบกลับสู่สภาวะปกติหลังเกิดภัยพิบัติ"], ["DR plans, data backups, server clustering, shadow copies", "แผนกู้คืนภัยพิบัติ (DRP), การกู้คืนข้อมูลสำรอง"]]]}, {"title": "Access Control Types", "thTitle": "ประเภทของมาตรการควบคุม (Administrative, Technical, Physical)", "type": "table", "headers": [["Type", "ประเภท"], ["Purpose", "วัตถุประสงค์"], ["Example", "ตัวอย่าง"]], "rows": [[["Administrative", "การบริหารจัดการ (Administrative)"], ["Administration of assets, personnel, and governance", "การกำหนดนโยบาย ระเบียบปฏิบัติ และการบริหารบุคลากร"], ["Data classification, labeling, security training, background checks, policies", "นโยบายความปลอดภัย, การจัดชั้นความลับ, การอบรมพนักงาน, ตรวจประวัติก่อนจ้าง"]], [["Logical/Technical", "เทคนิค/ตรรกะ (Technical/Logical)"], ["Software/hardware mechanisms restricting electronic access", "การใช้ฮาร์ดแวร์และซอฟต์แวร์ควบคุมการเข้าถึงระบบ"], ["Firewalls, IDS/IPS, encryption, biometrics, smart cards, passwords, ACLs", "ไฟร์วอลล์, การเข้ารหัส, รหัสผ่าน, ระบบสแกนลายนิ้วมือ, สิทธิ์ไฟล์"]], [["Physical", "กายภาพ (Physical)"], ["Protect physical infrastructure, facilities, and human personnel", "การปกป้องอาคาร สถานที่ ทรัพย์สิน และความปลอดภัยของบุคคล"], ["Perimeter security, fences, guards, locks, CCTV, cabling protection, mantraps", "รั้ว ประตูนิรภัย กล้องวงจรปิด เจ้าหน้าที่ รปภ. ประตูสองชั้น (Mantrap)"]]]}, {"title": "Authorization Methods / Concepts", "thTitle": "แนวคิดขั้นสูงในการจำกัดสิทธิ์และการตรวจสอบ", "type": "kv", "rows": [[["Constrained Interface Applications", "แอปพลิเคชันจำกัดอินเทอร์เฟซ"], ["Restrict actions performable by hiding/disabling menu options based on privileges", "การซ่อนหรือปิดการทำงานของปุ่ม/เมนูที่ผู้ใช้ไม่มีสิทธิ์ใช้งาน (เช่น ซ่อนปุ่มแก้ไข)"]], [["Content-Dependent", "การควบคุมตามเนื้อหา (Content-Dependent)"], ["Access restricted dynamically based on the specific sensitive content within an object", "การจำกัดสิทธิ์ตามเนื้อหาภายในข้อมูล เช่น ซ่อนคอลัมน์เงินเดือนในฐานข้อมูล"]], [["Context-Dependent / Work Hours", "การควบคุมตามบริบท (Context-Dependent)"], ["Access granted only after contextual criteria are satisfied (e.g. login allowed only during working hours or from corporate IP)", "การควบคุมสิทธิ์ตามบริบทแวดล้อม เช่น อนุญาตให้เข้าถึงได้เฉพาะช่วงเวลาทำงาน หรือจากเครือข่ายภายในองค์กร"]], [["Least Privilege", "สิทธิ์น้อยที่สุดเท่าที่จำเป็น"], ["Access granted strictly to what is required to perform assigned tasks — no more, no less", "การให้สิทธิ์เท่าที่จำเป็นต่อภารกิจ ไม่ให้สิทธิ์เผื่อ"]], [["Separation of Duties & Responsibilities", "การแบ่งแยกหน้าที่และความรับผิดชอบ"], ["Multi-step critical tasks split between 2 or more distinct individuals", "การแบ่งแยกขั้นตอนสำคัญให้มีผู้รับผิดชอบอย่างน้อย 2 คน ป้องกันการทุจริต"]], [["User Accountability", "ความรับผิดชอบของผู้ใช้"], ["Auditing/reporting, vulnerability assessment, pen testing, threat modeling", "การบันทึก Audit Log เพื่อให้สามารถตรวจสอบย้อนหลังหาตัวผู้กระทำได้เสมอ"]], [["Auditing and Reporting", "การตรวจสอบและรายงานผล"], ["Holding users accountable; monitoring network/app/system logs, user events, and keystroke activity", "การติดตามบันทึกเหตุการณ์ของระบบ แอปพลิเคชัน และพฤติกรรมผู้ใช้เพื่อหาความผิดปกติ"]]]}, {"title": "Vulnerability Assessment & Pen Testing", "thTitle": "การประเมินช่องโหว่และการทดสอบเจาะระบบ", "type": "kv", "rows": [[["Types", "ประเภทการทดสอบ"], ["Personnel Testing (social engineering), Physical Testing, System and Network Testing", "การทดสอบบุคคล (วิศวกรรมสังคม), การทดสอบกายภาพ, การทดสอบระบบและเครือข่าย"]], [["Pen test steps", "5 ขั้นตอนการทดสอบเจาะระบบ"], ["1. Record system info (Recon) · 2. Collect attack info · 3. Discover vulnerabilities · 4. Perform attacks (Exploit) · 5. Document outcome & remediate", "1. รวบรวมข้อมูลระบบ · 2. วิเคราะห์ภัย · 3. สแกนหาช่องโหว่ · 4. ทดลองเจาะระบบ · 5. จัดทำรายงานสรุปผลและแนวทางแก้ไข"]], [["Blind Test", "การทดสอบแบบ Blind (Black Hat Sim)"], ["Org knows about test beforehand, but pen-testers have zero insider knowledge", "ทีมทดสอบไม่มีข้อมูลภายในของระบบ แต่ทีมตั้งรับขององค์กรรู้ล่วงหน้าว่าจะมีการทดสอบ"]], [["Double-Blind Test", "การทดสอบแบบ Double-Blind (Zero Notice)"], ["Org IT staff does not know except senior management; pen-testers have zero info", "ทั้งทีมตั้งรับและผู้ทดสอบต่างไม่มีข้อมูลล่วงหน้า จำลองการโจมตีจริงของแฮกเกอร์"]], [["Target Test", "การทดสอบแบบมีเป้าหมาย (Targeted Test)"], ["Pen-testers and internal IT team work together with full knowledge of systems", "ผู้ทดสอบและทีมงานไอทีร่วมมือกันอย่างเปิดเผยเพื่อทดสอบระบบตามเป้าหมายเฉพาะเจาะจง"]], [["Zero-Knowledge Test", "การทดสอบแบบไม่มีข้อมูล (Black Box)"], ["No architectural or system info provided to testing team (pure black-box test)", "ผู้ทดสอบไม่ได้รับข้อมูลสถาปัตยกรรมใดๆ ของระบบเป้าหมาย (Black-Box Testing)"]], [["Partial Knowledge Test", "การทดสอบแบบมีข้อมูลบางส่วน (Gray Box)"], ["Team knows publicly available knowledge and limited user-level access (gray-box)", "ผู้ทดสอบได้รับข้อมูลเบื้องต้นบางส่วน เช่น บัญชีผู้ใช้ทั่วไป (Gray-Box Testing)"]], [["Full Knowledge Test", "การทดสอบแบบมีข้อมูลครบถ้วน (White Box)"], ["Team provided with full source code, architecture diagrams, and admin access (white-box)", "ผู้ทดสอบได้รับข้อมูลโครงสร้าง ซอร์สโค้ด และสิทธิ์ดูแลระบบครบถ้วน (White-Box Testing)"]]]}, {"title": "User Account Management", "thTitle": "การบริหารจัดการบัญชีผู้ใช้งาน (Account Lifecycle)", "type": "list", "rows": [["Regular account review and password changes", "การทบทวนสิทธิ์การใช้งานของบัญชีและบังคับเปลี่ยนรหัสผ่านเป็นระยะ"], ["Track access authorization via a procedure", "การติดตามและบันทึกการขออนุมัติสิทธิ์อย่างเป็นลายลักษณ์อักษรตามขั้นตอน"], ["Regularly verify accounts for active status and immediately deprovision terminated employees", "การตรวจสอบสถานะบัญชีที่ไม่ได้ใช้งาน และลบ/ระงับบัญชีของพนักงานที่ลาออกทันที"]]}, {"title": "Password Types", "thTitle": "ประเภทของรหัสผ่านและการยืนยันตัวตน", "type": "kv", "rows": [[["Simple Passwords", "รหัสผ่านแบบง่าย"], ["Single dictionary word, mixed upper/lowercase (weak, easily cracked)", "คำเดี่ยวจากพจนานุกรม สลับตัวพิมพ์ใหญ่เล็ก (ความปลอดภัยต่ำ ถูกถอดรหัสง่าย)"]], [["Combination/Composition Passwords", "รหัสผ่านแบบผสมคำ"], ["Two unmatching dictionary words combined with numbers/symbols", "คำสองคำที่ไม่เกี่ยวข้องกันรวมเข้าด้วยกันและแทรกตัวเลข/สัญลักษณ์"]], [["Passphrase Passwords", "วลีผ่าน (Passphrase)"], ["A long sequence of words forming a memorable sentence (high entropy, highly recommended)", "ประโยคยาวหลายคำต่อกัน จำง่ายแต่มีความยาวมาก ปลอดภัยต่อการ Brute Force สูง"]], [["One-Time/Dynamic Passwords", "รหัสผ่านใช้ครั้งเดียว (OTP)"], ["Dynamically generated token valid for a single session login only", "รหัสผ่านที่สร้างขึ้นใหม่และใช้ได้เพียงครั้งเดียวต่อการล็อกอินหนึ่งครั้ง"]], [["Graphical Passwords (CAPTCHA)", "รหัสผ่านภาพ / CAPTCHA"], ["Character images/graphics challenge to distinguish humans from automated bots", "ภาพกราฟิกหรือการเลือกรูปภาพเพื่อพิสูจน์ว่าเป็นมนุษย์ไม่ใช่บอท"]], [["Numeric Passwords", "รหัสตัวเลข (PIN)"], ["Digits/numbers only (e.g. 4-6 digit ATM PIN)", "รหัสตัวเลขล้วน เช่น รหัส PIN ตู้ ATM"]]]}]}, {"id": 6, "title": "Security Assessment & Testing", "thTitle": "การประเมินและการทดสอบความมั่นคงปลอดภัย", "color": "var(--c6)", "sections": [{"title": "Software Testing Types", "thTitle": "ประเภทของการทดสอบซอฟต์แวร์", "type": "kv", "rows": [[["Static Testing", "การทดสอบแบบสแตติก (SAST)"], ["Automated tools analyzing security without executing source code; e.g. code review for buffer overflow", "การตรวจวิเคราะห์ความปลอดภัยในซอร์สโค้ดโดยไม่ต้องรันโปรแกรม เช่น ค้นหา buffer overflow, syntax error"]], [["Dynamic Testing", "การทดสอบแบบไดนามิก (DAST)"], ["Test code in a running execution environment, no source access; e.g. probing running app for XSS, SQLi", "การทดสอบซอฟต์แวร์ขณะกำลังรันทำงานจริงจากภายนอกโดยไม่จำเป็นต้องเห็นซอร์สโค้ด"]], [["Fuzz Testing", "การทดสอบแบบฟัซซิ่ง (Fuzzing)"], ["Injecting massive invalid, unexpected, or random inputs to detect flaws and crashes under stress/load", "การป้อนข้อมูลสุ่มหรือข้อมูลผิดรูปแบบจำนวนมากเพื่อทดสอบหาข้อผิดพลาดและอาการแครช"]], [["Mutation/Dumb Fuzzing", "Mutation / Dumb Fuzzing"], ["Taking existing valid inputs and randomly modifying/mutating them to test resilience", "การนำข้อมูลนำเข้าที่ถูกต้องมาสุ่มดัดแปลงบางส่วนแล้วส่งไปทดสอบระบบ"]], [["Generational/Intelligent Fuzzing", "Generational / Smart Fuzzing"], ["Generating new test inputs from scratch based on formal data format specifications and protocols", "การสร้างข้อมูลทดสอบขึ้นใหม่ตามข้อกำหนดและโครงสร้างของโพรโทคอลอย่างชาญฉลาด"]], [["Misuse Case Testing", "การทดสอบกรณีใช้งานในทางที่ผิด (Misuse Case)"], ["Evaluating vulnerability against known malicious attacker behavioral scenarios", "การออกแบบกรณีทดสอบจากมุมมองของผู้โจมตีเพื่อดูว่าระบบทนทานต่อการถูกโจมตีหรือไม่"]], [["Interface Testing", "การทดสอบอินเทอร์เฟซ (Interface Testing)"], ["Evaluate module performance and data transfer compliance vs interface specifications", "การตรวจสอบการทำงานร่วมกันและการส่งผ่านข้อมูลระหว่างโมดูลว่าเป็นไปตามข้อกำหนดหรือไม่"]], [["API Testing", "การทดสอบความปลอดภัย API"], ["Test APIs to verify web application endpoints meet security, authentication, and boundary requirements", "การทดสอบ Endpoint ของ API เพื่อให้มั่นใจเรื่องการยืนยันตัวตนและการตรวจสอบขอบเขตข้อมูล"]], [["UI Testing", "การทดสอบส่วนติดต่อผู้ใช้ (UI Testing)"], ["Verifies GUIs & CLIs against requirement specifications and input sanitation controls", "การทดสอบหน้าจอใช้งาน (GUI / CLI) ว่าทำงานถูกต้องและมีการกรองข้อมูลนำเข้าที่ดี"]], [["Physical Interfaces", "อินเทอร์เฟซทางกายภาพ"], ["Testing physical device interfaces — e.g. ATM card readers, IoT hardware ports, kiosks", "การทดสอบความปลอดภัยของอุปกรณ์กายภาพ เช่น ช่องเสียบบัตร ATM, พอร์ตของอุปกรณ์ IoT"]], [["Unit Testing", "การทดสอบระดับหน่วย (Unit Testing)"], ["Testing individual functions, classes, or small parts of code in isolation before integration", "การทดสอบฟังก์ชันหรือคลาสย่อยๆ แต่ละส่วนแยกกันก่อนนำมารวมกัน"]], [["Integration Level Testing", "การทดสอบระดับการบูรณาการ"], ["Testing data flow and control transfer interfaces between multiple combined program modules", "การทดสอบการทำงานร่วมกันระหว่างโมดูลโปรแกรมหลายๆ ส่วนที่นำมาประกอบกัน"]], [["System Level Testing", "การทดสอบระดับระบบ (System Testing)"], ["Verifying that the entire integrated software system satisfies all specified business and security requirements", "การทดสอบระบบทั้งหมดแบบครบวงจรว่าตอบสนองฟังก์ชันและความปลอดภัยครบถ้วน"]]]}, {"title": "Log Management System", "thTitle": "ระบบการบริหารจัดการบันทึกเหตุการณ์ (Log Management)", "type": "kv", "rows": [[["OPSEC process", "กระบวนการ OPSEC"], ["Operations Security: analyze daily operations, identify vulnerabilities, review possible attacks, apply countermeasures", "การรักษาความปลอดภัยการปฏิบัติการ: วิเคราะห์งานประจำวัน ประเมินภัย และติดตั้งมาตรการป้องกัน"]], [["Pen-test", "การทดสอบเจาะระบบ (Penetration Test)"], ["Actively testing network and software security from an external adversary's perspective", "การจำลองการโจมตีจริงจากมุมมองของแฮกเกอร์เพื่อหาช่องโหว่ที่ใช้งานได้จริง"]], [["Port scanner", "โปรแกรมสแกนพอร์ต (Port Scanner)"], ["Utility (e.g. Nmap) checking any open/closed/filtered ports across target IP address ranges", "เครื่องมือตรวจสอบสถานะพอร์ตที่เปิดใช้งานอยู่บนเครื่องเป้าหมาย เช่น Nmap"]], [["Ring zero", "Ring 0 (ระดับเคอร์เนล)"], ["Most privileged CPU execution ring — contains internal core kernel code of the operating system", "ระดับสิทธิ์สูงสุดของซีพียู เป็นพื้นที่ทำงานของเคอร์เนลระบบปฏิบัติการ"]], [["Operational assurance", "ความเชื่อมั่นด้านการปฏิบัติการ"], ["Verifies that software continuously enforces security policies and requirements under production load", "การยืนยันว่าระบบยังคงรักษาระดับความปลอดภัยได้อย่างสม่ำเสมอในการใช้งานจริง"]], [["Supervisor mode", "โหมด Supervisor"], ["Privileged CPU execution state allowing direct execution of hardware and memory instructions", "สถานะการทำงานของซีพียูที่อนุญาตให้รันคำสั่งควบคุมฮาร์ดแวร์และหน่วยความจำได้โดยตรง"]]]}, {"title": "Threat Assessment Modeling — STRIDE", "thTitle": "แบบจำลองภัยคุกคาม STRIDE (Threat Modeling)", "type": "kv", "rows": [[["STRIDE", "ภาพรวม STRIDE"], ["Microsoft threat modeling methodology to evaluate threats against apps, OSs, and systems", "กรอบการประเมินภัยคุกคามของ Microsoft สำหรับวิเคราะห์ซอฟต์แวร์และสถาปัตยกรรม"]], [["Spoofing", "1. Spoofing (การปลอมแปลงตัวตน)"], ["False identity to gain access — forged IP/MAC address, stolen usernames, rogue wireless SSIDs (Violates Authentication)", "การแอบอ้างเป็นบุคคลหรือระบบอื่น เช่น ปลอม IP, ขโมย Username (ละเมิด Authentication)"]], [["Tampering", "2. Tampering (การดัดแปลงแก้ไขข้อมูล)"], ["Unauthorized modification of data in transit or in storage (Violates Integrity)", "การแอบแก้ไขข้อมูลระหว่างส่งหรือที่บันทึกไว้ในดิสก์โดยมิชอบ (ละเมิด Integrity)"]], [["Repudiation", "3. Repudiation (การปฏิเสธความรับผิดชอบ)"], ["Ability of an entity to deny performing an action due to lack of audit proof (Violates Non-Repudiation)", "การที่ผู้กระทำความผิดปฏิเสธว่าตนไม่ได้ทำเนื่องจากไม่มีหลักฐาน Log ที่รัดกุม (ละเมิด Non-Repudiation)"]], [["Information disclosure", "4. Information Disclosure (ข้อมูลรั่วไหล)"], ["Distribution of private, proprietary, or restricted info to unauthorized parties (Violates Confidentiality)", "การเปิดเผยข้อมูลความลับแก่ผู้ที่ไม่มีสิทธิ์เข้าถึง (ละเมิด Confidentiality)"]], [["Elevation of privilege", "5. Elevation of Privilege (การยกระดับสิทธิ์)"], ["An attacker with limited unprivileged access gains unauthorized administrator/root rights (Violates Authorization)", "การที่ผู้ใช้ทั่วไปสามารถเจาะระบบเพื่อยกระดับตนเองเป็น Admin หรือ Root (ละเมิด Authorization)"]]]}, {"title": "Risk Indicators & Vulnerability Scans", "thTitle": "ตัวชี้วัดความเสี่ยงและการสแกนช่องโหว่", "type": "kv", "rows": [[["Regular monitoring includes", "ตัวชี้วัดที่ต้องติดตามประจำ"], ["Number of open vulnerabilities, compromised accounts, mean time to resolve (MTTR), newly detected flaws", "จำนวนช่องโหว่ที่ค้างอยู่, บัญชีที่ถูกเจาะ, ระยะเวลาในการแก้ไข (MTTR), ช่องโหว่ใหม่ที่พบ"]], [["Vulnerability scans", "การสแกนช่องโหว่"], ["Automated passive/active tools probing systems, apps, and networks for known flaws (Nessus, Qualys)", "เครื่องมือสแกนอัตโนมัติเพื่อค้นหาช่องโหว่และจุดอ่อนที่ทราบในระบบ (เช่น Nessus, OpenVAS)"]], [["TCP SYN Scanning", "การสแกน TCP SYN (Half-Open)"], ["Sends packet with SYN flag; resets with RST upon receiving SYN/ACK ('half-open' stealth scan)", "ส่ง SYN หากตอบ SYN/ACK จะส่ง RST ยกเลิกทันที ไม่สร้างการเชื่อมต่อสมบูรณ์ (เงียบกว่า)"]], [["TCP Connect Scanning", "การสแกน TCP Connect"], ["Completes full 3-way handshake; used when scanner lacks raw packet forging permissions on OS", "ทำการจับมือ 3 ขั้นครบถ้วน ใช้เมื่อไม่มีสิทธิ์ระดับแอดมินในการสร้าง Raw Packet บน OS"]], [["TCP ACK Scanning", "การสแกน TCP ACK"], ["Sends packet with ACK flag set to map out firewall rulesets and stateful filtering behavior", "ส่งแพ็กเก็ต ACK เพื่อตรวจสอบกฎของไฟร์วอลล์ว่ามีการกรองแบบ Stateful หรือไม่"]], [["Xmas Scanning", "การสแกน Xmas Scan"], ["Sends packet with FIN, PSH, and URG flags all lit up; open ports ignore, closed ports reply RST on RFC-compliant stacks", "ส่งแพ็กเก็ตที่เปิดแฟล็ก FIN, PSH, URG พร้อมกันทั้งหมด พอร์ตปิดจะตอบ RST พอร์ตเปิดจะเงียบ"]], [["Passive Scanning", "การสแกนแบบ Passive"], ["Listens to network traffic silently to identify operating systems, versions, and rogue devices without sending active probes", "ดักฟังทราฟฟิกในเครือข่ายอย่างเงียบๆ เพื่อระบุชนิด OS และอุปกรณ์แปลกปลอมโดยไม่ส่งข้อมูลรบกวน"]], [["Authenticated scans", "การสแกนแบบใช้สิทธิ์ (Credentialed)"], ["Uses provided read-only credentials to log into target systems to inspect local registry, configurations, and patch levels directly", "ใช้รหัสผ่านล็อกอินเข้าไปตรวจสอบคอนฟิกและระดับแพตช์ภายในเครื่องอย่างละเอียด แม่นยำกว่า"]]]}, {"title": "Software Development Security Standards", "thTitle": "มาตรฐานความปลอดภัยในการพัฒนาซอฟต์แวร์", "type": "kv", "rows": [[["WASC", "WASC"], ["Web Application Security Consortium — open community creating application security standards", "กลุ่มความร่วมมือด้านความมั่นคงปลอดภัยเว็บแอปพลิเคชัน"]], [["OWASP", "OWASP"], ["Open Web Application Security Project — methodology, Top 10 risks, ASVS framework, cheat sheets", "โครงการความมั่นคงปลอดภัยแอปพลิเคชันบนเว็บแบบเปิด (ผู้เผยแพร่ OWASP Top 10)"]], [["BSI", "BSI (Build Security In)"], ["Build Security In initiative — US DHS project advocating incorporating security throughout all SDLC stages", "โครงการ Build Security In ของกระทรวงความมั่นคงแห่งมาตุภูมิสหรัฐฯ เน้นฝังความปลอดภัยในทุกขั้นตอน SDLC"]], [["IEC", "มาตรฐาน IEC"], ["International Electrotechnical Commission — standards for industrial, electrical, and software safety", "คณะกรรมาธิการระหว่างประเทศว่าด้วยมาตรฐานสาขาอิเล็กทรอเทคนิค (มาตรฐานความปลอดภัยระบบควบคุมและซอฟต์แวร์)"]]]}, {"title": "Security Testing — Software Threats", "thTitle": "ภัยคุกคามด้านซอฟต์แวร์และมัลแวร์", "type": "kv", "rows": [[["Viruses", "ประเภทของไวรัส"], ["Stealth (hides from OS), polymorphic (mutates cipher), macro virus (embedded in docs), spyware/adware, botnet, worm", "Stealth (ซ่อนตัว), Polymorphic (แปลงโค้ดตลอดเวลา), Macro (ฝังในเอกสาร Office), ไส้ศึก/สปายแวร์, บอตเน็ต, เวิร์ม"]], [["Rootkit", "รูทคิต (Rootkit)"], ["Kernel-mode, bootkit, user-mode, virtual, firmware rootkit — designed to hide deep in system and subvert OS controls", "มัลแวร์แฝงตัวระดับลึก: Kernel-Mode, Bootkit, Firmware Rootkit เพื่อควบคุมระบบและซ่อนตัวจากการตรวจจับ"]], [["Source Code Issues", "ปัญหาในซอร์สโค้ด"], ["Buffer overflow, integer overflow, escalation of privileges, backdoor, hardcoded secrets, race conditions", "Buffer Overflow, สิทธิ์รั่วไหล, ประตูหลัง (Backdoor), รหัสผ่านฝังในโค้ด, Race Condition"]], [["Malware Protection", "การป้องกันมัลแวร์"], ["Endpoint detection & response (EDR), signature/heuristic antivirus, sandboxing, strict security policies", "ระบบ EDR, แอนติไวรัสแบบ Heuristic และ Signature, ระบบ Sandboxing, นโยบายความปลอดภัย"]]]}, {"title": "Testing Considerations", "thTitle": "ข้อพิจารณาสำคัญก่อนการทดสอบความปลอดภัย", "type": "list", "rows": [["Resources availability", "ความพร้อมของทรัพยากรและบุคลากรผู้เชี่ยวชาญ"], ["Level of critical/sensitiveness of system under testing", "ระดับความสำคัญและข้อมูลอ่อนไหวของระบบที่อยู่ระหว่างการทดสอบ"], ["Technical failures", "ความเสี่ยงต่อความล้มเหลวทางเทคนิคของระบบขณะถูกทดสอบ"], ["Control misconfigurations = security loopholes", "การตั้งค่ามาตรการควบคุมผิดพลาดจนเกิดช่องโหว่ความปลอดภัยใหม่"], ["Security attack risks", "ความเสี่ยงที่การทดสอบอาจถูกแฮกเกอร์ฉวยโอกาสโจมตีซ้ำ"], ["Risk of performance changes", "ความเสี่ยงต่อสมรรถนะการทำงานของเซิร์ฟเวอร์ที่อาจช้าลง"], ["Impact on normal business operations", "ผลกระทบต่อความต่อเนื่องในการดำเนินธุรกิจตามปกติ (ต้องมีแผนถอยกลับ / Rollback)"]]}, {"title": "Verification & Validation / Security Software", "thTitle": "การทวนสอบ (Verification) vs การประเมินผลยืนยัน (Validation)", "type": "kv", "rows": [[["Verification", "Verification (การทวนสอบ)"], ["'Are we building the system right?' — checks that SDLC design specifications and architecture meet requirements", "'เราสร้างระบบได้ถูกต้องตามสเปกหรือไม่?' — ตรวจสอบว่าผลงานในแต่ละขั้นตอนตรงตามข้อกำหนดการออกแบบ"]], [["Validation", "Validation (การประเมินผลยืนยัน)"], ["'Are we building the right system?' — tests and validates that running software satisfies real user needs and operational requirements", "'เราสร้างระบบที่ถูกต้องตรงความต้องการของผู้ใช้หรือไม่?' — ทดสอบระบบจริงว่าทำงานตรงตามวัตถุประสงค์ธุรกิจ"]], [["Antimalware/AV", "ระบบ Antimalware / AV"], ["Real-time file scanning, heuristic detection, behavior analysis, and centralized signature updates", "การสแกนไฟล์แบบ Real-time, การตรวจจับเชิงพฤติกรรม และการอัปเดตฐานข้อมูลไวรัสจากศูนย์กลาง"]], [["IDS/IPS", "ระบบ IDS / IPS"], ["Real-time/promiscuous monitoring for attacks; N-IDS = network monitoring, no host-level scan; H-IDS = monitor via host event logs and file changes", "N-IDS (ตรวจจับทราฟฟิกบนเครือข่าย ไม่เห็นไฟล์ภายในโฮสต์) / H-IDS (ติดตั้งบนเครื่องเพื่อตรวจจับการเปลี่ยนแปลงไฟล์ระบบและ Log ภายใน)"]], [["Remote Access Software", "ซอฟต์แวร์เข้าถึงระยะไกล"], ["Must be authenticated via MFA and accessed exclusively via encrypted VPN / zero-trust tunnel", "ต้องบังคับใช้ MFA และเชื่อมต่อผ่าน VPN หรือ Zero-Trust Tunnel ที่เข้ารหัสเสมอ"]], [["Vulnerability assessment software", "ซอฟต์แวร์ประเมินช่องโหว่"], ["Must be continuously updated with latest CVE plugin definitions and patched", "ต้องอัปเดตฐานข้อมูลปลั๊กอินช่องโหว่ (CVE) ให้เป็นเวอร์ชันล่าสุดอยู่เสมอ"]], [["Routers", "เราเตอร์"], ["Configured with policy-based access control, ACLs, and disabled unneeded management protocols", "ต้องตั้งค่า ACL กรองทราฟฟิก และปิดโพรโทคอลการจัดการที่ไม่ปลอดภัย"]]]}, {"title": "Logs", "thTitle": "ประเภทของบันทึกเหตุการณ์ (Logs & Monitoring)", "type": "kv", "rows": [[["Network Flow", "NetFlow / IPFIX"], ["Network traffic metadata capture (source, destination, protocol, ports, bytes) for anomaly detection", "การบันทึก Metadata ของทราฟฟิกเครือข่าย (IP ต้นทาง/ปลายทาง, พอร์ต, ปริมาณข้อมูล) เพื่อตรวจจับสิ่งผิดปกติ"]], [["Audit logging", "Audit Logs"], ["Security events recording login attempts, privilege escalation, file access, and administrative actions", "การบันทึกเหตุการณ์ความปลอดภัย: การล็อกอิน, การใช้สิทธิ์แอดมิน, การเข้าถึงไฟล์สำคัญ"]], [["NTP", "โพรโทคอล NTP (Port 123)"], ["Network Time Protocol — must synchronize clocks across all systems for forensically valid log timestamps", "ต้องซิงค์เวลาของทุกอุปกรณ์ให้ตรงกัน เพื่อให้สามารถเรียงลำดับเหตุการณ์ใน Log ได้ถูกต้องตามหลักนิติวิทยาศาสตร์"]], [["Syslog", "มาตรฐาน Syslog (Port 514 UDP / 6514 TLS)"], ["Standard device event message logging protocol for centralized forwarding to SIEM", "มาตรฐานการส่งข้อความ Log จากอุปกรณ์ต่างๆ ไปยังศูนย์กลาง SIEM"]], [["Event types", "ประเภทเหตุการณ์ใน Log"], ["Errors, Warnings, Information, Success Audits, Failure Audits", "ข้อผิดพลาด (Errors), คำเตือน (Warnings), ข้อมูลทั่วไป (Info), การทำงานสำเร็จ/ล้มเหลว (Audit Success/Failure)"]], [["SNMP", "โพรโทคอล SNMP"], ["Simple Network Management Protocol — monitoring network device status and metrics (v3 recommended)", "โพรโทคอลติดตามสถานะอุปกรณ์เครือข่าย (แนะนำให้ใช้ SNMPv3 ที่เข้ารหัส)"]]]}, {"title": "Monitoring & Auditing", "thTitle": "การเฝ้าระวังและการตรวจสอบความปลอดภัย", "type": "list", "rows": [["Define a clipping level a.k.a. BASELINE (e.g. threshold of failed logins before triggering an alarm)", "กำหนดเกณฑ์ Clipping Level / Baseline (เช่น กำหนดให้แจ้งเตือนเมื่อล็อกอินผิดพลาดเกิน 3 ครั้ง)"], ["Audit trails: record event/transaction date/time, exact user ID, source IP, affected object, outcome", "ร่องรอยการตรวจสอบ (Audit Trail): ต้องบันทึกวันเวลา, บัญชีผู้ใช้, IP ต้นทาง, ข้อมูลที่เข้าถึง และผลลัพธ์"], ["Availability: log archival, tamper-proof storage (WORM — Write Once Read Many), regular integrity hashing", "ความพร้อมใช้งาน: การจัดเก็บอาร์ไคฟ์ Log ระยะยาวบนสื่อบันทึกแบบ WORM ป้องกันการลบแก้ไข"], ["Log Analysis: automated SIEM correlation engines to detect multi-stage coordinated attacks", "การวิเคราะห์ Log: ใช้ระบบ SIEM ประมวลผลความสัมพันธ์ของเหตุการณ์จากหลายระบบพร้อมกัน"]]}, {"title": "Code Review and Testing", "thTitle": "การทบทวนโค้ดและการประเมินความปลอดภัยของซอฟต์แวร์", "type": "kv", "rows": [[["Reviewer", "ผู้ทบทวนโค้ด (Peer Review)"], ["Someone other than the code author/developer systematically checks the code for defects", "บุคคลอื่นที่ไม่ใช่ผู้เขียนโปรแกรมเป็นผู้ตรวจสอบโค้ดเพื่อหาจุดบกพร่อง"]], [["Fagan inspections steps", "ขั้นตอนการตรวจสอบแบบ Fagan (6 ขั้นตอน)"], ["1. Planning → 2. Overview → 3. Preparation → 4. Inspection meeting → 5. Rework → 6. Follow-up", "1. วางแผน (Planning) → 2. ภาพรวม (Overview) → 3. เตรียมการ (Preparation) → 4. ประชุมตรวจโค้ด (Inspection) → 5. แก้ไขโค้ด (Rework) → 6. ติดตามผล (Follow-up)"]], [["Code Coverage Report", "รายงานความครอบคลุมของโค้ด (Code Coverage)"], ["Quantifies the percentage of codebase branches and lines executed during automated testing", "ร้อยละของบรรทัดโค้ดและเส้นทางการทำงานที่ถูกรันจริงระหว่างการทดสอบ"]], [["Use cases", "กรณีการใช้งาน (Use Cases)"], ["% of operational user journeys and business scenarios validated by test suites", "การจำลองสถานการณ์การใช้งานของผู้ใช้เพื่อตรวจสอบว่าโปรแกรมทำงานได้ตามวัตถุประสงค์"]], [["Code Review Report", "รายงานการทบทวนโค้ด"], ["Formal report documenting vulnerabilities, defects, and remediation steps found during code review", "เอกสารรายงานช่องโหว่และข้อบกพร่องที่พบพร้อมคำแนะนำในการแก้ไข"]], [["Black-box testing", "การทดสอบแบบกล่องดำ"], ["Test functionality from the outside with zero knowledge of internal source code or architecture", "ทดสอบการทำงานจากภายนอกโดยไม่มีความรู้เรื่องซอร์สโค้ดหรือสถาปัตยกรรมภายใน"]], [["Dynamic Testing", "การทดสอบแบบไดนามิก"], ["Testing the compiled software dynamically at run time in an execution environment", "ทดสอบโปรแกรมที่ถูกคอมไพล์แล้วขณะกำลังทำงานจริงในสภาพแวดล้อมรันไทม์"]], [["White-box testing", "การทดสอบแบบกล่องขาว"], ["Detailed structural testing with full access to source code, algorithms, and internal data structures", "การทดสอบเชิงลึกโดยเข้าถึงซอร์สโค้ด โครงสร้างข้อมูล และอัลกอริทึมทั้งหมด"]], [["CVE", "ฐานข้อมูล CVE"], ["Common Vulnerabilities and Exposures — standardized dictionary of publicly known cybersecurity vulnerabilities", "พจนานุกรมรหัสมาตรฐานสากลสำหรับระบุช่องโหว่ความปลอดภัยที่ถูกเปิดเผยสู่สาธารณะ"]], [["CVSS", "ระบบคะแนน CVSS"], ["Common Vulnerability Scoring System (0.0 to 10.0) measuring technical severity of vulnerabilities", "ระบบคำนวณคะแนนความรุนแรงของช่องโหว่ (0.0 - 10.0: ต่ำ, ปานกลาง, สูง, วิกฤต)"]], [["NVD", "ฐานข้อมูล NVD"], ["National Vulnerability Database — US government repository of standards-based vulnerability management data", "ฐานข้อมูลช่องโหว่แห่งชาติของสหรัฐอเมริกา เชื่อมโยงกับ CVE และ CVSS"]], [["Regression Testing", "การทดสอบความถดถอย (Regression Testing)"], ["Re-running existing test suites after bug fixes/updates to verify changes did not break existing features", "การทดสอบซ้ำหลังมีการแก้โค้ดหรือลงแพตช์ เพื่อให้มั่นใจว่าฟังก์ชันเดิมยังคงทำงานได้ปกติ"]], [["Integration Testing", "การทดสอบการผสานระบบ (Integration Testing)"], ["Verifying combined software components work properly together across shared interfaces", "การทดสอบการทำงานร่วมกันระหว่าง 2 โมดูลขึ้นไปเพื่อให้มั่นใจว่าส่งต่อข้อมูลถูกต้อง"]]]}]}, {"id": 7, "title": "Security Operations", "thTitle": "การปฏิบัติการความมั่นคงปลอดภัย", "color": "var(--c7)", "sections": [{"title": "Incident Scene & Evidence", "thTitle": "การจัดการสถานที่เกิดเหตุและพยานหลักฐาน", "type": "list", "rows": [["Assign ID to the scene", "กำหนดรหัสระบุสถานที่เกิดเหตุและคดีอย่างชัดเจน"], ["Incident environment protection", "ปิดกั้นและปกป้องสภาพแวดล้อมจุดเกิดเหตุไม่ให้ถูกรบกวน"], ["ID and possible sources of evidence", "ระบุแหล่งที่มาและตำแหน่งของพยานหลักฐานดิจิทัลทั้งหมด"], ["Collect evidence in prioritized order of volatility", "เก็บรวบรวมพยานหลักฐานตามลำดับความสูญหายง่าย (Order of Volatility)"], ["Avoid or minimize evidence contamination", "ป้องกันการปนเปื้อนหรือการเปลี่ยนแปลงข้อมูลในพยานหลักฐานอย่างเคร่งครัด"]]}, {"title": "Locard's Exchange Principle", "thTitle": "หลักการแลกเปลี่ยนของโลการ์ด (Locard's Principle)", "type": "kv", "rows": [[["Principle", "หลักการพื้นฐาน"], ["In a crime the suspect leaves something and takes something — digital leftovers and traces identify the suspect", "เมื่อมีการก่ออาชญากรรม ผู้กระทำผิดจะทิ้งร่องรอยบางอย่างไว้เสมอ และจะนำบางสิ่งติดตัวไปด้วย — ร่องรอยดิจิทัลที่ตกค้างจะช่วยระบุตัวคนร้าย"]]]}, {"title": "Characteristics of Evidence", "thTitle": "คุณลักษณะ 4 ประการของพยานหลักฐานที่ดี", "type": "kv", "rows": [[["Sufficient", "ความเพียงพอ (Sufficient)"], ["Must be persuasive and adequate to convince a reasonable person of the facts", "หลักฐานต้องมีน้ำหนักและปริมาณเพียงพอที่จะโน้มน้าวให้ศาลเชื่อในข้อเท็จจริง"]], [["Reliable", "ความน่าเชื่อถือ (Reliable)"], ["Consistent facts; proven to be authentic, untampered, and accurately extracted", "ข้อเท็จจริงสอดคล้องกัน ผ่านการพิสูจน์ว่าเป็นของแท้ ไม่ถูกแก้ไขดัดแปลง"]], [["Relevant", "ความเกี่ยวข้อง (Relevant)"], ["Reasonable relationship to the crimes/acts/methods being investigated; event documentation", "มีความเกี่ยวข้องโดยตรงกับประเด็นหรือการกระทำผิดที่กำลังสอบสวน"]], [["Permissible", "ความถูกต้องตามกฎหมาย (Permissible/Admissible)"], ["Evidence obtained strictly lawfully in compliance with constitutional rights and search warrants", "ได้มาโดยชอบด้วยกฎหมาย มีหมายศาลถูกต้อง และไม่ละเมิดสิทธิตามรัฐธรรมนูญ"]]]}, {"title": "Evidence Lifecycle", "thTitle": "วงจรชีวิตของพยานหลักฐานดิจิทัล (8 ขั้นตอน)", "type": "list", "rows": [["1. Discovery and recognition", "1. การค้นพบและตรวจระบุพยานหลักฐาน (Discovery)"], ["2. Protection and preservation", "2. การป้องกันและรักษาสภาพแวดล้อม (Protection)"], ["3. Recording and documentation", "3. การบันทึกภาพและจัดทำเอกสารประกอบ (Recording)"], ["4. Collection and identification", "4. การเก็บรวบรวมและการติดป้ายระบุพยานหลักฐาน (Collection)"], ["5. Forensic analysis", "5. การตรวจพิสูจน์และวิเคราะห์ทางนิติวิทยาศาสตร์ (Analysis)"], ["6. Storage, preservation, and secure transportation", "6. การจัดเก็บ รักษาความปลอดภัย และการขนส่ง (Storage & Transport)"], ["7. Present in court as expert testimony", "7. การนำเสนอพยานหลักฐานต่อศาล (Court Presentation)"], ["8. Return to legitimate owner or secure destruction", "8. การส่งคืนเจ้าของหรือการทำลายทิ้งตามคำสั่งศาล (Return/Disposition)"]]}, {"title": "Live Evidence Types", "thTitle": "ประเภทของพยานหลักฐานในชั้นศาล", "type": "kv", "rows": [[["Primary Evidence", "พยานเอกสารต้นฉบับ (Best Evidence)"], ["Most reliable, used at trial — original documents and physical evidence, no copies", "หลักฐานที่มีความน่าเชื่อถือสูงสุด — เอกสารหรือฮาร์ดแวร์ต้นฉบับแท้จริง ไม่ใช่สำเนา"]], [["Secondary Evidence", "พยานหลักฐานชั้นรอง (Secondary Evidence)"], ["Less reliable — copies of originals, oral testimonies, system log printouts", "หลักฐานที่มีน้ำหนักรองลงมา — สำเนาเอกสาร, คำเบิกความด้วยวาจา, รายงานพิมพ์จาก Log"]], [["Direct Evidence", "ประจักษ์พยาน (Direct Evidence)"], ["Proves a fact directly without requiring inferences — e.g. eyewitness testimony via 5 senses", "หลักฐานที่พิสูจน์ข้อเท็จจริงได้โดยตรง เช่น พยานบุคคลผู้เห็นเหตุการณ์ด้วยตนเอง"]], [["Conclusive Evidence", "พยานหลักฐานเด็ดขาด (Conclusive Evidence)"], ["Incontrovertible evidence that cannot be contradicted; conclusive proof of a fact", "หลักฐานที่ชัดเจนจนไม่อาจหักล้างได้ มีน้ำหนักชี้ขาดในข้อเท็จจริง"]], [["Corroborative Evidence", "พยานหลักฐานสนับสนุน (Corroborative Evidence)"], ["Supplementary evidence used to support, substantiate, and confirm other evidence", "หลักฐานประกอบที่นำมาใช้สนับสนุนหรือเสริมความน่าเชื่อถือของพยานหลักฐานอื่น"]], [["Hearsay Evidence", "พยานบอกเล่า (Hearsay Evidence)"], ["Second-hand testimony of what someone heard from another person — generally inadmissible in court", "คำให้การที่ได้ยินมาจากผู้อื่นอีกทอดหนึ่ง — โดยทั่วไปศาลจะไม่รับฟัง เว้นแต่มีข้อยกเว้นตามกฎหมาย"]]]}, {"title": "Interviewing and Interrogation", "thTitle": "การสัมภาษณ์ (Interview) vs การสอบปากคำ (Interrogation)", "type": "kv", "rows": [[["Interviewing", "การสัมภาษณ์ (Interviewing)"], ["Non-accusatory conversation to collect facts, timelines, and information from witnesses/victims", "การพูดคุยสอบถามพยานหรือผู้เสียหายโดยไม่กล่าวหา เพื่อรวบรวมข้อเท็จจริงและลำดับเวลา"]], [["Interrogation", "การสอบปากคำผู้ต้องสงสัย (Interrogation)"], ["Accusatory process aimed at obtaining an admission or confession from a suspect using retrieved evidence", "กระบวนการสอบปากคำผู้ต้องสงสัยโดยใช้หลักฐานที่มีเพื่อหาข้อยอมรับหรือคำรับสารภาพ"]], [["Opinion Rule", "กฎว่าด้วยความเห็น (Opinion Rule)"], ["Lay witnesses may testify only regarding observed facts, not draw personal conclusions/opinions", "พยานทั่วไปสามารถเบิกความได้เฉพาะข้อเท็จจริงที่ตนพบเห็นเท่านั้น ไม่อาจให้ความเห็นส่วนตัวได้"]], [["Expert Witnesses", "พยานผู้เชี่ยวชาญ (Expert Witnesses)"], ["Qualified technical specialists permitted by court to give professional opinions and analysis", "ผู้เชี่ยวชาญเฉพาะทางที่ศาลอนุญาตให้แสดงความคิดเห็นเชิงวิชาชีพและผลการวิเคราะห์ทางเทคนิคได้"]]]}, {"title": "Digital Evidence — Six Principles", "thTitle": "6 หลักการสากลในการจัดการพยานหลักฐานดิจิทัล (IOCE)", "type": "list", "rows": [["All general forensic and procedural legal principles apply fully to digital evidence", "1. หลักนิติวิทยาศาสตร์และกฎหมายวิธีพิจารณาความทั่วไปต้องนำมาบังคับใช้กับหลักฐานดิจิทัลอย่างครบถ้วน"], ["Upon seizure, no actions should be taken that alter original data on storage media", "2. เมื่อทำการยึดพยานหลักฐาน ต้องไม่มีการกระทำใดๆ ที่ทำให้ข้อมูลต้นฉบับเกิดการเปลี่ยนแปลง"], ["All individuals accessing digital evidence must be fully trained forensic specialists", "3. บุคคลทุกคนที่เข้าถึงพยานหลักฐานดิจิทัลต้องเป็นผู้เชี่ยวชาญที่ผ่านการฝึกอบรมอย่างถูกต้อง"], ["All actions performed on the data must be fully documented, logged, and verifiable by third parties", "4. ทุกขั้นตอนที่กระทำต่อพยานหลักฐานต้องถูกบันทึกเป็นเอกสารและสามารถตรวจสอบย้อนหลังได้"], ["Anyone who possesses digital evidence is personally responsible for all actions taken with it while in custody", "5. ผู้ครอบครองพยานหลักฐานต้องรับผิดชอบต่อการกระทำทั้งหมดที่เกิดขึ้นกับหลักฐานในความดูแลของตน"], ["Any agency possessing evidence must comply with these governing operational principles", "6. หน่วยงานทุกแห่งที่เก็บรักษาพยานหลักฐานต้องปฏิบัติตามหลักการเหล่านี้อย่างเคร่งครัด"]]}, {"title": "Media / Network Analysis", "thTitle": "การวิเคราะห์สื่อบันทึกและระบบเครือข่ายทางนิติวิทยาศาสตร์", "type": "kv", "rows": [[["Media Analysis", "การวิเคราะห์สื่อบันทึก (Disk Forensics)"], ["Identification and extraction of artifacts from storage media — hard drives, flash, optical, volatile RAM dumps", "การกู้คืนและวิเคราะห์ข้อมูลจากสื่อบันทึก (ฮาร์ดดิสก์ แฟลชไดรฟ์ แรม) โดยทำสำเนาแบบ Bit-by-Bit Image เสมอ"]], [["Network Analysis", "การวิเคราะห์เครือข่าย (Network Forensics)"], ["Inspecting breach activity via IDS/IPS alerts, firewall state logs, flow data, packet captures · Software analysis: examining running processes · Hardware analysis: inspecting mobile/embedded firmware", "การตรวจสอบร่องรอยการบุกรุกจาก Log ไฟร์วอลล์, แพ็กเก็ตเครือข่าย, โปรเซสที่ทำงานอยู่ และเฟิร์มแวร์อุปกรณ์"]]]}, {"title": "Admissible Evidence & Digital Forensics", "thTitle": "เกณฑ์การยอมรับพยานหลักฐานและกฎ 5 ข้อของ Digital Forensics", "type": "kv", "rows": [[["Admissible Evidence", "หลักฐานที่รับฟังได้ในศาล"], ["Must be relevant to the case, reliable, authenticated, and lawfully obtained under search warrants", "หลักฐานต้องเกี่ยวข้องกับคดี น่าเชื่อถือ เป็นของแท้ และได้มาโดยชอบด้วยกฎหมาย"]], [["Digital Forensics — 5 rules", "กฎ 5 ข้อของนิติวิทยาศาสตร์ดิจิทัล"], ["1. Authentic (ผูกกับคดีจริง) · 2. Accurate (แม่นยำไม่ผิดเพี้ยน) · 3. Complete (ครบถ้วนทุกมิติ) · 4. Convincing (น่าเชื่อถือชัดเจน) · 5. Admissible (รับฟังได้ตามกฎหมาย)", "1. Authentic (ของแท้) · 2. Accurate (ถูกต้องแม่นยำ) · 3. Complete (สมบูรณ์) · 4. Convincing (น่าเชื่อถือ) · 5. Admissible (ศาลยอมรับฟัง)"]]]}, {"title": "Investigation to Determine Suspects", "thTitle": "ประเภทของการสืบสวนสอบสวน (Investigation Types)", "type": "list", "rows": [["Operational Investigation: examines internal policy violations, operational failures, and internal system attacks", "การสืบสวนด้านการปฏิบัติการ (Operational): ตรวจสอบการละเมิดนโยบายภายในและความล้มเหลวของระบบ"], ["Criminal Investigation: conducted by law enforcement for statutory criminal law violations (beyond a reasonable doubt standard)", "การสืบสวนคดีอาญา (Criminal): ดำเนินการโดยตำรวจ/เจ้าหน้าที่รัฐ ต้องมีหลักฐานชัดเจนปราศจากข้อสงสัยตามสมควร"], ["Civil Investigation: disputes between private parties or corporations (preponderance of the evidence standard)", "การสืบสวนคดีแพ่ง (Civil): ข้อพิพาทระหว่างเอกชน/องค์กร ใช้เกณฑ์น้ำหนักพยานหลักฐานที่น่าเชื่อถือมากกว่า"], ["eDiscovery: formal process of identifying, preserving, collecting, and producing electronic documents for legal proceedings", "กระบวนการ eDiscovery: การค้นหา รวบรวม และส่งมอบเอกสารอิเล็กทรอนิกส์ในกระบวนการพิจารณาคดีความ"]]}, {"title": "Governing Laws", "thTitle": "ระบบกฎหมายหลักและอำนาจ 3 ฝ่าย", "type": "kv", "rows": [[["Common law", "ระบบคอมมอนลอว์ (Common Law)"], ["USA, UK, Australia, Canada — based on precedent, judicial decisions, and statutory law", "สหรัฐอเมริกา สหราชอาณาจักร แคนาดา — ตัดสินตามแนวคำพิพากษาบรรทัดฐานของศาลในอดีต"]], [["Civil law", "ระบบซีวิลลอว์ (Civil / Code Law)"], ["Continental Europe, South America, Thailand — based on comprehensive written statutory codes", "ยุโรป อเมริกาใต้ ไทย — ตัดสินตามประมวลกฎหมายลายลักษณ์อักษรเป็นหลัก"]], [["Islamic/other religious laws", "กฎหมายศาสนา (Religious Law)"], ["Middle East, parts of Africa, Indonesia — based on religious scriptures and doctrines (Sharia)", "อิงตามคัมภีร์และหลักคำสอนทางศาสนา เช่น กฎหมายชารีอะฮ์"]], [["3 Branches of Law", "อำนาจ 3 ฝ่ายตามรัฐธรรมนูญ"], ["Legislative (Statutory — enacts laws) · Executive (Administrative — enforces laws & regulations) · Judicial (Interprets laws & decides cases)", "นิติบัญญัติ (ตรากฎหมาย) · บริหาร (บังคับใช้กฎหมายและระเบียบ) · ตุลาการ (ตีความกฎหมายและตัดสินคดี)"]]]}, {"title": "Categories of Law", "thTitle": "หมวดหมู่ของกฎหมายและบทลงโทษ", "type": "kv", "rows": [[["Criminal law", "กฎหมายอาญา (Criminal Law)"], ["Violates laws protecting public order and society → penalties include imprisonment, fines paid to government", "การกระทำผิดต่อความสงบเรียบร้อยของสังคมและรัฐ → บทลงโทษคือการจำคุก การประหารชีวิต หรือปรับเข้าหลวง"]], [["Civil law", "กฎหมายแพ่ง (Civil Law / Tort)"], ["Wrongful act (tort) against an individual or corporation causing financial loss/harm → financial restitution/damages", "การละเมิดสิทธิ์ระหว่างเอกชน ก่อให้เกิดความเสียหาย → บทลงโทษคือการชดใช้ค่าสินไหมทดแทนทางการเงิน"]], [["Administrative/Regulatory law", "กฎหมายปกครอง/ระเบียบข้อบังคับ"], ["Standards set by government agencies governing corporate operations (HIPAA, FTC, SEC) → fines, license revocation", "ระเบียบที่หน่วยงานรัฐกำหนดเพื่อควบคุมอุตสาหกรรม (เช่น กลต., PDPA) → โทษปรับทางปกครองหรือเพิกถอนใบอนุญาต"]]]}, {"title": "Computer Crime Laws & Key Terms", "thTitle": "กฎหมายอาชญากรรมคอมพิวเตอร์และคำศัพท์สำคัญ", "type": "kv", "rows": [[["UCITA", "กฎหมาย UCITA"], ["Uniform Computer Information Transactions Act — legal framework for software licensing and IT contracts", "กฎหมายว่าด้วยธุรกรรมสารสนเทศคอมพิวเตอร์และสัญญาอนุญาตซอฟต์แวร์"]], [["3 types of harm", "3 รูปแบบความเสียหายทางไซเบอร์"], ["Unauthorized access/intrusion, unauthorized alteration/destruction of data, malicious code transmission", "การบุกรุกระบบโดยมิชอบ, การแก้ไขหรือทำลายข้อมูลโดยมิชอบ, การปล่อยมัลแวร์ทำลายระบบ"]], [["Admissible evidence", "หลักฐานที่รับฟังได้"], ["Relevant, authentic, sufficient, reliable — does not strictly need to be tangible physical item", "ต้องมีความเกี่ยวข้อง เป็นของแท้ เพียงพอ และน่าเชื่อถือ ไม่จำเป็นต้องเป็นวัตถุกายภาพเสมอไป"]], [["Hearsay", "พยานบอกเล่า"], ["Second-hand out-of-court statement offered to prove truth; generally inadmissible", "คำบอกเล่าที่บุคคลอื่นกล่าวไว้นอกศาล ศาลไม่รับฟังเว้นแต่มีข้อยกเว้นทางกฎหมาย"]], [["Enticement", "การล่อลวงแบบชอบด้วยกฎหมาย (Enticement)"], ["Legal action of making an open enticing target (e.g. Honeypot) visible to detect intruders who already have malicious intent", "การวางกับดักล่อ (เช่น Honeypot) เพื่อตรวจจับผู้ที่มีเจตนาชั่วร้ายอยู่แล้ว — ถูกต้องตามกฎหมาย"]], [["Entrapment", "การล่อลวงให้กระทำความผิด (Entrapment)"], ["Illegal act of law enforcement inducing an individual to commit a crime they had no prior intent to commit", "การที่เจ้าหน้าที่รัฐหลอกล่อชักจูงให้บุคคลกระทำความผิดที่เดิมไม่ได้มีความตั้งใจจะทำ — ผิดกฎหมาย ศาลจะยกฟ้อง"]]]}, {"title": "Asset Management", "thTitle": "การบริหารจัดการสินทรัพย์และการปฏิบัติการรักษาความปลอดภัย", "type": "kv", "rows": [[["Preserve", "การรักษาคุณสมบัติสำคัญ"], ["Availability, authorization/integrity, redundancy/fault tolerance, backup/recovery, IAM", "รักษาความพร้อมใช้งาน ความถูกต้องสมบูรณ์ ความทนทานต่อข้อผิดพลาด การสำรองข้อมูล และระบบ IAM"]], [["Storage Mgmt Issues", "การจัดการระบบจัดเก็บข้อมูล"], ["HSM (Hierarchical Storage Mgmt — continuous migration between fast/optical storage) · media history log · media labeling · climate control", "HSM (การย้ายข้อมูลอัตโนมัติตามความถี่การใช้งานสู่เทป/ออปติคอล) · การติดฉลากสื่อบันทึก · การควบคุมอุณหภูมิห้องเก็บสื่อ"]], [["Sanitizing & Disposing of Data", "การลบล้างและทำลายข้อมูล"], ["Data purging (degaussing — unusable for forensics) · data clearing (unrecoverable via keyboard) · remanence (data left after deletion)", "Purging (ลบล้างสนามแม่เหล็ก กู้คืนไม่ได้แม้ใช้แล็บนิติวิทยาศาสตร์) · Clearing (เขียนทับ กู้คืนไม่ได้ผ่านคีย์บอร์ด) · Remanence (ข้อมูลตกค้าง)"]], [["Network & Resource Mgmt", "การจัดการทรัพยากรและเครือข่าย"], ["Redundant hardware, fault-tolerant tech, SLAs, MTBF/MTTR, single point of failure (SPOF)", "อุปกรณ์สำรองคู่ขนาน, เทคโนโลยีทนทานต่อความล้มเหลว, ข้อตกลง SLA, ตัวชี้วัด MTBF/MTTR, การกำจัดจุดบกพร่องเดี่ยว (SPOF)"]], [["Incident Response Steps", "ขั้นตอนการตอบสนองต่อเหตุการณ์"], ["1. Detect · 2. Respond · 3. Report · 4. Recover · 5. Remediate · 6. Review", "1. ตรวจจับ (Detect) · 2. ตอบสนอง (Respond) · 3. รายงาน (Report) · 4. กู้คืน (Recover) · 5. แก้ไข (Remediate) · 6. ทบทวนบทเรียน (Review)"]], [["Change Management", "กระบวนการจัดการการเปลี่ยนแปลง"], ["Formal request, impact analysis vs business goals, cost estimation, approval, incremental testing, rollback plan, complete documentation", "ยื่นคำขออย่างเป็นทางการ, วิเคราะห์ผลกระทบ, อนุมัติโดย CAB, ทดสอบก่อนขึ้นระบบจริง, เตรียมแผน Rollback, จัดทำเอกสารครบถ้วน"]], [["Threats & Preventative Measures", "ภัยคุกคามและมาตรการป้องกัน"], ["Clipping levels (baseline for user errors), deviation from baseline (DDoS), unusual traffic patterns, unscheduled reboots, I/O controls", "Clipping Level (เกณฑ์ดักจับข้อผิดพลาด), ตรวจจับความผิดปกติจาก Baseline, การตรวจจับทราฟฟิก DDoS, รีบูตนอกเวลา, การควบคุม I/O"]]]}, {"title": "SIEM & IDS/IPS", "thTitle": "ระบบ SIEM และการตรวจจับ/ป้องกันการบุกรุก (IDS/IPS)", "type": "kv", "rows": [[["SIEM", "ระบบ SIEM"], ["Security Information and Event Management — centralized log aggregation, normalization, real-time event correlation, threat alerts", "ระบบรวมศูนย์ Log จากทุกอุปกรณ์ แปลงข้อมูลให้เป็นมาตรฐาน วิเคราะห์ความสัมพันธ์ของเหตุการณ์แบบ Real-time"]], [["IDS", "ระบบตรวจจับการบุกรุก (IDS)"], ["Automated inspection of network traffic and system logs to detect active intrusions; passive alerting, effective vs DoS/attacks", "ตรวจสอบแพ็กเก็ตและ Log อัตโนมัติเพื่อแจ้งเตือนเมื่อพบการบุกรุก (ทำงานแบบ Passive ไม่บล็อกทราฟฟิก)"]], [["IPS", "ระบบป้องกันการบุกรุก (IPS)"], ["In-line inspection device with automated capability to detect AND actively block malicious traffic, drop packets, reset sessions", "ติดตั้งแบบ In-line เพื่อตรวจจับและ **บล็อกตัดการเชื่อมต่ออันตรายทันที** (Active Response)"]]]}, {"title": "DLP & Data States", "thTitle": "ระบบป้องกันข้อมูลรั่วไหล (DLP) และสถานะของข้อมูล", "type": "kv", "rows": [[["DLP", "ระบบ DLP"], ["Data Loss Prevention — inspects data for confidential patterns/keywords (credit cards, SSN); blocks unauthorized exfiltration", "ระบบสแกนข้อมูลเพื่อค้นหาคำสำคัญหรือรูปแบบข้อมูลลับ (เช่น เลขบัตรเครดิต) และสกัดกั้นการส่งออกนอกองค์กร"]], [["Network-based DLP", "DLP ระดับเครือข่าย (Data in Motion)"], ["Data in motion — inspects outbound traffic (email, web, FTP) at the perimeter network edge", "ตรวจสอบข้อมูลที่กำลังวิ่งผ่านเครือข่ายขาออก (อีเมล, การอัปโหลดเว็บ, FTP) ที่ขอบเครือข่าย"]], [["Endpoint-based DLP", "DLP ระดับเครื่องลูกข่าย (Data in Use)"], ["Data in use / Data at rest — installed on workstations to block unauthorized USB copying, print screens, clipboard copies", "ติดตั้งเป็น Agent บนเครื่องผู้ใช้เพื่อควบคุมการก็อปปี้ลง USB, สั่งพิมพ์, หรือแคปหน้าจอ"]], [["Data at Rest", "ข้อมูลที่จัดเก็บ (Data at Rest)"], ["Stored on physical media, databases, SAN/NAS, backups — protected via full-disk/database encryption", "ข้อมูลที่บันทึกอยู่ในฮาร์ดดิสก์ ฐานข้อมูล สื่อสำรอง — ป้องกันด้วยการเข้ารหัสไฟล์และดิสก์"]], [["Data in Motion", "ข้อมูลระหว่างส่ง (Data in Motion)"], ["Travelling across corporate LAN or public internet — protected via TLS 1.3, IPsec, HTTPS VPN", "ข้อมูลที่วิ่งอยู่บนสายสัญญาณหรืออินเทอร์เน็ต — ป้องกันด้วยการเข้ารหัส TLS / IPsec"]], [["Data in Use", "ข้อมูลขณะใช้งาน (Data in Use)"], ["Active in volatile RAM, CPU registers, or application memory — protected via process isolation and memory encryption", "ข้อมูลที่กำลังถูกประมวลผลอยู่ในแรมหรือซีพียู — ป้องกันด้วยการแยก Memory Space"]]]}, {"title": "Configuration Management (CM)", "thTitle": "การบริหารจัดการการกำหนดค่า (Configuration Management)", "type": "kv", "rows": [[["CM", "ภาพรวม CM (ITIL / ITSM)"], ["ITIL / ITSM process tracking all Configuration Items (CIs) to maintain baseline integrity", "กระบวนการติดตามและควบคุมคุณลักษณะของ Configuration Item (CI) ทั้งหมดในระบบ"]], [["Configuration Items", "รายการกำหนดค่า (CIs)"], ["Any component that needs to be managed to deliver IT services — Version = baseline state; Configuration = collection of CIs", "ส่วนประกอบทุกชิ้นที่ต้องบริหารจัดการ เช่น เซิร์ฟเวอร์, ซอฟต์แวร์, สวิตช์ โดยมี Version กำกับสถานะ Baseline"]], [["Building", "การประกอบระบบ (Build Process)"], ["Assembling hardware and software baseline configuration from approved CI repository (Build List)", "การติดตั้งและประกอบระบบจากรายการคอมโพเนนต์ที่ผ่านการอนุมัติแล้ว (Build List)"]], [["Artifacts", "วัตถุระบบ (Artifacts)"], ["Recovery procedures, system images, restart scripts, configuration templates securely accessible by authorized admins", "เอกสารขั้นตอนการกู้คืน อิมเมจระบบ สคริปต์รีสตาร์ต ที่เก็บรักษาไว้อย่างปลอดภัยสำหรับผู้ดูแลระบบ"]]]}, {"title": "Incident Response", "thTitle": "วงจรการตอบสนองต่อเหตุการณ์ความมั่นคงปลอดภัย", "type": "kv", "rows": [[["Lifecycle", "วงจรชีวิต Incident Response"], ["1. Preparation (tools/training) → 2. Detection & Analysis → 3. Containment → 4. Eradication → 5. Recovery → 6. Lessons Learned (Feedback)", "1. เตรียมความพร้อม → 2. ตรวจจับและวิเคราะห์ → 3. จำกัดขอบเขต → 4. กำจัดภัย → 5. กู้คืนระบบ → 6. สรุปบทเรียน"]], [["Mitigation", "การบรรเทาความเสียหาย"], ["Taking immediate containment steps to minimize impact and scope of the active security breach", "การดำเนินการเฉพาะหน้าอย่างรวดเร็วเพื่อจำกัดความเสียหายไม่ให้ลุกลาม"]]]}, {"title": "Root Cause Analysis (RCA)", "thTitle": "ระเบียบวิธีวิเคราะห์หาสาเหตุที่แท้จริง (RCA)", "type": "kv", "rows": [[["Fault Tree Analysis (FTA)", "การวิเคราะห์ Fault Tree (FTA)"], ["Top-down deductive failure analysis using boolean logic gates (AND, OR) to model system failure paths", "การวิเคราะห์แบบบนลงล่างโดยใช้แผนผังตรรกะแบบบูลีน (AND/OR) เพื่อหาสาเหตุที่ทำให้ระบบล้มเหลว"]], [["FMEA", "การวิเคราะห์ FMEA"], ["Failure Modes and Effects Analysis — proactive review of components and subsystems to identify potential failure modes and severity", "การวิเคราะห์รูปแบบความล้มเหลวและผลกระทบเชิงรุกของแต่ละชิ้นส่วนเพื่อป้องกันล่วงหน้า"]], [["Pareto Analysis", "การวิเคราะห์พาเรโต (Pareto 80/20)"], ["Identifies top 20% of root causes responsible for 80% of system defects and security incidents", "กฎ 80/20: มุ่งแก้ไขสาเหตุหลัก 20% แรกที่ก่อให้เกิดปัญหาและความเสียหายถึง 80% ของทั้งหมด"]], [["Cause Mapping", "การทำแผนผังสาเหตุและผล (Cause Mapping)"], ["Visual connection of cause-and-effect relationships to provide deep insight into complex multi-variable systemic failures", "การเชื่อมโยงแผนผังเหตุและผลเพื่อให้เห็นภาพความสัมพันธ์ของปัญหาที่ซับซ้อนอย่างเป็นระบบ"]]]}, {"title": "Firewalls (Host vs Network)", "thTitle": "ระบบตรวจจับการบุกรุกระดับโฮสต์ vs ระดับเครือข่าย", "type": "kv", "rows": [[["HIDS", "HIDS (Host-based IDS)"], ["Monitors internals of a single computing host incl. OS system calls, registry changes, local log files, and critical file integrity", "ติดตั้งบนเครื่องโฮสต์ ตรวจสอบ System Call, การแก้ Registry, Log ภายในเครื่อง และความถูกต้องของไฟล์ระบบ"]], [["NIDS", "NIDS (Network-based IDS)"], ["Monitors and analyzes network packet traffic spanning multiple network segments; detects port scans, DoS, and known protocol exploits", "ติดตั้งดักจับแพ็กเก็ตบนเครือข่าย ตรวจจับการสแกนพอร์ต, ทราฟฟิก DDoS, และการโจมตีโพรโทคอล"]]]}, {"title": "Backup Types", "thTitle": "ประเภทของการสำรองข้อมูล (Backup Types)", "type": "kv", "rows": [[["Full", "การสำรองข้อมูลแบบเต็ม (Full Backup)"], ["All selected files are backed up; resets/clears the Archive bit (fastest restore, longest backup time)", "สำรองข้อมูลทั้งหมดทุกไฟล์; ทำการล้าง/รีเซ็ต Archive Bit (กู้คืนเร็วที่สุด แต่ใช้เวลาสำรองนานสุด)"]], [["Incremental", "การสำรองเฉพาะส่วนเพิ่ม (Incremental Backup)"], ["Backs up only files changed since last Full OR Incremental backup; clears Archive bit (fastest backup, slowest restore: requires Full + ALL Incrementals in order)", "สำรองเฉพาะไฟล์ที่มีการเปลี่ยนแปลงนับจาก Full หรือ Incremental ครั้งล่าสุด; ล้าง Archive Bit (สำรองเร็วสุด แต่กู้คืนช้าสุด ต้องใช้ Full + ทุก Incremental)"]], [["Differential", "การสำรองส่วนต่าง (Differential Backup)"], ["Backs up all files changed since the last Full backup; does NOT clear Archive bit (medium restore: requires Full + LAST Differential only)", "สำรองไฟล์ทั้งหมดที่มีการเปลี่ยนแปลงนับจาก Full ครั้งล่าสุด; **ไม่ล้าง** Archive Bit (กู้คืนปานกลาง ใช้ Full + Differential ครั้งสุดท้ายเท่านั้น)"]], [["Redundant servers", "เซิร์ฟเวอร์สำรองคู่ขนาน"], ["RAID, redundant power supplies, hot-swappable disks, load balancing for high availability", "การใช้ระบบดิสก์ RAID, เพาเวอร์ซัพพลายคู่, อุปกรณ์ Hot-Swap เพื่อเพิ่มความพร้อมใช้งาน"]], [["Server clustering", "ระบบคลัสเตอร์เซิร์ฟเวอร์"], ["Group of independent servers connected together acting as a single unified system for failover/high availability", "การรวมกลุ่มเซิร์ฟเวอร์ทำงานร่วมกันเสมือนเครื่องเดียวเพื่อรองรับ Failover อัตโนมัติ"]]]}, {"title": "Disaster Recovery Methods & RTOs", "thTitle": "ประเภทของศูนย์กู้คืนภัยพิบัติและระยะเวลากู้คืน (RTO)", "type": "kv", "rows": [[["Hot Site", "ศูนย์พร้อมใช้งานทันที (Hot Site)"], ["Fully equipped data center with identical hardware, real-time synchronized data replication — minimal downtime/RTO: Minutes to Hours", "ศูนย์ที่มีอุปกรณ์ครบ ข้อมูลซิงก์แบบ Real-time ตลอดเวลา กู้คืนได้เร็วที่สุด (RTO: ไม่กี่นาทีถึงไม่กี่ชั่วโมง) แต่ค่าใช้จ่ายสูงสุด"]], [["Cold Site", "ศูนย์สำรองเปล่า (Cold Site)"], ["Provides power, raised floor, and HVAC cooling only; zero hardware installed — recovery requires shipping hardware/RTO: 1 to 2 Weeks", "มีเฉพาะอาคาร ไฟฟ้า และแอร์ ไม่มีอุปกรณ์ฮาร์ดแวร์ติดตั้งไว้ ต้องจัดซื้ออุปกรณ์มาลง (RTO: 1-2 สัปดาห์) ประหยัดสุด"]], [["Warm Site", "ศูนย์พร้อมใช้งานบางส่วน (Warm Site)"], ["Middle ground: pre-installed skeletal hardware and comms links, requires restoring latest backup tapes/RTO: 1 to 2 Days", "จุดกึ่งกลาง: มีฮาร์ดแวร์หลักติดตั้งไว้ แต่ต้องนำเทปสำรองข้อมูลมา Restore และคอนฟิกระบบ (RTO: 1-2 วัน)"]], [["Service Bureau", "การเช่าบริการกู้คืน (Service Bureau)"], ["Contractual agreement with a third-party vendor to provide emergency data center processing capacity", "สัญญาจ้างบริษัทภายนอกเพื่อขอใช้ศูนย์ข้อมูลสำรองเมื่อเกิดเหตุฉุกเฉิน"]], [["Multiple centers/sites", "ศูนย์ประมวลผลกระจายตัว (Multi-Site)"], ["Workload distributed dynamically across multiple active owned data centers (Active-Active architecture)", "การกระจายโหลดงานและประมวลผลพร้อมกันในศูนย์ข้อมูลหลายแห่ง (Active-Active)"]], [["Rolling/mobile sites", "ศูนย์สำรองเคลื่อนที่ (Mobile Site)"], ["Custom mobile trailers/trucks outfitted with computer racks and power/HVAC/RTO: 3 to 5 Days", "รถเทรลเลอร์หรือตู้คอนเทนเนอร์ติดตั้งอุปกรณ์คอมพิวเตอร์และระบบไฟพร้อมเคลื่อนย้าย (RTO: 3-5 วัน)"]], [["RTOs", "สรุปกรอบเวลา RTO"], ["Hot Site: minutes to hours · Warm Site: 1-2 days · Mobile Site: 3-5 days · Cold Site: 1-2 weeks", "Hot Site: นาที-ชั่วโมง · Warm Site: 1-2 วัน · Mobile Site: 3-5 วัน · Cold Site: 1-2 สัปดาห์"]]]}, {"title": "RAID, SAN & NAS", "thTitle": "เทคโนโลยีการจัดเก็บข้อมูล: RAID, SAN และ NAS", "type": "kv", "rows": [[["RAID", "นิยาม RAID"], ["Redundant Array of Independent (or Inexpensive) Disks — combining multiple physical disks for redundancy and/or performance", "การรวมฮาร์ดดิสก์หลายลูกเข้าด้วยกันเพื่อเพิ่มความทนทานต่อความเสียหายและ/หรือเพิ่มความเร็ว"]], [["Disk Mirroring / Striping", "การ Mirroring vs Striping"], ["Mirroring: duplicate identical data written to 2 disks (100% redundancy) / Striping: splitting data blocks across multiple disks (faster throughput, zero fault tolerance)", "Mirroring (เขียนข้อมูลซ้ำกันลงดิสก์ 2 ลูก ปลอดภัยสูง) / Striping (แบ่งข้อมูลเขียนพร้อมกันหลายลูก เร็ว แต่ไม่มีความปลอดภัย)"]], [["RAID 0", "RAID 0 (Striping)"], ["Striping without parity — minimum 2 disks — fast read/write, zero fault tolerance; 1 disk failure = total data loss", "แบ่งบล็อกข้อมูลกระจายลงดิสก์ขั้นต่ำ 2 ลูก — เร็วมาก แต่ไม่มีความทนทาน หากดิสก์เสีย 1 ลูกข้อมูลจะสูญหายทั้งหมด"]], [["RAID 1", "RAID 1 (Mirroring)"], ["Mirroring — 2 disks — exact duplicate copy; survives 1 disk failure, 50% usable disk capacity", "ทำสำเนาเหมือนลงดิสก์ 2 ลูก — ทนต่อดิสก์เสียได้ 1 ลูก พื้นที่ใช้งานได้ 50% ของความจุรวม"]], [["RAID 3 / RAID 4", "RAID 3 / RAID 4"], ["RAID 3: byte-level striping with dedicated parity disk / RAID 4: block-level striping with dedicated parity disk", "RAID 3 (แบ่งข้อมูลระดับไบต์ มีดิสก์ Parity แยก 1 ลูก) / RAID 4 (แบ่งข้อมูลระดับบล็อก มีดิสก์ Parity แยก 1 ลูก)"]], [["RAID 5", "RAID 5 (Striped Parity)"], ["Block-level striping with distributed parity across all drives — min 3 disks — survives 1 disk failure; usable capacity = (N-1)", "แบ่งบล็อกข้อมูลและกระจาย Parity ลงทุกดิสก์ — ใช้ดิสก์ขั้นต่ำ 3 ลูก ทนต่อดิสก์เสียได้ 1 ลูก พื้นที่ใช้งาน = (N-1) ลูก"]], [["RAID 6", "RAID 6 (Dual Parity)"], ["Block-level striping with dual distributed parity — min 4 disks — survives 2 concurrent disk failures; usable capacity = (N-2)", "กระจาย Parity 2 ชุดลงทุกดิสก์ — ใช้ดิสก์ขั้นต่ำ 4 ลูก ทนต่อดิสก์เสียพร้อมกันได้ 2 ลูก พื้นที่ใช้งาน = (N-2) ลูก"]], [["RAID 0+1", "RAID 0+1 (Mirror of Stripes)"], ["Creates two striped arrays (RAID 0) and mirrors them together — min 4 disks", "สร้าง Striped Array (RAID 0) สองชุด แล้วนำมาทำ Mirroring กัน — ใช้ดิสก์ขั้นต่ำ 4 ลูก"]], [["RAID 1+0 (RAID 10)", "RAID 10 (Stripe of Mirrors)"], ["Creates mirrored pairs (RAID 1) and stripes across them — min 4 disks — superior fault tolerance and rebuild performance over RAID 0+1", "จับคู่ดิสก์ทำ Mirroring (RAID 1) แล้วนำมาทำ Striping รวมกัน — ทนทานและ Rebuild ปลอดภัยกว่า RAID 0+1"]], [["SAN", "ระบบ SAN (Storage Area Network)"], ["High-speed dedicated network of storage devices providing block-level data access via Fibre Channel or iSCSI", "เครือข่ายความเร็วสูงเฉพาะสำหรับอุปกรณ์จัดเก็บข้อมูล ให้บริการข้อมูลระดับบล็อก (Block-Level) ผ่าน Fibre Channel หรือ iSCSI"]], [["NAS", "ระบบ NAS (Network Attached Storage)"], ["Dedicated file storage appliance connected to standard LAN providing file-level data access via NFS (Linux) or CIFS/SMB (Windows)", "อุปกรณ์จัดเก็บข้อมูลที่ต่อตรงกับแลน ให้บริการแชร์ไฟล์ระดับไฟล์ (File-Level) ผ่านโพรโทคอล NFS หรือ SMB"]]]}, {"title": "DR Terminology & Concepts", "thTitle": "คำศัพท์และตัวชี้วัดสำคัญด้านการกู้คืนภัยพิบัติ (DR)", "type": "kv", "rows": [[["MTTF", "MTTF (Mean Time To Failure)"], ["Mean Time To Failure — expected operational lifespan before a non-repairable component fails completely", "ระยะเวลาเฉลี่ยที่อุปกรณ์ทำงานได้ตามปกติก่อนที่จะพังเสียหายถาวร (สำหรับอุปกรณ์ที่ซ่อมไม่ได้)"]], [["MTTR", "MTTR (Mean Time To Repair)"], ["Mean Time To Repair — average time required to repair or replace a failed component and restore service", "ระยะเวลาเฉลี่ยที่ใช้ในการซ่อมแซมหรือเปลี่ยนชิ้นส่วนเพื่อนำระบบกลับมาทำงาน"]], [["MTBF", "MTBF (Mean Time Between Failures)"], ["Mean Time Between Failures = MTTF + MTTR — average operational time between consecutive repairable failures", "ระยะเวลาเฉลี่ยระหว่างความล้มเหลวแต่ละครั้ง = MTTF + MTTR (สำหรับอุปกรณ์ที่ซ่อมแซมได้)"]], [["Transaction Redundancy", "การสำรองข้อมูลธุรกรรมความเร็วสูง"], ["Electronic Vaulting (batch transfer of backups over comms) · Remote Journaling (real-time transfer of journal/database transaction logs) · Database Shadowing (real-time mirror of whole DB to 2+ sites)", "Electronic Vaulting (ส่งไฟล์สำรองเป็นรอบ) · Remote Journaling (ส่งบันทึกธุรกรรม Transaction Log แบบ Real-time) · Database Shadowing (จำลองสำเนาฐานข้อมูลทั้งชุดแบบ Real-time ข้ามไซต์)"]]]}, {"title": "System Hardening & Recovery", "thTitle": "การเสริมความมั่นคงปลอดภัยของระบบ (Hardening) และการกู้คืน", "type": "kv", "rows": [[["System Hardening", "การทำ System Hardening"], ["Uninstall unneeded software/apps, disable unnecessary OS services, block unused ports, restrict removable media, patch management, configure baseline security policies", "ถอนการติดตั้งโปรแกรมที่ไม่จำเป็น, ปิด Service ที่ไม่ได้ใช้, ปิดพอร์ตที่ไม่ได้ใช้งาน, จำกัดอุปกรณ์บันทึกข้อมูลภายนอก, ลงแพตช์ล่าสุด, กำหนดค่านโยบายความปลอดภัยตาม Baseline"]], [["System Recovery Steps", "4 ขั้นตอนการกู้คืนระบบ"], ["1. Reboot in single-user mode / recovery console · 2. Recover active file systems and disk integrity · 3. Restore missing or corrupted files from clean backup · 4. Verify security policies, logs, and access controls", "1. รีบูตเข้าระบบใน Single-User Mode หรือ Recovery Console · 2. ตรวจสอบและกู้คืนความสมบูรณ์ของระบบไฟล์ · 3. กู้ไฟล์ที่เสียหายจากแบ็กอัปที่สะอาด · 4. ตรวจสอบนโยบายความปลอดภัยและสิทธิ์การเข้าถึง"]], [["System Failure Types", "ประเภทของความล้มเหลวในระบบ"], ["System reboot (controlled restart after minor error), emergency restart (immediate reboot bypassing cleanup), system cold start (critical hardware lockup requiring manual power cycle)", "System Reboot (การรีสตาร์ตอย่างเป็นระบบเมื่อพบข้อผิดพลาดเล็กน้อย), Emergency Restart (รีสตาร์ตฉุกเฉินทันที), Cold Start (ระบบค้างสนิทต้องตัดไฟและเปิดเครื่องใหม่)"]], [["Hierarchical Recovery Types", "ประเภทการกู้คืนตามลำดับขั้น"], ["Manual Recovery (administrator manually steps through cold restoration) vs Automatic Recovery (automated failover clustering and self-healing scripts)", "Manual Recovery (ผู้ดูแลระบบดำเนินการกู้คืนด้วยตนเอง) vs Automatic Recovery (ระบบคลัสเตอร์สลับการทำงานอัตโนมัติ)"]]]}, {"title": "Data Destruction and Reuse", "thTitle": "การทำลายข้อมูลและการนำสื่อบันทึกกลับมาใช้ใหม่", "type": "kv", "rows": [[["Object reuse", "การนำออบเจกต์กลับมาใช้ใหม่"], ["Reallocation of storage media/memory to new subjects after previous subject released it (must prevent data leakage)", "การนำพื้นที่หน่วยความจำหรือดิสก์กลับมาให้โปรเซสอื่นใช้งาน ต้องล้างข้อมูลเดิมทิ้งเพื่อป้องกันข้อมูลรั่วไหล"]], [["Data remanence", "ข้อมูลตกค้าง (Data Remanence)"], ["Residual representation of digital data remaining on media after nominal file deletion (DoD / Orange Book: overwrite multiple passes)", "ข้อมูลที่ยังคงหลงเหลืออยู่ในสื่อบันทึกหลังจากสั่งลบตามปกติ (ต้องเขียนทับหลายรอบตามมาตรฐานความปลอดภัย)"]], [["Clearing", "การล้างข้อมูล (Clearing)"], ["Overwriting media sectors with non-sensitive data (zeros, ones, random) to allow safe reuse WITHIN the organization", "การเขียนทับทุกเซกเตอร์ด้วยข้อมูลสุ่ม เพื่อให้นำสื่อบันทึกกลับมาใช้งานใหม่ได้ภายในองค์กร"]], [["Purging", "การลบล้างสิ้นเชิง (Purging)"], ["Degaussing magnetic media or cryptographic erasure to render data unrecoverable even using advanced laboratory tools (safe for release outside org)", "การใช้สนามแม่เหล็กแรงสูงลบข้อมูลหรือทำลายคีย์เข้ารหัส ทำให้ไม่สามารถกู้คืนได้แม้ใช้เครื่องมือแล็บ (ปลอดภัยสำหรับการส่งออกนอกองค์กร)"]], [["Destruction", "การทำลายทิ้งทางกายภาพ (Destruction)"], ["Physical destruction of media — disintegration, incineration, shredding, or melting (ultimate security assurance)", "การบด ขูด ย่อยสลาย เผา หรือหลอมละลายสื่อบันทึกทิ้งทางกายภาพ เป็นวิธีที่ปลอดภัยเด็ดขาดที่สุด"]]]}, {"title": "Disaster Recovery Test Types", "thTitle": "5 รูปแบบการทดสอบแผนกู้คืนภัยพิบัติ (DRP Testing)", "type": "kv", "rows": [[["Desk Check", "1. การตรวจทานเอกสาร (Checklist / Read-Through)"], ["Review contents of the DR plan documents individually to verify completeness and update contact details", "การอ่านทบทวนเอกสารแผน DRP เป็นรายบุคคลเพื่อตรวจความสมบูรณ์และอัปเดตเบอร์ติดต่อ"]], [["Table-top exercise", "2. การทดสอบแบบจำลองบนโต๊ะ (Structured Walk-Through)"], ["DR team members gather in a conference room to walk through disaster scenarios step-by-step verbally", "คณะทำงาน DRP มาร่วมประชุมกันเพื่อจำลองสถานการณ์และไล่เรียงขั้นตอนการปฏิบัติด้วยวาจา"]], [["Simulation test", "3. การทดสอบแบบจำลองเหตุการณ์เสมือน (Simulation Test)"], ["Technical support staff responds to simulated real-world disaster drills without disrupting production systems", "ทีมเทคนิคฝึกซ้อมรับมือกับสถานการณ์ภัยพิบัติจำลองเสมือนจริง โดยไม่กระทบต่อระบบงานจริง"]], [["Parallel tests", "4. การทดสอบคู่ขนาน (Parallel Test)"], ["Personnel recover and operate critical business systems at backup/alternate site while primary site continues running live operations", "ทีมงานกู้คืนระบบและทดลองประมวลผลที่ศูนย์สำรองควบคู่ไปกับศูนย์หลักที่ยังเปิดให้บริการตามปกติ"]], [["Full-implementation tests", "5. การทดสอบสลับระบบเต็มรูปแบบ (Full-Interruption Test)"], ["Personnel shut down primary production site completely and shift all operational workload entirely to the disaster recovery site (highest risk)", "ปิดศูนย์หลักจริงทั้งหมดแล้วสลับไปรันบนศูนย์กู้คืนภัยพิบัติเต็มรูปแบบ (มีความเสี่ยงสูงสุด ต้องทำนอกเวลาทำการ)"]]]}, {"title": "Business Continuity Planning", "thTitle": "การวางแผนความต่อเนื่องทางธุรกิจ (BCP & BIA)", "type": "kv", "rows": [[["BCP", "แผนความต่อเนื่องทางธุรกิจ (BCP)"], ["Business Continuity Planning — strategic framework to sustain critical operational functions during disruptive events", "กรอบแผนยุทธศาสตร์เพื่อรักษาความต่อเนื่องในการดำเนินงานขององค์กรเมื่อเกิดเหตุการณ์หยุดชะงัก"]], [["BIA", "การวิเคราะห์ผลกระทบทางธุรกิจ (BIA)"], ["Business Impact Analysis — foundational assessment identifying critical business functions, MTD, RTO, RPO, and financial impact of outages", "การประเมินเพื่อระบุฟังก์ชันงานวิกฤตขององค์กร, ประเมินค่า MTD, RTO, RPO และคำนวณมูลค่าความเสียหายหากระบบหยุดทำงาน"]], [["DRP", "แผนกู้คืนภัยพิบัติ (DRP)"], ["Disaster Recovery Plan — technical operational procedures to recover IT infrastructure after disaster (end goal: return to normal state)", "ขั้นตอนปฏิบัติการทางเทคนิคเพื่อกู้คืนระบบสารสนเทศและโครงสร้างพื้นฐานไอทีให้กลับมาใช้งานได้ตามปกติ (ต้องทำ BIA ก่อน)"]], [["BC Steps", "4 ขั้นตอนหลักของการจัดทำ BCP"], ["1. Scope and plan initiation · 2. Business Impact Analysis (BIA) · 3. BCP development and preventative controls · 4. Plan approval, training, testing, and maintenance", "1. กำหนดขอบเขตและริเริ่มโครงการ · 2. วิเคราะห์ผลกระทบทางธุรกิจ (BIA) · 3. พัฒนาแผนความต่อเนื่องและมาตรการป้องกัน · 4. ขออนุมัติ อบรม ทดสอบ และปรับปรุงแผน"]]]}, {"title": "Disaster Recovery Process", "thTitle": "กระบวนการกู้คืนภัยพิบัติและการบริหารทีมงาน", "type": "kv", "rows": [[["DR process", "กระบวนการ DR และทีมงาน"], ["Designated specialized response teams execute DR actions; Salvage Team works on restoring primary damaged site, Recovery Team brings up alternate site", "การแบ่งหน้าที่ของทีม: ทีมกู้คืน (Recovery Team) ดำเนินการเปิดระบบที่ศูนย์สำรอง ส่วนทีมกอบกู้ (Salvage Team) เข้าฟื้นฟูศูนย์หลักที่เสียหาย"]], [["Other recovery issues", "ประเด็นสำคัญอื่นในการกู้คืน"], ["Interfacing with media/law enforcement, fraud prevention, emergency payroll/financial disbursements, activating recovery procedures, HR care for personnel, emergency communications plan", "การประสานงานกับสื่อและตำรวจ, การป้องกันการฉ้อโกง, การเบิกจ่ายเงินฉุกเฉิน, การดูแลสวัสดิภาพบุคลากร, แผนการสื่อสารในภาวะวิกฤต"]]]}, {"title": "BCP Plan Development", "thTitle": "การพัฒนาแผน BCP และความปลอดภัยทางกายภาพ", "type": "kv", "rows": [[["Continuity strategy", "ยุทธศาสตร์ความต่อเนื่อง"], ["Computing (protect hardware/software/comms/data) · Facilities (primary/alternate data centers) · People (succession planning, remote work) · Supplies & equipment (vendor SLAs)", "ด้านไอที (ป้องกันระบบ/เครือข่าย/ข้อมูล) · ด้านอาคารสถานที่ (ศูนย์หลัก/สำรอง) · ด้านบุคลากร (แผนสืบทอดตำแหน่ง) · ด้านอุปกรณ์และคู่ค้า (สัญญา SLA)"]], [["Roles & responsibilities", "บทบาทและคณะกรรมการ BCP"], ["BCP Committee comprising senior executive sponsor, business unit leaders, IT directors, security administrators, legal, and HR representatives", "คณะกรรมการ BCP ประกอบด้วยผู้บริหารระดับสูง, ตัวแทนหน่วยธุรกิจ, ผู้อำนวยการไอที, ฝ่ายความปลอดภัย, ฝ่ายกฎหมาย และฝ่ายบุคคล"]], [["Physical security", "การรักษาความปลอดภัยทางกายภาพใน BCP"], ["CCTV surveillance, perimeter fences, audible/silent alarms, intrusion detection systems, motion sensors, multi-factor locks, audit trails, electronic badges", "กล้องวงจรปิด, รั้ว, สัญญาณเตือนภัย, เซนเซอร์ตรวจจับการบุกรุก, กลอนประตูดิจิทัล, บัตรผ่านอิเล็กทรอนิกส์"]]]}, {"title": "Trusted Recovery", "thTitle": "การกู้คืนระบบอย่างปลอดภัยและน่าเชื่อถือ (Trusted Recovery)", "type": "kv", "rows": [[["Breach Confirmation", "1. การยืนยันความปลอดภัย"], ["Confirm that no unauthorized security breach, backdoor, or data tampering occurred during system failure", "ตรวจสอบยืนยันว่าไม่มีการบุกรุก ช่องโหว่ หรือการดัดแปลงข้อมูลเกิดขึ้นระหว่างที่ระบบล้มเหลว"]], [["Failure Preparation", "2. การเตรียมความพร้อมรับมือ"], ["Continuously backup critical configurations, transaction logs, and cryptographic keys to enable reliable restoration", "สำรองข้อมูลการกำหนดค่าที่สำคัญ บันทึกธุรกรรม และกุญแจเข้ารหัสอย่างสม่ำเสมอเพื่อการกู้คืน"]], [["System Recovery", "3. การกู้คืนระบบสู่สถานะปลอดภัย"], ["After OS or application crash, system must boot safely into a predetermined secure state (fail-secure / fail-closed)", "เมื่อระบบหรือแอปพลิเคชันล่ม ระบบจะต้องสามารถรีสตาร์ตกลับสู่สถานะที่มั่นคงปลอดภัยได้เสมอ (Fail-Secure)"]]]}]}, {"id": 8, "title": "Software Development Security", "thTitle": "ความมั่นคงปลอดภัยในการพัฒนาซอฟต์แวร์", "color": "var(--c8)", "sections": [{"title": "SDLC — Development Methodologies", "thTitle": "ระเบียบวิธีและแบบจำลองการพัฒนาซอฟต์แวร์ (SDLC)", "type": "kv", "rows": [[["Build and Fix", "แบบจำลอง Build and Fix"], ["No formal architecture or upfront design; code is written immediately and fixed reactively as bugs appear; no feedback cycle", "ไม่มีการออกแบบสถาปัตยกรรมล่วงหน้า เขียนโค้ดทันทีและแก้ปัญหาเฉพาะหน้าเมื่อเกิดบั๊ก เป็นวิธีเชิงรับที่ไม่มีโครงสร้าง"]], [["Waterfall", "แบบจำลองวอเตอร์ฟอล (Waterfall)"], ["Strict sequential linear phases; each phase must be 100% completed before moving on; very difficult to accommodate requirement changes mid-cycle", "การทำงานเรียงตามลำดับขั้นแบบเส้นตรง ต้องจบแต่ละเฟสก่อนเริ่มขั้นถัดไป ปรับเปลี่ยนความต้องการระหว่างทางได้ยากมาก"]], [["V-shaped", "แบบจำลองรูปตัววี (V-Shaped)"], ["Based on waterfall with corresponding verification/validation testing planned at each development phase; lacks formal risk analysis phase", "ต่อยอดจาก Waterfall โดยจับคู่ขั้นตอนการพัฒนากับขั้นตอนการทดสอบควบคู่กัน แต่ยังขาดขั้นตอนการวิเคราะห์ความเสี่ยง"]], [["Prototyping", "การสร้างต้นแบบ (Prototyping)"], ["Rapid/evolutionary/operational prototypes developed to gather user requirements early and refine through iterative customer feedback", "การสร้างตัวอย่างโปรแกรมจำลองขึ้นมาอย่างรวดเร็วเพื่อให้ผู้ใช้ทดลองใช้งานและปรับปรุงตามข้อเสนอแนะ"]], [["Incremental", "แบบจำลองแบบส่วนเพิ่ม (Incremental)"], ["Software broken into small feature increments developed through mini-waterfalls; easy to introduce new requirements per release", "แบ่งระบบออกเป็นส่วนย่อยๆ แล้วพัฒนาเป็นรอบแบบ Mini-Waterfall ทยอยส่งมอบทีละส่วน"]], [["Spiral", "แบบจำลองเกลียวสว่าน (Spiral)"], ["Risk-driven iterative methodology combining prototyping and waterfall; incorporates formal risk analysis at every single iteration cycle", "ระเบียบวิธีที่ขับเคลื่อนด้วยการบริหารความเสี่ยง ทำงานเป็นรอบเกลียว มีการประเมินความเสี่ยงอย่างเป็นทางการในทุกๆ รอบ"]], [["RAD", "การพัฒนาแอปพลิเคชันอย่างรวดเร็ว (RAD)"], ["Rapid Application Development — emphasizes rapid prototyping, iterative visual development, and reusable software components", "เน้นการสร้างต้นแบบที่รวดเร็ว ใช้เครื่องมือช่วยพัฒนา และนำคอมโพเนนต์เดิมกลับมาใช้ใหม่"]], [["Agile", "ระเบียบวิธีแบบอไจล์ (Agile)"], ["Umbrella term for adaptive iterative methodologies (Scrum/Kanban/XP); user stories, continuous customer collaboration, short sprints (1-4 weeks), rapid feedback", "กรอบการทำงานที่ยืดหยุ่นสูง (Scrum, Kanban, XP) ซอยงานเป็นรอบสั้นๆ (Sprints) เน้นความร่วมมือและการส่งมอบคุณค่าอย่างต่อเนื่อง"]]]}, {"title": "DevOps", "thTitle": "แนวคิด DevOps / DevSecOps", "type": "kv", "rows": [[["Definition", "นิยามของ DevOps"], ["Software Development + Quality Assurance + IT Operations (and Security in DevSecOps) collaborating through automated CI/CD pipelines", "การผสานการทำงานร่วมกันระหว่างฝ่ายพัฒนาซอฟต์แวร์ (Dev), ฝ่ายประกันคุณภาพ (QA) และฝ่ายปฏิบัติการ (Ops) ผ่านกระบวนการ CI/CD อัตโนมัติ (และผนวกความปลอดภัยเป็น DevSecOps)"]]]}, {"title": "Programming Language Types", "thTitle": "วิวัฒนาการและระดับของภาษาโปรแกรมมิ่ง (Generations)", "type": "kv", "rows": [[["Machine Languages", "ภาษาเครื่อง (1st Generation)"], ["1st Gen — Direct raw binary machine instructions (0s and 1s) executed directly by CPU hardware", "ภาษาคอมพิวเตอร์ยุคที่ 1: คำสั่งรหัสฐานสอง (0 และ 1) ที่ซีพียูประมวลผลได้โดยตรง"]], [["Assembly Language", "ภาษาแอสเซมบลี (2nd Generation)"], ["2nd Gen — Uses human-readable symbolic mnemonics (ADD, PUSH, MOV, POP) mapped directly to machine opcodes", "ภาษาคอมพิวเตอร์ยุคที่ 2: ใช้คำช่วยจำเชิงสัญลักษณ์ (เช่น ADD, MOV, PUSH, POP) แทนเลขฐานสอง"]], [["High-Level Language", "ภาษาระดับสูง (3rd Generation)"], ["3rd Gen — Processor-independent procedural/OOP languages (C, Pascal, FORTRAN, COBOL); uses logic control structures (IF/THEN/ELSE)", "ภาษาระดับสูงยุคที่ 3: ไม่ขึ้นกับสถาปัตยกรรมซีพียู ใช้ตรรกะแบบมีโครงสร้าง (เช่น C, Pascal, COBOL)"]], [["Very High-Level Language", "ภาษาระดับสูงมาก (4th Generation)"], ["4th Gen — Focuses on business logic, algorithms, scripting, and non-procedural declarative queries (Python, SQL, C++, C#, Java)", "ภาษายุคที่ 4: เน้นการเขียนโปรแกรมเชิงวัตถุ สคริปต์ และการจัดการข้อมูล (เช่น Python, Java, C#, SQL)"]], [["Natural Language", "ภาษาธรรมชาติ (5th Generation)"], ["5th Gen — AI, neural networks, natural language processing, and constraint-based programming where the system learns/adapts", "ภาษายุคที่ 5: ปัญญาประดิษฐ์ (AI), โครงข่ายประสาทเทียม และการประมวลผลภาษาธรรมชาติ"]]]}, {"title": "Database Architecture and Models", "thTitle": "สถาปัตยกรรมและแบบจำลองฐานข้อมูล", "type": "kv", "rows": [[["Relational Model", "แบบจำลองเชิงสัมพันธ์ (Relational)"], ["Data structured into 2D tables consisting of attributes (columns/fields) and tuples (rows/records) linked by keys", "จัดเก็บข้อมูลเป็นตาราง 2 มิติ ประกอบด้วย Attributes (คอลัมน์) และ Tuples (แถว) เชื่อมโยงกันด้วยคีย์"]], [["Hierarchical Model", "แบบจำลองเชิงลำดับชั้น (Hierarchical)"], ["Tree-like parent-child data structure where each child record has exactly one parent record (1:N)", "โครงสร้างแบบต้นไม้ (Parent-Child) โดยเรคอร์ดลูกแต่ละตัวจะมีเรคอร์ดแม่ได้เพียงตัวเดียวเท่านั้น"]], [["Network Model", "แบบจำลองเครือข่าย (Network)"], ["Graph-like data structure where child records can have multiple parent records (N:M relationships)", "คล้ายแบบจำลองเชิงลำดับชั้น แต่เรคอร์ดลูกสามารถเชื่อมโยงกับเรคอร์ดแม่ได้หลายตัว (ความสัมพันธ์ N:M)"]], [["Object-Oriented Model", "แบบจำลองเชิงวัตถุ (OODBMS)"], ["Stores data and methods together as discrete objects; handles complex multimedia data types dynamically", "จัดเก็บข้อมูลและฟังก์ชันการทำงานไว้ด้วยกันในรูปแบบของ Object รองรับข้อมูลมัลติมีเดียที่ซับซ้อน"]], [["Object-Relational Model", "แบบจำลองเชิงวัตถุสัมพันธ์ (ORDBMS)"], ["Hybrid combining relational tabular database structure with object-oriented capabilities (classes, inheritance)", "ระบบไฮบริดที่ผสานความสามารถของฐานข้อมูลเชิงสัมพันธ์เข้ากับคุณสมบัติเชิงวัตถุ (เช่น PostgreSQL)"]]]}, {"title": "Database Interface Languages", "thTitle": "ภาษาและส่วนต่อประสานฐานข้อมูล (Database Interfaces)", "type": "kv", "rows": [[["ODBC", "มาตรฐาน ODBC"], ["Open Database Connectivity — standard API allowing client applications to communicate with any SQL database locally or remotely", "มาตรฐานกลาง API ที่ช่วยให้โปรแกรมสามารถติดต่อกับฐานข้อมูล SQL ค่ายใดก็ได้"]], [["JDBC", "มาตรฐาน JDBC"], ["Java Database Connectivity — Java API connecting Java applications to relational databases", "มาตรฐาน API สำหรับโปรแกรมภาษา Java เพื่อเชื่อมต่อกับฐานข้อมูลเชิงสัมพันธ์"]], [["XML", "ภาษา XML ในฐานข้อมูล"], ["Extensible Markup Language — structured data formatting enabling seamless cross-platform data interchange", "ภาษาโครงสร้างข้อมูลสำหรับการแลกเปลี่ยนข้อมูลระหว่างแอปพลิเคชันและฐานข้อมูลที่ต่างระบบกัน"]], [["OLE DB", "มาตรฐาน OLE DB"], ["Object Linking and Embedding Database — Microsoft successor to ODBC providing access to both SQL and non-SQL data sources", "เทคโนโลยีของ Microsoft ที่พัฒนาต่อยอดจาก ODBC เพื่อเข้าถึงข้อมูลทั้งแบบ SQL และไม่ใช่ SQL"]]]}, {"title": "Data Warehousing & Mining", "thTitle": "คลังข้อมูล (Data Warehousing) และการทำเหมืองข้อมูล (Data Mining)", "type": "kv", "rows": [[["Data Warehousing", "คลังข้อมูล (Data Warehousing)"], ["Consolidating and combining large historical data sets from multiple disparate operational sources into a central analytical repository", "การรวบรวมและผสานข้อมูลประวัติขนาดใหญ่จากหลายแหล่งข้อมูลเข้าไว้ในศูนย์กลางเพื่อการวิเคราะห์"]], [["Data Mining", "การทำเหมืองข้อมูล (Data Mining)"], ["Analyzing vast data warehouses using statistical algorithms and AI to discover hidden patterns, trends, and correlations for decision making", "การใช้สถิติและ AI วิเคราะห์ข้อมูลขนาดใหญ่เพื่อค้นหารูปแบบ ความสัมพันธ์ และแนวโน้มที่ซ่อนอยู่สำหรับช่วยตัดสินใจทางธุรกิจ"]]]}, {"title": "Database Threats & Access Control", "thTitle": "ภัยคุกคามฐานข้อมูลและการควบคุมการเข้าถึง", "type": "kv", "rows": [[["Aggregation", "การรวบรวมข้อมูล (Aggregation)"], ["Combining separate non-sensitive pieces of information from various sources to uncover higher-classification sensitive facts", "การนำข้อมูลย่อยๆ ที่ไม่เป็นความลับมารวมเข้าด้วยกันจนกลายเป็นข้อมูลความลับระดับสูง"]], [["Inference", "การอนุมานข้อมูล (Inference)"], ["Deducing unauthorized sensitive information from accessible lower-level facts using logical deduction", "การคาดเดาหรืออนุมานข้อเท็จจริงที่เป็นความลับจากข้อมูลระดับต่ำที่ได้รับอนุญาตให้เห็น"]], [["Content-Dependent AC", "การควบคุมสิทธิ์ตามเนื้อหา"], ["Access granted or restricted dynamically based on the sensitivity of the specific data values (e.g. hiding salaries)", "การจำกัดสิทธิ์ตามเนื้อหาของข้อมูล เช่น ซ่อนคอลัมน์เงินเดือนพนักงาน"]], [["Context-Dependent AC", "การควบคุมสิทธิ์ตามบริบท"], ["Access evaluated based on contextual environment factors: user location, time of day, previous transaction history", "การควบคุมสิทธิ์ตามบริบทแวดล้อม เช่น ตำแหน่งที่อยู่, เวลาทำการ, ประวัติการเข้าถึงเดิม"]], [["Database Views", "วิวของฐานข้อมูล (Database Views)"], ["Virtual customized subsets of tables created to restrict what specific users or groups are allowed to view", "ตารางเสมือนที่สร้างขึ้นเพื่อจำกัดให้ผู้ใช้แต่ละกลุ่มมองเห็นเฉพาะคอลัมน์หรือแถวที่ตนมีสิทธิ์เท่านั้น"]], [["Database Locks", "การล็อกฐานข้อมูล (Database Locks)"], ["Concurrency control mechanisms preventing simultaneous conflicting writes and lost updates", "กลไกการล็อกข้อมูลเพื่อป้องกันไม่ให้ผู้ใช้สองคนแก้ไขข้อมูลเดียวกันพร้อมกันจนข้อมูลคลาดเคลื่อน"]], [["Polyinstantiation", "การสร้างหลายอินสแตนซ์ (Polyinstantiation)"], ["Allowing 2 or more distinct rows with identical primary keys but different classification levels and data to prevent inference", "การอนุญาตให้มีข้อมูล 2 แถวที่ใช้คีย์หลักเดียวกัน แต่มีเนื้อหาและระดับชั้นความลับต่างกัน เพื่อป้องกันการอนุมานข้อมูลลับ"]]]}, {"title": "ACID", "thTitle": "คุณสมบัติ ACID ของธุรกรรมฐานข้อมูล", "type": "kv", "rows": [[["Atomicity", "1. Atomicity (ความเป็นหนึ่งเดียว)"], ["All operations within a transaction succeed completely, or the entire transaction is rolled back (All or Nothing)", "คำสั่งทั้งหมดในธุรกรรมต้องสำเร็จครบถ้วน หากมีคำสั่งใดล้มเหลวต้องยกเลิกและย้อนกลับทั้งหมด (สำเร็จทั้งหมดหรือไม่ทำเลย)"]], [["Consistency", "2. Consistency (ความสอดคล้องถูกต้อง)"], ["Transactions preserve all database schema rules, foreign key constraints, and integrity invariants", "ธุรกรรมต้องนำพาฐานข้อมูลจากสถานะที่ถูกต้องหนึ่งไปยังอีกสถานะที่ถูกต้องเสมอ ไม่ละเมิดกฎความสัมพันธ์"]], [["Isolation", "3. Isolation (ความเป็นอิสระจากกัน)"], ["Concurrent transactions execute separately as if executed sequentially without interfering with each other", "ธุรกรรมที่เกิดขึ้นพร้อมกันจะถูกประมวลผลแยกจากกันเสมือนทำทีละรายการ ป้องกันปัญหาการแย่งอ่าน/เขียนข้อมูล"]], [["Durability", "4. Durability (ความคงทนถาวร)"], ["Once a transaction is committed, its recorded changes are permanent and survive any subsequent crash or power failure", "เมื่อธุรกรรมได้รับการยืนยัน (Commit) แล้ว ข้อมูลจะถูกบันทึกอย่างถาวรและไม่สูญหายแม้ระบบจะดับหรือแครช"]]]}, {"title": "Traditional SDLC", "thTitle": "ขั้นตอนของวงจรการพัฒนาซอฟต์แวร์แบบดั้งเดิม (SDLC Phases)", "type": "kv", "rows": [[["Steps", "ลำดับขั้นตอน"], ["Analysis → High-level design → Detail Design → Construction (Coding) → Testing → Implementation & Maintenance", "การวิเคราะห์ → การออกแบบระดับสูง → การออกแบบรายละเอียด → การเขียนโปรแกรม → การทดสอบ → การติดตั้งใช้งาน"]], [["Initiation", "1. ขั้นริเริ่มโครงการ (Initiation)"], ["Feasibility study, cost/benefit analysis, risk assessment, management approval, baseline security requirements", "การศึกษาความเป็นไปได้, วิเคราะห์ความคุ้มค่า, ประเมินความเสี่ยงเบื้องต้น, กำหนดข้อกำหนดความปลอดภัยพื้นฐาน"]], [["Functional analysis and planning", "2. ขั้นวิเคราะห์ฟังก์ชันและวางแผน"], ["Formal functional requirement definitions, evaluate proposed security controls and regulatory compliance", "กำหนดความต้องการเชิงหน้าที่, ตรวจสอบมาตรการควบคุมความปลอดภัยและข้อกำหนดกฎหมาย"]], [["System design specs", "3. ขั้นออกแบบระบบ (System Design)"], ["Detailed technical design specifications, architecture modeling, threat modeling, examine access controls", "จัดทำข้อกำหนดการออกแบบทางเทคนิค, สร้างโมเดลสถาปัตยกรรม, ทำ Threat Modeling และวางระบบควบคุมสิทธิ์"]], [["Software development", "4. ขั้นพัฒนาซอฟต์แวร์ (Coding)"], ["Source coding, static analysis (SAST), unit testing, code reviews, prototyping, verification, validation", "การเขียนซอร์สโค้ด, ตรวจสอบโค้ดด้วย SAST, ทดสอบระดับ Unit Test, ตรวจทานโค้ด (Peer Review)"]], [["Acceptance testing/implementation", "5. ขั้นทดสอบและติดตั้งใช้งาน (Implementation)"], ["User acceptance testing (UAT), dynamic testing (DAST), security penetration testing,
